<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3f2818">
  <title>Hưng Phát Giao hàng — Mất kết nối</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 90% 0, rgba(191, 133, 53, .2), transparent 28rem),
        #f7f1e8;
      color: #35251a;
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid rgba(133, 88, 29, .22);
      border-radius: 26px;
      background: rgba(255, 253, 248, .94);
      box-shadow: 0 24px 60px rgba(63, 40, 24, .14);
      text-align: center;
    }
    img { width: 86px; height: 86px; border-radius: 24px; box-shadow: 0 12px 28px rgba(63,40,24,.18); }
    h1 { margin: 20px 0 8px; font-size: 1.55rem; }
    p { margin: 0 0 22px; color: #74665a; line-height: 1.55; }
    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(180deg, #a66c1b, #754706);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/delivery-192.png" alt="">
    <h1>Đang mất kết nối</h1>
    <p>Dữ liệu chuyến và kết quả giao hàng không được lưu ngoại tuyến. Kết nối mạng rồi tải lại để tiếp tục.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
