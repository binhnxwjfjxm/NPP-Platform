<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b180b" />
    <title>Admin MCP/NPP — Mất kết nối</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #fffdf8 0, #f7f3eb 52%, #eee5d7 100%);
        color: #2d2924;
      }
      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid rgba(152, 96, 15, 0.2);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 48px rgba(72, 54, 34, 0.12);
        text-align: center;
      }
      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        place-items: center;
        border: 2px solid #d9a441;
        border-radius: 18px;
        background: linear-gradient(145deg, #1f1208, #533515);
        color: #f3c76d;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 700;
      }
      h1 { margin: 0; color: #342416; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.65rem, 7vw, 2.2rem); }
      p { margin: 12px 0 0; color: #70685f; line-height: 1.6; }
      button {
        min-height: 46px;
        margin-top: 24px;
        padding: 0 22px;
        border: 1px solid #8b580d;
        border-radius: 12px;
        background: linear-gradient(180deg, #b87819, #98600f);
        color: #fffdf8;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(117, 71, 6, 0.2);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">HP</div>
      <h1>Không có kết nối</h1>
      <p>Admin MCP/NPP cần mạng để tải dữ liệu quản lý mới nhất. Kiểm tra kết nối rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
