name: issue-638-resend-apply

on:
  push:
    branches:
      - agent/issue-638-resend-email-provider

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-638-resend-email-provider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Resend provider migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')

          def replace_once(path, old, new):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_regex_once(path, pattern, replacement):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 regex replacement, found {count}')
              p.write_text(updated, encoding='utf-8')

          resend_helper = '''import { createIdempotencyKey } from '@npp/contracts';

          const RESEND_EMAIL_ENDPOINT = 'https://api.resend.com/emails';
          const DEFAULT_RESEND_EMAIL_TIMEOUT_MS = 5_000;
          const EMAIL_PATTERN = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

          function text(value) { return String(value ?? '').trim(); }

          function boundedTimeout(value) {
            const parsed = Number.parseInt(text(value), 10);
            return Number.isInteger(parsed) && parsed >= 1000 && parsed <= 30_000
              ? parsed
              : DEFAULT_RESEND_EMAIL_TIMEOUT_MS;
          }

          export function loadResendEmailRuntime({ env = process.env } = {}) {
            return Object.freeze({
              apiKey: text(env.RESEND_API_KEY),
              from: text(env.INTERNAL_AUTH_EMAIL_FROM),
              timeoutMs: boundedTimeout(env.RESEND_EMAIL_TIMEOUT_MS),
            });
          }

          export function resendEmailRuntimeReady(runtime, fetchImpl = globalThis.fetch) {
            return Boolean(
              runtime?.apiKey
              && EMAIL_PATTERN.test(runtime?.from ?? '')
              && typeof fetchImpl === 'function'
            );
          }

          export async function sendResendEmail(fetchImpl, runtime, {
            to,
            subject,
            text: textBody,
            html,
            operation,
            entityId,
          }) {
            if (!resendEmailRuntimeReady(runtime, fetchImpl)) throw new Error('RESEND_EMAIL_UNAVAILABLE');
            if (!Array.isArray(to) || to.length === 0 || to.some((value) => !EMAIL_PATTERN.test(text(value)))) {
              throw new Error('RESEND_EMAIL_RECIPIENT_INVALID');
            }
            if (!text(operation) || !text(entityId)) throw new Error('RESEND_EMAIL_IDEMPOTENCY_CONTEXT_INVALID');

            const idempotencyKey = createIdempotencyKey(operation, entityId);
            const response = await fetchImpl(RESEND_EMAIL_ENDPOINT, {
              method: 'POST',
              signal: AbortSignal.timeout(runtime.timeoutMs),
              headers: {
                Authorization: `Bearer ${runtime.apiKey}`,
                'Content-Type': 'application/json',
                'Idempotency-Key': idempotencyKey,
              },
              body: JSON.stringify({
                from: runtime.from,
                to,
                subject,
                text: textBody,
                html,
              }),
            });

            const payload = await response.json().catch(() => null);
            if (!response?.ok || !payload?.id) throw new Error('RESEND_EMAIL_SEND_FAILED');
            return Object.freeze({ id: String(payload.id), idempotencyKey });
          }
          '''
          p = ROOT / 'npp-core/api/src/email/resend.js'
          p.parent.mkdir(parents=True, exist_ok=True)
          if p.exists():
              raise SystemExit('npp-core/api/src/email/resend.js already exists; refusing to overwrite')
          p.write_text(resend_helper, encoding='utf-8')

          replace_once(
              'npp-core/api/src/internal-workforce-auth.js',
              "import { promisify } from 'node:util';\n",
              "import { promisify } from 'node:util';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from './email/resend.js';\n",
          )
          replace_once(
              'npp-core/api/src/internal-workforce-auth.js',
              """  return Object.freeze({\n    accountId: text(env.CLOUDFLARE_ACCOUNT_ID),\n    apiToken: text(env.CLOUDFLARE_EMAIL_API_TOKEN),\n    from: text(env.INTERNAL_AUTH_EMAIL_FROM),\n    pepper: text(env.INTERNAL_AUTH_CHALLENGE_PEPPER),\n""",
              """  return Object.freeze({\n    ...loadResendEmailRuntime({ env }),\n    pepper: text(env.INTERNAL_AUTH_CHALLENGE_PEPPER),\n""",
          )
          replace_once(
              'npp-core/api/src/internal-workforce-auth.js',
              """  return Boolean(\n    runtime.accountId\n    && runtime.apiToken\n    && EMAIL_PATTERN.test(runtime.from)\n    && runtime.pepper.length >= 32\n    && normalizeChallengeRecipient(recipientEmail)\n    && typeof fetchImpl === 'function'\n  );\n""",
              """  return Boolean(\n    resendEmailRuntimeReady(runtime, fetchImpl)\n    && runtime.pepper.length >= 32\n    && normalizeChallengeRecipient(recipientEmail)\n  );\n""",
          )
          replace_regex_once(
              'npp-core/api/src/internal-workforce-auth.js',
              r"async function sendLoginChallengeEmail\(fetchImpl, runtime, \{ recipientEmail, code, sourceApp \} \) \{.*?\n\}\n\nexport function internalWebChallengeRequired",
              """async function sendLoginChallengeEmail(fetchImpl, runtime, { recipientEmail, code, sourceApp, challengeId }) {\n  const subject = 'Mã xác nhận đăng nhập hệ thống Hưng Phát';\n  const textBody = `Có yêu cầu đăng nhập Web/PWA vào hệ thống Hưng Phát (${sourceApp}). Mã xác nhận: ${code}. Mã hết hạn sau ${Math.ceil(runtime.ttlSeconds / 60)} phút. Mã này chỉ dùng cho đăng nhập hệ thống Hưng Phát, không dùng cho ngân hàng, thanh toán hoặc giao dịch tài chính. Nếu không phải yêu cầu của bạn, không cung cấp mã này.`;\n  const htmlBody = `<p>Có yêu cầu đăng nhập Web/PWA vào hệ thống Hưng Phát (${sourceApp}).</p><p>Mã xác nhận: <strong>${code}</strong></p><p>Mã hết hạn sau ${Math.ceil(runtime.ttlSeconds / 60)} phút.</p><p>Mã này chỉ dùng cho đăng nhập hệ thống Hưng Phát, không dùng cho ngân hàng, thanh toán hoặc giao dịch tài chính.</p><p>Nếu không phải yêu cầu của bạn, không cung cấp mã này.</p>`;\n  const recipient = normalizeChallengeRecipient(recipientEmail);\n  if (!recipient) throw new Error('INTERNAL_AUTH_EMAIL_SEND_FAILED');\n  try {\n    await sendResendEmail(fetchImpl, runtime, {\n      to: [recipient],\n      subject,\n      text: textBody,\n      html: htmlBody,\n      operation: 'login-challenge-email',\n      entityId: challengeId,\n    });\n  } catch {\n    throw new Error('INTERNAL_AUTH_EMAIL_SEND_FAILED');\n  }\n}\n\nexport function internalWebChallengeRequired""",
          )
          replace_once(
              'npp-core/api/src/internal-workforce-auth.js',
              """          code: transactionResult.challengeDelivery.code,\n          sourceApp: transactionResult.challengeDelivery.sourceApp,\n""",
              """          code: transactionResult.challengeDelivery.code,\n          sourceApp: transactionResult.challengeDelivery.sourceApp,\n          challengeId: transactionResult.challengeDelivery.challengeId,\n""",
          )

          replace_once(
              'npp-core/api/src/backup/technical-access.js',
              "import { createHmac, randomBytes, randomInt, timingSafeEqual } from 'node:crypto';\n",
              "import { createHmac, randomBytes, randomInt, timingSafeEqual } from 'node:crypto';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from '../email/resend.js';\n",
          )
          replace_once(
              'npp-core/api/src/backup/technical-access.js',
              """  return Object.freeze({\n    accountId: text(env.CLOUDFLARE_ACCOUNT_ID),\n    apiToken: text(env.CLOUDFLARE_EMAIL_API_TOKEN),\n    from: text(env.INTERNAL_AUTH_EMAIL_FROM),\n    pepper: text(env.INTERNAL_AUTH_CHALLENGE_PEPPER),\n""",
              """  return Object.freeze({\n    ...loadResendEmailRuntime({ env }),\n    pepper: text(env.INTERNAL_AUTH_CHALLENGE_PEPPER),\n""",
          )
          replace_once(
              'npp-core/api/src/backup/technical-access.js',
              """  return Boolean(\n    runtime?.accountId\n    && runtime?.apiToken\n    && EMAIL_PATTERN.test(runtime?.from ?? '')\n    && runtime?.pepper?.length >= 32\n    && runtime?.recipient === TECHNICAL_BACKUP_RECIPIENT\n    && typeof fetchImpl === 'function'\n  );\n""",
              """  return Boolean(\n    resendEmailRuntimeReady(runtime, fetchImpl)\n    && runtime?.pepper?.length >= 32\n    && runtime?.recipient === TECHNICAL_BACKUP_RECIPIENT\n  );\n""",
          )
          replace_regex_once(
              'npp-core/api/src/backup/technical-access.js',
              r"export async function sendTechnicalBackupAccessEmail\(fetchImpl, runtime, \{ code \} \) \{.*?\n\}\n",
              """export async function sendTechnicalBackupAccessEmail(fetchImpl, runtime, { code, challengeId }) {\n  if (!technicalBackupAccessRuntimeReady(runtime, fetchImpl)) throw new Error('TECHNICAL_BACKUP_ACCESS_UNAVAILABLE');\n  const minutes = Math.ceil(runtime.challengeTtlSeconds / 60);\n  const subject = 'Mã mở khóa Khu vực kỹ thuật Hưng Phát';\n  const bodyText = `Có yêu cầu mở Khu vực kỹ thuật sao lưu hệ thống Công Ty. Mã xác nhận: ${code}. Mã hết hạn sau ${minutes} phút. Mã này chỉ dùng cho sao lưu kỹ thuật; không dùng để xác nhận xóa dữ liệu.`;\n  const bodyHtml = `<p>Có yêu cầu mở <strong>Khu vực kỹ thuật sao lưu hệ thống Công Ty</strong>.</p><p>Mã xác nhận: <strong>${code}</strong></p><p>Mã hết hạn sau ${minutes} phút.</p><p>Mã này chỉ dùng cho sao lưu kỹ thuật; không dùng để xác nhận xóa dữ liệu.</p>`;\n  try {\n    return await sendResendEmail(fetchImpl, runtime, {\n      to: [TECHNICAL_BACKUP_RECIPIENT],\n      subject,\n      text: bodyText,\n      html: bodyHtml,\n      operation: 'technical-backup-challenge-email',\n      entityId: challengeId,\n    });\n  } catch {\n    throw new Error('TECHNICAL_BACKUP_CHALLENGE_DELIVERY_FAILED');\n  }\n}\n""",
          )

          replace_once(
              'npp-core/api/src/services/technical-backup-access.js',
              "await sendTechnicalBackupAccessEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp });",
              "await sendTechnicalBackupAccessEmail(fetchImpl, runtime, { code, challengeId });",
          )

          replace_once(
              'npp-core/api/src/backup/owner-delete-challenge.js',
              "import { createHmac, randomInt, timingSafeEqual } from 'node:crypto';\n",
              "import { createHmac, randomInt, timingSafeEqual } from 'node:crypto';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from '../email/resend.js';\n",
          )
          replace_once(
              'npp-core/api/src/backup/owner-delete-challenge.js',
              """  return Object.freeze({\n    accountId: text(env.CLOUDFLARE_ACCOUNT_ID),\n    apiToken: text(env.CLOUDFLARE_EMAIL_API_TOKEN),\n    from: text(env.INTERNAL_AUTH_EMAIL_FROM),\n    pepper: text(env.INTERNAL_AUTH_CHALLENGE_PEPPER),\n""",
              """  return Object.freeze({\n    ...loadResendEmailRuntime({ env }),\n    pepper: text(env.INTERNAL_AUTH_CHALLENGE_PEPPER),\n""",
          )
          replace_once(
              'npp-core/api/src/backup/owner-delete-challenge.js',
              """  return Boolean(\n    runtime?.accountId\n    && runtime?.apiToken\n    && EMAIL_PATTERN.test(runtime?.from ?? '')\n    && runtime?.pepper?.length >= 32\n    && Array.isArray(runtime?.recipients)\n    && runtime.recipients.length > 0\n    && typeof fetchImpl === 'function'\n  );\n""",
              """  return Boolean(\n    resendEmailRuntimeReady(runtime, fetchImpl)\n    && runtime?.pepper?.length >= 32\n    && Array.isArray(runtime?.recipients)\n    && runtime.recipients.length > 0\n  );\n""",
          )
          replace_regex_once(
              'npp-core/api/src/backup/owner-delete-challenge.js',
              r"export async function sendOwnerDeletionChallengeEmail\(fetchImpl, runtime, \{ code, sourceApp \} \) \{.*?\n\}\n",
              """export async function sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp, intentId }) {\n  if (!ownerDeletionRuntimeReady(runtime, fetchImpl)) throw new Error('DATA_DELETION_CHALLENGE_UNAVAILABLE');\n  const subject = 'Mã xác nhận yêu cầu xóa dữ liệu Hưng Phát';\n  const minutes = Math.ceil(runtime.ttlSeconds / 60);\n  const bodyText = `Có yêu cầu xác minh xóa dữ liệu từ ${sourceApp}. Mã xác nhận: ${code}. Mã hết hạn sau ${minutes} phút. Chỉ nhập mã trong mục Cài đặt > Dữ liệu & sao lưu. Nếu không phải yêu cầu của bạn, không cung cấp mã này.`;\n  const bodyHtml = `<p>Có yêu cầu xác minh <strong>xóa dữ liệu</strong> từ ${sourceApp}.</p><p>Mã xác nhận: <strong>${code}</strong></p><p>Mã hết hạn sau ${minutes} phút.</p><p>Chỉ nhập mã trong mục Cài đặt &gt; Dữ liệu &amp; sao lưu. Nếu không phải yêu cầu của bạn, không cung cấp mã này.</p>`;\n  try {\n    return await sendResendEmail(fetchImpl, runtime, {\n      to: runtime.recipients,\n      subject,\n      text: bodyText,\n      html: bodyHtml,\n      operation: 'data-deletion-challenge-email',\n      entityId: intentId,\n    });\n  } catch {\n    throw new Error('DATA_DELETION_CHALLENGE_DELIVERY_FAILED');\n  }\n}\n""",
          )

          replace_once(
              'npp-core/api/src/services/backup.js',
              "await sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp });",
              "await sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp, intentId });",
          )

          replace_once(
              'npp-core/api/src/services/backup.js',
              """await sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp, intentId });\n""",
              """await sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp, intentId });\n""",
          )

          package_path = ROOT / 'npp-core/api/package.json'
          package_text = package_path.read_text(encoding='utf-8')
          marker = '"build": "node --check src/server.js &&'
          if package_text.count(marker) != 1:
              raise SystemExit('npp-core/api/package.json: build marker not found exactly once')
          package_path.write_text(package_text.replace(marker, '"build": "node --check src/email/resend.js && node --check src/server.js &&'), encoding='utf-8')

          test_path = ROOT / 'npp-core/api/test/resend-email.test.js'
          if test_path.exists():
              raise SystemExit('npp-core/api/test/resend-email.test.js already exists; refusing to overwrite')
          test_path.write_text('''import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from '../src/email/resend.js';\n\nconst RECIPIENTS = [\n  'khuongbinh.info@gmail.com',\n  'hgluckit@gmail.com',\n  'buomphuong@gmail.com',\n];\n\ntest('Resend runtime uses RESEND_API_KEY and keeps provider credentials out of the email payload', () => {\n  const runtime = loadResendEmailRuntime({\n    env: {\n      RESEND_API_KEY: 're_test_only',\n      INTERNAL_AUTH_EMAIL_FROM: 'security@nguyenlieuhungphat.com',\n      CLOUDFLARE_ACCOUNT_ID: 'must-not-be-used',\n      CLOUDFLARE_EMAIL_API_TOKEN: 'must-not-be-used',\n    },\n  });\n  assert.equal(runtime.apiKey, 're_test_only');\n  assert.equal(runtime.from, 'security@nguyenlieuhungphat.com');\n  assert.equal(resendEmailRuntimeReady(runtime, async () => ({ ok: true })), true);\n});\n\ntest('Resend send adapter maps accepted response and reuses the canonical idempotency key for the same challenge', async () => {\n  const runtime = loadResendEmailRuntime({\n    env: { RESEND_API_KEY: 're_test_only', INTERNAL_AUTH_EMAIL_FROM: 'security@nguyenlieuhungphat.com' },\n  });\n  const requests = [];\n  const fetchImpl = async (url, init) => {\n    requests.push({ url, init, body: JSON.parse(init.body) });\n    return { ok: true, json: async () => ({ id: 'email-123' }) };\n  };\n\n  for (const recipient of RECIPIENTS) {\n    await sendResendEmail(fetchImpl, runtime, {\n      to: [recipient],\n      subject: 'Test OTP',\n      text: 'Mã kiểm thử',\n      html: '<p>Mã kiểm thử</p>',\n      operation: 'login-challenge-email',\n      entityId: '11111111-1111-4111-8111-111111111111',\n    });\n  }\n\n  assert.equal(requests.length, 3);\n  for (const request of requests) {\n    assert.equal(request.url, 'https://api.resend.com/emails');\n    assert.equal(request.init.headers.Authorization, 'Bearer re_test_only');\n    assert.match(request.init.headers['Idempotency-Key'], /^[A-Za-z0-9._-]{1,128}$/);\n    assert.equal(request.body.from, 'security@nguyenlieuhungphat.com');\n    assert.equal(JSON.stringify(request.body).includes('re_test_only'), false);\n  }\n  assert.equal(requests[0].init.headers['Idempotency-Key'], requests[1].init.headers['Idempotency-Key']);\n  assert.equal(requests[1].init.headers['Idempotency-Key'], requests[2].init.headers['Idempotency-Key']);\n});\n\ntest('Resend send adapter fails closed on provider rejection, timeout, and malformed success', async () => {\n  const runtime = loadResendEmailRuntime({\n    env: { RESEND_API_KEY: 're_test_only', INTERNAL_AUTH_EMAIL_FROM: 'security@nguyenlieuhungphat.com' },\n  });\n  const input = {\n    to: ['khuongbinh.info@gmail.com'],\n    subject: 'Test',\n    text: 'Test',\n    html: '<p>Test</p>',\n    operation: 'technical-backup-challenge-email',\n    entityId: '22222222-2222-4222-8222-222222222222',\n  };\n\n  await assert.rejects(\n    sendResendEmail(async () => ({ ok: false, json: async () => ({ error: { message: 'rejected' } }) }), runtime, input),\n    /RESEND_EMAIL_SEND_FAILED/,\n  );\n  await assert.rejects(\n    sendResendEmail(async () => { throw new Error('timeout'); }, runtime, input),\n  );\n  await assert.rejects(\n    sendResendEmail(async () => ({ ok: true, json: async () => ({}) }), runtime, input),\n    /RESEND_EMAIL_SEND_FAILED/,\n  );\n});\n''', encoding='utf-8')

          backup_test = ROOT / 'npp-core/api/test/backup-foundation.test.js'
          replace_once(
              'npp-core/api/test/backup-foundation.test.js',
              """      CLOUDFLARE_ACCOUNT_ID: 'account-1',\n      CLOUDFLARE_EMAIL_API_TOKEN: 'secret-provider-token',\n""",
              """      RESEND_API_KEY: 're_test_only',\n""",
          )
          replace_once(
              'npp-core/api/test/backup-foundation.test.js',
              """      return {\n      ok: true,\n      json: async () => ({ success: true, result: { delivered: runtime.recipients, queued: [], permanent_bounces: [] } }),\n    };\n""",
              """      return {\n      ok: true,\n      json: async () => ({ id: 'email-123' }),\n    };\n""",
          )
          replace_once(
              'npp-core/api/test/backup-foundation.test.js',
              """  assert.ok(!JSON.stringify(requestBody).includes('secret-provider-token'));\n""",
              """  assert.ok(!JSON.stringify(requestBody).includes('re_test_only'));\n""",
          )
          replace_once(
              'npp-core/api/test/backup-foundation.test.js',
              """      CLOUDFLARE_ACCOUNT_ID: 'account-1',\n      CLOUDFLARE_EMAIL_API_TOKEN: 'provider-token',\n""",
              """      RESEND_API_KEY: 're_test_only',\n""",
          )
          replace_once(
              'npp-core/api/test/backup-foundation.test.js',
              """  const fetchImpl = async () => ({\n    ok: true,\n    json: async () => ({ success: true, result: { delivered: ['owner1@example.com', 'owner2@example.com'], queued: [], permanent_bounces: [] } }),\n  });\n""",
              """  const fetchImpl = async () => ({\n    ok: true,\n    json: async () => ({ id: 'email-123' }),\n  });\n""",
          )
          replace_once(
              'npp-core/api/test/backup-foundation.test.js',
              """  await assert.rejects(\n    sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code: '123456', sourceApp: 'npp-operations-web' }),\n    /DATA_DELETION_CHALLENGE_DELIVERY_FAILED/,\n  );\n""",
              """  await assert.rejects(\n    sendOwnerDeletionChallengeEmail(async () => ({ ok: false, json: async () => ({ error: { message: 'rejected' } }) }), runtime, { code: '123456', sourceApp: 'npp-operations-web', intentId: '33333333-3333-4333-8333-333333333333' }),\n    /DATA_DELETION_CHALLENGE_DELIVERY_FAILED/,\n  );\n""",
          )

          # Verify that no provider-specific Cloudflare email sending code remains in the three adapters.
          for path in [
              'npp-core/api/src/internal-workforce-auth.js',
              'npp-core/api/src/backup/technical-access.js',
              'npp-core/api/src/backup/owner-delete-challenge.js',
          ]:
              text = (ROOT / path).read_text(encoding='utf-8')
              if 'api.cloudflare.com/client/v4/accounts/' in text or 'CLOUDFLARE_EMAIL_API_TOKEN' in text:
                  raise SystemExit(f'{path}: Cloudflare outbound email provider reference remains')

          print('Resend migration patch applied')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        working-directory: npp-core/api
        run: npm run verify

      - name: Verify no migration or secret changes
        shell: bash
        run: |
          test "$(git diff --name-only -- database/migrations | wc -l)" -eq 0
          ! git diff --cached --name-only | grep -E '(^|/)(\.env|.*secret.*|.*token.*)$' || true
          git diff --check

      - name: Commit final issue-638 changes and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-638-apply-resend.yml
          git add npp-core/api/src/email/resend.js \
            npp-core/api/src/internal-workforce-auth.js \
            npp-core/api/src/backup/technical-access.js \
            npp-core/api/src/backup/owner-delete-challenge.js \
            npp-core/api/src/services/technical-backup-access.js \
            npp-core/api/src/services/backup.js \
            npp-core/api/package.json \
            npp-core/api/test/resend-email.test.js \
            npp-core/api/test/backup-foundation.test.js
          git commit -m 'fix(issue-638): switch transactional email provider to Resend'
          git push origin agent/issue-638-resend-email-provider
