name: Lane G approved PWA icon resize

on:
  push:
    branches:
      - agent/fix-admin-delivery-pwa-icons

permissions:
  contents: write

jobs:
  resize-and-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Resize approved sources and map PWA assets
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected audited text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def save_png(image: Image.Image, path: Path, size: int) -> None:
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              path.parent.mkdir(parents=True, exist_ok=True)
              resized.save(path, format='PNG', optimize=True, compress_level=9)

          def process_source(source_path: str, output_prefix: str, sizes: tuple[int, ...]) -> None:
              source = ROOT / source_path
              before_bytes = source.stat().st_size
              with Image.open(source) as opened:
                  opened.load()
                  width, height = opened.size
                  print(f'{source_path}: before={width}x{height}, bytes={before_bytes}, mode={opened.mode}')
                  if width != height:
                      raise SystemExit(f'{source_path} must be square; refusing to crop approved artwork')
                  if width < 512:
                      raise SystemExit(f'{source_path} is smaller than 512px; refusing to upscale approved artwork')
                  master = opened.convert('RGBA').resize((512, 512), Image.Resampling.LANCZOS)

              master.save(source, format='PNG', optimize=True, compress_level=9)
              print(f'{source_path}: after=512x512, bytes={source.stat().st_size}')

              prefix = ROOT / output_prefix
              for size in sizes:
                  save_png(master, Path(f'{prefix}-{size}.png'), size)
              save_png(master, Path(f'{prefix}-maskable-512.png'), 512)

          process_source('pwa-icon-admin.png', 'admin/web/public/icons/admin', (180, 192, 512))
          process_source('pwa-icon-deliveri.png', 'delivery/web/public/icons/delivery', (180, 192, 512))

          replace_once('admin/web/app/manifest.ts', "src: '/api/pwa-icon?size=192'", "src: '/icons/admin-192.png'")
          replace_once('admin/web/app/manifest.ts', "src: '/api/pwa-icon?size=512'", "src: '/icons/admin-512.png'")
          replace_once('admin/web/app/manifest.ts', "src: '/api/pwa-icon?size=512&maskable=1'", "src: '/icons/admin-maskable-512.png'")

          replace_once('admin/web/app/layout.tsx', "{ url: '/api/pwa-icon?size=192', sizes: '192x192', type: 'image/png' }", "{ url: '/icons/admin-192.png', sizes: '192x192', type: 'image/png' }")
          replace_once('admin/web/app/layout.tsx', "{ url: '/api/pwa-icon?size=512', sizes: '512x512', type: 'image/png' }", "{ url: '/icons/admin-512.png', sizes: '512x512', type: 'image/png' }")
          replace_once('admin/web/app/layout.tsx', "shortcut: '/api/pwa-icon?size=192'", "shortcut: '/icons/admin-192.png'")
          replace_once('admin/web/app/layout.tsx', "apple: '/api/pwa-icon?size=512'", "apple: [{ url: '/icons/admin-180.png', sizes: '180x180', type: 'image/png' }]")

          replace_once('admin/web/middleware.ts', 'manifest.webmanifest|sw.js|offline.html|api/pwa-icon', 'manifest.webmanifest|sw.js|offline.html|icons/')

          replace_once('admin/web/public/sw.js', "const CACHE_NAME = 'admin-mcp-npp-static-v1';", "const CACHE_NAME = 'admin-mcp-npp-static-v2';")
          replace_once('admin/web/public/sw.js', "const STATIC_PATH_PREFIXES = ['/_next/static/', '/api/pwa-icon'];", "const STATIC_PATH_PREFIXES = ['/_next/static/', '/icons/'];")
          replace_once(
              'admin/web/public/sw.js',
              "const STATIC_PATHS = ['/manifest.webmanifest', OFFLINE_URL];",
              "const STATIC_PATHS = [\n  '/manifest.webmanifest',\n  OFFLINE_URL,\n  '/icons/admin-180.png',\n  '/icons/admin-192.png',\n  '/icons/admin-512.png',\n  '/icons/admin-maskable-512.png',\n];",
          )
          replace_once('admin/web/public/sw.js', '.then((cache) => cache.add(OFFLINE_URL))', '.then((cache) => cache.addAll(STATIC_PATHS))')
          replace_once('delivery/web/public/sw.js', "const CACHE_NAME = 'hung-phat-delivery-static-v1';", "const CACHE_NAME = 'hung-phat-delivery-static-v2';")

          # Update Admin regression expectations from the removed dynamic generator to approved static assets.
          replace_once('admin/web/test/pwa.test.mjs', "const iconRoute = read('app/api/pwa-icon/route.ts');\n", '')
          replace_once(
              'admin/web/test/pwa.test.mjs',
              "  assert.match(manifest, /theme_color:\\s*'#2b180b'/i);\n",
              "  assert.match(manifest, /theme_color:\\s*'#2b180b'/i);\n  assert.match(manifest, /\\/icons\\/admin-192\\.png/);\n  assert.match(manifest, /\\/icons\\/admin-512\\.png/);\n  assert.match(manifest, /\\/icons\\/admin-maskable-512\\.png/);\n  assert.doesNotMatch(manifest, /api\\/pwa-icon/);\n",
          )
          replace_once(
              'admin/web/test/pwa.test.mjs',
              "  assert.doesNotMatch(layout, /maximumScale|userScalable/);\n",
              "  assert.match(layout, /\\/icons\\/admin-180\\.png/);\n  assert.match(layout, /\\/icons\\/admin-192\\.png/);\n  assert.match(layout, /\\/icons\\/admin-512\\.png/);\n  assert.doesNotMatch(layout, /api\\/pwa-icon|maximumScale|userScalable/);\n",
          )
          replace_once('admin/web/test/pwa.test.mjs', "  assert.match(serviceWorker, /'\\/api\\/pwa-icon'/);\n", "  assert.match(serviceWorker, /'\\/icons\\/'/);\n  assert.match(serviceWorker, /admin-mcp-npp-static-v2/);\n  assert.doesNotMatch(serviceWorker, /api\\/pwa-icon|admin-mcp-npp-static-v1/);\n")
          replace_once(
              'admin/web/test/pwa.test.mjs',
              "  assert.match(middleware, /api\\/pwa-icon/);\n  assert.match(iconRoute, /SUPPORTED_SIZES = new Set\\(\\[192, 512\\]\\)/);\n  assert.match(iconRoute, /maskable/);\n  assert.match(iconRoute, /ImageResponse/);\n",
              "  assert.match(middleware, /icons\\//);\n  assert.doesNotMatch(middleware, /api\\/pwa-icon/);\n",
          )
          replace_once(
              'admin/web/test/pwa.test.mjs',
              "test('Admin registers a root-scoped service worker', () => {\n",
              "test('Admin approved source and derived PWA icons have exact dimensions', () => {\n  const files = [\n    ['../../../pwa-icon-admin.png', 512],\n    ['../public/icons/admin-180.png', 180],\n    ['../public/icons/admin-192.png', 192],\n    ['../public/icons/admin-512.png', 512],\n    ['../public/icons/admin-maskable-512.png', 512],\n  ];\n  for (const [path, size] of files) {\n    const bytes = readFileSync(new URL(path, import.meta.url));\n    assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');\n    assert.equal(bytes.readUInt32BE(16), size, `${path} width`);\n    assert.equal(bytes.readUInt32BE(20), size, `${path} height`);\n  }\n});\n\ntest('Admin registers a root-scoped service worker', () => {\n",
          )

          # Extend Delivery regression with exact dimensions and cache rotation.
          replace_once(
              'delivery/web/test/mobile-shell-pwa.test.mjs',
              "test('Delivery bottom navigation is compact while preserving iPhone safe area', () => {\n",
              "test('Delivery approved source and derived PWA icons have exact dimensions', () => {\n  const files = [\n    ['../../../pwa-icon-deliveri.png', 512],\n    ['../public/icons/delivery-180.png', 180],\n    ['../public/icons/delivery-192.png', 192],\n    ['../public/icons/delivery-512.png', 512],\n    ['../public/icons/delivery-maskable-512.png', 512],\n  ];\n  for (const [path, size] of files) {\n    const bytes = readFileSync(new URL(path, import.meta.url));\n    assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');\n    assert.equal(bytes.readUInt32BE(16), size, `${path} width`);\n    assert.equal(bytes.readUInt32BE(20), size, `${path} height`);\n  }\n});\n\ntest('Delivery bottom navigation is compact while preserving iPhone safe area', () => {\n",
          )
          replace_once(
              'delivery/web/test/mobile-shell-pwa.test.mjs',
              "  assert.match(worker, /request\\.mode === 'navigate'/);\n",
              "  assert.match(worker, /hung-phat-delivery-static-v2/);\n  assert.doesNotMatch(worker, /hung-phat-delivery-static-v1/);\n  assert.match(worker, /request\\.mode === 'navigate'/);\n",
          )

          icon_route = ROOT / 'admin/web/app/api/pwa-icon/route.ts'
          if not icon_route.exists():
              raise SystemExit('Audited Admin dynamic icon route is missing')
          icon_route.unlink()
          PY

          rm .github/workflows/lane-g-resize-icons.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pwa): map approved admin and delivery icons'
          git push origin HEAD:agent/fix-admin-delivery-pwa-icons
