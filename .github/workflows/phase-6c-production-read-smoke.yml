name: Phase 6C production read smoke

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: phase-6c-production-read-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/smoke-phase-6c-production-read' &&
      (
        github.actor == 'binhnxwjfjxm' ||
        github.actor == 'khuongbinhinfo-a11y'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_REF: main
      CORE_APP_NAME: hung-phat
      MCP_APP_NAME: hung-phat-mcp
    steps:
      - name: Validate exact issue command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/smoke-phase-6c-production-read'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Run read-only production acceptance
        id: smoke
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          fail_smoke() {
            local code="$1"
            echo "Phase 6C read smoke failed: $code" >&2
            echo "SMOKE_FAILURE=$code" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          require_nonempty() {
            local label="$1"
            local value="$2"
            [ -n "$value" ] || fail_smoke "${label}_missing"
          }

          require_equal() {
            local label="$1"
            local actual="$2"
            local expected="$3"
            [ "$actual" = "$expected" ] || fail_smoke "${label}_mismatch"
          }

          app_url() {
            local app="$1"
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.heroku+json; version=3' \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$app" \
              | jq -r '.web_url // empty' \
              | sed 's:/*$::'
          }

          request_json() {
            local label="$1"
            local expected="$2"
            shift 2
            local body="$workdir/$label.json"
            local status error_code
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 45 --output "$body" --write-out '%{http_code}' "$@" || true)"
            echo "SMOKE_STEP=$label HTTP=${status:-none}" >&2
            echo "SMOKE_HTTP_${label^^}=${status:-none}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "$expected" ]; then
              error_code="$(jq -r '.error.code // empty' "$body" 2>/dev/null || true)"
              if [ -n "$error_code" ]; then
                echo "SMOKE_ERROR_CODE_${label^^}=$error_code" >> "$GITHUB_STEP_SUMMARY"
                echo "$label returned error code $error_code" >&2
              fi
              fail_smoke "${label}_http_${status:-none}_expected_$expected"
              return 1
            fi
            if ! jq -e . "$body" >/dev/null 2>&1; then
              fail_smoke "${label}_invalid_json"
              return 1
            fi
            printf '%s' "$status"
          }

          request_error_json() {
            local label="$1"
            local expected_status="$2"
            local expected_code="$3"
            shift 3
            local body="$workdir/$label.json"
            local status error_code
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 45 --output "$body" --write-out '%{http_code}' "$@" || true)"
            error_code="$(jq -r '.error.code // empty' "$body" 2>/dev/null || true)"
            echo "SMOKE_STEP=$label HTTP=${status:-none}" >&2
            echo "SMOKE_HTTP_${label^^}=${status:-none}" >> "$GITHUB_STEP_SUMMARY"
            echo "SMOKE_ERROR_CODE_${label^^}=${error_code:-none}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "$expected_status" ]; then
              fail_smoke "${label}_http_${status:-none}_expected_$expected_status"
              return 1
            fi
            if [ "$error_code" != "$expected_code" ]; then
              fail_smoke "${label}_error_${error_code:-none}_expected_$expected_code"
              return 1
            fi
            if ! jq -e . "$body" >/dev/null 2>&1; then
              fail_smoke "${label}_invalid_json"
              return 1
            fi
            printf '%s:%s' "$status" "$error_code"
          }

          core_url="$(app_url "$CORE_APP_NAME")"
          mcp_url="$(app_url "$MCP_APP_NAME")"
          require_nonempty core_url "$core_url"
          require_nonempty mcp_url "$mcp_url"

          mcp_config="$(heroku config -a "$MCP_APP_NAME" --json)"
          mcp_backend_token="$(jq -r '.BACKEND_API_TOKEN // empty' <<<"$mcp_config")"
          onboarding_base="$(jq -r '.CORE_ONBOARDING_API_BASE_URL // empty' <<<"$mcp_config" | sed 's:/*$::')"
          onboarding_token="$(jq -r '.CORE_ONBOARDING_API_TOKEN // empty' <<<"$mcp_config")"
          sales_base="$(jq -r '.CORE_SALES_API_BASE_URL // empty' <<<"$mcp_config" | sed 's:/*$::')"
          sales_token="$(jq -r '.CORE_SALES_API_TOKEN // empty' <<<"$mcp_config")"
          require_nonempty mcp_backend_token "$mcp_backend_token"
          require_nonempty onboarding_base "$onboarding_base"
          require_nonempty onboarding_token "$onboarding_token"
          require_nonempty sales_base "$sales_base"
          require_nonempty sales_token "$sales_token"
          for value in "$mcp_backend_token" "$onboarding_token" "$sales_token"; do echo "::add-mask::$value"; done
          require_equal onboarding_base "$onboarding_base" "$core_url"
          require_equal sales_base "$sales_base" "$core_url"

          core_live="$(request_json core_live 200 "$core_url/health/live")"
          core_ready="$(request_json core_ready 200 "$core_url/health/ready")"
          core_onboarding="$(request_json core_onboarding 200 -H "Authorization: Bearer $onboarding_token" -H 'Accept: application/json' "$onboarding_base/api/customer-onboarding-requests?limit=1&offset=0")"
          core_sku="$(request_json core_sku 200 -H "Authorization: Bearer $sales_token" -H 'Accept: application/json' "$sales_base/api/sales-orders/sku-search?search=&limit=1&offset=0")"
          core_orders="$(request_json core_orders 200 -H "Authorization: Bearer $sales_token" -H 'Accept: application/json' "$sales_base/api/sales-orders?limit=1&offset=0")"

          mcp_live="$(request_json mcp_live 200 "$mcp_url/health/live")"
          mcp_ready="$(request_json mcp_ready 200 "$mcp_url/health/ready")"
          mcp_db_read="$(request_json mcp_db_read 200 -X POST -H "X-Backend-Token: $mcp_backend_token" -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{"table":"orders","select":"id","limit":1}' "$mcp_url/api/read")"
          mcp_product_proxy="$(request_json mcp_product_proxy 200 -H "X-Backend-Token: $mcp_backend_token" -H 'Accept: application/json' "$mcp_url/api/core-sales/products/search?q=&limit=1")"
          mcp_direct_orders_auth="$(request_error_json mcp_direct_orders_auth 401 TRUSTED_EMPLOYEE_REQUIRED -H "X-Backend-Token: $mcp_backend_token" -H 'Accept: application/json' "$mcp_url/api/core-sales/orders")"

          {
            echo "SOURCE_SHA=${{ steps.source.outputs.sha }}"
            echo "CORE_HEALTH_LIVE=$core_live"
            echo "CORE_HEALTH_READY=$core_ready"
            echo "CORE_ONBOARDING_LIST=$core_onboarding"
            echo "CORE_SKU_SEARCH=$core_sku"
            echo "CORE_SALES_ORDER_LIST=$core_orders"
            echo "MCP_HEALTH_LIVE=$mcp_live"
            echo "MCP_HEALTH_READY=$mcp_ready"
            echo "MCP_DATABASE_READ=$mcp_db_read"
            echo "MCP_CORE_PRODUCT_PROXY=$mcp_product_proxy"
            echo "MCP_DIRECT_CORE_ORDERS_AUTH_BOUNDARY=$mcp_direct_orders_auth"
            echo "LEGACY_SESSION_ORDER_ROUTES=retired"
            echo "PRODUCTION_WRITE_SMOKE=not_exercised_no_owner_approved_fixture"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized read-smoke evidence to Issue 189
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence_file="$(mktemp)"
          {
            echo "## Phase 6C production read smoke — ${OPERATION_STATUS}"
            echo
            cat "$GITHUB_STEP_SUMMARY"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          } > "$evidence_file"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/189/comments" -f body="$(cat "$evidence_file")" >/dev/null
          rm -f "$evidence_file"
