name: Temporary PR 90 Repair

on:
  push:
    branches:
      - agent/phase-5-4-supplier-return
    paths:
      - .github/workflows/repair-pr90.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-4-supplier-return
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:docs/operations/LATEST_HANDOFF.md > docs/operations/LATEST_HANDOFF.md
          echo '' | base64 --decode > /tmp/repair_pr90.py
          python3 /tmp/repair_pr90.py
          rm .github/workflows/repair-pr90.yml
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(purchasing): harden supplier return invariants"
          git push origin HEAD:agent/phase-5-4-supplier-return
