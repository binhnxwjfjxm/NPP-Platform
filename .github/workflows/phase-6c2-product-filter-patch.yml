name: Phase 6C.2 Product Filter Patch

on:
  push:
    branches:
      - agent/phase-6c2-mcp-sales-order-adapter

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(core): filter Sales SKU variants by product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6c2-mcp-sales-order-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact product filter boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing_patch_anchor:{path}:{old[:80]}")
              file.write_text(text.replace(old, new, 1))

          replace(
              'npp-core/api/src/db/repositories/sales-order.js',
              "export async function searchSalesOrderSkuOptions(client, {\n  installationId, search, limit = 20, offset = 0,\n}) {",
              "export async function searchSalesOrderSkuOptions(client, {\n  installationId, search, productId = null, limit = 20, offset = 0,\n}) {"
          )
          replace(
              'npp-core/api/src/db/repositories/sales-order.js',
              "     WHERE pv.installation_id = $1\n       AND (",
              "     WHERE pv.installation_id = $1\n       AND ($4::uuid IS NULL OR pv.product_id = $4::uuid)\n       AND ("
          )
          replace(
              'npp-core/api/src/db/repositories/sales-order.js',
              "     LIMIT $4 OFFSET $5`,\n    [installationId, normalized, pattern, limit, offset],",
              "     LIMIT $5 OFFSET $6`,\n    [installationId, normalized, pattern, productId, limit, offset],"
          )

          replace(
              'npp-core/api/src/services/sales-order-entry-legacy.js',
              "const TAX_MODES = new Set(['EXCLUSIVE', 'INCLUSIVE']);",
              "const TAX_MODES = new Set(['EXCLUSIVE', 'INCLUSIVE']);\nconst UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;"
          )
          replace(
              'npp-core/api/src/services/sales-order-entry-legacy.js',
              "  search,\n  limit = 20,",
              "  search,\n  productId = null,\n  limit = 20,"
          )
          replace(
              'npp-core/api/src/services/sales-order-entry-legacy.js',
              "  if (term.length > 256) return failure('INVALID_SEARCH', 'Từ khóa tìm hàng không được vượt quá 256 ký tự');\n  const [rows, settings]",
              "  if (term.length > 256) return failure('INVALID_SEARCH', 'Từ khóa tìm hàng không được vượt quá 256 ký tự');\n  const normalizedProductId = productId ? String(productId).trim() : null;\n  if (normalizedProductId && !UUID_PATTERN.test(normalizedProductId)) return failure('INVALID_PRODUCT_ID', 'Mã sản phẩm không hợp lệ');\n  const [rows, settings]"
          )
          replace(
              'npp-core/api/src/services/sales-order-entry-legacy.js',
              "      search: term,\n      limit:",
              "      search: term,\n      productId: normalizedProductId,\n      limit:"
          )

          replace(
              'npp-core/api/src/routes/sales-orders.js',
              "        search: url.searchParams.get('search') ?? '',\n        limit:",
              "        search: url.searchParams.get('search') ?? '',\n        productId: url.searchParams.get('productId'),\n        limit:"
          )

          replace(
              'mcp/apps/backend/foundation/core-sales-client.js',
              "  const params = new URLSearchParams({ search: term, limit: String(limit), offset: String(offset) });",
              "  const params = new URLSearchParams({ search: term, limit: String(limit), offset: String(offset) });\n  if (options.productId) params.set(\"productId\", String(options.productId));"
          )
          replace(
              'mcp/apps/backend/foundation/core-sales-api.js',
              "  const options = await searchCoreSalesSkus(search, context, config, { fetchImpl, limit: 50, offset: 0 });\n  return response(options.filter((item) => item.productId === productId).map(mapSkuOption));",
              "  const options = await searchCoreSalesSkus(search, context, config, {\n    fetchImpl,\n    limit: 50,\n    offset: 0,\n    productId\n  });\n  return response(options.map(mapSkuOption));"
          )
          PY
      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail
          node --check npp-core/api/src/db/repositories/sales-order.js
          node --check npp-core/api/src/services/sales-order-entry-legacy.js
          node --check npp-core/api/src/routes/sales-orders.js
          node --check mcp/apps/backend/foundation/core-sales-client.js
          node --check mcp/apps/backend/foundation/core-sales-api.js
      - name: Commit product filter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add npp-core/api/src/db/repositories/sales-order.js \
            npp-core/api/src/services/sales-order-entry-legacy.js \
            npp-core/api/src/routes/sales-orders.js \
            mcp/apps/backend/foundation/core-sales-client.js \
            mcp/apps/backend/foundation/core-sales-api.js
          git diff --cached --check
          git commit -m 'fix(core): filter Sales SKU variants by product'
          git push origin HEAD:agent/phase-6c2-mcp-sales-order-adapter
