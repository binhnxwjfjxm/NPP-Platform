name: P4.3 One-Time BigInt Hash Fix

on:
  push:
    branches:
      - agent/phase-4-inventory-reservations-negative-stock-v2

permissions:
  contents: write

jobs:
  fix-service:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-inventory-reservations-negative-stock-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Canonicalize BigInt as an exact string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('npp-core/api/src/services/inventory-reservations.js')
          source = path.read_text(encoding='utf-8')
          old = """function canonicalize(value) {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value === null || typeof value !== 'object') return value;"""
          new = """function canonicalize(value) {
            if (typeof value === 'bigint') return value.toString();
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value === null || typeof value !== 'object') return value;"""
          if source.count(old) != 1:
              raise SystemExit(f'expected one canonicalize match, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          node --check npp-core/api/src/services/inventory-reservations.js
          git diff --check

      - name: Commit service fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/p43-fix-bigint-hash.yml
          git add npp-core/api/src/services/inventory-reservations.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(inventory): canonicalize reservation BigInt values"
          git push origin HEAD:agent/phase-4-inventory-reservations-negative-stock-v2
