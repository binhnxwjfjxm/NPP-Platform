name: Issue 791 Lot B apply

on:
  push:
    branches:
      - agent/issue-791-lot-b-fast-search

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lot-b-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-791-lot-b-fast-search
          fetch-depth: 0
      - name: Apply audited Lot B changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend: canonical batch inventory preview read model.
          Path('npp-core/api/src/db/repositories/sales-order-search-preview.js').write_text(r'''export async function listSalesOrderSkuInventoryPreviews(client, {
            installationId,
            warehouseId,
            variantIds,
          }) {
            const ids = [...new Set((Array.isArray(variantIds) ? variantIds : []).filter(Boolean))];
            if (ids.length === 0) return [];
            const result = await client.query(
              `WITH selected AS (
                 SELECT pv.id AS sales_variant_id,
                        product.is_inventory_managed,
                        base_scope.base_variant_count,
                        base_scope.base_variant_id,
                        base_scope.base_unit_code
                   FROM shared.product_variants pv
                   JOIN shared.products product
                     ON product.installation_id = pv.installation_id
                    AND product.id = pv.product_id
                   LEFT JOIN LATERAL (
                     SELECT count(*)::int AS base_variant_count,
                            (array_agg(base_variant.id ORDER BY base_variant.id))[1] AS base_variant_id,
                            (array_agg(base_unit.code ORDER BY base_variant.id))[1] AS base_unit_code
                       FROM shared.product_variants base_variant
                       LEFT JOIN shared.units_of_measure base_unit
                         ON base_unit.installation_id = base_variant.installation_id
                        AND base_unit.id = base_variant.unit_id
                      WHERE base_variant.installation_id = pv.installation_id
                        AND base_variant.product_id = pv.product_id
                        AND base_variant.is_inventory_base = true
                        AND base_variant.is_active = true
                   ) base_scope ON true
                  WHERE pv.installation_id = $1
                    AND pv.id = ANY($3::uuid[])
               ), balance AS (
                 SELECT balance.base_variant_id,
                        COALESCE(sum(balance.on_hand_quantity), 0)::numeric(30,12) AS on_hand_quantity,
                        COALESCE(sum(balance.reserved_quantity), 0)::numeric(30,12) AS exact_reserved_quantity
                   FROM inventory.inventory_balances balance
                  WHERE balance.installation_id = $1
                    AND balance.warehouse_id = $2
                    AND balance.base_variant_id IN (
                      SELECT base_variant_id FROM selected
                       WHERE base_variant_count = 1 AND base_variant_id IS NOT NULL
                    )
                  GROUP BY balance.base_variant_id
               ), demand AS (
                 SELECT demand.base_variant_id,
                        COALESCE(sum(demand.reserved_base_quantity - demand.allocated_base_quantity), 0)::numeric(30,12)
                          AS fulfillment_reserved_quantity
                   FROM sales.sales_order_fulfillment_demands demand
                  WHERE demand.installation_id = $1
                    AND demand.warehouse_id = $2
                    AND demand.state = 'ACTIVE'
                    AND demand.base_variant_id IN (
                      SELECT base_variant_id FROM selected
                       WHERE base_variant_count = 1 AND base_variant_id IS NOT NULL
                    )
                  GROUP BY demand.base_variant_id
               )
               SELECT selected.sales_variant_id,
                      selected.is_inventory_managed,
                      selected.base_variant_count,
                      selected.base_variant_id,
                      selected.base_unit_code,
                      COALESCE(balance.on_hand_quantity, 0)::numeric(30,12)::text AS on_hand_quantity,
                      greatest(
                        COALESCE(balance.on_hand_quantity, 0)
                        - COALESCE(balance.exact_reserved_quantity, 0)
                        - COALESCE(demand.fulfillment_reserved_quantity, 0),
                        0
                      )::numeric(30,12)::text AS available_quantity
                 FROM selected
                 LEFT JOIN balance ON balance.base_variant_id = selected.base_variant_id
                 LEFT JOIN demand ON demand.base_variant_id = selected.base_variant_id`,
              [installationId, warehouseId, ids],
            );
            return result.rows;
          }
          ''')

          # Backend: enrich each search response server-side with canonical price + warehouse facts.
          Path('npp-core/api/src/services/sales-order-search-preview.js').write_text(r'''import * as legacy from './sales-order-entry-legacy.js';
          import * as pricingService from './pricing.js';
          import * as commercialRepository from '../db/repositories/sales-order-commercial.js';
          import * as salesOrderRepository from '../db/repositories/sales-order.js';
          import * as warehouseRepository from '../db/repositories/warehouse.js';
          import * as previewRepository from '../db/repositories/sales-order-search-preview.js';

          const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          function failure(code, message, retryable = false, details = {}) {
            return Object.freeze({ ok: false, code, message, retryable, details });
          }

          function scopedWarehouseIds(requestContext) {
            return new Set(Array.isArray(requestContext?.scopes?.warehouseIds)
              ? requestContext.scopes.warehouseIds.filter((id) => UUID_PATTERN.test(String(id ?? '')))
              : []);
          }

          function normalizePricingAt(value, fallback) {
            const raw = String(value ?? fallback ?? '').trim();
            const parsed = new Date(raw);
            return raw && !Number.isNaN(parsed.getTime()) ? parsed.toISOString() : null;
          }

          function pricePreview(result) {
            if (!result?.ok) {
              return Object.freeze({
                status: 'UNAVAILABLE',
                unitPriceMinor: null,
                message: 'Chưa tính được giá',
              });
            }
            if (result.resolution?.resolutionStatus === 'MANUAL_PRICE_REQUIRED') {
              return Object.freeze({
                status: 'MISSING',
                unitPriceMinor: null,
                message: 'Chưa có giá',
              });
            }
            const unitPriceMinor = result.resolution?.systemUnitPriceMinor
              ?? result.resolution?.finalUnitPriceMinor
              ?? null;
            return Object.freeze({
              status: unitPriceMinor === null ? 'UNAVAILABLE' : 'RESOLVED',
              unitPriceMinor: unitPriceMinor === null ? null : String(unitPriceMinor),
              message: unitPriceMinor === null ? 'Chưa tính được giá' : null,
            });
          }

          function inventoryPreview(row) {
            if (!row) {
              return Object.freeze({
                status: 'UNAVAILABLE',
                onHandQuantity: null,
                availableQuantity: null,
                unitCode: null,
              });
            }
            if (row.is_inventory_managed === false) {
              return Object.freeze({
                status: 'NOT_MANAGED',
                onHandQuantity: null,
                availableQuantity: null,
                unitCode: null,
              });
            }
            if (row.is_inventory_managed !== true || Number(row.base_variant_count) !== 1 || !row.base_variant_id) {
              return Object.freeze({
                status: 'UNAVAILABLE',
                onHandQuantity: null,
                availableQuantity: null,
                unitCode: row.base_unit_code ?? null,
              });
            }
            return Object.freeze({
              status: 'TRACKED',
              onHandQuantity: String(row.on_hand_quantity ?? '0'),
              availableQuantity: String(row.available_quantity ?? '0'),
              unitCode: row.base_unit_code ?? null,
            });
          }

          function pickDefaultWarehouseId(warehouses, requestContext) {
            const scoped = scopedWarehouseIds(requestContext);
            if (scoped.size === 0) return null;
            const active = (Array.isArray(warehouses) ? warehouses : [])
              .filter((warehouse) => warehouse?.is_active === true && scoped.has(warehouse.id));
            if (active.length === 0) return null;
            if (active.length === 1) return active[0].id;
            const branchIds = Array.isArray(requestContext?.scopes?.branchIds)
              ? requestContext.scopes.branchIds.filter(Boolean)
              : [];
            const branchCandidates = branchIds.length === 1
              ? active.filter((warehouse) => warehouse.branch_id === branchIds[0])
              : [];
            const candidates = branchCandidates.length ? branchCandidates : active;
            return candidates.find((warehouse) => warehouse.warehouse_type === 'main')?.id
              ?? candidates[0]?.id
              ?? null;
          }

          export async function resolveDefaultWarehouseId(client, { requestContext }) {
            const warehouses = await warehouseRepository.listWarehousesForInstallation(client, {
              installationId: requestContext.installationId,
              active: true,
              limit: 10000,
              offset: 0,
            });
            return pickDefaultWarehouseId(warehouses, requestContext);
          }

          export async function searchSalesOrderSkuOptions(client, {
            requestContext,
            search,
            warehouseId,
            salesChannelId,
            customerId = null,
            pricingAt,
            limit = 20,
            offset = 0,
          }) {
            const normalizedWarehouseId = String(warehouseId ?? '').trim();
            const normalizedChannelId = String(salesChannelId ?? '').trim();
            const normalizedCustomerId = String(customerId ?? '').trim() || null;
            const normalizedPricingAt = normalizePricingAt(pricingAt, requestContext.receivedAt);
            if (!UUID_PATTERN.test(normalizedWarehouseId)
              || !UUID_PATTERN.test(normalizedChannelId)
              || !normalizedPricingAt) {
              return failure(
                'SALES_ORDER_SEARCH_CONTEXT_REQUIRED',
                'Hãy chọn kho và kênh bán trước khi tìm hàng',
              );
            }
            const scoped = scopedWarehouseIds(requestContext);
            if (!scoped.has(normalizedWarehouseId)) {
              return failure('WAREHOUSE_SCOPE_DENIED', 'Kho đã chọn nằm ngoài phạm vi được cấp');
            }
            const [warehouse, channel] = await Promise.all([
              warehouseRepository.getWarehouseByIdForInstallation(client, {
                id: normalizedWarehouseId,
                installationId: requestContext.installationId,
              }),
              commercialRepository.getActiveSalesChannel(client, {
                installationId: requestContext.installationId,
                id: normalizedChannelId,
              }),
            ]);
            if (!warehouse || warehouse.is_active !== true) {
              return failure('WAREHOUSE_NOT_FOUND', 'Kho đã chọn không còn hoạt động');
            }
            if (!channel) return failure('SALES_CHANNEL_NOT_FOUND', 'Kênh bán không còn hoạt động');
            if (normalizedCustomerId) {
              if (!UUID_PATTERN.test(normalizedCustomerId)) {
                return failure('CUSTOMER_NOT_FOUND', 'Khách hàng không hợp lệ');
              }
              const customer = await salesOrderRepository.getActiveCustomer(client, {
                installationId: requestContext.installationId,
                id: normalizedCustomerId,
              });
              if (!customer?.is_active) return failure('CUSTOMER_NOT_FOUND', 'Khách hàng không còn hoạt động');
            }

            const base = await legacy.searchSalesOrderSkuOptions(client, {
              requestContext,
              search,
              limit,
              offset,
            });
            if (!base.ok || base.skuOptions.length === 0) return base;

            const inventoryRows = await previewRepository.listSalesOrderSkuInventoryPreviews(client, {
              installationId: requestContext.installationId,
              warehouseId: normalizedWarehouseId,
              variantIds: base.skuOptions.map((option) => option.id),
            });
            const inventoryByVariantId = new Map(inventoryRows.map((row) => [row.sales_variant_id, row]));
            const enriched = await Promise.all(base.skuOptions.map(async (option) => {
              const pricing = await pricingService.resolvePrice(client, {
                installationId: requestContext.installationId,
                payload: {
                  variantId: option.id,
                  quantity: '1',
                  currencyCode: 'VND',
                  priceAt: normalizedPricingAt,
                  channelId: normalizedChannelId,
                  ...(normalizedCustomerId ? { customerId: normalizedCustomerId } : {}),
                  allowMissingBasePrice: true,
                },
              });
              return Object.freeze({
                ...option,
                pricePreview: pricePreview(pricing),
                inventoryPreview: inventoryPreview(inventoryByVariantId.get(option.id)),
              });
            }));
            return Object.freeze({ ok: true, skuOptions: Object.freeze(enriched) });
          }

          export const salesOrderSearchPreviewInternals = Object.freeze({
            inventoryPreview,
            normalizePricingAt,
            pickDefaultWarehouseId,
            pricePreview,
          });
          ''')

          # Entry settings now owns a deterministic scoped default warehouse.
          replace_once(
              'npp-core/api/src/services/sales-order-entry.js',
              "import * as systemSalesChannelRepository from '../db/repositories/system-sales-channel.js';\n",
              "import * as systemSalesChannelRepository from '../db/repositories/system-sales-channel.js';\nimport { resolveDefaultWarehouseId } from './sales-order-search-preview.js';\n",
          )
          replace_once(
              'npp-core/api/src/services/sales-order-entry.js',
              "  const [base, channels, defaultSalesChannelId] = await Promise.all([\n",
              "  const [base, channels, defaultSalesChannelId, defaultWarehouseId] = await Promise.all([\n",
          )
          replace_once(
              'npp-core/api/src/services/sales-order-entry.js',
              "    commercialRepository.getDefaultSalesChannelId(client, {\n      installationId: requestContext.installationId,\n    }),\n  ]);\n",
              "    commercialRepository.getDefaultSalesChannelId(client, {\n      installationId: requestContext.installationId,\n    }),\n    resolveDefaultWarehouseId(client, { requestContext }),\n  ]);\n",
          )
          replace_once(
              'npp-core/api/src/services/sales-order-entry.js',
              "      defaultSalesChannelId,\n      permissions: Object.freeze({\n",
              "      defaultSalesChannelId,\n      defaultWarehouseId,\n      permissions: Object.freeze({\n",
          )

          # Route requires the full canonical search context and delegates to the enriched service.
          replace_once(
              'npp-core/api/src/routes/sales-orders.js',
              "import * as entryService from '../services/sales-order-entry.js';\n",
              "import * as entryService from '../services/sales-order-entry.js';\nimport * as searchPreviewService from '../services/sales-order-search-preview.js';\n",
          )
          replace_once(
              'npp-core/api/src/routes/sales-orders.js',
              "      const result = await entryService.searchSalesOrderSkuOptions(options.getPool(), {\n        requestContext: context,\n        search: url.searchParams.get('search') ?? '',\n        limit: parseInteger(url.searchParams.get('limit'), 20, 50),\n        offset: parseInteger(url.searchParams.get('offset'), 0, 100000),\n      });\n",
              "      const result = await searchPreviewService.searchSalesOrderSkuOptions(options.getPool(), {\n        requestContext: context,\n        search: url.searchParams.get('search') ?? '',\n        warehouseId: url.searchParams.get('warehouseId'),\n        salesChannelId: url.searchParams.get('salesChannelId'),\n        customerId: url.searchParams.get('customerId'),\n        pricingAt: url.searchParams.get('pricingAt'),\n        limit: parseInteger(url.searchParams.get('limit'), 20, 50),\n        offset: parseInteger(url.searchParams.get('offset'), 0, 100000),\n      });\n",
          )

          # Web types describe preview facts without inventing browser-side calculations.
          replace_once(
              'npp-core/web/lib/sales-order-types.ts',
              "export type SalesOrderSkuSearchOption = {\n",
              "export type SalesOrderSkuPricePreview = {\n  status: 'RESOLVED' | 'MISSING' | 'UNAVAILABLE';\n  unitPriceMinor: string | null;\n  message: string | null;\n};\n\nexport type SalesOrderSkuInventoryPreview = {\n  status: 'TRACKED' | 'NOT_MANAGED' | 'UNAVAILABLE';\n  onHandQuantity: string | null;\n  availableQuantity: string | null;\n  unitCode: string | null;\n};\n\nexport type SalesOrderSkuSearchOption = {\n",
          )
          replace_once(
              'npp-core/web/lib/sales-order-types.ts',
              "  defaultTaxRate: string;\n  eligibility: SalesOrderSkuEligibility;\n};\n",
              "  defaultTaxRate: string;\n  eligibility: SalesOrderSkuEligibility;\n  pricePreview: SalesOrderSkuPricePreview;\n  inventoryPreview: SalesOrderSkuInventoryPreview;\n};\n",
          )
          replace_once(
              'npp-core/web/lib/sales-order-types.ts',
              "  defaultSalesChannelId: string | null;\n  permissions: {\n",
              "  defaultSalesChannelId: string | null;\n  defaultWarehouseId: string | null;\n  permissions: {\n",
          )

          form = 'npp-core/web/app/sales/sales-orders/SalesOrderCommercialForm.tsx'
          replace_once(form, "type LineDraft = {\n  variantId: string;\n", "type LineDraft = {\n  clientLineId: string;\n  variantId: string;\n")
          replace_once(form, "  return (version?.lines ?? []).map((line) => ({\n    variantId: line.variantId,\n", "  return (version?.lines ?? []).map((line) => ({\n    clientLineId: line.id,\n    variantId: line.variantId,\n")
          replace_once(form, "  const searchRef = useRef<HTMLInputElement>(null);\n", "  const searchRef = useRef<HTMLInputElement>(null);\n  const quantityRefs = useRef(new Map<string, HTMLInputElement>());\n")
          replace_once(
              form,
              "        setEntrySettings(settings);\n        setSalesChannelId((current) => current || settings.defaultSalesChannelId || '');\n        if (linesRef.current.length === 0) setTaxReady(true);\n",
              "        setEntrySettings(settings);\n        setSalesChannelId((current) => current || settings.defaultSalesChannelId || '');\n        setWarehouseId((current) => current || settings.defaultWarehouseId || '');\n        if (linesRef.current.length === 0) setTaxReady(true);\n",
          )
          replace_once(form, "    if (term.length < MIN_PRODUCT_SEARCH_LENGTH) {\n", "    if (term.length < MIN_PRODUCT_SEARCH_LENGTH || !warehouseId || !salesChannelId) {\n")
          replace_once(
              form,
              "        const query = new URLSearchParams({ search: term, limit: String(SEARCH_PAGE_SIZE), offset: '0' });\n        const rows = await apiRequest<SalesOrderSkuSearchOption[]>(`/api/sales-orders/sku-search?${query}`, { signal: controller.signal });\n",
              "        const query = new URLSearchParams({\n          search: term,\n          warehouseId,\n          salesChannelId,\n          pricingAt,\n          limit: String(SEARCH_PAGE_SIZE),\n          offset: '0',\n        });\n        if (customerMode === 'EXISTING' && customerId) query.set('customerId', customerId);\n        const rows = await apiRequest<SalesOrderSkuSearchOption[]>(`/api/sales-orders/sku-search?${query}`, { signal: controller.signal });\n",
          )
          replace_once(form, "  }, [onError, skuTerm]);\n", "  }, [customerId, customerMode, onError, pricingAt, salesChannelId, skuTerm, warehouseId]);\n")
          replace_once(form, "  const quantitySignature = lines.map((line) => `${line.variantId}:${line.quantity}`).join('|');\n", "  const quantitySignature = lines.map((line) => `${line.clientLineId}:${line.quantity}`).join('|');\n")
          replace_once(
              form,
              "  async function addSku(option: SalesOrderSkuSearchOption) {\n",
              "  function focusLineQuantity(clientLineId: string) {\n    window.setTimeout(() => {\n      const input = quantityRefs.current.get(clientLineId);\n      input?.focus();\n      input?.select();\n    }, 0);\n  }\n\n  async function addSku(option: SalesOrderSkuSearchOption) {\n",
          )
          replace_once(form, "    const pending: LineDraft = {\n      variantId: option.id,\n", "    const pending: LineDraft = {\n      clientLineId: crypto.randomUUID(),\n      variantId: option.id,\n")
          replace_once(form, "    setSkuTerm('');\n    setSkuResults([]);\n    markDirty();\n", "    setSkuTerm('');\n    setSkuResults([]);\n    focusLineQuantity(pending.clientLineId);\n    markDirty();\n")
          replace_once(form, "    } finally {\n      window.setTimeout(() => searchRef.current?.focus(), 0);\n    }\n", "    }\n")

          replace_once(
              form,
              "function pricingSummary(line: LineDraft): string {\n",
              "function searchPriceText(option: SalesOrderSkuSearchOption): string {\n  if (option.pricePreview.status === 'RESOLVED' && option.pricePreview.unitPriceMinor !== null) {\n    return vnd(option.pricePreview.unitPriceMinor);\n  }\n  return option.pricePreview.status === 'MISSING' ? 'Chưa có giá' : 'Chưa tính được giá';\n}\n\nfunction searchInventoryPrimary(option: SalesOrderSkuSearchOption): string {\n  if (option.inventoryPreview.status === 'NOT_MANAGED') return 'Không quản lý tồn';\n  if (option.inventoryPreview.status !== 'TRACKED') return 'Chưa có số liệu tồn';\n  const unit = option.inventoryPreview.unitCode ? ` ${option.inventoryPreview.unitCode}` : '';\n  return `Tồn ${compactQuantity(option.inventoryPreview.onHandQuantity)}${unit}`;\n}\n\nfunction searchInventorySecondary(option: SalesOrderSkuSearchOption): string | null {\n  if (option.inventoryPreview.status !== 'TRACKED') return null;\n  const unit = option.inventoryPreview.unitCode ? ` ${option.inventoryPreview.unitCode}` : '';\n  return `Khả dụng ${compactQuantity(option.inventoryPreview.availableQuantity)}${unit}`;\n}\n\nfunction pricingSummary(line: LineDraft): string {\n",
          )

          channel_line = "            <label className={styles.salesChannelField}><span>Kênh bán *</span><select data-testid=\"sales-channel-select\" value={salesChannelId} onChange={(event) => { setSalesChannelId(event.target.value); markDirty(); }}><option value=\"\">Chọn kênh bán</option>{entrySettings?.salesChannels.map((channel) => <option key={channel.id} value={channel.id}>{channel.code} — {channel.name}</option>)}</select></label>\n"
          replace_once(form, channel_line, "")
          replace_once(
              form,
              "          <section className={styles.productEntry} aria-label=\"Nhập hàng hóa\">\n            <div className={styles.productSearchBox}>\n              <label><span>Tìm hàng nhanh</span><input ref={searchRef} value={skuTerm} onChange={(event) => setSkuTerm(event.target.value)} onKeyDown={handleSkuKeyDown} placeholder=\"Tên sản phẩm, mã hàng, SKU hoặc barcode\" autoComplete=\"off\" /></label>\n",
              "          <section className={styles.productEntry} aria-label=\"Nhập hàng hóa\">\n            <div className={styles.productSearchBox}>\n              <div className={styles.productSearchControls}>\n                <label className={styles.salesChannelField}><span>Kênh bán / nguồn giá *</span><select data-testid=\"sales-channel-select\" value={salesChannelId} onChange={(event) => { setSalesChannelId(event.target.value); markDirty(); }}><option value=\"\">Chọn kênh bán</option>{entrySettings?.salesChannels.map((channel) => <option key={channel.id} value={channel.id}>{channel.code} — {channel.name}</option>)}</select></label>\n                <label><span>Tìm hàng nhanh</span><input ref={searchRef} value={skuTerm} onChange={(event) => setSkuTerm(event.target.value)} onKeyDown={handleSkuKeyDown} placeholder=\"Tên sản phẩm, mã hàng, SKU hoặc barcode\" autoComplete=\"off\" /></label>\n              </div>\n",
          )
          replace_once(
              form,
              "                      <div><strong>{option.productName}</strong><span>{option.productCode} · {option.sku} · {option.variantName}</span></div>\n                      <div><b>{option.unitCode ?? 'Chưa có ĐVT'}</b>{option.barcode && <small>{option.barcode}</small>}<small className={option.eligibility.selectable ? styles.eligible : styles.ineligible}>{option.eligibility.message}</small></div>\n",
              "                      <div><span>{option.productName}</span><strong>SKU {option.sku}</strong><small>{option.productCode}{option.variantName ? ` · ${option.variantName}` : ''}</small></div>\n                      <div><b>{searchPriceText(option)}</b><small>{searchInventoryPrimary(option)}</small>{searchInventorySecondary(option) && <small>{searchInventorySecondary(option)}</small>}{option.barcode && <small>Barcode {option.barcode}</small>}<small className={option.eligibility.selectable ? styles.eligible : styles.ineligible}>{option.eligibility.message}</small></div>\n",
          )
          replace_once(form, "              <article className={styles.orderLineCard} key={line.variantId} data-testid={`sales-order-line-${index + 1}`}>\n", "              <article className={styles.orderLineCard} key={line.clientLineId} data-testid={`sales-order-line-${index + 1}`}>\n")
          replace_once(
              form,
              "                    <input\n                      aria-label={`Số lượng ${line.sku}`}\n",
              "                    <input\n                      ref={(node) => {\n                        if (node) quantityRefs.current.set(line.clientLineId, node);\n                        else quantityRefs.current.delete(line.clientLineId);\n                      }}\n                      aria-label={`Số lượng ${line.sku}`}\n",
          )
          replace_once(
              form,
              "                      onBlur={() => compactLineQuantity(index)}\n",
              "                      onFocus={(event) => event.currentTarget.select()}\n                      onClick={(event) => event.currentTarget.select()}\n                      onKeyDown={(event) => {\n                        if (event.key === 'Enter') {\n                          event.preventDefault();\n                          event.currentTarget.blur();\n                        }\n                      }}\n                      onBlur={() => compactLineQuantity(index)}\n",
          )

          # Keep the channel selector visually beside quick search without spreading style changes.
          css = Path('npp-core/web/app/sales/sales-orders/sales-orders.module.css')
