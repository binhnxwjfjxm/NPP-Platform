name: Provision MCP Field Vercel project

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/vercel-mcp-project-provision.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-mcp-field-project-provision
  cancel-in-progress: false

jobs:
  provision:
    if: github.head_ref == 'agent/phase-6c0-mcp-legacy-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TEAM_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      MCP_PROJECT_NAME: mcp-field
      MCP_ROOT_DIRECTORY: mcp
      MCP_BACKEND_BASE_URL: https://hung-phat-mcp.herokuapp.com
    steps:
      - name: Provision project without Git auto-deploy
        shell: bash
        env:
          VERCEL_TOKEN_RAW: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          vercel_token="$(printf '%s' "${VERCEL_TOKEN_RAW:-}" | tr -d '\r\n')"
          if [ -z "$vercel_token" ]; then
            echo "VERCEL_TOKEN secret is required." >&2
            exit 1
          fi

          auth_header="Authorization: Bearer ${vercel_token}"
          project_url="https://api.vercel.com/v9/projects/${MCP_PROJECT_NAME}?teamId=${VERCEL_TEAM_ID}"
          curl_common=(--silent --show-error --http1.1 --retry 3 --retry-delay 2)

          status="$(curl "${curl_common[@]}" \
            --output /tmp/mcp-project.json \
            --write-out '%{http_code}' \
            --header "$auth_header" \
            "$project_url")"

          if [ "$status" = "404" ]; then
            jq -n \
              --arg name "$MCP_PROJECT_NAME" \
              --arg root "$MCP_ROOT_DIRECTORY" \
              '{
                name: $name,
                framework: "nextjs",
                rootDirectory: $root,
                installCommand: "npm install",
                buildCommand: "npm run build",
                devCommand: "npm run dev",
                skipGitConnectDuringLink: true
              }' >/tmp/create-mcp-project.json

            curl "${curl_common[@]}" --fail-with-body \
              --request POST \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/create-mcp-project.json \
              "https://api.vercel.com/v11/projects?teamId=${VERCEL_TEAM_ID}" \
              >/tmp/mcp-project.json
          elif [ "$status" != "200" ]; then
            cat /tmp/mcp-project.json >&2
            echo "Unable to inspect MCP Vercel project: HTTP $status" >&2
            exit 1
          fi

          project_id="$(jq -r '.id // empty' /tmp/mcp-project.json)"
          test -n "$project_id"

          jq -n \
            --arg value "$MCP_BACKEND_BASE_URL" \
            '{
              key: "BACKEND_API_BASE_URL",
              value: $value,
              type: "plain",
              target: ["production", "preview", "development"],
              comment: "MCP Field frontend server target; backend owner is Heroku app hung-phat-mcp"
            }' >/tmp/mcp-backend-env.json

          curl "${curl_common[@]}" --fail-with-body \
            --request POST \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/mcp-backend-env.json \
            "https://api.vercel.com/v10/projects/${project_id}/env?teamId=${VERCEL_TEAM_ID}&upsert=true" \
            >/tmp/mcp-env-result.json

          curl "${curl_common[@]}" --fail-with-body \
            --header "$auth_header" \
            "$project_url" \
            >/tmp/mcp-project-verified.json

          verified_name="$(jq -r '.name // empty' /tmp/mcp-project-verified.json)"
          verified_root="$(jq -r '.rootDirectory // .settings.rootDirectory // empty' /tmp/mcp-project-verified.json)"
          git_link="$(jq -r '.link.type // empty' /tmp/mcp-project-verified.json)"

          test "$verified_name" = "$MCP_PROJECT_NAME"
          test "$verified_root" = "$MCP_ROOT_DIRECTORY"
          if [ -n "$git_link" ]; then
            echo "MCP project unexpectedly has a Git link; auto-deploy boundary is not safe." >&2
            exit 1
          fi

          echo "MCP_PROJECT_ID=$project_id"
          echo "MCP_PROJECT_NAME=$verified_name"
          echo "MCP_ROOT_DIRECTORY=$verified_root"
          echo "MCP_GIT_LINK=none"
          echo "MCP_BACKEND_APP=hung-phat-mcp"
          echo "MCP_DEPLOYMENT_CREATED=false"
