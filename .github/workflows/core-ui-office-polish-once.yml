name: Core UI Office Polish Once

on:
  push:
    branches:
      - agent/core-ui-office-polish
    paths:
      - .github/workflows/core-ui-office-polish-once.yml
      - tools/core-ui-office-polish.py

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ui-polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/core-ui-office-polish
          fetch-depth: 0

      - name: Apply guarded UI changes
        run: python tools/core-ui-office-polish.py

      - name: Remove one-shot files
        run: |
          rm .github/workflows/core-ui-office-polish-once.yml
          rm tools/core-ui-office-polish.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/web/app/organization/organization-workspace.tsx \
                  npp-core/web/public/logo-transparent.png \
                  .github/workflows/core-ui-office-polish-once.yml \
                  tools/core-ui-office-polish.py
          git diff --cached --quiet && exit 0
          git commit -m "feat(core-web): finish office UI polish [ui-polish-applied]"
          git push origin HEAD:agent/core-ui-office-polish
