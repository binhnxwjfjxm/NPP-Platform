name: Admin AI production config gate

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: admin-ai-production-config
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 5 &&
       github.event.comment.body == '/configure-admin-ai-production' &&
       contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_REF: main
      HEROKU_APP_NAME: hung-phat
      HEROKU_FORBIDDEN_APP_NAME: hung-phat-mcp
      COMPANY_API_URL: https://hung-phat-945da1547594.herokuapp.com
      ADMIN_AI_GATEWAY_BASE_URL: https://www.nguyenlieuhungphat.com
      ADMIN_AI_AGENT_MODEL: gemini-2.5-pro

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: '${{ github.event.comment.body }}'
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/configure-admin-ai-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: '${{ env.DEPLOY_REF }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify shared Website AI channel and configure Công Ty
        shell: bash
        env:
          HEROKU_API_KEY: '${{ secrets.HEROKU_API_KEY }}'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const env = process.env;
          const text = (value) => String(value ?? '').trim();
          const required = (value, name) => {
            const normalized = text(value);
            if (!normalized) throw new Error(`${name}_missing`);
            return normalized;
          };

          const herokuApiKey = required(env.HEROKU_API_KEY, 'heroku_api_key');
          const gatewayBaseUrl = required(env.ADMIN_AI_GATEWAY_BASE_URL, 'admin_ai_gateway_base_url').replace(/\/$/, '');
          const model = required(env.ADMIN_AI_AGENT_MODEL, 'admin_ai_agent_model');
          if (env.HEROKU_APP_NAME !== 'hung-phat' || env.HEROKU_APP_NAME === env.HEROKU_FORBIDDEN_APP_NAME) {
            throw new Error('unexpected_heroku_target');
          }
          if (!/^https:\/\/[^/]+$/.test(gatewayBaseUrl)) throw new Error('admin_ai_gateway_url_invalid');
          if (model !== 'gemini-2.5-pro') throw new Error('admin_ai_model_mismatch');

          const herokuHeaders = {
            Accept: 'application/vnd.heroku+json; version=3',
            Authorization: `Bearer ${herokuApiKey}`,
            'Content-Type': 'application/json',
          };
          const configUrl = `https://api.heroku.com/apps/${encodeURIComponent(env.HEROKU_APP_NAME)}/config-vars`;
          const currentResponse = await fetch(configUrl, { headers: herokuHeaders, signal: AbortSignal.timeout(15_000) });
          const current = await currentResponse.json().catch(() => null);
          if (!currentResponse.ok || !current || typeof current !== 'object') throw new Error(`heroku_config_read_failed:${currentResponse.status}`);

          const websiteToken = required(current.WEBSITE_AI_API_TOKEN, 'website_ai_api_token');
          console.log(`::add-mask::${websiteToken}`);

          const readinessResponse = await fetch(`${gatewayBaseUrl}/api/admin-agent/gateway`, {
            method: 'GET',
            redirect: 'error',
            headers: {
              authorization: `Bearer ${websiteToken}`,
              'x-company-admin-ai-gateway': 'company-admin',
              accept: 'application/json',
            },
            signal: AbortSignal.timeout(45_000),
          });
          const readiness = await readinessResponse.json().catch(() => null);
          if (!readinessResponse.ok) {
            throw new Error(`admin_ai_gateway_probe_failed:${readinessResponse.status}:${text(readiness?.code) || 'unknown'}`);
          }
          if (readiness?.ok !== true || readiness?.capability !== 'company-admin-ai' || readiness?.model !== model) {
            throw new Error('admin_ai_gateway_identity_mismatch');
          }

          const desired = {
            ADMIN_AI_GATEWAY_BASE_URL: gatewayBaseUrl,
            ADMIN_AI_AGENT_MODEL: model,
          };
          const patch = {};
          for (const [key, value] of Object.entries(desired)) {
            if (text(current[key]) !== value) patch[key] = value;
          }
          if (Object.keys(patch).length > 0) {
            const patchResponse = await fetch(configUrl, {
              method: 'PATCH',
              headers: herokuHeaders,
              body: JSON.stringify(patch),
              signal: AbortSignal.timeout(15_000),
            });
            if (!patchResponse.ok) throw new Error(`heroku_config_patch_failed:${patchResponse.status}`);
            await patchResponse.arrayBuffer();
          }

          const verifyResponse = await fetch(configUrl, { headers: herokuHeaders, signal: AbortSignal.timeout(15_000) });
          const verified = await verifyResponse.json().catch(() => null);
          if (!verifyResponse.ok || !verified || typeof verified !== 'object') throw new Error(`heroku_config_verify_failed:${verifyResponse.status}`);
          if (text(verified.WEBSITE_AI_API_TOKEN) !== websiteToken) throw new Error('website_ai_token_changed_unexpectedly');
          if (text(verified.ADMIN_AI_GATEWAY_BASE_URL) !== gatewayBaseUrl) throw new Error('admin_ai_gateway_url_mismatch');
          if (text(verified.ADMIN_AI_AGENT_MODEL) !== model) throw new Error('admin_ai_model_mismatch');

          console.log('ADMIN_AI_CONFIG=success');
          console.log('ADMIN_AI_SHARED_GOOGLE_RUNTIME=success');
          console.log('ADMIN_AI_GATEWAY_IDENTITY=success');
          NODE

      - name: Verify Công Ty health after config restart
        shell: bash
        run: |
          set -euo pipefail
          for path in /health/live /health/ready; do
            ok=0
            for attempt in $(seq 1 18); do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "${COMPANY_API_URL}${path}" || true)"
              if [ "$status" = '200' ]; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = '1'
          done
          echo 'ADMIN_AI_COMPANY_HEALTH=success'
