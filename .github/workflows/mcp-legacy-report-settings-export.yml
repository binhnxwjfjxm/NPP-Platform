name: Export MCP legacy report settings

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-legacy-report-settings-export
  cancel-in-progress: false

jobs:
  export-legacy-report-settings:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/export-mcp-legacy-report-settings' &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_REF: main
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      HEROKU_APP_NAME: hung-phat-mcp
      LEGACY_SUPABASE_PROJECT_REF: noiadkpkvdohljgopgfb
      EXPORT_DIR: mcp/artifacts/legacy-report-settings
      EXPORT_FILE: mcp/artifacts/legacy-report-settings/mcp-legacy-report-settings.json
      EXPORT_SHA_FILE: mcp/artifacts/legacy-report-settings/mcp-legacy-report-settings.sha256

    steps:
      - name: Validate exact export command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/export-mcp-legacy-report-settings'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin refs/heads/main:refs/remotes/origin/main
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Pull MCP production environment without changing it
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes vercel@latest pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Export exact legacy report settings
        id: export
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          const EXPECTED_GROUPS = 7;
          const EXPECTED_ITEMS = 52;
          const expectedRef = String(process.env.LEGACY_SUPABASE_PROJECT_REF || "").trim();

          function decodeEnvValue(raw) {
            const value = String(raw || "").trim();
            if (!value) return "";
            if (value.startsWith('"') && value.endsWith('"')) {
              try { return JSON.parse(value); } catch { return value.slice(1, -1); }
            }
            if (value.startsWith("'") && value.endsWith("'")) return value.slice(1, -1);
            return value;
          }

          function parseEnv(text) {
            const result = {};
            for (const line of String(text || "").split(/\r?\n/)) {
              if (!line || line.trimStart().startsWith("#")) continue;
              const index = line.indexOf("=");
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              result[key] = decodeEnvValue(line.slice(index + 1));
            }
            return result;
          }

          async function loadVercelConfig() {
            try {
              return parseEnv(await readFile(".vercel/.env.production.local", "utf8"));
            } catch {
              return {};
            }
          }

          async function loadHerokuConfig() {
            const token = String(process.env.HEROKU_API_KEY || "").trim();
            if (!token) return {};
            process.stdout.write(`::add-mask::${token}\n`);
            const response = await fetch(
              `https://api.heroku.com/apps/${process.env.HEROKU_APP_NAME}/config-vars`,
              {
                headers: {
                  Accept: "application/vnd.heroku+json; version=3",
                  Authorization: `Bearer ${token}`
                }
              }
            );
            if (!response.ok) throw new Error(`heroku_config_read_failed:${response.status}`);
            const payload = await response.json().catch(() => ({}));
            return payload && typeof payload === "object" && !Array.isArray(payload) ? payload : {};
          }

          function pick(configs, names) {
            for (const config of configs) {
              for (const name of names) {
                const value = String(config?.[name] || "").trim();
                if (value) return value;
              }
            }
            return "";
          }

          function canonical(value) {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === "object") {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonical(value[key])])
              );
            }
            return value;
          }

          const vercelConfig = await loadVercelConfig();
          const herokuConfig = await loadHerokuConfig();
          const configs = [vercelConfig, herokuConfig];
          const baseUrl = pick(configs, ["SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_URL"]).replace(/\/+$/, "");
          const apiKey = pick(configs, [
            "SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_SECRET_KEY",
            "SUPABASE_SERVICE_KEY",
            "SUPABASE_ANON_KEY",
            "SUPABASE_PUBLISHABLE_KEY",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          ]);

          if (!baseUrl || !apiKey) throw new Error("legacy_supabase_config_missing");
          process.stdout.write(`::add-mask::${baseUrl}\n`);
          process.stdout.write(`::add-mask::${apiKey}\n`);

          const parsedUrl = new URL(baseUrl);
          if (parsedUrl.protocol !== "https:" || parsedUrl.hostname !== `${expectedRef}.supabase.co`) {
            throw new Error("unexpected_legacy_supabase_project");
          }

          async function rest(path, safeName) {
            const response = await fetch(`${baseUrl}/rest/v1/${path}`, {
              headers: {
                apikey: apiKey,
                Authorization: `Bearer ${apiKey}`,
                Accept: "application/json"
              }
            });
            if (!response.ok) throw new Error(`${safeName}_fetch_failed:${response.status}`);
            const payload = await response.json().catch(() => null);
            if (!Array.isArray(payload)) throw new Error(`${safeName}_payload_invalid`);
            return payload;
          }

          const groups = await rest(
            "mcp_setting_groups?select=*&group_type=eq.market_report&order=sort_order.asc,title.asc",
            "legacy_groups"
          );
          const items = await rest(
            "mcp_setting_items?select=*&order=sort_order.asc,label.asc",
            "legacy_items"
          );

          if (groups.length !== EXPECTED_GROUPS) throw new Error(`legacy_group_count_mismatch:${groups.length}`);
          if (items.length !== EXPECTED_ITEMS) throw new Error(`legacy_item_count_mismatch:${items.length}`);

          const groupIds = new Set(groups.map((group) => String(group.id || "").trim()));
          if (groupIds.size !== EXPECTED_GROUPS || groupIds.has("")) throw new Error("legacy_group_id_invalid");

          for (const group of groups) {
            if (!String(group.group_key || "").trim() || !String(group.title || "").trim()) {
              throw new Error("legacy_group_identity_invalid");
            }
            if (String(group.status || "").trim() !== "active") throw new Error("legacy_group_status_mismatch");
          }

          const itemIdentity = new Set();
          for (const item of items) {
            const groupId = String(item.group_id || "").trim();
            const itemKey = String(item.item_key || "").trim();
            if (!groupIds.has(groupId)) throw new Error("legacy_item_orphan_detected");
            if (!itemKey || !String(item.label || "").trim()) throw new Error("legacy_item_identity_invalid");
            if (String(item.status || "").trim() !== "active") throw new Error("legacy_item_status_mismatch");
            const identity = `${groupId}:${itemKey}`;
            if (itemIdentity.has(identity)) throw new Error("legacy_item_duplicate_key");
            itemIdentity.add(identity);
          }

          const data = canonical({ groups, items });
          const encoded = `${JSON.stringify(data, null, 2)}\n`;
          const sha256 = createHash("sha256").update(encoded).digest("hex");
          const artifact = {
            source: {
              provider: "supabase",
              projectRef: expectedRef,
              capturedAt: new Date().toISOString(),
              sourceSha: process.env.GITHUB_SHA
            },
            counts: { groups: groups.length, items: items.length },
            sha256,
            data
          };

          await writeFile(process.env.EXPORT_FILE, `${JSON.stringify(artifact, null, 2)}\n`, { mode: 0o600 });
          await writeFile(process.env.EXPORT_SHA_FILE, `${sha256}  ${process.env.EXPORT_FILE}\n`, { mode: 0o600 });
          await writeFile(
            process.env.GITHUB_OUTPUT,
            `groups=${groups.length}\nitems=${items.length}\nsha256=${sha256}\n`,
            { flag: "a" }
          );
          NODE

      - name: Upload exact legacy settings artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-legacy-report-settings-export
          path: |
            mcp/artifacts/legacy-report-settings/mcp-legacy-report-settings.json
            mcp/artifacts/legacy-report-settings/mcp-legacy-report-settings.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Record sanitized export evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary_file="${RUNNER_TEMP}/legacy-settings-export.md"
          {
            echo "## MCP legacy report settings export — success"
            echo
            echo "- Source SHA: ${{ steps.source.outputs.sha }}"
            echo "- Groups: ${{ steps.export.outputs.groups }}"
            echo "- Items: ${{ steps.export.outputs.items }}"
            echo "- SHA-256: ${{ steps.export.outputs.sha256 }}"
            echo "- Artifact: mcp-legacy-report-settings-export"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Production mutation: none"
          } > "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/189/comments" -f body="$(cat "$summary_file")" >/dev/null
