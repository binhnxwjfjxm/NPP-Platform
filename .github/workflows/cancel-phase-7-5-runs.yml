name: Cancel Phase 7.5 stale runs

on:
  push:
    branches:
      - agent/cancel-phase-7-5-runs

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-phase-7-5-stale-runs
  cancel-in-progress: true

jobs:
  cancel-runs:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Cancel queued and in-progress Phase 7.5 runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/phase-7-5-costing-foundation
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          api="https://api.github.com"
          statuses=(queued in_progress waiting requested pending)

          for status in "${statuses[@]}"; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&status=${status}&per_page=100" \
              | jq -r '.workflow_runs[].id' \
              | while read -r run_id; do
                  [ -z "$run_id" ] && continue
                  echo "Cancelling run ${run_id} (${status})"
                  curl -fsSL -X POST \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "${api}/repos/${repo}/actions/runs/${run_id}/cancel" \
                    -o /dev/null || true
                done
          done

          sleep 10
          remaining=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" \
            | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          echo "Remaining active runs: ${remaining}"
