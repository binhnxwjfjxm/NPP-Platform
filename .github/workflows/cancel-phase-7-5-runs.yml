name: Force-cancel Phase 7.5 stale runs

on:
  push:
    branches:
      - agent/cancel-phase-7-5-runs

permissions:
  actions: write
  contents: read

concurrency:
  group: force-cancel-phase-7-5-ubuntu-slim
  cancel-in-progress: true

jobs:
  force-cancel-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Force-cancel Phase 7.5 and stale cleanup runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/phase-7-5-costing-foundation
          CLEANUP_BRANCH: agent/cancel-phase-7-5-runs
        run: |
          set -u
          repo="$GITHUB_REPOSITORY"
          api="https://api.github.com"
          self="$GITHUB_RUN_ID"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10")

          for pass in 1 2 3 4 5 6; do
            echo "Force-cancel pass ${pass}"
            ids=""
            for branch in "$TARGET_BRANCH" "$CLEANUP_BRANCH"; do
              found=$(curl --connect-timeout 5 --max-time 15 -fsSL "${auth[@]}" \
                "${api}/repos/${repo}/actions/runs?branch=${branch}&per_page=100" \
                | jq -r '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") | .id') || found=""
              ids="${ids}"$'\n'"${found}"
            done

            ids=$(printf '%s\n' "$ids" | sed '/^$/d' | sort -u | grep -v "^${self}$" || true)
            if [ -z "$ids" ]; then
              echo "Remaining active runs excluding self: 0"
              exit 0
            fi

            while read -r run_id; do
              [ -z "$run_id" ] && continue
              echo "Force-cancelling ${run_id}"
              curl --connect-timeout 5 --max-time 10 -sS -X POST "${auth[@]}" \
                "${api}/repos/${repo}/actions/runs/${run_id}/force-cancel" \
                -o /dev/null || true
            done <<< "$ids"
            sleep 6
          done

          remaining=0
          for branch in "$TARGET_BRANCH" "$CLEANUP_BRANCH"; do
            count=$(curl --connect-timeout 5 --max-time 15 -fsSL "${auth[@]}" \
              "${api}/repos/${repo}/actions/runs?branch=${branch}&per_page=100" \
              | jq --arg self "$self" '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") and (.id|tostring) != $self)] | length')
            remaining=$((remaining + count))
          done
          echo "Remaining active runs excluding self: ${remaining}"
          test "$remaining" -eq 0
