name: Cancel Phase 7.5 stale runs

on:
  push:
    branches:
      - agent/cancel-phase-7-5-runs

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-phase-7-5-stale-runs
  cancel-in-progress: true

jobs:
  cancel-runs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Cancel all active Phase 7.5 runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/phase-7-5-costing-foundation
        run: |
          set -u
          repo="$GITHUB_REPOSITORY"
          api="https://api.github.com"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          for pass in 1 2 3 4 5 6; do
            echo "Cancellation pass ${pass}"
            ids=$(curl --connect-timeout 5 --max-time 15 -fsSL "${auth[@]}" \
              "${api}/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" \
              | jq -r '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") | .id') || ids=""

            if [ -z "$ids" ]; then
              echo "Remaining active runs: 0"
              exit 0
            fi

            while read -r run_id; do
              [ -z "$run_id" ] && continue
              echo "Cancelling ${run_id}"
              curl --connect-timeout 5 --max-time 10 -sS -X POST "${auth[@]}" \
                "${api}/repos/${repo}/actions/runs/${run_id}/cancel" \
                -o /dev/null || true
            done <<< "$ids"

            sleep 8
          done

          remaining=$(curl --connect-timeout 5 --max-time 15 -fsSL "${auth[@]}" \
            "${api}/repos/${repo}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" \
            | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          echo "Remaining active runs: ${remaining}"
          test "$remaining" -eq 0
