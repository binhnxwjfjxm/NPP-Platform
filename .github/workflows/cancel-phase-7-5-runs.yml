name: Cancel Phase 7.5 stale runs

on:
  push:
    branches:
      - agent/cancel-phase-7-5-runs

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-phase-7-5-stale-runs
  cancel-in-progress: true

jobs:
  cancel-runs:
    runs-on: windows-latest
    steps:
      - name: Cancel queued and in-progress Phase 7.5 runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/phase-7-5-costing-foundation
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $selfRun = [int64]$env:GITHUB_RUN_ID
          $statuses = @('queued', 'in_progress', 'waiting', 'requested', 'pending')

          foreach ($status in $statuses) {
            $response = gh api "/repos/$repo/actions/runs?branch=$($env:TARGET_BRANCH)&status=$status&per_page=100" | ConvertFrom-Json
            foreach ($run in $response.workflow_runs) {
              if ([int64]$run.id -eq $selfRun) { continue }
              Write-Host "Cancelling run $($run.id) ($status)"
              gh api -X POST "/repos/$repo/actions/runs/$($run.id)/cancel" | Out-Null
            }
          }

          Start-Sleep -Seconds 10
          $remaining = gh api "/repos/$repo/actions/runs?branch=$($env:TARGET_BRANCH)&per_page=100" | ConvertFrom-Json
          $active = @($remaining.workflow_runs | Where-Object { $_.status -in $statuses })
          Write-Host "Remaining active runs: $($active.Count)"
          $active | ForEach-Object { Write-Host "$($_.id)`t$($_.name)`t$($_.status)" }
