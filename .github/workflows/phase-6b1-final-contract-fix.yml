name: Phase 6B.1 Final Contract Fix

on:
  push:
    branches:
      - agent/phase-6b1-sales-order-operational-ux
    paths:
      - .github/workflows/phase-6b1-final-contract-fix.yml

permissions:
  contents: write

jobs:
  apply-final-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6b1-sales-order-operational-ux
          fetch-depth: 0

      - name: Apply tax compatibility and regression coverage
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('npp-core/api/src/services/sales-order-entry.js')
          service = service_path.read_text(encoding='utf-8')
          old_function = """function applyDefaultTax(lines, settings) {
            if (!Array.isArray(lines)) return lines;
            if (!settings) return lines;
            const defaults = taxSettings(settings);
            return lines.map((line) => Object.freeze({
              ...line,
              taxMode: defaults.taxMode,
              taxRate: defaults.taxRate,
            }));
          }"""
          new_function = """function applyDefaultTax(lines, settings) {
            if (!Array.isArray(lines)) return lines;
            const defaults = taxSettings(settings);
            return lines.map((line) => Object.freeze({
              ...line,
              taxMode: TAX_MODES.has(String(line?.taxMode ?? '').trim().toUpperCase())
                ? String(line.taxMode).trim().toUpperCase()
                : defaults.taxMode,
              taxRate: line?.taxRate === null || line?.taxRate === undefined || String(line.taxRate).trim() === ''
                ? defaults.taxRate
                : String(line.taxRate).trim(),
            }));
          }"""
          old_function = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_function.splitlines())
          new_function = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_function.splitlines())
          if old_function not in service:
              raise SystemExit('Expected applyDefaultTax function not found')
          service_path.write_text(service.replace(old_function, new_function, 1), encoding='utf-8')

          source_test_path = Path('npp-core/api/test/sales-order-entry-tax-defaults-source.test.js')
          source_test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const source = readFileSync(
            new URL('../src/services/sales-order-entry.js', import.meta.url),
            'utf8',
          );

          test('Sales Order tax preserves valid explicit values and defaults only missing fields', () => {
            assert.doesNotMatch(source, /if\\s*\\(!settings\\)\\s*return\\s*lines/);
            assert.match(source, /const\\s+defaults\\s*=\\s*taxSettings\\(settings\\)/);
            assert.match(
              source,
              /taxMode:\\s*TAX_MODES\\.has\\(String\\(line\\?\\.taxMode[\\s\\S]*?\\?\\s*String\\(line\\.taxMode\\)[\\s\\S]*?:\\s*defaults\\.taxMode/,
            );
            assert.match(
              source,
              /taxRate:\\s*line\\?\\.taxRate\\s*===\\s*null[\\s\\S]*?\\?\\s*defaults\\.taxRate[\\s\\S]*?:\\s*String\\(line\\.taxRate\\)/,
            );
          });
          """.replace('          ', ''), encoding='utf-8')

          integration_path = Path('npp-core/api/test/sales-order-operational-entry.test.js')
          integration = integration_path.read_text(encoding='utf-8')
          replacements = [
            (
              "test('operational Sales Order entry supports configured walk-in, barcode search and Core tax defaults', async () => {",
              "test('operational Sales Order entry supports walk-in, barcode search, explicit tax and Core fallback', async () => {",
            ),
            ("    assert.equal(first.versions[0].lines[0].taxMode, 'EXCLUSIVE');", "    assert.equal(first.versions[0].lines[0].taxMode, 'INCLUSIVE');"),
            ("    assert.equal(first.versions[0].lines[0].taxRate, '10.000000');", "    assert.equal(first.versions[0].lines[0].taxRate, '1.000000');"),
            ("    assert.equal(first.versions[0].lines[0].taxAmount, '2000.000000');", "    assert.equal(first.versions[0].lines[0].taxAmount, '198.000000');"),
            ("    assert.equal(first.versions[0].total, '22000.000000');", "    assert.equal(first.versions[0].total, '20000.000000');"),
            (
              "    const configured = (await pool.query(\n",
              "    const fallbackResponse = await createWalkIn(`walk-in-${randomUUID()}`, {\n"
              "      ...walkInPayload(fixture, {\n"
              "        walkInDisplayName: 'Khách dùng thuế mặc định',\n"
              "        walkInPhone: '0923456789',\n"
              "      }),\n"
              "      lines: [{\n"
              "        variantId: fixture.variantId,\n"
              "        quantity: '2',\n"
              "        discountMode: 'TOTAL_AMOUNT',\n"
              "        discountValue: '0',\n"
              "      }],\n"
              "    });\n"
              "    assert.equal(fallbackResponse.status, 201);\n"
              "    const fallback = (await fallbackResponse.json()).data;\n"
              "    assert.equal(fallback.versions[0].lines[0].taxMode, 'EXCLUSIVE');\n"
              "    assert.equal(fallback.versions[0].lines[0].taxRate, '10.000000');\n"
              "    assert.equal(fallback.versions[0].lines[0].taxAmount, '2000.000000');\n"
              "    assert.equal(fallback.versions[0].total, '22000.000000');\n\n"
              "    const configured = (await pool.query(\n",
            ),
            (
              "    await pool.query('DELETE FROM shared.customers WHERE installation_id=$1', [config.installationId]).catch(() => {});\n    await closePool();",
              "    await closePool();",
            ),
          ]
          for old, new in replacements:
              if old not in integration:
                  raise SystemExit(f'Expected integration-test fragment not found: {old!r}')
              integration = integration.replace(old, new, 1)
          integration_path.write_text(integration, encoding='utf-8')

          doc_path = Path('docs/operations/phase-6b1-sales-order-operational-ux.md')
          doc = doc_path.read_text(encoding='utf-8')
          old_doc = "- the same safe Core default applies whether or not an installation settings row has already been created; row existence must never switch tax ownership silently;"
          new_doc = "- valid explicit tax values from an existing trusted API contract remain compatible; missing/null/blank values use the same Core default regardless of whether an installation settings row already exists;"
          if old_doc not in doc:
              raise SystemExit('Expected tax contract bullet not found')
          doc_path.write_text(doc.replace(old_doc, new_doc, 1), encoding='utf-8')

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "npp-ci-fix"
          git config user.email "npp-ci-fix@users.noreply.github.com"
          git rm .github/workflows/phase-6b1-final-contract-fix.yml
          git add \
            docs/operations/phase-6b1-sales-order-operational-ux.md \
            npp-core/api/src/services/sales-order-entry.js \
            npp-core/api/test/sales-order-entry-tax-defaults-source.test.js \
            npp-core/api/test/sales-order-operational-entry.test.js
          git commit -m "fix(phase-6b1): align tax compatibility and Core fallback"
          git push origin HEAD:agent/phase-6b1-sales-order-operational-ux
