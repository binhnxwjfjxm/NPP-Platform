name: Temporary PR 90 Final Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/repair-pr90-final.py
      - .github/workflows/repair-pr90-final.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 90 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-4-supplier-return
          fetch-depth: 0

      - name: Apply final reviewed fixes
        run: python3 scripts/repair-pr90-final.py

      - name: Commit source changes and remove repair artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/repair-pr90-final.py .github/workflows/repair-pr90-final.yml
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(purchasing): close supplier return review gaps"
          git push origin HEAD:agent/phase-5-4-supplier-return
