name: Agent Retail Warehouse 409 fix

on:
  push:
    branches:
      - agent/retail-warehouse-409-fix

permissions:
  contents: write

concurrency:
  group: agent-retail-warehouse-409-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/retail-warehouse-409-fix
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Apply audited patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: 563b5d06629f2888e07116499c5ae961760c0064
          CORRECTION_BLOB_SHA: f7d8f41cd51080603e600092d6ceaa655c2dabe0
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$PATCH_BLOB_SHA" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/fix.py"
          python3 "$RUNNER_TEMP/fix.py"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$CORRECTION_BLOB_SHA" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/correct.py"
          python3 "$RUNNER_TEMP/correct.py"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm --prefix retail/web install --ignore-scripts --no-package-lock

      - name: Verify full batch
        shell: bash
        run: |
          set +e

          (
            set -euo pipefail
            npm --workspace npp-core-api run build
            node --test \
              npp-core/api/test/retail-price-batch-contract.test.js \
              npp-core/api/test/retail-lot7-channel-contract.test.js
          )
          api_status=$?

          (
            set -euo pipefail
            npm --prefix retail/web run typecheck
            node --test \
              retail/web/test/retail-price-terminal-cache.test.mjs \
              retail/web/test/retail-lot7-polish-contract.test.mjs \
              retail/web/test/retail-lot4-ui-contract.test.mjs
            npm --prefix retail/web run build
          )
          retail_status=$?

          (
            set -euo pipefail
            npm --workspace npp-core-web run typecheck
            node --test npp-core/web/test/warehouse-workspace-contract.test.mjs
            npm --workspace npp-core-web run build
          )
          warehouse_status=$?

          set -e
          echo "API_STATUS=$api_status"
          echo "RETAIL_STATUS=$retail_status"
          echo "WAREHOUSE_STATUS=$warehouse_status"
          test "$api_status" -eq 0
          test "$retail_status" -eq 0
          test "$warehouse_status" -eq 0

      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-retail-warehouse-409-fix.yml
          git add npp-core/api/src/services/retail-catalog.js \
                  npp-core/api/src/routes/retail-catalog.js \
                  npp-core/api/test/retail-price-batch-contract.test.js \
                  npp-core/api/test/retail-lot7-channel-contract.test.js \
                  'retail/web/app/api/retail/[...segments]/route.ts' \
                  retail/web/app/retail-workspace.tsx \
                  retail/web/test/retail-price-terminal-cache.test.mjs \
                  npp-core/web/app/organization/warehouses/warehouse-workspace.tsx \
                  npp-core/web/test/warehouse-workspace-contract.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(retail-warehouse): xử lý dứt điểm hai luồng 409'
          git push origin HEAD:agent/retail-warehouse-409-fix
