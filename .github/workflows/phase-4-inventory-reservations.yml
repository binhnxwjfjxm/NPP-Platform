name: Phase 4 Inventory Reservations

on:
  pull_request:
    paths:
      - ".github/workflows/phase-4-inventory-reservations.yml"
      - "database/migrations/inventory/019_inventory_reservations_negative_stock.sql"
      - "npp-core/api/package.json"
      - "npp-core/api/src/access/permissions.js"
      - "npp-core/api/src/request-context.js"
      - "npp-core/api/src/migrations/**"
      - "npp-core/api/src/db/repositories/inventory-balance.js"
      - "npp-core/api/src/db/repositories/inventory-reservation.js"
      - "npp-core/api/src/services/inventory-reservation.js"
      - "npp-core/api/test/inventory-reservation.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-inventory-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase4_inventory_reservations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase4_inventory_reservations
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase4_inventory_reservations
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Verify Core-only boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^mcp/'; then
            echo "Phase 4 Core PR must keep mcp/** unchanged." >&2
            exit 1
          fi

      - name: Verify reservation source syntax
        run: npm --workspace npp-core-api run build

      - name: Apply migrations on clean PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm --workspace npp-core-api run migration:migrate 2>&1 | tee artifacts/phase-4-reservations-migrate-clean.log

      - name: Verify migration registry and schema
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace npp-core-api run migration:verify 2>&1 | tee artifacts/phase-4-reservations-migration-verify.log

      - name: Verify migration rerun is a no-op
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace npp-core-api run migration:migrate 2>&1 | tee artifacts/phase-4-reservations-migrate-rerun.log
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync('artifacts/phase-4-reservations-migrate-rerun.log', 'utf8')
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter((line) => line.startsWith('{'));
          const result = JSON.parse(lines.at(-1));
          if (result.status !== 'success' || !Array.isArray(result.result?.applied) || result.result.applied.length !== 0) {
            throw new Error(`migration rerun was not a no-op: ${JSON.stringify(result)}`);
          }
          NODE

      - name: Run reservation and negative-stock tests
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace npp-core-api run test:inventory-reservation 2>&1 | tee artifacts/phase-4-reservations-tests.log

      - name: Run full Core API regression
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace npp-core-api run verify 2>&1 | tee artifacts/phase-4-reservations-core-api-regression.log

      - name: Upload Phase 4 reservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-inventory-reservations-${{ github.run_id }}
          path: artifacts/phase-4-reservations-*.log
          if-no-files-found: warn
          retention-days: 14
