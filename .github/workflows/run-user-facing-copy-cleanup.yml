name: Apply CI scope matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/run-user-facing-copy-cleanup.yml"
      - "mcp/scripts/apply-ci-scope-matrix.mjs"

permissions:
  contents: write

concurrency:
  group: apply-ci-scope-matrix-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.head_ref == 'agent/ci-scope-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout CI scope branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply workflow scope matrix
        run: node mcp/scripts/apply-ci-scope-matrix.mjs

      - name: Verify workflow scope contract
        run: node --test mcp/test/ci-workflow-scope-matrix.test.mjs

      - name: Commit verified workflow scopes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f mcp/scripts/apply-ci-scope-matrix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): scope workflows by runtime domain"
          git push origin "HEAD:${HEAD_BRANCH}"
