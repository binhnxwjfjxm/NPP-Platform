name: Run verified user-facing copy cleanup

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.event.issue.pull_request && github.event.issue.number == 3 && github.event.comment.body == '/run-copy-cleanup'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/user-facing-language-audit-20260713
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply copy cleanup
        run: node scripts/apply-user-facing-copy-cleanup.mjs

      - name: Audit user-facing copy
        run: npm run audit:copy

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          BACKEND_API_BASE_URL: http://165.22.109.61
          NEXT_PUBLIC_API_BASE_URL: http://165.22.109.61
        run: npm run build

      - name: Commit verified cleanup to branch
        run: |
          rm -f scripts/apply-user-facing-copy-cleanup.mjs
          rm -f .github/workflows/one-time-user-facing-copy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace demo and developer copy with business language"
          git push origin HEAD:chore/user-facing-language-audit-20260713

      - name: Remove one-time runner from main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/run-user-facing-copy-cleanup.yml
          git commit -m "Remove one-time copy cleanup workflow"
          git push origin main
