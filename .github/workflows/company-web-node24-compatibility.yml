name: Công Ty frontend Node 24 compatibility

on:
  pull_request:
    paths:
      - 'npp-core/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/frontend-node24-runtime-contract.test.mjs'
      - '.github/workflows/company-web-node24-compatibility.yml'
      - '.github/workflows/vercel-production-manual.yml'
  push:
    branches: [main]
    paths:
      - 'npp-core/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/frontend-node24-runtime-contract.test.mjs'
      - '.github/workflows/company-web-node24-compatibility.yml'
      - '.github/workflows/vercel-production-manual.yml'

permissions:
  contents: read

jobs:
  verify-company-web-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify runtime boundary
        run: node --test test/frontend-node24-runtime-contract.test.mjs
      - name: Install locked repository dependencies
        run: npm ci
      - name: Verify Công Ty frontend on Node 24
        run: npm run verify:core-web
