name: MCP production deploy evidence

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: heroku-mcp-deploy-evidence
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/status-heroku-mcp-production' &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish MCP production deployment correlation
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'heroku-mcp-backend-manual.yml';
            const issueNumber = 5;
            const allowedActors = new Set(['binhnxwjfjxm', 'khuongbinhinfo-a11y']);
            const statusComment = context.payload.comment;
            const statusCreatedAt = Date.parse(statusComment.created_at);

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );
            const deployComment = issueComments
              .filter((comment) =>
                comment.body === '/deploy-heroku-mcp-production' &&
                allowedActors.has(comment.user?.login) &&
                Date.parse(comment.created_at) < statusCreatedAt
              )
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0];

            const listed = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              event: 'issue_comment',
              per_page: 100
            });
            const deployCreatedAt = deployComment ? Date.parse(deployComment.created_at) : null;
            const nearby = listed.data.workflow_runs
              .filter((run) =>
                run.name === 'Manual Heroku MCP production deploy' &&
                run.event === 'issue_comment' &&
                Date.parse(run.created_at) < statusCreatedAt
              )
              .map((run) => ({
                run,
                deltaSeconds: deployCreatedAt === null
                  ? null
                  : Math.round((Date.parse(run.created_at) - deployCreatedAt) / 1000)
              }))
              .sort((left, right) => {
                if (deployCreatedAt === null) {
                  return Date.parse(right.run.created_at) - Date.parse(left.run.created_at);
                }
                return Math.abs(left.deltaSeconds) - Math.abs(right.deltaSeconds);
              })
              .slice(0, 12);

            const lines = [
              '## MCP production deployment correlation',
              '',
              `- Status comment ID: \`${statusComment.id}\``,
              `- Status comment time: \`${statusComment.created_at}\``
            ];
            if (deployComment) {
              lines.push(
                `- Deploy comment ID: \`${deployComment.id}\``,
                `- Deploy comment time: \`${deployComment.created_at}\``
              );
            } else {
              lines.push('- Deploy comment: `not found`');
            }
            lines.push('', '### Nearby workflow runs');
            if (!nearby.length) {
              lines.push('- No issue-comment runs found for the MCP production workflow.');
            } else {
              for (const item of nearby) {
                const run = item.run;
                const delta = item.deltaSeconds === null
                  ? 'n/a'
                  : `${item.deltaSeconds >= 0 ? '+' : ''}${item.deltaSeconds}s`;
                lines.push(
                  `- Run \`${run.id}\` — delta \`${delta}\` — ` +
                  `status \`${run.status}\` — conclusion \`${run.conclusion || 'pending'}\` — ` +
                  `head \`${run.head_sha}\` — started \`${run.created_at}\``
                );
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: lines.join('\n')
            });

            if (!deployComment) {
              core.setFailed('mcp_production_deploy_comment_not_found');
            }
