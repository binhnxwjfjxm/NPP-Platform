name: MCP production deploy evidence

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: heroku-mcp-deploy-evidence
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/status-heroku-mcp-production' &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Find and report the matching MCP production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'heroku-mcp-backend-manual.yml';
            const issueNumber = 5;
            const allowedActors = new Set(['binhnxwjfjxm', 'khuongbinhinfo-a11y']);
            const statusCreatedAt = Date.parse(context.payload.comment.created_at);

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );
            const deployComment = issueComments
              .filter((comment) =>
                comment.body === '/deploy-heroku-mcp-production' &&
                allowedActors.has(comment.user?.login) &&
                Date.parse(comment.created_at) < statusCreatedAt
              )
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0];

            if (!deployComment) {
              core.setFailed('mcp_production_deploy_comment_not_found');
              return;
            }

            const deployCreatedAt = Date.parse(deployComment.created_at);
            const listed = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              event: 'issue_comment',
              per_page: 100
            });
            const candidates = listed.data.workflow_runs
              .filter((run) => {
                const runCreatedAt = Date.parse(run.created_at);
                return run.name === 'Manual Heroku MCP production deploy' &&
                  run.event === 'issue_comment' &&
                  runCreatedAt >= deployCreatedAt - 5000 &&
                  runCreatedAt < statusCreatedAt;
              })
              .sort((left, right) =>
                Math.abs(Date.parse(left.created_at) - deployCreatedAt) -
                Math.abs(Date.parse(right.created_at) - deployCreatedAt)
              );
            const target = candidates[0];

            if (!target || Math.abs(Date.parse(target.created_at) - deployCreatedAt) > 120000) {
              core.setFailed('matching_mcp_production_deploy_run_not_found');
              return;
            }

            const format = (run, jobs) => {
              const lines = [
                '## MCP production deployment evidence',
                '',
                `- Trigger comment ID: \`${deployComment.id}\``,
                `- Triggered: \`${deployComment.created_at}\``,
                `- Run ID: \`${run.id}\``,
                `- Status: \`${run.status}\``,
                `- Conclusion: \`${run.conclusion || 'pending'}\``,
                `- Head SHA: \`${run.head_sha}\``,
                `- Event: \`${run.event}\``,
                `- Started: \`${run.created_at}\``
              ];
              for (const job of jobs) {
                lines.push(
                  `- Job ID: \`${job.id}\` — \`${job.name}\` — ` +
                  `status \`${job.status}\`, conclusion \`${job.conclusion || 'pending'}\``
                );
              }
              lines.push('', `[Open workflow run](${run.html_url})`);
              return lines.join('\n');
            };

            let run = (await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: target.id
            })).data;
            let jobs = (await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: target.id,
              per_page: 100
            })).data.jobs;

            const evidenceComment = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: format(run, jobs)
            });

            const deadline = Date.now() + 55 * 60 * 1000;
            while (run.status !== 'completed' && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 15000));
              run = (await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: target.id
              })).data;
              jobs = (await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: target.id,
                per_page: 100
              })).data.jobs;
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: evidenceComment.data.id,
                body: format(run, jobs)
              });
            }

            if (run.status !== 'completed') {
              core.setFailed('mcp_production_deploy_status_timeout');
              return;
            }
            if (run.conclusion !== 'success') {
              core.setFailed(`mcp_production_deploy_${run.conclusion || 'failed'}`);
            }
