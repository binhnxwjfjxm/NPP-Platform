name: One-shot MCP runtime credential repair v2

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'agent/ops-mcp-runtime-credential-final2' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_APP: hung-phat
      MCP_APP: hung-phat-mcp
      EXPECTED_MAIN_SHA: 188165fe9c8de84291015a1fa4564c15180399ee
      RUNTIME_ROLE: mcp_runtime
      TEMP_ATTACHMENT: MCP_RUNTIME_DB
      STATUS_FILE: /tmp/mcp-runtime-credential-status
    steps:
      - name: Verify exact operation scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "$EXPECTED_MAIN_SHA"
          test "$CORE_APP" = "hung-phat"
          test "$MCP_APP" = "hung-phat-mcp"
          test "$RUNTIME_ROLE" = "mcp_runtime"

      - name: Install Heroku CLI
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku version

      - name: Repair provider configuration
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          stage="preflight"
          cutover_started=false
          old_was_attachment=false
          addon_name=""
          old_database_url=""
          old_role=""

          status() { printf '%s\n' "$1" > "$STATUS_FILE"; }

          detach_temp() {
            local value
            value="$(heroku config:get "${TEMP_ATTACHMENT}_URL" -a "$MCP_APP" 2>/dev/null || true)"
            if [ -n "$value" ]; then
              heroku addons:detach "$TEMP_ATTACHMENT" -a "$MCP_APP" --confirm "$MCP_APP" >/dev/null 2>&1 || true
            fi
          }

          rollback() {
            set +e
            heroku addons:detach DATABASE -a "$MCP_APP" --confirm "$MCP_APP" >/dev/null 2>&1 || true
            if [ "$old_was_attachment" = true ] && [ -n "$addon_name" ]; then
              heroku addons:attach "$addon_name" --as DATABASE -a "$MCP_APP" >/dev/null 2>&1 || true
            elif [ -n "$old_database_url" ]; then
              heroku config:set "DATABASE_URL=$old_database_url" -a "$MCP_APP" >/dev/null 2>&1 || true
            fi
            if [ -n "$old_role" ]; then
              heroku config:set "MCP_DB_ROLE=$old_role" -a "$MCP_APP" >/dev/null 2>&1 || true
            fi
            detach_temp
            set -e
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ "$cutover_started" = true ]; then rollback; else detach_temp; fi
              status "failure:$stage"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"

          stage="provider-audit"
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_APP/config-vars" > /tmp/core-config.json
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$MCP_APP/config-vars" > /tmp/mcp-config.json
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_APP/addons" > /tmp/core-addons.json
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$MCP_APP/addon-attachments" > /tmp/mcp-attachments.json

          RUNTIME_ROLE="$RUNTIME_ROLE" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const core = JSON.parse(await readFile('/tmp/core-config.json', 'utf8'));
          const mcp = JSON.parse(await readFile('/tmp/mcp-config.json', 'utf8'));
          const addons = JSON.parse(await readFile('/tmp/core-addons.json', 'utf8'));
          const attachments = JSON.parse(await readFile('/tmp/mcp-attachments.json', 'utf8'));
          const ownerUrl = core.DATABASE_URL;
          const runtimeUrl = mcp.DATABASE_URL;
          const oldRole = mcp.MCP_DB_ROLE;
          const role = process.env.RUNTIME_ROLE;
          if (!ownerUrl || !runtimeUrl || !oldRole || !role) throw new Error('missing_required_config');
          const pg = addons.filter((a) => a?.addon_service?.name === 'heroku-postgresql' || String(a?.plan?.name || '').startsWith('heroku-postgresql'));
          if (pg.length !== 1) throw new Error('expected_one_postgres_addon');
          if (String(pg[0]?.plan?.name || '').includes('advanced')) throw new Error('advanced_postgres_not_supported_by_this_operation');
          const databaseAttachment = attachments.find((a) => a?.name === 'DATABASE');
          if (databaseAttachment && databaseAttachment?.addon?.id !== pg[0].id) throw new Error('wrong_database_attachment');
          const owner = new URL(ownerUrl);
          const runtime = new URL(runtimeUrl);
          const port = (u) => u.port || '5432';
          if (owner.hostname !== runtime.hostname || port(owner) !== port(runtime) || owner.pathname !== runtime.pathname) throw new Error('different_database_target');
          const already = decodeURIComponent(owner.username) !== decodeURIComponent(runtime.username)
            && decodeURIComponent(runtime.username) === role
            && oldRole === role;
          await writeFile('/tmp/addon-name', pg[0].name, { mode: 0o600 });
          await writeFile('/tmp/old-url', runtimeUrl, { mode: 0o600 });
          await writeFile('/tmp/old-role', oldRole, { mode: 0o600 });
          await writeFile('/tmp/old-attachment', databaseAttachment ? 'true' : 'false', { mode: 0o600 });
          await writeFile('/tmp/already', already ? 'true' : 'false', { mode: 0o600 });
          NODE

          addon_name="$(cat /tmp/addon-name)"
          old_database_url="$(cat /tmp/old-url)"
          old_role="$(cat /tmp/old-role)"
          old_was_attachment="$(cat /tmp/old-attachment)"
          already="$(cat /tmp/already)"
          echo "::add-mask::$old_database_url"

          if [ "$already" = true ]; then
            status "success:already-separated:$RUNTIME_ROLE"
            trap - EXIT
            exit 0
          fi

          stage="credential-provision"
          credentials="$(heroku pg:credentials DATABASE_URL -a "$CORE_APP")"
          if ! printf '%s\n' "$credentials" | grep -Eq "^[[:space:]]*${RUNTIME_ROLE}[[:space:]]"; then
            heroku pg:credentials:create DATABASE_URL --name "$RUNTIME_ROLE" -a "$CORE_APP"
          fi

          stage="temporary-attachment"
          detach_temp
          heroku addons:attach "$addon_name" --credential "$RUNTIME_ROLE" --as "$TEMP_ATTACHMENT" -a "$MCP_APP"
          temp_url="$(heroku config:get "${TEMP_ATTACHMENT}_URL" -a "$MCP_APP")"
          test -n "$temp_url"
          echo "::add-mask::$temp_url"

          TEMP_URL="$temp_url" OLD_URL="$old_database_url" ROLE="$RUNTIME_ROLE" node --input-type=module <<'NODE'
          const oldUrl = new URL(process.env.OLD_URL);
          const tempUrl = new URL(process.env.TEMP_URL);
          const port = (u) => u.port || '5432';
          if (decodeURIComponent(tempUrl.username) !== process.env.ROLE) throw new Error('wrong_runtime_role');
          if (oldUrl.hostname !== tempUrl.hostname || port(oldUrl) !== port(tempUrl) || oldUrl.pathname !== tempUrl.pathname) throw new Error('wrong_runtime_database');
          if (decodeURIComponent(oldUrl.username) === decodeURIComponent(tempUrl.username)) throw new Error('credential_not_separated');
          NODE

          stage="database-cutover"
          cutover_started=true
          if [ "$old_was_attachment" = true ]; then
            heroku addons:detach DATABASE -a "$MCP_APP" --confirm "$MCP_APP"
          else
            heroku config:unset DATABASE_URL -a "$MCP_APP"
          fi
          heroku addons:attach "$addon_name" --credential "$RUNTIME_ROLE" --as DATABASE -a "$MCP_APP"
          heroku config:set "MCP_DB_ROLE=$RUNTIME_ROLE" -a "$MCP_APP" >/dev/null

          stage="final-verification"
          final_url="$(heroku config:get DATABASE_URL -a "$MCP_APP")"
          owner_url="$(heroku config:get DATABASE_URL -a "$CORE_APP")"
          final_role="$(heroku config:get MCP_DB_ROLE -a "$MCP_APP")"
          test "$final_role" = "$RUNTIME_ROLE"
          echo "::add-mask::$final_url"
          echo "::add-mask::$owner_url"
          FINAL_URL="$final_url" OWNER_URL="$owner_url" ROLE="$RUNTIME_ROLE" node --input-type=module <<'NODE'
          const runtime = new URL(process.env.FINAL_URL);
          const owner = new URL(process.env.OWNER_URL);
          const port = (u) => u.port || '5432';
          if (decodeURIComponent(runtime.username) !== process.env.ROLE) throw new Error('final_role_mismatch');
          if (decodeURIComponent(runtime.username) === decodeURIComponent(owner.username)) throw new Error('final_credentials_not_separated');
          if (runtime.hostname !== owner.hostname || port(runtime) !== port(owner) || runtime.pathname !== owner.pathname) throw new Error('final_database_mismatch');
          NODE

          detach_temp
          cutover_started=false
          status "success:repaired:$RUNTIME_ROLE"
          trap - EXIT

      - name: Publish sanitized evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="failure:workflow-interrupted"
          if [ -f "$STATUS_FILE" ]; then result="$(cat "$STATUS_FILE")"; fi
          if [[ "$result" == success:* ]]; then
            mode="$(cut -d: -f2 <<<"$result")"
            role="$(cut -d: -f3 <<<"$result")"
            body="## MCP runtime database credential ready

- Exact main audited: \`$EXPECTED_MAIN_SHA\`
- Runtime role: \`$role\`
- Result: \`$mode\`
- Shared database target preserved: yes
- Runtime and migrator usernames separated: yes
- Production source/workflow/frontend changed: no"
          else
            body="## MCP runtime database credential repair failed

- Exact main audited: \`$EXPECTED_MAIN_SHA\`
- Failed stage: \`${result#failure:}\`
- Rollback attempted where required
- Deployment not triggered"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$body" >/dev/null
