name: Fix Phase 7.3 permission and verification registry

on:
  push:
    branches:
      - agent/phase-7-3-stocktake
    paths:
      - ".github/workflows/phase73-fix-permissions.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-7-3-stocktake
          fetch-depth: 0
      - name: Sync current main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
      - name: Patch files
        run: |
          set -euo pipefail
          python3 .phase73-patch.py
          rm -f .phase73-patch.py .github/workflows/phase73-fix-permissions.yml
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase-7.3): register stocktake permissions and schema verification"
          git push origin HEAD:agent/phase-7-3-stocktake
