name: VPS DB network read-only audit

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-db-network-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/audit-vps-db-network-958' &&
        (
          github.actor == 'binhnxwjfjxm' ||
          github.actor == 'khuongbinhinfo-a11y'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/audit-vps-db-network-958'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_DB_HOST"
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_MCP_SSH_KEY"

          umask 077
          prepare_key() {
            local raw="$1" host="$2" slug="$3"
            local key="$RUNNER_TEMP/vps-${slug}.key"
            local known="$RUNNER_TEMP/vps-${slug}-known-hosts"
            printf '%s\n' "$raw" > "$key"
            chmod 600 "$key"
            ssh-keygen -y -f "$key" >/dev/null
            ssh-keyscan -T 10 -H "$host" > "$known" 2>/dev/null
            test -s "$known"
            chmod 600 "$known"
          }

          prepare_key "$VPS_DB_SSH_KEY" "$VPS_DB_HOST" db
          prepare_key "$VPS_COMPANY_SSH_KEY" "$VPS_COMPANY_HOST" company
          prepare_key "$VPS_MCP_SSH_KEY" "$VPS_MCP_HOST" mcp

      - name: Resolve exact private IPv4 addresses
        id: network
        shell: bash
        run: |
          set -euo pipefail
          private_ip() {
            local slug="$1" host="$2"
            ssh -i "$RUNNER_TEMP/vps-${slug}.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/vps-${slug}-known-hosts" \
              "$VPS_SSH_USER@$host" \
              "ip -4 route get 1.1.1.1 | awk 'NR==1 {for(i=1;i<=NF;i++) if(\$i==\"src\") {print \$(i+1); exit}}'"
          }

          db_private_ip="$(private_ip db "$VPS_DB_HOST")"
          company_private_ip="$(private_ip company "$VPS_COMPANY_HOST")"
          mcp_private_ip="$(private_ip mcp "$VPS_MCP_HOST")"

          python3 - "$db_private_ip" "$company_private_ip" "$mcp_private_ip" <<'PY'
          import ipaddress, sys
          ips = [ipaddress.IPv4Address(value) for value in sys.argv[1:]]
          if not all(ip.is_private for ip in ips):
              raise SystemExit('non_private_vps_address')
          if len(set(ips)) != 3:
              raise SystemExit('duplicate_private_vps_address')
          PY

          echo "db_private_ip=$db_private_ip" >> "$GITHUB_OUTPUT"
          echo "company_private_ip=$company_private_ip" >> "$GITHUB_OUTPUT"
          echo "mcp_private_ip=$mcp_private_ip" >> "$GITHUB_OUTPUT"

      - name: Collect provider metadata and host firewall state
        shell: bash
        env:
          REPORT_FILE: ${{ runner.temp }}/vps-db-network-958.md
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
          COMPANY_PRIVATE_IP: ${{ steps.network.outputs.company_private_ip }}
          MCP_PRIVATE_IP: ${{ steps.network.outputs.mcp_private_ip }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          : > "$REPORT_FILE"
          {
            echo '## VPS DB network read-only audit'
            echo
            echo "- Source main SHA: \`$SOURCE_SHA\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo '- Operation: read-only provider/network/firewall/connectivity audit; no config mutation.'
            echo '- Production traffic: unchanged.'
            echo
          } >> "$REPORT_FILE"

          collect_host() {
            local role="$1" slug="$2" host="$3" expected_private="$4"
            {
              echo "### $role"
              echo '```text'
            } >> "$REPORT_FILE"
            ssh -i "$RUNNER_TEMP/vps-${slug}.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/vps-${slug}-known-hosts" \
              "$VPS_SSH_USER@$host" "bash -s -- '$expected_private'" >> "$REPORT_FILE" <<'REMOTE'
          set -euo pipefail
          expected_private="$1"
          actual_private="$(ip -4 route get 1.1.1.1 | awk 'NR==1 {for(i=1;i<=NF;i++) if($i=="src") {print $(i+1); exit}}')"
          echo "hostname=$(hostname)"
          echo "private_ip=$actual_private"
          test "$actual_private" = "$expected_private"
          echo 'private_routes:'
          ip -4 route show | grep -E '(^default|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)' || true
          echo 'provider_metadata:'
          if metadata="$(curl -fsS --max-time 2 -H 'Authorization: Bearer Oracle' http://169.254.169.254/opc/v2/instance/ 2>/dev/null)"; then
            PROVIDER_METADATA="$metadata" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['PROVIDER_METADATA'])
          print('provider=oracle_oci')
          print('region=' + str(data.get('region', 'unknown')))
          print('availability_domain=' + str(data.get('availabilityDomain', 'unknown')))
          PY
          else
            echo 'provider=metadata_unavailable'
          fi
          echo 'vnic_metadata:'
          if vnics="$(curl -fsS --max-time 2 -H 'Authorization: Bearer Oracle' http://169.254.169.254/opc/v2/vnics/ 2>/dev/null)"; then
            VNIC_METADATA="$vnics" python3 - <<'PY'
          import json, os
          rows = json.loads(os.environ['VNIC_METADATA'])
          if not rows:
              print('vnic=none')
          else:
              row = rows[0]
              print('vnic_private_ip=' + str(row.get('privateIp', 'unknown')))
              print('subnet_cidr=' + str(row.get('subnetCidrBlock', 'unknown')))
              print('virtual_router_ip=' + str(row.get('virtualRouterIp', 'unknown')))
          PY
          else
            echo 'vnic=metadata_unavailable'
          fi
          echo 'ufw_status:'
          sudo -n ufw status numbered 2>/dev/null | grep -E 'Status:|22/tcp|5432' || true
          echo 'iptables_input:'
          sudo -n iptables -S INPUT 2>/dev/null | grep -E '^-P INPUT|22|5432|ufw' || true
          echo 'nft_input_summary:'
          sudo -n nft list ruleset 2>/dev/null | grep -E 'hook input|tcp dport (22|5432)|policy (drop|accept)' | head -n 30 || true
          REMOTE
            echo '```' >> "$REPORT_FILE"
            echo >> "$REPORT_FILE"
          }

          collect_host 'DB VPS' db "$VPS_DB_HOST" "$DB_PRIVATE_IP"
          collect_host 'Công Ty VPS' company "$VPS_COMPANY_HOST" "$COMPANY_PRIVATE_IP"
          collect_host 'MCP/proxy VPS' mcp "$VPS_MCP_HOST" "$MCP_PRIVATE_IP"

      - name: Probe private and public network paths without mutation
        shell: bash
        env:
          REPORT_FILE: ${{ runner.temp }}/vps-db-network-958.md
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
          COMPANY_PRIVATE_IP: ${{ steps.network.outputs.company_private_ip }}
          MCP_PRIVATE_IP: ${{ steps.network.outputs.mcp_private_ip }}
        run: |
          set -euo pipefail

          probe_from() {
            local slug="$1" host="$2" label="$3" dest="$4" port="$5"
            local output="$RUNNER_TEMP/probe-${slug}-${port}.out"
            set +e
            ssh -i "$RUNNER_TEMP/vps-${slug}.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/vps-${slug}-known-hosts" \
              "$VPS_SSH_USER@$host" "bash -s -- '$dest' '$port'" > "$output" 2>&1 <<'REMOTE'
          set -u
          dest="$1"
          port="$2"
          echo "route=$(ip -4 route get "$dest" 2>/dev/null | head -n1 || true)"
          timeout 4 bash -c "cat < /dev/null > /dev/tcp/$dest/$port" >/dev/null 2>&1
          rc=$?
          case "$rc" in
            0) echo 'result=PASS' ;;
            124) echo 'result=TIMEOUT' ;;
            *) echo "result=FAIL rc=$rc" ;;
          esac
          exit 0
          REMOTE
            ssh_rc=$?
            set -e
            {
              echo "$label"
              cat "$output"
              echo "ssh_wrapper_rc=$ssh_rc"
            } >> "$REPORT_FILE"
          }

          {
            echo '### Connectivity matrix'
            echo '```text'
          } >> "$REPORT_FILE"

          probe_from company "$VPS_COMPANY_HOST" 'company_to_db_private_22:' "$DB_PRIVATE_IP" 22
          probe_from company "$VPS_COMPANY_HOST" 'company_to_db_private_5432:' "$DB_PRIVATE_IP" 5432
          probe_from company "$VPS_COMPANY_HOST" 'company_to_db_public_22:' "$VPS_DB_HOST" 22
          probe_from company "$VPS_COMPANY_HOST" 'company_to_db_public_5432:' "$VPS_DB_HOST" 5432
          probe_from mcp "$VPS_MCP_HOST" 'mcp_to_db_private_22:' "$DB_PRIVATE_IP" 22
          probe_from mcp "$VPS_MCP_HOST" 'mcp_to_db_private_5432:' "$DB_PRIVATE_IP" 5432
          probe_from mcp "$VPS_MCP_HOST" 'mcp_to_db_public_22:' "$VPS_DB_HOST" 22
          probe_from mcp "$VPS_MCP_HOST" 'mcp_to_db_public_5432:' "$VPS_DB_HOST" 5432
          probe_from db "$VPS_DB_HOST" 'db_to_company_private_22:' "$COMPANY_PRIVATE_IP" 22
          probe_from db "$VPS_DB_HOST" 'db_to_mcp_private_22:' "$MCP_PRIVATE_IP" 22

          {
            echo '```'
            echo
            echo 'production_traffic=not_enabled'
            echo 'cutover=not_performed'
          } >> "$REPORT_FILE"

      - name: Publish sanitized evidence to Issue 958
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/vps-db-network-958.md
        run: |
          set -euo pipefail
          test -s "$REPORT_FILE"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/958/comments" \
            -f body="$(cat "$REPORT_FILE")" >/dev/null
