name: P4.3 One-Time Fixture Repair

on:
  push:
    branches:
      - agent/phase-4-inventory-reservations-negative-stock-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p43-one-time-fixture-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: npp_p43_fix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d npp_p43_fix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_p43_fix
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_p43_fix
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-inventory-reservations-negative-stock-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Repair invalid P4.3 unit fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('npp-core/api/test/inventory-reservations.test.js')
          source = path.read_text(encoding='utf-8')
          old = "[baseUnitId, installationId, 'UNIT', 'Đơn vị kiểm thử', 'base', 'test:seed'],"
          new = "[baseUnitId, installationId, 'UNIT', 'Đơn vị kiểm thử', 'COUNT', 'test:seed'],"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one invalid fixture, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- npp-core/api/test/inventory-reservations.test.js

      - name: Install workspaces
        run: npm ci

      - name: Build Core API
        run: npm --workspace npp-core-api run build

      - name: Apply and verify migrations
        run: |
          npm --workspace npp-core-api run migration:migrate
          npm --workspace npp-core-api run migration:verify
          npm --workspace npp-core-api run migration:migrate

      - name: Run focused P4.3 tests
        run: node --test npp-core/api/test/inventory-reservations.test.js

      - name: Run full Core API verification
        run: npm --workspace npp-core-api run verify

      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/p43-self-fix.yml
          git add npp-core/api/test/inventory-reservations.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(inventory): use valid unit kind in P4.3 fixture"
          git push origin HEAD:agent/phase-4-inventory-reservations-negative-stock-v2
