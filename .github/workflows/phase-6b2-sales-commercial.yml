name: Phase 6B.2 Sales Commercial Controls

on:
  pull_request:
    branches:
      - main
    paths:
      - 'npp-core/api/**'
      - 'npp-core/web/**'
      - 'database/migrations/sales/**'
      - 'docs/operations/phase-6b2-sales-order-commercial-controls.md'
      - '.github/workflows/phase-6b2-sales-commercial.yml'
  push:
    branches:
      - agent/phase-6b2-sales-commercial-controls
    paths:
      - 'npp-core/api/**'
      - 'npp-core/web/**'
      - 'database/migrations/sales/**'
      - 'docs/operations/phase-6b2-sales-order-commercial-controls.md'
      - '.github/workflows/phase-6b2-sales-commercial.yml'

permissions:
  contents: read

concurrency:
  group: phase-6b2-sales-commercial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact commercial vertical slice
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_phase_6b2
      E2E_BACKEND_API_TOKEN: ci-phase-6b2-token-not-a-production-secret

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: npp_phase_6b2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d npp_phase_6b2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Core-only scope
        if: github.event_name == 'push' || github.head_ref == 'agent/phase-6b2-sales-commercial-controls'
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | tee phase-6b2-changed-files.log
          if git diff --name-only origin/main...HEAD -- mcp | grep -q .; then
            echo "::error::Phase 6B.2 must not change mcp/**"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Apply migrations on PostgreSQL 17
        run: npm --workspace npp-core-api run migration:migrate 2>&1 | tee phase-6b2-migration.log
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          NODE_ENV: test

      - name: Reapply migrations as rerun no-op
        run: npm --workspace npp-core-api run migration:migrate 2>&1 | tee -a phase-6b2-migration.log
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          NODE_ENV: test

      - name: Verify Core API commercial contracts
        run: npm --workspace npp-core-api run verify 2>&1 | tee phase-6b2-api.log
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          NODE_ENV: test

      - name: Verify Core web commercial contracts
        run: npm --workspace npp-core-web run verify 2>&1 | tee phase-6b2-web.log

      - name: Run Sales Order commercial Chromium gate
        working-directory: npp-core/web
        run: |
          docker run --rm \
            --network host \
            --ipc host \
            --env CI \
            --env E2E_DATABASE_URL \
            --env E2E_BACKEND_API_TOKEN \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/npp-core/web \
            mcr.microsoft.com/playwright:v1.62.0-noble \
            bash -lc 'npx playwright test --project=sales-order-commercial 2>&1 | tee ../../phase-6b2-browser.log'

      - name: Upload Phase 6B.2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6b2-diagnostics-${{ github.run_id }}
          path: |
            phase-6b2-changed-files.log
            phase-6b2-migration.log
            phase-6b2-api.log
            phase-6b2-web.log
            phase-6b2-browser.log
            npp-core/web/playwright-report/
            npp-core/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
