name: P4.3 One-Time Non-Base Unit Fix

on:
  push:
    branches:
      - agent/phase-4-inventory-reservations-negative-stock-v2

permissions:
  contents: write

jobs:
  fix-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-inventory-reservations-negative-stock-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Assign a distinct UOM to the non-base variant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('npp-core/api/test/inventory-reservations.test.js')
          source = path.read_text(encoding='utf-8')
          old = "($3,$4,$5,$9,'SKU cân không cơ sở','OTHER',false,true,true,true,$10,1,true,$12,$12)"
          new = "($3,$4,$5,$9,'SKU cân không cơ sở','OTHER',false,true,true,true,$11,1,true,$12,$12)"
          if source.count(old) != 1:
              raise SystemExit(f'expected one non-base variant match, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit fixture fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/p43-fix-nonbase-unit.yml
          git add npp-core/api/test/inventory-reservations.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(inventory): use distinct UOM for non-base fixture"
          git push origin HEAD:agent/phase-4-inventory-reservations-negative-stock-v2
