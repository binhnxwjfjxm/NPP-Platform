name: Diagnose MCP database readiness 158

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-mcp-db-readiness-158.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/diagnose-mcp-db-readiness-158'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_APP_NAME: hung-phat
      MCP_APP_NAME: hung-phat-mcp
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Confirm tools and credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Audit shared PostgreSQL without mutation
        shell: bash
        run: |
          set -euo pipefail
          core_config="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_APP_NAME/config-vars")"
          database_url="$(jq -r '.DATABASE_URL // empty' <<<"$core_config")"
          test -n "$database_url"
          echo "::add-mask::$database_url"
          export PGCONNECT_TIMEOUT=15

          psql "$database_url" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          SELECT 'CURRENT_DATABASE_ROLE=' || current_user;
          SELECT 'CURRENT_SEARCH_PATH=' || current_setting('search_path');
          SELECT 'SERVER_VERSION=' || current_setting('server_version');
          SELECT 'MCP_SCHEMA_EXISTS=' || (to_regnamespace('mcp') IS NOT NULL)::text;
          SELECT 'MCP_RUNTIME_ROLE_EXISTS=' || EXISTS(SELECT 1 FROM pg_roles WHERE rolname = 'mcp_runtime')::text;
          SELECT 'MCP_RUNTIME_CAN_LOGIN=' || COALESCE((SELECT rolcanlogin::text FROM pg_roles WHERE rolname = 'mcp_runtime'), 'role_missing');
          SELECT 'MCP_MIGRATOR_ROLE_EXISTS=' || EXISTS(SELECT 1 FROM pg_roles WHERE rolname = 'mcp_migrator')::text;
          SELECT 'MCP_TABLES=' || COALESCE((SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'mcp'), 'none');
          SELECT 'MCP_ROUTES_EXISTS=' || (to_regclass('mcp.mcp_routes') IS NOT NULL)::text;
          SELECT 'MCP_ROUTE_CUSTOMERS_EXISTS=' || (to_regclass('mcp.mcp_route_customers') IS NOT NULL)::text;
          SELECT 'MCP_ROUTE_SESSIONS_EXISTS=' || (to_regclass('mcp.mcp_route_sessions') IS NOT NULL)::text;
          SELECT 'MCP_IDEMPOTENCY_EXISTS=' || (to_regclass('mcp.idempotency_records') IS NOT NULL)::text;
          SELECT 'MCP_AUDIT_EXISTS=' || (to_regclass('mcp.audit_events') IS NOT NULL)::text;
          SELECT 'MCP_OUTBOX_EXISTS=' || (to_regclass('mcp.outbox_events') IS NOT NULL)::text;
          SELECT 'MCP_RUNTIME_SCHEMA_USAGE=' || CASE WHEN EXISTS(SELECT 1 FROM pg_roles WHERE rolname = 'mcp_runtime') AND to_regnamespace('mcp') IS NOT NULL THEN has_schema_privilege('mcp_runtime', 'mcp', 'USAGE')::text ELSE 'not_applicable' END;
          SELECT 'MCP_RUNTIME_SCHEMA_CREATE=' || CASE WHEN EXISTS(SELECT 1 FROM pg_roles WHERE rolname = 'mcp_runtime') AND to_regnamespace('mcp') IS NOT NULL THEN has_schema_privilege('mcp_runtime', 'mcp', 'CREATE')::text ELSE 'not_applicable' END;
          SELECT 'MIGRATION_REGISTRY_EXISTS=' || (to_regclass('shared.schema_migrations') IS NOT NULL)::text;
          SELECT 'MIGRATION_REGISTRY_COLUMNS=' || COALESCE((SELECT string_agg(column_name, ',' ORDER BY ordinal_position) FROM information_schema.columns WHERE table_schema = 'shared' AND table_name = 'schema_migrations'), 'none');
          SQL

          registry_exists="$(psql "$database_url" --no-psqlrc --tuples-only --no-align --command "SELECT to_regclass('shared.schema_migrations') IS NOT NULL")"
          if [[ "$registry_exists" == "t" ]]; then
            psql "$database_url" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 'MCP_MIGRATIONS=' || COALESCE(string_agg(id, ',' ORDER BY id), 'none') FROM shared.schema_migrations WHERE id LIKE 'mcp_%'"
          fi

          for table in mcp_routes mcp_route_customers mcp_route_sessions idempotency_records audit_events outbox_events; do
            exists="$(psql "$database_url" --no-psqlrc --tuples-only --no-align --command "SELECT to_regclass('mcp.${table}') IS NOT NULL")"
            if [[ "$exists" == "t" ]]; then
              count="$(psql "$database_url" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT count(*) FROM mcp.${table}")"
              echo "ROW_COUNT_${table^^}=$count"
            fi
          done

      - name: Audit MCP dyno and sanitized startup logs
        shell: bash
        run: |
          set -euo pipefail
          dynos_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$MCP_APP_NAME/dynos")"
          jq -r '.[] | "DYNO name=\(.name) type=\(.type) state=\(.state) release=\(.release.version // "unknown") updated=\(.updated_at // "unknown")"' <<<"$dynos_json"

          log_session="$(curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d '{"lines":200,"source":"app","tail":false}' \
            "https://api.heroku.com/apps/$MCP_APP_NAME/log-sessions")"
          log_url="$(jq -r '.logplex_url // empty' <<<"$log_session")"
          test -n "$log_url"
          curl --fail --silent --show-error "$log_url" \
            | tail -n 200 \
            | sed -E 's#(postgres(?:ql)?://)[^ @]+@#\1[redacted]@#gi; s/[A-Za-z0-9_\-]{40,}/[redacted]/g' \
            | grep -E 'foundation|error|Error|fatal|Fatal|crash|Crash|missing_|invalid_|persistence|State changed|Starting process|Process exited|at file:' \
            || true

      - name: Audit current backup evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKUP_LIST_BEGIN"
          heroku pg:backups -a "$CORE_APP_NAME" \
            | sed -E 's#(postgres(?:ql)?://)[^ @]+@#\1[redacted]@#gi; s/[A-Za-z0-9_\-]{40,}/[redacted]/g'
          echo "BACKUP_LIST_END"
