name: VPS production read-only audit

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-production-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/audit-vps-production' &&
        (
          github.actor == 'binhnxwjfjxm' ||
          github.actor == 'khuongbinhinfo-a11y'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/audit-vps-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH credentials
        id: ssh
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$VPS_DB_HOST"
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_MCP_SSH_KEY"

          umask 077
          printf '%s\n' "$VPS_DB_SSH_KEY" > "$RUNNER_TEMP/vps-db.key"
          printf '%s\n' "$VPS_COMPANY_SSH_KEY" > "$RUNNER_TEMP/vps-company.key"
          printf '%s\n' "$VPS_MCP_SSH_KEY" > "$RUNNER_TEMP/vps-mcp.key"
          chmod 600 "$RUNNER_TEMP"/vps-*.key

          ssh-keygen -y -f "$RUNNER_TEMP/vps-db.key" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/vps-company.key" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/vps-mcp.key" >/dev/null

          known_hosts="$RUNNER_TEMP/vps-known-hosts"
          : > "$known_hosts"
          for host in "$VPS_DB_HOST" "$VPS_COMPANY_HOST" "$VPS_MCP_HOST"; do
            ssh-keyscan -T 10 -H "$host" >> "$known_hosts" 2>/dev/null
          done
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Audit all three VPS
        id: audit
        shell: bash
        env:
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          report="$RUNNER_TEMP/vps-audit.md"
          : > "$report"
          overall=0

          audit_host() {
            local role="$1"
            local slug="$2"
            local host="$3"
            local key="$4"
            local stdout_file="$RUNNER_TEMP/vps-${slug}.out"
            local stderr_file="$RUNNER_TEMP/vps-${slug}.err"

            {
              echo "### ${role}"
              echo
              echo "- Host: \`${host}\`"
              echo "- SSH user: \`${VPS_SSH_USER}\`"
            } >> "$report"

            set +e
            ssh \
              -i "$key" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS" \
              "$VPS_SSH_USER@$host" "bash -s -- '$slug'" >"$stdout_file" 2>"$stderr_file" <<'REMOTE'
          set -euo pipefail
          slug="${1:-unknown}"

          yn_path() {
            if [ -e "$1" ]; then printf 'present'; else printf 'missing'; fi
          }

          yn_root_path() {
            if sudo -n test -e "$1" 2>/dev/null; then printf 'present'; else printf 'missing_or_unreadable'; fi
          }

          svc_state() {
            local svc="$1"
            local active enabled
            active="$(systemctl is-active "$svc" 2>/dev/null || true)"
            enabled="$(systemctl is-enabled "$svc" 2>/dev/null || true)"
            printf '%s/%s' "${active:-unknown}" "${enabled:-unknown}"
          }

          printf 'hostname='; hostname
          printf 'os='; . /etc/os-release; echo "$PRETTY_NAME"
          printf 'kernel='; uname -r
          printf 'uptime='; uptime -p
          printf 'cpu_vcpu='; nproc
          printf 'load_1_5_15='; awk '{print $1","$2","$3}' /proc/loadavg
          printf 'ram_available_mb='; awk '/MemAvailable:/ {printf "%.0f\n", $2/1024}' /proc/meminfo
          printf 'swap_total_mb='; free -m | awk '/Swap:/ {print $2}'
          printf 'swap_used_mb='; free -m | awk '/Swap:/ {print $3}'
          printf 'disk_root_available='; df -hP / | awk 'NR==2 {print $4}'
          printf 'disk_root_used_percent='; df -hP / | awk 'NR==2 {print $5}'
          printf 'failed_units_count='; systemctl --failed --no-legend --plain 2>/dev/null | wc -l
          printf 'failed_units_names='; systemctl --failed --no-legend --plain 2>/dev/null | awk '{print $1}' | paste -sd, - || true
          printf 'tcp_listen_ports='; ss -lntH | awk '{n=split($4,a,":"); print a[n]}' | sort -n -u | paste -sd, -
          printf 'rpcbind='; svc_state rpcbind; echo

          for svc in \
            nginx postgresql datadog-agent \
            ipv4-proxy ipv6-proxy oci-ipv6-pool squid \
            ungdungthongminh \
            bepsi-api bepsi-api-canary bepsi-ai-worker bepsi-recipe-media-cleanup \
            tocviet-api vlgn-api viec-lam-gan-nha; do
            printf 'service_%s=' "$svc"; svc_state "$svc"; echo
          done

          printf 'node_version='; (node --version 2>/dev/null || echo missing)
          printf 'npm_version='; (npm --version 2>/dev/null || echo missing)
          printf 'psql_version='; (psql --version 2>/dev/null || echo missing)
          printf 'pg_lsclusters='
          if command -v pg_lsclusters >/dev/null 2>&1; then
            pg_lsclusters --no-header 2>/dev/null | awk '{print $1"/"$2"/"$4"/"$5}' | paste -sd';' -
          else
            echo missing
          fi

          printf 'nginx_test='
          if command -v nginx >/dev/null 2>&1; then
            if sudo -n nginx -t >/dev/null 2>&1; then echo PASS; else echo FAIL; fi
          else
            echo missing
          fi
          printf 'nginx_enabled_sites='
          if [ -d /etc/nginx/sites-enabled ]; then
            find /etc/nginx/sites-enabled -maxdepth 1 -type l -printf '%f\n' 2>/dev/null | sort | paste -sd, -
          else
            echo missing
          fi

          printf 'custom_timers_relevant='
          systemctl list-timers --all --no-legend --no-pager 2>/dev/null \
            | awk '{print $NF}' \
            | grep -E 'certbot|bepsi|npp|mcp|postgres|backup' \
            | sort -u \
            | paste -sd, - || true

          printf 'ufw_state='
          if command -v ufw >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            (sudo -n ufw status 2>/dev/null | head -n1 | sed 's/^Status: //' || echo unavailable)
          else
            echo missing_or_unavailable
          fi
          printf 'iptables_input_policy='
          if command -v iptables >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            (sudo -n iptables -S INPUT 2>/dev/null | awk 'NR==1 {print $0}' || echo unavailable)
          else
            echo missing_or_unavailable
          fi
          printf 'iptables_input_rule_count='
          if command -v iptables >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            (sudo -n iptables -S INPUT 2>/dev/null | awk 'NR>1 {c++} END {print c+0}' || echo unavailable)
          else
            echo missing_or_unavailable
          fi

          case "$slug" in
            db)
              echo "path_old_db_app=$(yn_path /opt/ungdungthongminh)"
              echo "path_preclear_backup=$(yn_root_path /root/npp-preclear-958)"
              printf 'old_db_vhost_refs='
              if command -v nginx >/dev/null 2>&1; then
                refs="$(sudo -n nginx -T 2>/dev/null | { grep -E 'ungdungthongminh\.shop|127\.0\.0\.1:3900' || true; } | wc -l)"
                echo "$refs"
              else
                echo 0
              fi
              ;;
            company)
              echo "path_bepsi=$(yn_path /srv/apps/bepsi)"
              echo "path_vlgn=$(yn_path /opt/vlgn-repo)"
              echo "path_vieclam=$(yn_path /var/www/viec-lam-gan-nha)"
              echo "path_preclear_backup=$(yn_root_path /root/npp-preclear-958)"
              printf 'old_company_vhost_refs='
              if command -v nginx >/dev/null 2>&1; then
                refs="$(sudo -n nginx -T 2>/dev/null | { grep -E 'api\.bepsi\.click|127\.0\.0\.1:5100|127\.0\.0\.1:5101|127\.0\.0\.1:5102' || true; } | wc -l)"
                echo "$refs"
              else
                echo 0
              fi
              ;;
            mcp)
              echo "path_ipv4_proxy=$(yn_path /opt/ipv4-proxy)"
              echo "path_ipv6_proxy=$(yn_path /opt/ipv6-proxy)"
              echo "path_ipv6_pool_script=$(yn_path /usr/local/sbin/oci-ipv6-pool.sh)"
              printf 'proxy_listener_count_3128_3427='
              ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}'
              ;;
          esac
          REMOTE
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              echo "- SSH: **PASS**" >> "$report"
              echo >> "$report"
              echo '```text' >> "$report"
              cat "$stdout_file" >> "$report"
              echo '```' >> "$report"
            else
              overall=1
              echo "- SSH: **FAIL** (exit ${rc})" >> "$report"
              echo >> "$report"
              echo '```text' >> "$report"
              head -n 8 "$stderr_file" | sed -E 's#(/[^ ]*vps-[^ ]*\.key)#<ssh-key-file>#g' >> "$report"
              echo '```' >> "$report"
            fi
            echo >> "$report"
          }

          {
            echo "## VPS production read-only audit"
            echo
            echo "- Source main SHA: \`${SOURCE_SHA}\`"
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Operation: read-only SSH audit; no deploy/restart/migration/config mutation"
            echo "- Secret handling: no env values, passwords, tokens, private keys, database URLs or file contents are printed."
            echo "- Host-key bootstrap: GitHub runner uses ssh-keyscan for these fixed VPS IPs; pin fingerprints in a follow-up hardening change."
            echo
          } >> "$report"

          audit_host "DB VPS" "db" "$VPS_DB_HOST" "$RUNNER_TEMP/vps-db.key"
          audit_host "Công Ty VPS" "company" "$VPS_COMPANY_HOST" "$RUNNER_TEMP/vps-company.key"
          audit_host "MCP/proxy VPS" "mcp" "$VPS_MCP_HOST" "$RUNNER_TEMP/vps-mcp.key"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit evidence to Issue 958
        if: always() && steps.audit.outputs.report != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ steps.audit.outputs.report }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/958/comments" \
            -f body="$(cat "$REPORT_FILE")" \
            >/dev/null

      - name: Enforce SSH audit outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ssh.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.overall }}" = "0"
