name: VPS production read-only audit

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-production-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/audit-vps-production' &&
        (
          github.actor == 'binhnxwjfjxm' ||
          github.actor == 'khuongbinhinfo-a11y'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/audit-vps-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH credentials
        id: ssh
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$VPS_DB_HOST"
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_MCP_SSH_KEY"

          umask 077
          printf '%s\n' "$VPS_DB_SSH_KEY" > "$RUNNER_TEMP/vps-db.key"
          printf '%s\n' "$VPS_COMPANY_SSH_KEY" > "$RUNNER_TEMP/vps-company.key"
          printf '%s\n' "$VPS_MCP_SSH_KEY" > "$RUNNER_TEMP/vps-mcp.key"
          chmod 600 "$RUNNER_TEMP"/vps-*.key

          ssh-keygen -y -f "$RUNNER_TEMP/vps-db.key" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/vps-company.key" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/vps-mcp.key" >/dev/null

          known_hosts="$RUNNER_TEMP/vps-known-hosts"
          : > "$known_hosts"
          for host in "$VPS_DB_HOST" "$VPS_COMPANY_HOST" "$VPS_MCP_HOST"; do
            ssh-keyscan -T 10 -H "$host" >> "$known_hosts" 2>/dev/null
          done
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Audit all three VPS
        id: audit
        shell: bash
        env:
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          report="$RUNNER_TEMP/vps-audit.md"
          : > "$report"
          overall=0

          audit_host() {
            local role="$1"
            local host="$2"
            local key="$3"
            local stdout_file="$RUNNER_TEMP/${role}.out"
            local stderr_file="$RUNNER_TEMP/${role}.err"

            {
              echo "### ${role}"
              echo
              echo "- Host: \`${host}\`"
              echo "- SSH user: \`${VPS_SSH_USER}\`"
            } >> "$report"

            set +e
            ssh \
              -i "$key" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS" \
              "$VPS_SSH_USER@$host" 'bash -s' >"$stdout_file" 2>"$stderr_file" <<'REMOTE'
set -euo pipefail
printf 'hostname='; hostname
printf 'os='; . /etc/os-release; echo "$PRETTY_NAME"
printf 'kernel='; uname -r
printf 'uptime='; uptime -p
printf 'cpu_vcpu='; nproc
printf 'ram_available_mb='; awk '/MemAvailable:/ {printf "%.0f\n", $2/1024}' /proc/meminfo
printf 'swap_total_mb='; free -m | awk '/Swap:/ {print $2}'
printf 'disk_root_available='; df -hP / | awk 'NR==2 {print $4}'
printf 'failed_units='; systemctl --failed --no-legend --plain 2>/dev/null | wc -l
printf 'tcp_listen_ports='; ss -lntH | awk '{n=split($4,a,":"); print a[n]}' | sort -n -u | paste -sd, -
for svc in nginx postgresql datadog-agent ipv4-proxy ipv6-proxy oci-ipv6-pool; do
  active="$(systemctl is-active "$svc" 2>/dev/null || true)"
  enabled="$(systemctl is-enabled "$svc" 2>/dev/null || true)"
  printf 'service_%s=%s/%s\n' "$svc" "${active:-unknown}" "${enabled:-unknown}"
done
REMOTE
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              echo "- SSH: **PASS**" >> "$report"
              echo >> "$report"
              echo '```text' >> "$report"
              cat "$stdout_file" >> "$report"
              echo '```' >> "$report"
            else
              overall=1
              echo "- SSH: **FAIL** (exit ${rc})" >> "$report"
              echo >> "$report"
              echo '```text' >> "$report"
              head -n 5 "$stderr_file" | sed -E 's#(/[^ ]*vps-[^ ]*\.key)#<ssh-key-file>#g' >> "$report"
              echo '```' >> "$report"
            fi
            echo >> "$report"
          }

          {
            echo "## VPS production read-only audit"
            echo
            echo "- Source main SHA: \`${SOURCE_SHA}\`"
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Operation: read-only SSH audit; no deploy/restart/migration/config mutation"
            echo "- Host-key bootstrap: GitHub runner uses ssh-keyscan for these fixed VPS IPs; pin fingerprints in a follow-up hardening change."
            echo
          } >> "$report"

          audit_host "DB VPS" "$VPS_DB_HOST" "$RUNNER_TEMP/vps-db.key"
          audit_host "Công Ty VPS" "$VPS_COMPANY_HOST" "$RUNNER_TEMP/vps-company.key"
          audit_host "MCP/proxy VPS" "$VPS_MCP_HOST" "$RUNNER_TEMP/vps-mcp.key"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit evidence to Issue 958
        if: always() && steps.audit.outputs.report != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ steps.audit.outputs.report }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/958/comments" \
            -f body="$(cat "$REPORT_FILE")" \
            >/dev/null

      - name: Enforce SSH audit outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ssh.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.overall }}" = "0"
