name: Patch PR168 provider contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-pr168-provider-contract.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/issue-158-mcp-production-read-store'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-158-mcp-production-read-store
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch provider contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider = Path('mcp/apps/backend/foundation/provider-cutover.js')
          text = provider.read_text()
          replacements = [
            (
              'export const REQUIRED_MCP_MIGRATIONS = Object.freeze(["mcp_001_write_foundation"]);',
              'export const REQUIRED_MCP_MIGRATIONS = Object.freeze([\n  "mcp_001_write_foundation",\n  "mcp_002_legacy_read_store"\n]);'
            ),
            (
              "        to_regclass('mcp.outbox_events') IS NOT NULL AS outbox_table,\n",
              "        to_regclass('mcp.outbox_events') IS NOT NULL AS outbox_table,\n        to_regclass('mcp.legacy_read_rows') IS NOT NULL AS legacy_read_store_table,\n"
            ),
            (
              "          CASE WHEN to_regclass('mcp.outbox_events') IS NULL THEN false ELSE has_table_privilege($1, to_regclass('mcp.outbox_events'), 'DELETE') END AS outbox_delete\n",
              "          CASE WHEN to_regclass('mcp.outbox_events') IS NULL THEN false ELSE has_table_privilege($1, to_regclass('mcp.outbox_events'), 'DELETE') END AS outbox_delete,\n          CASE WHEN to_regclass('mcp.legacy_read_rows') IS NULL THEN false ELSE has_table_privilege($1, to_regclass('mcp.legacy_read_rows'), 'SELECT') END AS legacy_read_store_select,\n          CASE WHEN to_regclass('mcp.legacy_read_rows') IS NULL THEN false ELSE has_table_privilege($1, to_regclass('mcp.legacy_read_rows'), 'INSERT') END AS legacy_read_store_insert,\n          CASE WHEN to_regclass('mcp.legacy_read_rows') IS NULL THEN false ELSE has_table_privilege($1, to_regclass('mcp.legacy_read_rows'), 'UPDATE') END AS legacy_read_store_update,\n          CASE WHEN to_regclass('mcp.legacy_read_rows') IS NULL THEN false ELSE has_table_privilege($1, to_regclass('mcp.legacy_read_rows'), 'DELETE') END AS legacy_read_store_delete\n"
            ),
            (
              "        outboxTable: objects.outbox_table === true,\n",
              "        outboxTable: objects.outbox_table === true,\n        legacyReadStoreTable: objects.legacy_read_store_table === true,\n"
            ),
            (
              "        outbox: {\n          select: privileges.outbox_select === true,\n          insert: privileges.outbox_insert === true,\n          update: privileges.outbox_update === true,\n          delete: privileges.outbox_delete === true\n        },\n",
              "        outbox: {\n          select: privileges.outbox_select === true,\n          insert: privileges.outbox_insert === true,\n          update: privileges.outbox_update === true,\n          delete: privileges.outbox_delete === true\n        },\n        legacyReadStore: {\n          select: privileges.legacy_read_store_select === true,\n          insert: privileges.legacy_read_store_insert === true,\n          update: privileges.legacy_read_store_update === true,\n          delete: privileges.legacy_read_store_delete === true\n        },\n"
            ),
            (
              "  const outbox = privileges.outbox ?? {};\n  if (outbox.insert !== true || outbox.select || outbox.update || outbox.delete) issue(issues, \"runtime_outbox_privileges_invalid\");\n",
              "  const outbox = privileges.outbox ?? {};\n  if (outbox.insert !== true || outbox.select || outbox.update || outbox.delete) issue(issues, \"runtime_outbox_privileges_invalid\");\n  const legacyReadStore = privileges.legacyReadStore ?? {};\n  if (legacyReadStore.select !== true || legacyReadStore.insert || legacyReadStore.update || legacyReadStore.delete) issue(issues, \"runtime_legacy_read_store_privileges_invalid\");\n"
            )
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'provider replacement mismatch: {old[:80]!r} count={text.count(old)}')
            text = text.replace(old, new)
          provider.write_text(text)

          integration = Path('mcp/apps/backend/foundation/provider-cutover-integration.test.js')
          text = integration.read_text()
          old = "  await admin.query(`GRANT INSERT ON mcp.outbox_events TO ${role}`);\n"
          new = old + "  await admin.query(`GRANT SELECT ON mcp.legacy_read_rows TO ${role}`);\n"
          if text.count(old) != 1:
            raise SystemExit('integration grant replacement mismatch')
          integration.write_text(text.replace(old, new))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp/apps/backend/foundation/provider-cutover.js \
                  mcp/apps/backend/foundation/provider-cutover-integration.test.js
          git commit -m 'fix(mcp): extend provider preflight for read store'
          git push origin HEAD:agent/issue-158-mcp-production-read-store
