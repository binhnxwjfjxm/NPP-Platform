name: One-shot Pack 8 PostgreSQL client fix

on:
  push:
    branches:
      - agent/document-numbering
    paths:
      - ".github/workflows/one-shot-add-pack8-pg17-client.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-numbering
          fetch-depth: 0

      - name: Add PostgreSQL 17 client step to Pack 8
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/phase-3-split-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = """      - run: npm ci
      - name: Run grouped migration apply, rerun and verification
"""
          new = """      - run: npm ci
      - name: Install PostgreSQL 17 client tools
        run: bash npp-core/api/scripts/install-postgresql-client-17.sh
      - name: Run grouped migration apply, rerun and verification
"""
          if text.count(old) != 1:
              raise SystemExit('Pack 8 install step contract changed unexpectedly')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-add-pack8-pg17-client.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-3-split-validation.yml npp-core/api/scripts/install-postgresql-client-17.sh
          git diff --cached --check
          git commit -m "Phase 3: use PostgreSQL 17 client in Pack 8"
          git push origin HEAD:agent/document-numbering
