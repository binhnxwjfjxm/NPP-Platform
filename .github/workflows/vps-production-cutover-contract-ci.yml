name: VPS production cutover contract CI

on:
  pull_request:
    paths:
      - .github/workflows/vps-production-cutover-manual.yml
      - .github/workflows/vps-production-cutover-contract-ci.yml
      - .github/workflows/vercel-delivery-production-manual.yml
      - .github/workflows/vercel-retail-production-manual.yml
      - npp-core/api/scripts/vps-production-cutover-958.sh
      - npp-core/api/scripts/vps-production-cutover-preflight-958.sh
      - npp-core/api/scripts/vps-production-cutover-db-958.sh
      - npp-core/api/scripts/vps-production-cutover-runtime-958.sh
      - npp-core/api/scripts/vps-production-cutover-deploy-958.sh
      - npp-core/api/scripts/vps-production-cutover-wiring-958.sh
      - npp-core/api/scripts/vps-db-heroku-rehearsal-958.sh
      - npp-core/api/scripts/vps-db-heroku-parity-gate-958.sh
      - delivery/web/scripts/deploy-production.sh
      - retail/web/scripts/deploy-production.sh
      - docs/operations/vps-production-runtime-manifest.md
      - mcp/test/vps-db-parity-contract.test.mjs
      - mcp/test/vps-production-cutover-contract.test.mjs
      - mcp/test/vps-production-cutover-browser-smoke.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-production-cutover-manual.yml
      - .github/workflows/vps-production-cutover-contract-ci.yml
      - .github/workflows/vercel-delivery-production-manual.yml
      - .github/workflows/vercel-retail-production-manual.yml
      - npp-core/api/scripts/vps-production-cutover-958.sh
      - npp-core/api/scripts/vps-production-cutover-preflight-958.sh
      - npp-core/api/scripts/vps-production-cutover-db-958.sh
      - npp-core/api/scripts/vps-production-cutover-runtime-958.sh
      - npp-core/api/scripts/vps-production-cutover-deploy-958.sh
      - npp-core/api/scripts/vps-production-cutover-wiring-958.sh
      - npp-core/api/scripts/vps-db-heroku-parity-gate-958.sh
      - delivery/web/scripts/deploy-production.sh
      - retail/web/scripts/deploy-production.sh
      - docs/operations/vps-production-runtime-manifest.md
      - mcp/test/vps-db-parity-contract.test.mjs
      - mcp/test/vps-production-cutover-contract.test.mjs
      - mcp/test/vps-production-cutover-browser-smoke.test.mjs

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate shell syntax
        run: |
          bash -n npp-core/api/scripts/vps-production-cutover-958.sh
          bash -n npp-core/api/scripts/vps-production-cutover-preflight-958.sh
          bash -n npp-core/api/scripts/vps-production-cutover-db-958.sh
          bash -n npp-core/api/scripts/vps-production-cutover-runtime-958.sh
          bash -n npp-core/api/scripts/vps-production-cutover-deploy-958.sh
          bash -n npp-core/api/scripts/vps-production-cutover-wiring-958.sh
          bash -n npp-core/api/scripts/vps-db-heroku-parity-gate-958.sh
          bash -n delivery/web/scripts/deploy-production.sh
          bash -n retail/web/scripts/deploy-production.sh
      - name: Verify cutover and DB parity contracts
        run: |
          node --test mcp/test/vps-db-parity-contract.test.mjs
          node --test mcp/test/vps-production-cutover-contract.test.mjs
          node --test mcp/test/vps-production-cutover-browser-smoke.test.mjs
      - name: Verify Delivery and Retail regression contracts
        run: |
          node --test delivery/web/test/delivery-production-workflow.test.mjs
          node --test retail/web/test/retail-runtime-contract.test.mjs
