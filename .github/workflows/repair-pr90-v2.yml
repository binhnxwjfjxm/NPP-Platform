name: Temporary PR 90 Repair V2

on:
  push:
    branches:
      - agent/phase-5-4-supplier-return
    paths:
      - .github/workflows/repair-pr90-v2.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-4-supplier-return
          fetch-depth: 0

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:docs/operations/LATEST_HANDOFF.md > docs/operations/LATEST_HANDOFF.md
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          service = Path('npp-core/api/src/services/supplier-return.js')
          text = service.read_text(encoding='utf-8')
          start = text.index('export async function postSupplierReturn')
          prefix, posting = text[:start], text[start:]
          target = '  const validation = await validateLines(client, {\n'
          if posting.count(target) != 1:
              raise SystemExit(f'expected one post validation block, found {posting.count(target)}')
          posting = posting.replace(
              target,
              '  // Revalidate posting after the source receipt rows are locked.\n' + target,
              1,
          )
          service.write_text(prefix + posting, encoding='utf-8', newline='\n')

          workflow = Path('.github/workflows/repair-pr90.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([^']+)' \| base64 --decode", workflow)
          if not match:
              raise SystemExit('embedded repair payload not found')
          Path('/tmp/repair_pr90.py').write_bytes(base64.b64decode(match.group(1)))
          PY
          python3 /tmp/repair_pr90.py
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add npp-core docs
          git commit -m "fix(purchasing): harden supplier return invariants"
          git push origin HEAD:agent/phase-5-4-supplier-return
