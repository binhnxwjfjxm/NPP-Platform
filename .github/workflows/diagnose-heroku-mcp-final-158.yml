name: Diagnose final MCP Heroku rollout 158

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-final-158.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-final-158'
    runs-on: ubuntu-latest
    steps:
      - name: Find completed non-skipped MCP Heroku deploy run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: b7d39d75531330ec9c35deb5e732eadae7145485
          CREATED_AFTER: 2026-08-02T10:14:54Z
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            runs_json="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/heroku-mcp-backend-manual.yml/runs" \
              -f event=issue_comment \
              -f per_page=50)"

            if (( attempt == 1 || attempt % 12 == 0 )); then
              jq -r --arg head "$EXPECTED_HEAD" --arg after "$CREATED_AFTER" '
                .workflow_runs
                | map(select(.head_sha == $head and .created_at >= $after))
                | sort_by(.created_at)
                | reverse
                | .[]
                | "RUN id=\(.id) status=\(.status) conclusion=\(.conclusion // "") created=\(.created_at) title=\(.display_title // "")"
              ' <<<"$runs_json"
            fi

            run_id="$(jq -r --arg head "$EXPECTED_HEAD" --arg after "$CREATED_AFTER" '
              .workflow_runs
              | map(select(
                  .head_sha == $head
                  and .created_at >= $after
                  and .status == "completed"
                  and (.conclusion // "") != "skipped"
                ))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"$runs_json")"

            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done

          test -n "$run_id"
          run_json="$(gh api --method GET -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          echo "TARGET_RUN_ID=$run_id"
          echo "TARGET_STATUS=$(jq -r '.status' <<<"$run_json")"
          echo "TARGET_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$run_json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Print final rollout jobs and steps
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | "JOB id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // "")\n" + ([.steps[] | "  STEP \(.number) \(.name): \(.status)/\(.conclusion // "")"] | join("\n"))'

  provider-health:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-final-158'
    runs-on: ubuntu-latest
    env:
      HEROKU_APP_NAME: hung-phat-mcp
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Audit current Heroku release and health
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"

          app_json="$(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.heroku+json; version=3' \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$HEROKU_APP_NAME"
          )"
          app_name="$(jq -r '.name // empty' <<<"$app_json")"
          app_url="$(jq -r '.web_url // empty' <<<"$app_json")"
          test "$app_name" = "$HEROKU_APP_NAME"
          test -n "$app_url"

          releases_json="$(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.heroku+json; version=3' \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$HEROKU_APP_NAME/releases"
          )"
          release_version="$(jq -r 'sort_by(.version) | reverse | .[0].version // empty' <<<"$releases_json")"
          release_status="$(jq -r 'sort_by(.version) | reverse | .[0].status // empty' <<<"$releases_json")"

          config_json="$(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.heroku+json; version=3' \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$HEROKU_APP_NAME/config-vars"
          )"
          echo "CONFIG_NAMES=$(jq -r 'keys | sort | join(",")' <<<"$config_json")"
          echo "PERSISTENCE_PROVIDER=$(jq -r '.PERSISTENCE_PROVIDER // "missing"' <<<"$config_json")"
          echo "MCP_DB_SCHEMA=$(jq -r '.MCP_DB_SCHEMA // "missing"' <<<"$config_json")"
          echo "MCP_DB_ROLE=$(jq -r '.MCP_DB_ROLE // "missing"' <<<"$config_json")"
          echo "MCP_LEGACY_RUNTIME_ENABLED=$(jq -r '.MCP_LEGACY_RUNTIME_ENABLED // "missing"' <<<"$config_json")"

          live_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output live.json --write-out '%{http_code}' "$app_url/health/live" || true)"
          ready_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output ready.json --write-out '%{http_code}' "$app_url/health/ready" || true)"
          live_code="$(jq -r '.code // .status // empty' live.json 2>/dev/null || true)"
          ready_code="$(jq -r '.code // .persistence.code // .status // empty' ready.json 2>/dev/null || true)"

          echo "APP_NAME=$app_name"
          echo "LATEST_RELEASE_VERSION=${release_version:-missing}"
          echo "LATEST_RELEASE_STATUS=${release_status:-missing}"
          echo "HEALTH_LIVE_HTTP=${live_status:-none}"
          echo "HEALTH_LIVE_CODE=${live_code:-none}"
          echo "HEALTH_READY_HTTP=${ready_status:-none}"
          echo "HEALTH_READY_CODE=${ready_code:-none}"
