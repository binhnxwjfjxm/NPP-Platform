name: VPS production DB migration 143

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  migrate-143:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/migrate-vps-production-143' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y","gustavjung01"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: vps-production-db-migration
      cancel-in-progress: false
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/migrate-vps-production-143'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA and migration contract
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          test -s database/migrations/inventory/143_inventory_adjustment_reconciliation_batch.sql
          grep -q "143_inventory_adjustment_reconciliation_batch" npp-core/api/src/migrations/index.js
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare DB SSH credential
        id: ssh
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_DB_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"

          umask 077
          key="$RUNNER_TEMP/vps-db.key"
          printf '%s\n' "$VPS_DB_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

          known_hosts="$RUNNER_TEMP/vps-db-known-hosts"
          ssh-keyscan -T 10 -H "$VPS_DB_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Copy exact migration SQL to DB VPS
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          scp \
            -i "$SSH_KEY" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            database/migrations/inventory/143_inventory_adjustment_reconciliation_batch.sql \
            "$VPS_SSH_USER@$VPS_DB_HOST:/tmp/npp-143-${SOURCE_SHA}.sql"

      - name: Fresh backup, restore rehearsal, migrate production and verify
        id: migrate
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vps-production-migration-143.txt"

          ssh \
            -i "$SSH_KEY" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_DB_HOST" \
            "bash -s -- '$SOURCE_SHA' '$GITHUB_RUN_ID'" > "$out" <<'REMOTE'
          set -euo pipefail
          source_sha="$1"
          run_id="$2"
          db="npp_production"
          migration_id="143_inventory_adjustment_reconciliation_batch"
          predecessor_id="142_inventory_adjustment_warehouse_location_guard"
          migration_sql="/tmp/npp-143-${source_sha}.sql"
          rehearsal="npp_migration_rehearsal_${run_id}"
          backup_dir="/var/backups/npp/migrations"
          backup_file="${backup_dir}/${source_sha}-${run_id}.dump"

          sudo -n true
          command -v psql >/dev/null
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          command -v createdb >/dev/null
          command -v dropdb >/dev/null
          test -s "$migration_sql"
          chmod 0644 "$migration_sql"

          cleanup() {
            sudo -n -u postgres dropdb --if-exists "$rehearsal" >/dev/null 2>&1 || true
            rm -f "$migration_sql" || true
          }
          trap cleanup EXIT

          scalar() {
            local target="$1"
            local query="$2"
            sudo -n -u postgres psql -XAt -d "$target" -c "$query"
          }

          row_count() {
            scalar "$1" "SELECT 'adjustments='||count(*) FROM inventory.inventory_adjustments UNION ALL SELECT 'adjustment_lines='||count(*) FROM inventory.inventory_adjustment_lines ORDER BY 1"
          }

          verify_target() {
            local target="$1"
            local registry header_column line_columns index_count constraint_count invalid_count
            registry="$(scalar "$target" "SELECT count(*) FROM shared.schema_migrations WHERE id = '${migration_id}'")"
            header_column="$(scalar "$target" "SELECT count(*) FROM information_schema.columns WHERE table_schema='inventory' AND table_name='inventory_adjustments' AND column_name='reconciliation_batch_code'")"
            line_columns="$(scalar "$target" "SELECT count(*) FROM information_schema.columns WHERE table_schema='inventory' AND table_name='inventory_adjustment_lines' AND column_name IN ('product_name_snapshot','source_location_code_snapshot','source_location_name_snapshot','system_base_quantity_snapshot','counted_base_quantity_snapshot')")"
            index_count="$(scalar "$target" "SELECT count(*) FROM pg_indexes WHERE schemaname='inventory' AND indexname='inventory_adjustments_reconciliation_batch_idx'")"
            constraint_count="$(scalar "$target" "SELECT count(*) FROM pg_constraint WHERE conname IN ('inventory_adjustments_reconciliation_batch_code_ck','inventory_adjustment_lines_system_quantity_snapshot_ck','inventory_adjustment_lines_counted_quantity_snapshot_ck')")"
            invalid_count="$(scalar "$target" "SELECT count(*) FROM inventory.inventory_adjustment_lines WHERE system_base_quantity_snapshot < 0 OR counted_base_quantity_snapshot < 0")"
            test "$registry" = 1
            test "$header_column" = 1
            test "$line_columns" = 5
            test "$index_count" = 1
            test "$constraint_count" = 3
            test "$invalid_count" = 0
          }

          apply_exact_migration() {
            local target="$1"
            sudo -n -u postgres psql -X -v ON_ERROR_STOP=1 -d "$target" >/dev/null <<SQL
          BEGIN;
          SET LOCAL lock_timeout = '5s';
          SET LOCAL statement_timeout = '10min';
          \i '$migration_sql'
          INSERT INTO shared.schema_migrations (id)
          VALUES ('$migration_id')
          ON CONFLICT (id) DO NOTHING;
          COMMIT;
          SQL
          }

          db_exists="$(scalar postgres "SELECT count(*) FROM pg_database WHERE datname = '${db}'")"
          test "$db_exists" = 1
          predecessor="$(scalar "$db" "SELECT count(*) FROM shared.schema_migrations WHERE id = '${predecessor_id}'")"
          test "$predecessor" = 1

          already="$(scalar "$db" "SELECT count(*) FROM shared.schema_migrations WHERE id = '${migration_id}'")"
          if [ "$already" = 1 ]; then
            verify_target "$db"
            echo "MIGRATION_ID=$migration_id"
            echo "SOURCE_SHA=$source_sha"
            echo "PRODUCTION_MIGRATION=ALREADY_APPLIED"
            echo "PRODUCTION_VERIFY=PASS"
            exit 0
          fi

          db_bytes="$(scalar postgres "SELECT pg_database_size('${db}')")"
          free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          free_bytes=$((free_kb * 1024))
          required_bytes=$((db_bytes * 2))
          test "$db_bytes" -gt 0
          test "$free_bytes" -gt "$required_bytes"

          sudo -n install -d -o postgres -g postgres -m 0700 "$backup_dir"
          sudo -n -u postgres pg_dump -Fc -d "$db" -f "$backup_file"
          backup_bytes="$(sudo -n stat -c '%s' "$backup_file")"
          test "$backup_bytes" -gt 0

          sudo -n -u postgres dropdb --if-exists "$rehearsal"
          sudo -n -u postgres createdb --template=template0 "$rehearsal"
          sudo -n -u postgres pg_restore --exit-on-error --no-owner --no-privileges --dbname="$rehearsal" "$backup_file"

          rehearsal_rows_before="$(row_count "$rehearsal")"
          apply_exact_migration "$rehearsal"
          verify_target "$rehearsal"
          test "$(row_count "$rehearsal")" = "$rehearsal_rows_before"
          sudo -n -u postgres dropdb "$rehearsal"

          production_rows_before="$(row_count "$db")"
          apply_exact_migration "$db"
          verify_target "$db"
          production_rows_after="$(row_count "$db")"
          test "$production_rows_after" = "$production_rows_before"

          apply_exact_migration "$db"
          verify_target "$db"
          test "$(row_count "$db")" = "$production_rows_after"

          echo "MIGRATION_ID=$migration_id"
          echo "SOURCE_SHA=$source_sha"
          echo "BACKUP_BYTES=$backup_bytes"
          echo "BACKUP_LOCATION=DB_VPS_LOCAL"
          echo "RESTORE_REHEARSAL=PASS"
          echo "ADJUSTMENT_ROWS_UNCHANGED=PASS"
          echo "PRODUCTION_MIGRATION=APPLIED"
          echo "PRODUCTION_RERUN_NOOP=PASS"
          echo "PRODUCTION_VERIFY=PASS"
          REMOTE

          cat "$out"
          echo "report=$out" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized migration evidence to Issue 958
        if: always() && steps.migrate.outputs.report != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ steps.migrate.outputs.report }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/migration-evidence.md"
          {
            echo "## VPS production migration 143"
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Exact main SHA: \`$SOURCE_SHA\`"
            echo '- Command: `/migrate-vps-production-143`'
            echo "- Operation status: \`${{ job.status }}\`"
            echo "- Secret values and database URLs are not included."
            echo
            echo '```text'
            cat "$REPORT_FILE"
            echo '```'
          } > "$evidence"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/958/comments" \
            -f body="$(cat "$evidence")" >/dev/null
