name: Core Foundation

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "Procfile"
      - "npp-core/**"
      - "packages/**"
      - "database/**"
      - "docs/operations/migration-rehearsal.md"
      - ".github/workflows/core-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "Procfile"
      - "npp-core/**"
      - "packages/**"
      - "database/**"
      - "docs/operations/migration-rehearsal.md"
      - ".github/workflows/core-foundation.yml"

permissions:
  contents: read

jobs:
  verify-core-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npp-core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_npp_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspaces
        run: npm --prefix .. ci

      - name: Verify shared packages
        run: npm --prefix .. run verify:packages

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_npp_core
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_npp_core
          NODE_ENV: test
        run: npm --prefix ./api run migration:migrate

      - name: Verify Core API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_npp_core
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_npp_core
          NODE_ENV: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm --prefix .. run verify:core-api 2>&1 | tee artifacts/core-api-verify.log

      - name: Upload Core API verification log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-verification-log-${{ github.run_id }}
          path: npp-core/artifacts/core-api-verify.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify Core web
        run: npm --prefix .. run verify:core-web

      - name: Verify Heroku Core process contract
        working-directory: .
        run: |
          test "$(cat Procfile)" = "web: npm run start:core-api"
          node --test mcp/test/heroku-root-contract.test.mjs

  verify-migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-core-foundation
    defaults:
      run:
        working-directory: npp-core
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehearsal_npp_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspaces
        run: npm --prefix .. ci

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migration rehearsal
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal_npp_core
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal_npp_core
          NODE_ENV: test
          MIGRATION_REHEARSAL_CONFIRM: temporary-database
        run: npm --prefix ./api run migration:rehearse

      - name: Upload migration rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-rehearsal-report
          path: npp-core/artifacts/migration-rehearsal-report.json
          if-no-files-found: error
          retention-days: 14
