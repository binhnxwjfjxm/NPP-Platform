name: Final Delivery domain and production smoke

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write

concurrency:
  group: final-delivery-domain-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.head_ref == 'agent/production-rollout-admin-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPROVED_RUNTIME_BASE: 5b4a5680ab5368be360c799b9ac22527fcf7f862
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      DELIVERY_PROJECT_ID: prj_aqsb62CiXpN1a1u3vU9P8SOKw2Ux
      DELIVERY_PROJECT_NAME: npp-delivery
      DELIVERY_DOMAIN: log.nguyenlieuhungphat.com
      DELIVERY_ALIAS: https://npp-delivery.vercel.app
      CORE_HEROKU_APP_NAME: hung-phat
      NPP_URL: https://office.nguyenlieuhungphat.com
      ADMIN_URL: https://admin.nguyenlieuhungphat.com

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main and unchanged runtime tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          runtime_diff="$(git diff --name-only "$APPROVED_RUNTIME_BASE"..HEAD -- npp-core delivery admin mcp packages package.json package-lock.json)"
          if [ -n "$runtime_diff" ]; then
            printf '%s\n' "$runtime_diff" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve protected Core runtime and smoke credentials
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          SECRET_CORE_WEB_ADMIN_USERNAME: ${{ secrets.CORE_WEB_ADMIN_USERNAME }}
          SECRET_CORE_WEB_ADMIN_PASSWORD: ${{ secrets.CORE_WEB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          app_json="${RUNNER_TEMP}/core-app.json"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_HEROKU_APP_NAME" > "$app_json"
          core_url="$(jq -r '.web_url // empty' "$app_json")"
          core_url="${core_url%/}"
          admin_username="${SECRET_CORE_WEB_ADMIN_USERNAME:-}"
          admin_password="${SECRET_CORE_WEB_ADMIN_PASSWORD:-}"
          test -n "$core_url"
          test -n "$admin_username"
          test -n "$admin_password"
          for value in "$core_url" "$admin_username" "$admin_password"; do
            echo "::add-mask::$value"
          done
          marker="CFG_${RANDOM}_${RANDOM}"
          {
            echo "CORE_API_INTERNAL_URL<<$marker"
            echo "$core_url"
            echo "$marker"
          } >> "$GITHUB_ENV"
          marker="CFG_${RANDOM}_${RANDOM}"
          {
            echo "SMOKE_USERNAME<<$marker"
            echo "$admin_username"
            echo "$marker"
          } >> "$GITHUB_ENV"
          marker="CFG_${RANDOM}_${RANDOM}"
          {
            echo "SMOKE_PASSWORD<<$marker"
            echo "$admin_password"
            echo "$marker"
          } >> "$GITHUB_ENV"

      - name: Verify fifth Vercel project and READY production deployment
        id: delivery
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project_json="${RUNNER_TEMP}/delivery-project.json"
          deployments_json="${RUNNER_TEMP}/delivery-deployments.json"
          domain_json="${RUNNER_TEMP}/delivery-domain.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$DELIVERY_PROJECT_ID?teamId=$VERCEL_ORG_ID" > "$project_json"
          test "$(jq -r '.id // empty' "$project_json")" = "$DELIVERY_PROJECT_ID"
          test "$(jq -r '.name // empty' "$project_json")" = "$DELIVERY_PROJECT_NAME"
          test "$(jq -r '.rootDirectory // empty' "$project_json")" = "delivery/web"
          test "$(jq -r '.framework // empty' "$project_json")" = nextjs
          test "$(jq -r '.git.deploymentEnabled // false' delivery/web/vercel.json)" = false

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$DELIVERY_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1" > "$deployments_json"
          deployment_id="$(jq -r '.deployments[0].uid // .deployments[0].id // empty' "$deployments_json")"
          deployment_url="$(jq -r '.deployments[0].url // empty' "$deployments_json")"
          deployment_state="$(jq -r '.deployments[0].state // empty' "$deployments_json")"
          test -n "$deployment_id"
          test -n "$deployment_url"
          test "$deployment_state" = READY

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$DELIVERY_PROJECT_ID/domains/$DELIVERY_DOMAIN?teamId=$VERCEL_ORG_ID" > "$domain_json"
          test "$(jq -r '.name // empty' "$domain_json")" = "$DELIVERY_DOMAIN"

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke READY Vercel alias
        shell: bash
        run: |
          set -euo pipefail
          auth="${SMOKE_USERNAME}:${SMOKE_PASSWORD}"
          echo "::add-mask::$auth"
          unauth="$(curl --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$DELIVERY_ALIAS/")"
          test "$unauth" = 401
          html="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 5 --max-time 20 -u "$auth" "$DELIVERY_ALIAS/")"
          grep -q 'Chuyến của tôi' <<<"$html"
          grep -qv 'Không tải được chuyến' <<<"$html"

      - name: Wait for custom-domain TLS and authenticated Delivery response
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          auth="${SMOKE_USERNAME}:${SMOKE_PASSWORD}"
          echo "::add-mask::$auth"
          ready=false
          last_status="none"
          last_error=""
          html_file="${RUNNER_TEMP}/delivery-domain.html"
          error_file="${RUNNER_TEMP}/delivery-domain-error.txt"

          for attempt in $(seq 1 90); do
            : > "$error_file"
            last_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://$DELIVERY_DOMAIN/" 2>"$error_file" || true)"
            if [ "$last_status" = 401 ]; then
              auth_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
                -u "$auth" --output "$html_file" --write-out '%{http_code}' \
                "https://$DELIVERY_DOMAIN/" 2>"$error_file" || true)"
              if [ "$auth_status" = 200 ] \
                 && grep -q 'Chuyến của tôi' "$html_file" \
                 && ! grep -q 'Không tải được chuyến' "$html_file"; then
                ready=true
                break
              fi
              last_status="auth:$auth_status"
            fi
            sleep 10
          done

          if [ "$ready" != true ]; then
            last_error="$(tr '\n' ' ' < "$error_file" | cut -c1-500)"
            echo "Delivery custom domain not ready; last_status=$last_status error=$last_error" >&2
            echo "DNS A records: $(dig +short A "$DELIVERY_DOMAIN" | tr '\n' ' ')" >&2
            echo "DNS CNAME: $(dig +short CNAME "$DELIVERY_DOMAIN" | tr '\n' ' ')" >&2
            exit 1
          fi

          css="$(grep -oE '/_next/static/[^" ]+\.css' "$html_file" | head -n 1)"
          js="$(grep -oE '/_next/static/[^" ]+\.js' "$html_file" | head -n 1)"
          test -n "$css"
          test -n "$js"
          curl --fail --silent --show-error "https://$DELIVERY_DOMAIN$css" >/dev/null
          curl --fail --silent --show-error "https://$DELIVERY_DOMAIN$js" >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Smoke Core, NPP Operations and Admin production
        id: related
        shell: bash
        run: |
          set -euo pipefail
          auth="${SMOKE_USERNAME}:${SMOKE_PASSWORD}"
          echo "::add-mask::$auth"
          for path in /health/live /health/ready; do
            status="$(curl --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$CORE_API_INTERNAL_URL$path")"
            test "$status" = 200
          done
          for path in /dashboard /logistics/trips /logistics/dispatch; do
            status="$(curl --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 5 --max-time 20 -u "$auth" --output /dev/null --write-out '%{http_code}' "$NPP_URL$path")"
            test "$status" = 200
          done
          for path in / /customer-onboarding; do
            status="$(curl --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 5 --max-time 20 -u "$auth" --output /dev/null --write-out '%{http_code}' "$ADMIN_URL$path")"
            test "$status" = 200
          done

      - name: Publish completed rollout evidence
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(cat <<EOT
          ## Phase 6D/6E production rollout — completed

          - SOURCE_SHA: ${{ steps.source.outputs.sha }}
          - DATABASE_MIGRATIONS_042_048: applied and verified
          - CORE_BACKEND: deployed; live/ready smoke passed
          - NPP_OPERATIONS: deployed; dashboard/logistics smoke passed
          - ADMIN_MCP_NPP: deployed READY; authenticated smoke passed
          - DELIVERY_PROJECT_NAME: ${DELIVERY_PROJECT_NAME}
          - DELIVERY_PROJECT_ID: ${DELIVERY_PROJECT_ID}
          - DELIVERY_DEPLOYMENT_ID: ${{ steps.delivery.outputs.deployment_id }}
          - DELIVERY_DEPLOYMENT_URL: ${{ steps.delivery.outputs.deployment_url }}
          - DELIVERY_ALIAS: ${DELIVERY_ALIAS}
          - DELIVERY_DOMAIN: https://${DELIVERY_DOMAIN}
          - DELIVERY_DOMAIN_READY: ${{ steps.domain.outputs.ready }}
          - DELIVERY_AUTHENTICATED_SMOKE: passed
          - DELIVERY_STATIC_ASSETS: passed
          - AUTO_DEPLOY: OFF
          - MCP_FIELD_AND_BACKEND: not redeployed; no related runtime diff
          - WEBSITE: not redeployed; separate repository and no related runtime diff
          - FINAL_SMOKE: success
          - GITHUB_RUN_ID: ${GITHUB_RUN_ID}
          EOT
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/248/comments" -f body="$body" >/dev/null
          gh issue close 248 --reason completed >/dev/null

      - name: Publish sanitized domain-smoke failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/248/comments" \
            -f body="## Final Delivery domain smoke — failure\n\n- SOURCE_SHA: ${{ steps.source.outputs.sha }}\n- DELIVERY_DEPLOYMENT: ${{ steps.delivery.outcome }}\n- DELIVERY_DOMAIN: ${{ steps.domain.outcome }}\n- RELATED_RUNTIME_SMOKE: ${{ steps.related.outcome }}\n- GITHUB_RUN_ID: ${GITHUB_RUN_ID}" >/dev/null
