name: VPS DB firewall normalization

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-db-firewall-normalization-958
  cancel-in-progress: false

jobs:
  normalize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/normalize-vps-db-firewall-958' &&
        (
          github.actor == 'binhnxwjfjxm' ||
          github.actor == 'khuongbinhinfo-a11y'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/normalize-vps-db-firewall-958'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = false
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "REPORT_FILE=$RUNNER_TEMP/vps-db-firewall-normalize-958.md" >> "$GITHUB_ENV"

      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_DB_HOST"
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_MCP_SSH_KEY"
          umask 077
          prepare_key() {
            local raw="$1" host="$2" slug="$3"
            printf '%s\n' "$raw" > "$RUNNER_TEMP/vps-${slug}.key"
            chmod 600 "$RUNNER_TEMP/vps-${slug}.key"
            ssh-keygen -y -f "$RUNNER_TEMP/vps-${slug}.key" >/dev/null
            ssh-keyscan -T 10 -H "$host" > "$RUNNER_TEMP/vps-${slug}-known-hosts" 2>/dev/null
            test -s "$RUNNER_TEMP/vps-${slug}-known-hosts"
          }
          prepare_key "$VPS_DB_SSH_KEY" "$VPS_DB_HOST" db
          prepare_key "$VPS_COMPANY_SSH_KEY" "$VPS_COMPANY_HOST" company
          prepare_key "$VPS_MCP_SSH_KEY" "$VPS_MCP_HOST" mcp

      - name: Resolve exact DB and Công Ty private addresses
        id: network
        shell: bash
        run: |
          set -euo pipefail
          private_ip() {
            local slug="$1" host="$2"
            ssh -i "$RUNNER_TEMP/vps-${slug}.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/vps-${slug}-known-hosts" \
              "$VPS_SSH_USER@$host" \
              "ip -4 route get 1.1.1.1 | awk 'NR==1 {for(i=1;i<=NF;i++) if(\$i==\"src\") {print \$(i+1); exit}}'"
          }
          db_private_ip="$(private_ip db "$VPS_DB_HOST")"
          company_private_ip="$(private_ip company "$VPS_COMPANY_HOST")"
          python3 - "$db_private_ip" "$company_private_ip" "$VPS_MCP_HOST" <<'PY'
          import ipaddress, sys
          db = ipaddress.IPv4Address(sys.argv[1])
          company = ipaddress.IPv4Address(sys.argv[2])
          mcp_public = ipaddress.IPv4Address(sys.argv[3])
          if not db.is_private or not company.is_private:
              raise SystemExit('db_or_company_private_ip_invalid')
          if company not in ipaddress.ip_network(f'{db}/24', strict=False):
              raise SystemExit('company_and_db_not_same_private_subnet')
          if mcp_public.is_private:
              raise SystemExit('mcp_public_ip_is_private')
          PY
          echo "db_private_ip=$db_private_ip" >> "$GITHUB_OUTPUT"
          echo "company_private_ip=$company_private_ip" >> "$GITHUB_OUTPUT"

      - name: Normalize DB host firewall authority to UFW
        shell: bash
        env:
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
          COMPANY_PRIVATE_IP: ${{ steps.network.outputs.company_private_ip }}
        run: |
          set -euo pipefail
          : > "$REPORT_FILE"
          ssh -i "$RUNNER_TEMP/vps-db.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-db-known-hosts" \
            "$VPS_SSH_USER@$VPS_DB_HOST" \
            "bash -s -- '$DB_PRIVATE_IP' '$COMPANY_PRIVATE_IP' '$VPS_MCP_HOST'" >> "$REPORT_FILE" <<'REMOTE'
          set -euo pipefail
          db_private_ip="$1"
          company_private_ip="$2"
          mcp_public_ip="$3"
          sudo -n true

          test "$(sudo -n ufw status | head -n1)" = 'Status: active'
          sudo -n ufw status | grep -F "$company_private_ip" | grep -Fq '5432'
          sudo -n ufw status | grep -F "$mcp_public_ip" | grep -Fq '5432'
          if sudo -n ufw status | grep -Eq '^5432(/tcp)?[[:space:]]+ALLOW([[:space:]]+IN)?[[:space:]]+Anywhere'; then
            echo broad_public_5432_rule_detected >&2
            exit 31
          fi
          test "$(systemctl is-active postgresql)" = active
          ss -lntH | awk -v ip="$db_private_ip" '$4 == ip ":5432" {found=1} END {exit found?0:1}'

          legacy_rule='-A INPUT -j REJECT --reject-with icmp-host-prohibited'
          before_count="$(sudo -n iptables -S INPUT | grep -Fxc -- "$legacy_rule" || true)"
          test "$before_count" -ge 1

          sudo -n tee /usr/local/sbin/npp-db-firewall-normalize-958 >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$(ufw status | head -n1)" = 'Status: active'
          while iptables -C INPUT -j REJECT --reject-with icmp-host-prohibited 2>/dev/null; do
            iptables -D INPUT -j REJECT --reject-with icmp-host-prohibited
          done
          SCRIPT
          sudo -n chmod 0755 /usr/local/sbin/npp-db-firewall-normalize-958

          sudo -n tee /etc/systemd/system/npp-db-firewall-normalize-958.service >/dev/null <<'UNIT'
          [Unit]
          Description=NPP DB firewall normalization for Issue 958
          Wants=network-online.target
          After=network-online.target ufw.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/npp-db-firewall-normalize-958
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo -n systemctl daemon-reload
          sudo -n systemctl enable npp-db-firewall-normalize-958.service >/dev/null
          sudo -n systemctl restart npp-db-firewall-normalize-958.service
          test "$(systemctl is-active npp-db-firewall-normalize-958.service)" = active
          test "$(systemctl is-enabled npp-db-firewall-normalize-958.service)" = enabled

          after_count="$(sudo -n iptables -S INPUT | grep -Fxc -- "$legacy_rule" || true)"
          test "$after_count" = 0
          sudo -n iptables -S INPUT | grep -q -- '-A INPUT -j ufw-before-input'
          test "$(sudo -n ufw status | head -n1)" = 'Status: active'
          sudo -n ufw status | grep -F "$company_private_ip" | grep -Fq '5432'
          sudo -n ufw status | grep -F "$mcp_public_ip" | grep -Fq '5432'

          echo "legacy_reject_before=$before_count"
          echo "legacy_reject_after=$after_count"
          echo 'host_firewall_authority=ufw'
          echo 'ufw_default_incoming=deny'
          echo 'db_5432_sources=company_private,mcp_public_allowlist'
          echo 'normalization_service=active_enabled'
          REMOTE

      - name: Verify Công Ty and MCP DB paths plus proxy preservation
        shell: bash
        env:
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vps-company.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-company-known-hosts" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" \
            "timeout 6 bash -c 'cat < /dev/null > /dev/tcp/$DB_PRIVATE_IP/5432'"
          echo 'company_to_db_private_5432=PASS' >> "$REPORT_FILE"

          ssh -i "$RUNNER_TEMP/vps-mcp.key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-mcp-known-hosts" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" "bash -s -- '$VPS_DB_HOST'" >> "$REPORT_FILE" <<'REMOTE'
          set -euo pipefail
          db_public="$1"
          for svc in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
            test "$(systemctl is-active "$svc")" = active
            test "$(systemctl is-enabled "$svc")" = enabled
          done
          test "$(ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}')" = 300
          ss -lntH | awk '{n=split($4,a,":"); if (a[n]+0==3000) found=1} END {exit found?0:1}'
          timeout 6 bash -c "cat < /dev/null > /dev/tcp/$db_public/5432"
          echo 'mcp_to_db_public_5432=PASS'
          echo 'proxy_services=active_enabled_untouched'
          echo 'proxy_listener_count=300'
          echo 'tcp_3000_listener=preserved'
          REMOTE

      - name: Verify unrelated public runner remains blocked
        shell: bash
        run: |
          set -euo pipefail
          if timeout 4 bash -c "cat < /dev/null > /dev/tcp/$VPS_DB_HOST/5432" 2>/dev/null; then
            echo unrelated_runner_reached_db_5432 >&2
            exit 41
          fi
          {
            echo 'unrelated_public_5432=blocked'
            echo 'production_traffic=not_enabled'
            echo 'cutover=not_performed'
          } >> "$REPORT_FILE"

      - name: Publish sanitized evidence to Issue 958
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -s "$REPORT_FILE"
          evidence="$(mktemp)"
          {
            echo '## VPS DB firewall normalization — Issue #958'
            echo
            echo "- Source main SHA: \`$SOURCE_SHA\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo '- Scope: remove only the conflicting generic legacy INPUT REJECT so UFW becomes the DB host firewall authority; no deploy and no cutover.'
            echo '```text'
            cat "$REPORT_FILE"
            echo '```'
          } > "$evidence"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/958/comments" -f body="$(cat "$evidence")" >/dev/null
          rm -f "$evidence"
