      - name: Upload encrypted audit result
        uses: actions/upload-artifact@v4
        with:
          name: inventory-duplicate-scope-audit-encrypted
          path: ${{ runner.temp }}/inventory-duplicate-scope-audit.csv.cms
          retention-days: 1
          if-no-files-found: error
