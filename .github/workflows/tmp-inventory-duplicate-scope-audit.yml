name: Temporary inventory duplicate-scope read-only audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tmp-inventory-duplicate-scope-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/audit-inventory-duplicate-scopes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEROKU_APP_NAME: hung-phat
    steps:
      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh >/dev/null

      - name: Run production read-only inventory query
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          raw="$RUNNER_TEMP/inventory-duplicate-scope-audit.csv"
          sql=$(cat <<'SQL'
          COPY (
            WITH grouped AS (
              SELECT balance.installation_id,
                     balance.warehouse_id,
                     balance.base_variant_id,
                     bool_or(balance.location_id IS NULL) AS has_unassigned_scope,
                     bool_or(balance.location_id IS NOT NULL) AS has_assigned_scope,
                     count(*) FILTER (WHERE balance.location_id IS NOT NULL) AS assigned_scope_rows,
                     sum(CASE WHEN balance.location_id IS NULL THEN balance.on_hand_quantity ELSE 0 END)::numeric(30,12) AS unassigned_on_hand,
                     sum(CASE WHEN balance.location_id IS NOT NULL THEN balance.on_hand_quantity ELSE 0 END)::numeric(30,12) AS assigned_on_hand
                FROM inventory.inventory_balances balance
               GROUP BY balance.installation_id, balance.warehouse_id, balance.base_variant_id
            )
            SELECT warehouse.code AS "Kho",
                   warehouse.name AS "Tên kho",
                   base.sku AS "SKU tồn",
                   product.name AS "Sản phẩm",
                   COALESCE(base_unit.name, base_unit.code, '') AS "Đơn vị tồn",
                   grouped.unassigned_on_hand AS "Tồn Không vị trí",
                   grouped.assigned_on_hand AS "Tồn ở vị trí thật",
                   (grouped.unassigned_on_hand + grouped.assigned_on_hand)::numeric(30,12) AS "Tổng tồn",
                   grouped.assigned_scope_rows AS "Số phạm vi vị trí thật",
                   CASE
                     WHEN grouped.assigned_on_hand > 0 THEN 'ĐANG CÓ TỒN Ở CẢ HAI PHẠM VI'
                     ELSE 'CÒN TỒN KHÔNG VỊ TRÍ, VỊ TRÍ THẬT ĐANG 0'
                   END AS "Phân loại"
              FROM grouped
              JOIN shared.warehouses warehouse
                ON warehouse.installation_id = grouped.installation_id
               AND warehouse.id = grouped.warehouse_id
              JOIN shared.product_variants base
                ON base.installation_id = grouped.installation_id
               AND base.id = grouped.base_variant_id
              JOIN shared.products product
                ON product.installation_id = base.installation_id
               AND product.id = base.product_id
              LEFT JOIN shared.units_of_measure base_unit
                ON base_unit.installation_id = base.installation_id
               AND base_unit.id = base.unit_id
             WHERE grouped.has_unassigned_scope = true
               AND grouped.has_assigned_scope = true
               AND grouped.unassigned_on_hand > 0
             ORDER BY warehouse.code, product.name, base.sku
          ) TO STDOUT WITH CSV HEADER;
          SQL
          )
          heroku pg:psql --app "$HEROKU_APP_NAME" --command "$sql" > "$raw"
          test -s "$raw"

      - name: Encrypt audit result before upload
        shell: bash
        run: |
          set -euo pipefail
