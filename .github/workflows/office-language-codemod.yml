name: Office language codemod

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/office-language-codemod.mjs
      - .github/workflows/office-language-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/office-language-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/office-language-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align one-time codemod with current user workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/office-language-codemod.mjs')
          source = path.read_text()
          source = source.replace(
              "[\"user.is_active ? 'Vô hiệu' : 'Kích hoạt'\", \"user.is_active ? 'Ngừng sử dụng' : 'Đưa vào sử dụng'\"],",
              "[\"user.is_active ? 'Vô hiệu hóa' : 'Kích hoạt'\", \"user.is_active ? 'Ngừng sử dụng' : 'Đưa vào sử dụng'\"],",
          )
          source = source.replace(
              "[\"toggleState.nextActive ? 'Kích hoạt' : 'Vô hiệu'\", \"toggleState.nextActive ? 'Đưa vào sử dụng' : 'Ngừng sử dụng'\"],",
              "['Tạo tài khoản nội bộ với tập vai trò trống.', 'Tạo tài khoản và hoàn thiện phân quyền sau khi lưu.'],\n  ['Chỉ trạng thái và tập vai trò có thể thay đổi.', 'Cập nhật trạng thái và vai trò được giao.'],\n  ['Kích hoạt lại người dùng này? Nhân sự liên kết phải đang hoạt động.', 'Đưa người dùng này vào sử dụng? Nhân sự liên kết phải đang hoạt động.'],\n  ['Vô hiệu hóa người dùng này? Các vai trò được giữ nguyên để phục vụ audit và có thể dùng lại khi kích hoạt.', 'Ngừng sử dụng người dùng này? Các vai trò được giữ nguyên để có thể dùng lại khi cần.'],",
          )
          path.write_text(source)
          PY
      - name: Apply verified office-language replacements
        run: node scripts/office-language-codemod.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/web
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor(ui): apply office language audit"
          git push origin HEAD:agent/office-language-cleanup
