name: Office language codemod

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/office-language-inventory-codemod.mjs
      - .github/workflows/office-language-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/office-language-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/office-language-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply verified inventory language replacements
        run: node scripts/office-language-inventory-codemod.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/web
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor(ui): apply inventory office language"
          git push origin HEAD:agent/office-language-cleanup
