name: issue-638-resend-apply-pr6

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-638-resend-email-provider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply direct Resend migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_once(path, old, new):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def regex_once(path, pattern, replacement):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement count={count}')
              p.write_text(updated, encoding='utf-8')

          helper = '''import { createIdempotencyKey } from '@npp/contracts';

          const RESEND_EMAIL_ENDPOINT = 'https://api.resend.com/emails';
          const DEFAULT_RESEND_EMAIL_TIMEOUT_MS = 5_000;
          const EMAIL_PATTERN = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

          function text(value) { return String(value ?? '').trim(); }

          function boundedTimeout(value) {
            const parsed = Number.parseInt(text(value), 10);
            return Number.isInteger(parsed) && parsed >= 1000 && parsed <= 30_000 ? parsed : DEFAULT_RESEND_EMAIL_TIMEOUT_MS;
          }

          export function loadResendEmailRuntime({ env = process.env } = {}) {
            return Object.freeze({
              apiKey: text(env.RESEND_API_KEY),
              from: text(env.INTERNAL_AUTH_EMAIL_FROM),
              timeoutMs: boundedTimeout(env.RESEND_EMAIL_TIMEOUT_MS),
            });
          }

          export function resendEmailRuntimeReady(runtime, fetchImpl = globalThis.fetch) {
            return Boolean(runtime?.apiKey && EMAIL_PATTERN.test(runtime?.from ?? '') && typeof fetchImpl === 'function');
          }

          export async function sendResendEmail(fetchImpl, runtime, { to, subject, text: textBody, html, operation, entityId }) {
            if (!resendEmailRuntimeReady(runtime, fetchImpl)) throw new Error('RESEND_EMAIL_UNAVAILABLE');
            if (!Array.isArray(to) || to.length === 0 || to.some((value) => !EMAIL_PATTERN.test(text(value)))) {
              throw new Error('RESEND_EMAIL_RECIPIENT_INVALID');
            }
            if (!text(operation) || !text(entityId)) throw new Error('RESEND_EMAIL_IDEMPOTENCY_CONTEXT_INVALID');
            const idempotencyKey = createIdempotencyKey(operation, entityId);
            const response = await fetchImpl(RESEND_EMAIL_ENDPOINT, {
              method: 'POST',
              signal: AbortSignal.timeout(runtime.timeoutMs),
              headers: {
                Authorization: `Bearer ${runtime.apiKey}`,
                'Content-Type': 'application/json',
                'Idempotency-Key': idempotencyKey,
              },
              body: JSON.stringify({ from: runtime.from, to, subject, text: textBody, html }),
            });
            const payload = await response.json().catch(() => null);
            if (!response?.ok || !payload?.id) throw new Error('RESEND_EMAIL_SEND_FAILED');
            return Object.freeze({ id: String(payload.id), idempotencyKey });
          }
          '''
          p = ROOT / 'npp-core/api/src/email/resend.js'
          p.parent.mkdir(parents=True, exist_ok=True)
          if p.exists(): raise SystemExit('resend.js already exists')
          p.write_text(helper, encoding='utf-8')

          replace_once('npp-core/api/src/internal-workforce-auth.js', "import { promisify } from 'node:util';\n", "import { promisify } from 'node:util';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from './email/resend.js';\n")
          replace_once('npp-core/api/src/internal-workforce-auth.js', "    accountId: text(env.CLOUDFLARE_ACCOUNT_ID),\n    apiToken: text(env.CLOUDFLARE_EMAIL_API_TOKEN),\n    from: text(env.INTERNAL_AUTH_EMAIL_FROM),\n", "    ...loadResendEmailRuntime({ env }),\n")
          replace_once('npp-core/api/src/internal-workforce-auth.js', """  return Boolean(\n    runtime.accountId\n    && runtime.apiToken\n    && EMAIL_PATTERN.test(runtime.from)\n    && runtime.pepper.length >= 32\n    && normalizeChallengeRecipient(recipientEmail)\n    && typeof fetchImpl === 'function'\n  );\n""", """  return Boolean(\n    resendEmailRuntimeReady(runtime, fetchImpl)\n    && runtime.pepper.length >= 32\n    && normalizeChallengeRecipient(recipientEmail)\n  );\n""")
          regex_once('npp-core/api/src/internal-workforce-auth.js', r"async function sendLoginChallengeEmail[\s\S]*?(?=\nexport function internalWebChallengeRequired)", """async function sendLoginChallengeEmail(fetchImpl, runtime, { recipientEmail, code, sourceApp, challengeId }) {\n  const subject = 'Mã xác nhận đăng nhập hệ thống Hưng Phát';\n  const textBody = `Có yêu cầu đăng nhập Web/PWA vào hệ thống Hưng Phát (${sourceApp}). Mã xác nhận: ${code}. Mã hết hạn sau ${Math.ceil(runtime.ttlSeconds / 60)} phút. Mã này chỉ dùng cho đăng nhập hệ thống Hưng Phát, không dùng cho ngân hàng, thanh toán hoặc giao dịch tài chính. Nếu không phải yêu cầu của bạn, không cung cấp mã này.`;\n  const htmlBody = `<p>Có yêu cầu đăng nhập Web/PWA vào hệ thống Hưng Phát (${sourceApp}).</p><p>Mã xác nhận: <strong>${code}</strong></p><p>Mã hết hạn sau ${Math.ceil(runtime.ttlSeconds / 60)} phút.</p><p>Mã này chỉ dùng cho đăng nhập hệ thống Hưng Phát, không dùng cho ngân hàng, thanh toán hoặc giao dịch tài chính.</p><p>Nếu không phải yêu cầu của bạn, không cung cấp mã này.</p>`;\n  const recipient = normalizeChallengeRecipient(recipientEmail);\n  if (!recipient) throw new Error('INTERNAL_AUTH_EMAIL_SEND_FAILED');\n  try {\n    await sendResendEmail(fetchImpl, runtime, {\n      to: [recipient],\n      subject,\n      text: textBody,\n      html: htmlBody,\n      operation: 'login-challenge-email',\n      entityId: challengeId,\n    });\n  } catch {\n    throw new Error('INTERNAL_AUTH_EMAIL_SEND_FAILED');\n  }\n}\n\nexport function internalWebChallengeRequired""")
          replace_once('npp-core/api/src/internal-workforce-auth.js', "          sourceApp: transactionResult.challengeDelivery.sourceApp,\n", "          sourceApp: transactionResult.challengeDelivery.sourceApp,\n          challengeId: transactionResult.challengeDelivery.challengeId,\n")

          replace_once('npp-core/api/src/backup/technical-access.js', "import { createHmac, randomBytes, randomInt, timingSafeEqual } from 'node:crypto';\n", "import { createHmac, randomBytes, randomInt, timingSafeEqual } from 'node:crypto';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from '../email/resend.js';\n")
          replace_once('npp-core/api/src/backup/technical-access.js', "    accountId: text(env.CLOUDFLARE_ACCOUNT_ID),\n    apiToken: text(env.CLOUDFLARE_EMAIL_API_TOKEN),\n    from: text(env.INTERNAL_AUTH_EMAIL_FROM),\n", "    ...loadResendEmailRuntime({ env }),\n")
          replace_once('npp-core/api/src/backup/technical-access.js', """  return Boolean(\n    runtime?.accountId\n    && runtime?.apiToken\n    && EMAIL_PATTERN.test(runtime?.from ?? '')\n    && runtime?.pepper?.length >= 32\n    && runtime?.recipient === TECHNICAL_BACKUP_RECIPIENT\n    && typeof fetchImpl === 'function'\n  );\n""", """  return Boolean(\n    resendEmailRuntimeReady(runtime, fetchImpl)\n    && runtime?.pepper?.length >= 32\n    && runtime?.recipient === TECHNICAL_BACKUP_RECIPIENT\n  );\n""")
          regex_once('npp-core/api/src/backup/technical-access.js', r"export async function sendTechnicalBackupAccessEmail[\s\S]*?(?=\nexport (?:function|const)|\Z)", """export async function sendTechnicalBackupAccessEmail(fetchImpl, runtime, { code, challengeId }) {\n  if (!technicalBackupAccessRuntimeReady(runtime, fetchImpl)) throw new Error('TECHNICAL_BACKUP_ACCESS_UNAVAILABLE');\n  const minutes = Math.ceil(runtime.challengeTtlSeconds / 60);\n  const subject = 'Mã mở khóa Khu vực kỹ thuật Hưng Phát';\n  const bodyText = `Có yêu cầu mở Khu vực kỹ thuật sao lưu hệ thống Công Ty. Mã xác nhận: ${code}. Mã hết hạn sau ${minutes} phút. Mã này chỉ dùng cho sao lưu kỹ thuật; không dùng để xác nhận xóa dữ liệu.`;\n  const bodyHtml = `<p>Có yêu cầu mở <strong>Khu vực kỹ thuật sao lưu hệ thống Công Ty</strong>.</p><p>Mã xác nhận: <strong>${code}</strong></p><p>Mã hết hạn sau ${minutes} phút.</p><p>Mã này chỉ dùng cho sao lưu kỹ thuật; không dùng để xác nhận xóa dữ liệu.</p>`;\n  try {\n    return await sendResendEmail(fetchImpl, runtime, {\n      to: [TECHNICAL_BACKUP_RECIPIENT],\n      subject,\n      text: bodyText,\n      html: bodyHtml,\n      operation: 'technical-backup-challenge-email',\n      entityId: challengeId,\n    });\n  } catch {\n    throw new Error('TECHNICAL_BACKUP_CHALLENGE_DELIVERY_FAILED');\n  }\n}\n""")
          replace_once('npp-core/api/src/services/technical-backup-access.js', "await sendTechnicalBackupAccessEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp });", "await sendTechnicalBackupAccessEmail(fetchImpl, runtime, { code, challengeId });")

          replace_once('npp-core/api/src/backup/owner-delete-challenge.js', "import { createHmac, randomInt, timingSafeEqual } from 'node:crypto';\n", "import { createHmac, randomInt, timingSafeEqual } from 'node:crypto';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from '../email/resend.js';\n")
          replace_once('npp-core/api/src/backup/owner-delete-challenge.js', "    accountId: text(env.CLOUDFLARE_ACCOUNT_ID),\n    apiToken: text(env.CLOUDFLARE_EMAIL_API_TOKEN),\n    from: text(env.INTERNAL_AUTH_EMAIL_FROM),\n", "    ...loadResendEmailRuntime({ env }),\n")
          replace_once('npp-core/api/src/backup/owner-delete-challenge.js', """  return Boolean(\n    runtime?.accountId\n    && runtime?.apiToken\n    && EMAIL_PATTERN.test(runtime?.from ?? '')\n    && runtime?.pepper?.length >= 32\n    && Array.isArray(runtime?.recipients)\n    && runtime.recipients.length > 0\n    && typeof fetchImpl === 'function'\n  );\n""", """  return Boolean(\n    resendEmailRuntimeReady(runtime, fetchImpl)\n    && runtime?.pepper?.length >= 32\n    && Array.isArray(runtime?.recipients)\n    && runtime.recipients.length > 0\n  );\n""")
          regex_once('npp-core/api/src/backup/owner-delete-challenge.js', r"export async function sendOwnerDeletionChallengeEmail[\s\S]*?(?=\nexport (?:function|const)|\Z)", """export async function sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp, intentId }) {\n  if (!ownerDeletionRuntimeReady(runtime, fetchImpl)) throw new Error('DATA_DELETION_CHALLENGE_UNAVAILABLE');\n  const subject = 'Mã xác nhận yêu cầu xóa dữ liệu Hưng Phát';\n  const minutes = Math.ceil(runtime.ttlSeconds / 60);\n  const bodyText = `Có yêu cầu xác minh xóa dữ liệu từ ${sourceApp}. Mã xác nhận: ${code}. Mã hết hạn sau ${minutes} phút. Chỉ nhập mã trong mục Cài đặt > Dữ liệu & sao lưu. Nếu không phải yêu cầu của bạn, không cung cấp mã này.`;\n  const bodyHtml = `<p>Có yêu cầu xác minh <strong>xóa dữ liệu</strong> từ ${sourceApp}.</p><p>Mã xác nhận: <strong>${code}</strong></p><p>Mã hết hạn sau ${minutes} phút.</p><p>Chỉ nhập mã trong mục Cài đặt &gt; Dữ liệu &amp; sao lưu. Nếu không phải yêu cầu của bạn, không cung cấp mã này.</p>`;\n  try {\n    return await sendResendEmail(fetchImpl, runtime, {\n      to: runtime.recipients,\n      subject,\n      text: bodyText,\n      html: bodyHtml,\n      operation: 'data-deletion-challenge-email',\n      entityId: intentId,\n    });\n  } catch {\n    throw new Error('DATA_DELETION_CHALLENGE_DELIVERY_FAILED');\n  }\n}\n""")
          replace_once('npp-core/api/src/services/backup.js', "await sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp });", "await sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code, sourceApp: requestContext.sourceApp, intentId });")

          package_path = ROOT / 'npp-core/api/package.json'
          package_text = package_path.read_text(encoding='utf-8')
          marker = '"build": "node --check src/server.js &&'
          if package_text.count(marker) != 1: raise SystemExit('build marker missing')
          package_path.write_text(package_text.replace(marker, '"build": "node --check src/email/resend.js && node --check src/server.js &&'), encoding='utf-8')

          test_path = ROOT / 'npp-core/api/test/resend-email.test.js'
          test_path.write_text('''import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { loadResendEmailRuntime, resendEmailRuntimeReady, sendResendEmail } from '../src/email/resend.js';\n\nconst RECIPIENTS = ['khuongbinh.info@gmail.com', 'hgluckit@gmail.com', 'buomphuong@gmail.com'];\n\ntest('Resend runtime reads RESEND_API_KEY only', () => {\n  const runtime = loadResendEmailRuntime({ env: { RESEND_API_KEY: 're_test_only', INTERNAL_AUTH_EMAIL_FROM: 'security@nguyenlieuhungphat.com', CLOUDFLARE_EMAIL_API_TOKEN: 'ignored' } });\n  assert.equal(runtime.apiKey, 're_test_only');\n  assert.equal(resendEmailRuntimeReady(runtime, async () => ({ ok: true })), true);\n});\n\ntest('Resend sends all requested test recipients and reuses one canonical key for the same operation', async () => {\n  const runtime = loadResendEmailRuntime({ env: { RESEND_API_KEY: 're_test_only', INTERNAL_AUTH_EMAIL_FROM: 'security@nguyenlieuhungphat.com' } });\n  const requests = [];\n  const fetchImpl = async (url, init) => { requests.push({ url, init, body: JSON.parse(init.body) }); return { ok: true, json: async () => ({ id: 'email-123' }) }; };\n  for (const recipient of RECIPIENTS) await sendResendEmail(fetchImpl, runtime, { to: [recipient], subject: 'Test OTP', text: 'Mã kiểm thử', html: '<p>Mã kiểm thử</p>', operation: 'login-challenge-email', entityId: '11111111-1111-4111-8111-111111111111' });\n  assert.equal(requests.length, 3);\n  assert.equal(requests[0].init.headers['Idempotency-Key'], requests[1].init.headers['Idempotency-Key']);\n  assert.equal(requests[1].init.headers['Idempotency-Key'], requests[2].init.headers['Idempotency-Key']);\n  for (const request of requests) {\n    assert.equal(request.url, 'https://api.resend.com/emails');\n    assert.match(request.init.headers['Idempotency-Key'], /^[A-Za-z0-9._-]{1,128}$/);\n    assert.equal(request.body.from, 'security@nguyenlieuhungphat.com');\n    assert.equal(JSON.stringify(request.body).includes('re_test_only'), false);\n  }\n});\n\ntest('Resend adapter fails closed when the provider rejects or returns no message id', async () => {\n  const runtime = loadResendEmailRuntime({ env: { RESEND_API_KEY: 're_test_only', INTERNAL_AUTH_EMAIL_FROM: 'security@nguyenlieuhungphat.com' } });\n  const input = { to: ['khuongbinh.info@gmail.com'], subject: 'Test', text: 'Test', html: '<p>Test</p>', operation: 'data-deletion-challenge-email', entityId: '22222222-2222-4222-8222-222222222222' };\n  await assert.rejects(sendResendEmail(async () => ({ ok: false, json: async () => ({}) }), runtime, input), /RESEND_EMAIL_SEND_FAILED/);\n  await assert.rejects(sendResendEmail(async () => ({ ok: true, json: async () => ({}) }), runtime, input), /RESEND_EMAIL_SEND_FAILED/);\n});\n''', encoding='utf-8')

          backup_test = ROOT / 'npp-core/api/test/backup-foundation.test.js'
          backup_text = backup_test.read_text(encoding='utf-8')
          backup_text = re.sub(r"CLOUDFLARE_ACCOUNT_ID: '[^']+',\n\s+CLOUDFLARE_EMAIL_API_TOKEN: '[^']+',", "RESEND_API_KEY: 're_test_only',", backup_text)
          backup_text = backup_text.replace("json: async () => ({ success: true, result: { delivered: runtime.recipients, queued: [], permanent_bounces: [] } }),", "json: async () => ({ id: 'email-123' }),")
          backup_text = backup_text.replace("json: async () => ({ success: true, result: { delivered: ['owner1@example.com', 'owner2@example.com'], queued: [], permanent_bounces: [] } }),", "json: async () => ({ id: 'email-123' }),")
          backup_text = backup_text.replace("assert.deepEqual(requestBody.from, { address: 'security@example.com', name: 'Hưng Phát Security' });", "assert.equal(requestBody.from, 'security@example.com');")
          backup_text = backup_text.replace('secret-provider-token', 're_test_only')
          backup_text = re.sub(r"sendOwnerDeletionChallengeEmail\(fetchImpl, runtime, \{ code: '123456', sourceApp: '([^']+)' \}\)", r"sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code: '123456', sourceApp: '\1', intentId: '33333333-3333-4333-8333-333333333333' })", backup_text)
          backup_test.write_text(backup_text, encoding='utf-8')

          for path in ['npp-core/api/src/internal-workforce-auth.js', 'npp-core/api/src/backup/technical-access.js', 'npp-core/api/src/backup/owner-delete-challenge.js']:
              text = (ROOT / path).read_text(encoding='utf-8')
              if 'api.cloudflare.com/client/v4/accounts/' in text or 'CLOUDFLARE_EMAIL_API_TOKEN' in text:
                  raise SystemExit(f'{path}: Cloudflare email sender remains')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        working-directory: npp-core/api
        run: npm run verify

      - name: Verify scope
        shell: bash
        run: |
          test "$(git diff --name-only -- database/migrations | wc -l)" -eq 0
          git diff --check

      - name: Commit final changes and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-638-apply-resend.yml .github/workflows/issue-638-apply-pr.yml .github/workflows/issue-638-apply-pr2.yml .github/workflows/issue-638-apply-pr3.yml .github/workflows/issue-638-apply-pr4.yml .github/workflows/issue-638-apply-pr5.yml .github/workflows/issue-638-apply-pr6.yml
          git add npp-core/api/src/email/resend.js \
            npp-core/api/src/internal-workforce-auth.js \
            npp-core/api/src/backup/technical-access.js \
            npp-core/api/src/backup/owner-delete-challenge.js \
            npp-core/api/src/services/technical-backup-access.js \
            npp-core/api/src/services/backup.js \
            npp-core/api/package.json \
            npp-core/api/test/resend-email.test.js \
            npp-core/api/test/backup-foundation.test.js
          git commit -m 'fix(issue-638): switch transactional email provider to Resend'
          git push origin agent/issue-638-resend-email-provider
