          git checkout -b agent/document-print-detail-ux-fix
          git add npp-core/web
          git commit -m 'fix(core-web): print from opened document details'
          test "$(git rev-list --count 41f05a8c17e2d9267ab2e656cfd307bab417cd95..HEAD)" = "1"
          git push origin HEAD:refs/heads/agent/document-print-detail-ux-fix
