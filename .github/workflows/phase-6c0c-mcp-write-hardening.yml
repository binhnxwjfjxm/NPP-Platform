name: Phase 6C.0C MCP Write Hardening

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: phase-6c0c-mcp-write-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Auth, idempotency and audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Phase 6C.0C source boundary when applicable
        shell: bash
        run: |
          set -euo pipefail
          git -C .. diff --name-only origin/main...HEAD | tee phase-6c0c-changed-files.log
          head_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$head_branch" = 'agent/phase-6c0c-mcp-write-hardening' ]; then
            if git -C .. diff --name-only origin/main...HEAD | grep -E '^(npp-core/|database/)' >/dev/null; then
              echo '::error::The original Phase 6C.0C branch must not change Core or database migrations.'
              exit 1
            fi
            if git -C .. diff --name-only origin/main...HEAD | grep -E '^\.github/workflows/(heroku|vercel)' >/dev/null; then
              echo '::error::MCP write-hardening changes must not modify production deployment workflows.'
              exit 1
            fi
          else
            echo "Historical Phase 6C.0C source-only boundary is not applicable to ${head_branch}."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/apps/backend/package-lock.json

      - name: Install MCP backend dependencies
        run: npm ci --prefix apps/backend

      - name: Verify MCP backend contracts
        run: npm --prefix apps/backend run verify 2>&1 | tee phase-6c0c-backend.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6c0c-diagnostics-${{ github.run_id }}
          path: |
            mcp/phase-6c0c-changed-files.log
            mcp/phase-6c0c-backend.log
          retention-days: 7
          if-no-files-found: ignore
