name: Website AI production config gate

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: website-ai-production-config
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 5 &&
       github.event.comment.body == '/configure-website-ai-production' &&
       contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_REF: main
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      VERCEL_PROJECT_NAME: nguyenlieuhungphat
      WEBSITE_AI_ACTOR_ID: service:website-ai
      DIALOGFLOW_CX_PROJECT_ID: hck-agent-chat-prod
      DIALOGFLOW_CX_LOCATION: global
      DIALOGFLOW_CX_AGENT_ID: e326abbf-77f7-4b16-996c-64408c4dd136
      DIALOGFLOW_CX_AGENT_DISPLAY_NAME: Hưng Phát
      DIALOGFLOW_CX_LANGUAGE_CODE: vi

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/configure-website-ai-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare Công Ty VPS SSH credential
        id: ssh
        shell: bash
        env:
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_COMPANY_SSH_KEY"
          umask 077
          key="$RUNNER_TEMP/vps-company.key"
          printf '%s\n' "$VPS_COMPANY_SSH_KEY" > "$key"
          chmod 600 "$key"
          known_hosts="$RUNNER_TEMP/vps-company-known-hosts"
          ssh-keyscan -T 10 -H "$VPS_COMPANY_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Read Website AI runtime contract from Công Ty VPS
        id: runtime
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: |
          set -euo pipefail
          runtime_file="$RUNNER_TEMP/company-ai-runtime.json"
          ssh \
            -i "$SSH_KEY" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" 'bash -s' > "$runtime_file" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/npp/company.env
          test -f "$env_file"
          set -a
          . "$env_file"
          set +a
          node <<'NODE'
          const names = [
            'WEBSITE_AI_API_TOKEN',
            'WEBSITE_AI_ACTOR_ID',
            'BACKEND_API_TOKEN',
            'MCP_ONBOARDING_API_TOKEN',
            'MCP_SALES_API_TOKEN',
            'DELIVERY_FRONTEND_API_TOKEN'
          ];
          const out = Object.fromEntries(names.map((name) => [name, process.env[name] || '']));
          process.stdout.write(JSON.stringify(out));
          NODE
          REMOTE
          test -s "$runtime_file"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!p.WEBSITE_AI_API_TOKEN) process.exit(1);' "$runtime_file"
          while IFS= read -r secret; do
            [ -z "$secret" ] || echo "::add-mask::$secret"
          done < <(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); for(const v of Object.values(p)) if(v) console.log(v)' "$runtime_file")
          echo "file=$runtime_file" >> "$GITHUB_OUTPUT"

      - name: Audit and synchronize Website Dialogflow CX production configuration
        id: config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RUNTIME_FILE: ${{ steps.runtime.outputs.file }}
        run: |
          set -euo pipefail
          export COMPANY_API_URL="https://$VPS_COMPANY_HOST"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createSign, randomUUID } from 'node:crypto';

          const {
            VERCEL_TOKEN,
            VERCEL_ORG_ID,
            VERCEL_PROJECT_ID,
            VERCEL_PROJECT_NAME,
            COMPANY_API_URL,
            WEBSITE_AI_ACTOR_ID,
            DIALOGFLOW_CX_PROJECT_ID,
            DIALOGFLOW_CX_LOCATION,
            DIALOGFLOW_CX_AGENT_ID,
            DIALOGFLOW_CX_AGENT_DISPLAY_NAME,
            DIALOGFLOW_CX_LANGUAGE_CODE,
            RUNTIME_FILE,
          } = process.env;
          const runtime = JSON.parse(readFileSync(RUNTIME_FILE, 'utf8'));

          function required(value, name) {
            if (!value) throw new Error(`${name}_missing`);
            return value;
          }
          required(VERCEL_TOKEN, 'vercel_token');
          required(runtime.WEBSITE_AI_API_TOKEN, 'website_ai_api_token');
          if (runtime.WEBSITE_AI_ACTOR_ID !== WEBSITE_AI_ACTOR_ID) throw new Error('website_ai_actor_mismatch');
          if (VERCEL_PROJECT_NAME !== 'nguyenlieuhungphat') throw new Error('unexpected_vercel_project_name');
          if (!/^https:\/\/[^/]+$/.test(COMPANY_API_URL)) throw new Error('invalid_company_api_url');
          if (DIALOGFLOW_CX_PROJECT_ID !== 'hck-agent-chat-prod') throw new Error('unexpected_dialogflow_project');
          if (DIALOGFLOW_CX_LOCATION !== 'global') throw new Error('unexpected_dialogflow_location');
          if (DIALOGFLOW_CX_AGENT_ID !== 'e326abbf-77f7-4b16-996c-64408c4dd136') throw new Error('unexpected_dialogflow_agent_id');
          if (DIALOGFLOW_CX_AGENT_DISPLAY_NAME !== 'Hưng Phát') throw new Error('unexpected_dialogflow_agent_name');
          if (DIALOGFLOW_CX_LANGUAGE_CODE !== 'vi') throw new Error('unexpected_dialogflow_language');

          const reservedTokens = [
            runtime.BACKEND_API_TOKEN,
            runtime.MCP_ONBOARDING_API_TOKEN,
            runtime.MCP_SALES_API_TOKEN,
            runtime.DELIVERY_FRONTEND_API_TOKEN,
          ].filter(Boolean);
          if (reservedTokens.includes(runtime.WEBSITE_AI_API_TOKEN)) throw new Error('website_ai_token_not_dedicated');
          const sharedToken = runtime.WEBSITE_AI_API_TOKEN;

          const vercelHeaders = {
            Authorization: `Bearer ${VERCEL_TOKEN}`,
            'Content-Type': 'application/json',
          };
          async function jsonRequest(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`provider_request_failed:${response.status}:${body?.error?.code || 'unknown'}`);
            return body;
          }
          const project = await jsonRequest(
            `https://api.vercel.com/v9/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}?teamId=${encodeURIComponent(VERCEL_ORG_ID)}`,
            { headers: vercelHeaders },
          );
          if (project?.id !== VERCEL_PROJECT_ID || project?.name !== VERCEL_PROJECT_NAME) throw new Error('vercel_project_identity_mismatch');
          if (project?.nodeVersion !== '24.x') throw new Error('website_node_runtime_not_24');

          async function fetchVercelProductionEnv() {
            const url = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}/env`);
            url.searchParams.set('teamId', VERCEL_ORG_ID);
            url.searchParams.set('decrypt', 'true');
            url.searchParams.set('source', 'vercel-cli:pull');
            const body = await jsonRequest(url, { headers: vercelHeaders });
            const entries = Array.isArray(body) ? body : Array.isArray(body?.envs) ? body.envs : [];
            return entries.filter((entry) => {
              const targets = Array.isArray(entry?.target) ? entry.target : [entry?.target].filter(Boolean);
              return targets.includes('production') && !entry?.gitBranch;
            });
          }
          function envEntries(entries, key) { return entries.filter((entry) => entry?.key === key); }
          function envValue(entries, key) {
            const matches = envEntries(entries, key);
            if (matches.length === 0) return '';
            const values = [...new Set(matches.map((entry) => typeof entry?.value === 'string' ? entry.value : ''))];
            if (values.length !== 1) throw new Error(`conflicting_vercel_env:${key}`);
            return values[0];
          }
          function assertSecretMetadata(entries, key) {
            const matches = envEntries(entries, key);
            if (matches.length !== 1) throw new Error(`vercel_secret_metadata_count_invalid:${key}:${matches.length}`);
            const type = String(matches[0]?.type || '');
            if (!['encrypted', 'sensitive'].includes(type)) throw new Error(`vercel_secret_metadata_type_invalid:${key}:${type || 'missing'}`);
          }
          function parseServiceAccount(raw) {
            if (!raw) return null;
            try {
              const value = JSON.parse(raw);
              if (value?.client_email && value?.private_key && value?.project_id) return value;
            } catch {}
            return null;
          }
          async function probeGoogleServiceAccount(serviceAccount) {
            const b64 = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${b64({ alg: 'RS256', typ: 'JWT' })}.${b64({
              iss: serviceAccount.client_email,
              scope: 'https://www.googleapis.com/auth/dialogflow',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now - 30,
              exp: now + 3300,
            })}`;
            const signer = createSign('RSA-SHA256');
            signer.update(unsigned);
            signer.end();
            const assertion = `${unsigned}.${signer.sign(serviceAccount.private_key).toString('base64url')}`;
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth2:grant-type:jwt-bearer', assertion }),
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || !body?.access_token) throw new Error(`google_service_account_probe_failed:${response.status}`);
            return body.access_token;
          }
          async function probeDialogflowAgent(accessToken) {
            const url = `https://dialogflow.googleapis.com/v3/projects/${encodeURIComponent(DIALOGFLOW_CX_PROJECT_ID)}/locations/${encodeURIComponent(DIALOGFLOW_CX_LOCATION)}/agents/${encodeURIComponent(DIALOGFLOW_CX_AGENT_ID)}`;
            const response = await fetch(url, { headers: { authorization: `Bearer ${accessToken}` } });
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`dialogflow_agent_probe_failed:${response.status}`);
            if (body?.displayName !== DIALOGFLOW_CX_AGENT_DISPLAY_NAME) throw new Error('dialogflow_agent_probe_name_mismatch');
            const expectedName = `projects/${DIALOGFLOW_CX_PROJECT_ID}/locations/${DIALOGFLOW_CX_LOCATION}/agents/${DIALOGFLOW_CX_AGENT_ID}`;
            if (body?.name !== expectedName) throw new Error('dialogflow_agent_probe_resource_mismatch');
          }
          async function upsertVercelEnv(key, value, type) {
            const endpoint = new URL(`https://api.vercel.com/v10/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}/env`);
            endpoint.searchParams.set('teamId', VERCEL_ORG_ID);
            endpoint.searchParams.set('upsert', 'true');
            await jsonRequest(endpoint, {
              method: 'POST',
              headers: vercelHeaders,
              body: JSON.stringify([{ key, value, type, target: ['production'], comment: 'Website Dialogflow CX production contract' }]),
            });
          }

          let vercelEnv = await fetchVercelProductionEnv();
          const credentialKeys = [
            'DIALOGFLOW_CX_SERVICE_ACCOUNT_JSON',
            'DIALOGFLOW_SERVICE_ACCOUNT_JSON',
            'GOOGLE_SERVICE_ACCOUNT_JSON',
          ];
          const presentCredentialKeys = credentialKeys.filter((key) => envEntries(vercelEnv, key).length > 0);
          if (presentCredentialKeys.length === 0) throw new Error('dialogflow_service_account_missing_in_vercel_production');
          for (const key of presentCredentialKeys) assertSecretMetadata(vercelEnv, key);
          const selectedCredentialKey = presentCredentialKeys[0];
          const selectedCredentialEntry = envEntries(vercelEnv, selectedCredentialKey)[0];
          const selectedCredentialDecrypted = selectedCredentialEntry?.decrypted === true;
          const selectedCredentialRaw = envValue(vercelEnv, selectedCredentialKey);
          const serviceAccount = selectedCredentialDecrypted ? parseServiceAccount(selectedCredentialRaw) : null;
          if (selectedCredentialDecrypted && !serviceAccount) throw new Error(`dialogflow_selected_service_account_invalid:${selectedCredentialKey}`);

          let credentialMode = 'runtime';
          let dialogflowIdentity = 'runtime_unverified';
          if (serviceAccount) {
            const accessToken = await probeGoogleServiceAccount(serviceAccount);
            await probeDialogflowAgent(accessToken);
            credentialMode = 'oauth';
            dialogflowIdentity = 'success';
          }

          if (envValue(vercelEnv, 'COMPANY_API_URL').replace(/\/$/, '') !== COMPANY_API_URL) {
            await upsertVercelEnv('COMPANY_API_URL', COMPANY_API_URL, 'plain');
          }
          await upsertVercelEnv('COMPANY_WEBSITE_AI_API_TOKEN', sharedToken, 'encrypted');
          for (const [key, value] of [
            ['DIALOGFLOW_CX_PROJECT_ID', DIALOGFLOW_CX_PROJECT_ID],
            ['DIALOGFLOW_CX_LOCATION', DIALOGFLOW_CX_LOCATION],
            ['DIALOGFLOW_CX_AGENT_ID', DIALOGFLOW_CX_AGENT_ID],
            ['DIALOGFLOW_CX_AGENT_DISPLAY_NAME', DIALOGFLOW_CX_AGENT_DISPLAY_NAME],
            ['DIALOGFLOW_CX_LANGUAGE_CODE', DIALOGFLOW_CX_LANGUAGE_CODE],
          ]) {
            if (envValue(vercelEnv, key) !== value) await upsertVercelEnv(key, value, 'plain');
          }

          async function health(path) {
            const deadline = Date.now() + 180_000;
            let last = 0;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`${COMPANY_API_URL}${path}`, { redirect: 'manual' });
                last = response.status;
                if (last === 200) return;
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            throw new Error(`company_health_failed:${path}:${last}`);
          }
          await health('/health/live');
          await health('/health/ready');

          vercelEnv = await fetchVercelProductionEnv();
          const finalCredentialKeys = credentialKeys.filter((key) => envEntries(vercelEnv, key).length > 0);
          if (finalCredentialKeys.length === 0) throw new Error('vercel_dialogflow_credential_contract_missing');
          for (const key of finalCredentialKeys) assertSecretMetadata(vercelEnv, key);
          if (finalCredentialKeys[0] !== selectedCredentialKey) throw new Error('vercel_dialogflow_credential_priority_changed_after_sync');
          assertSecretMetadata(vercelEnv, 'COMPANY_WEBSITE_AI_API_TOKEN');

          const probe = await fetch(`${COMPANY_API_URL}/api/ai/usage-events`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${sharedToken}`,
              'content-type': 'application/json; charset=utf-8',
              'idempotency-key': randomUUID(),
            },
            body: '{}',
          });
          if (probe.status !== 400) throw new Error(`company_website_ai_auth_probe_unexpected_status:${probe.status}`);
          const probeBody = await probe.json().catch(() => null);
          if (!String(probeBody?.error?.code || '').startsWith('AI_USAGE_')) throw new Error('company_website_ai_auth_probe_unexpected_code');

          appendFileSync(process.env.GITHUB_OUTPUT, `credential_mode=${credentialMode}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `dialogflow_identity=${dialogflowIdentity}\n`);
          console.log('WEBSITE_AI_PRODUCTION_CONFIG=success');
          console.log(`GOOGLE_CREDENTIAL_MODE=${credentialMode}`);
          console.log('DIALOGFLOW_CX_CONFIG=success');
          console.log(`DIALOGFLOW_CX_IDENTITY=${dialogflowIdentity}`);
          console.log('COMPANY_WEBSITE_AI_AUTH_PROBE=success');
          NODE

      - name: Publish sanitized production configuration evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CREDENTIAL_MODE: ${{ steps.config.outputs.credential_mode }}
          DIALOGFLOW_IDENTITY: ${{ steps.config.outputs.dialogflow_identity }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Website Dialogflow CX production config gate — success

          WEBSITE_AI_PRODUCTION_CONFIG=success
          GOOGLE_CREDENTIAL_MODE=$CREDENTIAL_MODE
          DIALOGFLOW_CX_CONFIG=success
          DIALOGFLOW_CX_IDENTITY=$DIALOGFLOW_IDENTITY
          COMPANY_WEBSITE_AI_AUTH_PROBE=success
          SOURCE_SHA=$TARGET_SHA
          GITHUB_RUN_ID=$GITHUB_RUN_ID
          EOF
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/764/comments" -f body="$body" >/dev/null
