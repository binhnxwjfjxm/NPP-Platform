name: Manual Vercel MCP production deploy

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-mcp-production-manual
  cancel-in-progress: false

jobs:
  deploy-mcp-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      LEGACY_RUNTIME_SOURCE_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      DEPLOY_REF: main
      MCP_ROOT_DIRECTORY: mcp
      MCP_PRODUCTION_URL: https://mcp-field-binhnxwjfjxms-projects.vercel.app
    steps:
      - name: Validate exact MCP deployment target
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "prj_854SWdJeDEOPezAvvTZzTaRvZUSq"
          test "$VERCEL_PROJECT_ID" != "$LEGACY_RUNTIME_SOURCE_PROJECT_ID"
          test "$MCP_PRODUCTION_URL" = "https://mcp-field-binhnxwjfjxms-projects.vercel.app"

      - name: Validate Issue #5 trigger comment
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          trimmed_comment="${COMMENT_BODY:-}"
          trimmed_comment="${trimmed_comment#"${trimmed_comment%%[![:space:]]*}"}"
          trimmed_comment="${trimmed_comment%"${trimmed_comment##*[![:space:]]}"}"
          test "$trimmed_comment" = '/deploy-vercel-mcp-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying MCP ref ${DEPLOY_REF} at SHA: $sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Copy legacy MCP runtime configuration to dedicated project
        id: runtime-config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/mcp-runtime-config-status.md"
          legacy_dir="$(mktemp -d)"
          legacy_env_file="${legacy_dir}/legacy-production.env"

          cleanup() {
            rm -rf "$legacy_dir"
          }
          trap cleanup EXIT

          fail_preflight() {
            local code="$1"
            printf 'MCP runtime configuration synchronization failed: %s.\n' "$code" > "$status_file"
            exit 1
          }

          printf 'MCP runtime configuration synchronization failed: unknown_preflight_error.\n' > "$status_file"
          test -n "${VERCEL_TOKEN:-}" || fail_preflight missing_vercel_token

          mkdir -p "${legacy_dir}/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$LEGACY_RUNTIME_SOURCE_PROJECT_ID" \
            > "${legacy_dir}/.vercel/project.json"

          if ! (
            cd "$legacy_dir"
            VERCEL_ORG_ID="$VERCEL_ORG_ID" \
            VERCEL_PROJECT_ID="$LEGACY_RUNTIME_SOURCE_PROJECT_ID" \
              npx --yes vercel@latest env pull "$legacy_env_file" \
                --environment=production \
                --yes \
                --token="$VERCEL_TOKEN"
          ); then
            fail_preflight legacy_vercel_env_pull_failed
          fi

          LEGACY_ENV_FILE="$legacy_env_file" \
          STATUS_FILE="$status_file" \
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from "node:fs/promises";
          import { loadEnvFile } from "node:process";

          const requiredNames = [
            "BACKEND_API_BASE_URL",
            "BACKEND_API_TOKEN",
            "MCP_LEGACY_ACTOR_ID",
            "SUPABASE_URL",
            "SUPABASE_ANON_KEY"
          ];

          try {
            loadEnvFile(process.env.LEGACY_ENV_FILE);

            const values = Object.fromEntries(
              requiredNames.map((name) => [name, String(process.env[name] || "").trim()])
            );
            const missing = requiredNames.filter((name) => !values[name]);

            if (missing.length) {
              throw new Error(`missing_legacy_runtime_values:${missing.join(",")}`);
            }
            if (!values.BACKEND_API_BASE_URL.startsWith("https://")) {
              throw new Error("backend_api_base_url_must_be_https");
            }
            if (values.BACKEND_API_TOKEN.length < 32) {
              throw new Error("backend_api_token_too_short");
            }
            if (!values.SUPABASE_URL.startsWith("https://")) {
              throw new Error("supabase_url_must_be_https");
            }

            for (const value of Object.values(values)) {
              process.stdout.write(`::add-mask::${value}\n`);
            }

            const response = await fetch(
              `https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}&upsert=true`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(
                  Object.entries(values).map(([key, value]) => ({
                    key,
                    value,
                    type: "encrypted",
                    target: ["production"],
                    comment: "Copied from the legacy MCP production runtime during guarded separation"
                  }))
                )
              }
            );

            if (!response.ok) {
              const payload = await response.json().catch(() => ({}));
              throw new Error(
                `vercel_env_upsert_failed:${response.status}:${payload?.error?.code || "unknown"}`
              );
            }

            for (const [key, value] of Object.entries(values)) {
              const marker = `MCP_RUNTIME_${key}_${Date.now()}`;
              await appendFile(
                process.env.GITHUB_ENV,
                `${key}<<${marker}\n${value}\n${marker}\n`,
                "utf8"
              );
            }

            await writeFile(
              process.env.STATUS_FILE,
              `MCP runtime configuration copied for: ${requiredNames.join(", ")}.\n`,
              "utf8"
            );
          } catch (error) {
            const code = String(error?.message || "runtime_config_sync_failed")
              .replace(/[^A-Za-z0-9_:,.-]/g, "_")
              .slice(0, 500);
            await writeFile(
              process.env.STATUS_FILE,
              `MCP runtime configuration synchronization failed: ${code}.\n`,
              "utf8"
            );
            throw error;
          }
          NODE

      - name: Report MCP runtime configuration failure
        if: failure() && steps.runtime-config.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### MCP Vercel production preflight failed"
            echo
            cat "${RUNNER_TEMP}/mcp-runtime-config-status.md"
            echo
            echo "Source SHA: ${{ steps.target.outputs.sha }}"
          } > "${RUNNER_TEMP}/mcp-runtime-config-comment.md"
          gh issue comment 5 --body-file "${RUNNER_TEMP}/mcp-runtime-config-comment.md"

      - name: Pull MCP production project configuration
        run: >-
          npx --yes vercel@latest pull
          --yes
          --environment=production
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify MCP Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`unexpected_mcp_vercel_project:${linked.projectId}`);
          }
          if (linked.projectId === process.env.LEGACY_RUNTIME_SOURCE_PROJECT_ID) {
            throw new Error("mcp_project_must_not_equal_legacy_runtime_source");
          }
          if (linked.settings?.rootDirectory !== process.env.MCP_ROOT_DIRECTORY) {
            throw new Error(`unexpected_mcp_root_directory:${linked.settings?.rootDirectory}`);
          }
          NODE

      - name: Verify automatic deployment lock
        working-directory: mcp
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const config = JSON.parse(await readFile("vercel.json", "utf8"));
          if (config.git?.deploymentEnabled !== false) {
            throw new Error("mcp_vercel_auto_deploy_not_locked");
          }
          NODE

      - name: Build MCP production artifact
        run: >-
          npx --yes vercel@latest build
          --prod
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy MCP production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(
            npx --yes vercel@latest deploy \
              --prebuilt \
              --prod \
              --token="${{ secrets.VERCEL_TOKEN }}"
          )"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "MCP production deployment URL: $url"

      - name: Smoke exact MCP production deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          assert_status() {
            local path="$1"
            shift
            local -a expected_codes=("$@")
            local response
            response="$(
              curl --silent --show-error \
                --retry 5 --retry-delay 5 --retry-all-errors \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$DEPLOYMENT_URL$path"
            )"
            for code in "${expected_codes[@]}"; do
              if [ "$response" = "$code" ]; then
                return 0
              fi
            done
            echo "Unexpected MCP status for $path: expected one of ${expected_codes[*]}, got $response" >&2
            exit 1
          }

          assert_status / 200 302 307
          assert_status /login 200 302 307 404
          assert_status /visits 200 302 307 401 403

          html="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$DEPLOYMENT_URL/")"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.(css|js)' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$DEPLOYMENT_URL$asset" >/dev/null

      - name: Smoke configured MCP production alias
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ env.MCP_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$DEPLOYMENT_URL/" || true
            )"
            case "$response" in
              200|302|307)
                echo "MCP production alias is serving: $DEPLOYMENT_URL"
                exit 0
                ;;
            esac
            if [ "$attempt" -eq 12 ]; then
              echo "MCP production alias did not become ready; last status: ${response:-000}" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Record successful exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "MCP_DEPLOYED_SHA=${{ steps.target.outputs.sha }}"
          echo "MCP_DEPLOYED_URL=${{ steps.deploy.outputs.url }}"
          gh issue comment 5 --body "MCP Vercel production deploy succeeded for SHA ${{ steps.target.outputs.sha }} at ${{ steps.deploy.outputs.url }}."
