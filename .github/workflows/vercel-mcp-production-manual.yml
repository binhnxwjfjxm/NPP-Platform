name: Manual Vercel MCP production deploy

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: vercel-mcp-production-manual
  cancel-in-progress: false

jobs:
  deploy-mcp-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-mcp-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      CORE_VERCEL_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      DEPLOY_REF: main
      MCP_ROOT_DIRECTORY: mcp
      MCP_PRODUCTION_URL: https://mcp.nguyenlieuhungphat.com
      MCP_LEGACY_ACTOR_ID: service:mcp-plan:mcp-v1
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}

    steps:
      - name: Validate exact MCP deployment target
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "prj_854SWdJeDEOPezAvvTZzTaRvZUSq"
          test "$VERCEL_PROJECT_ID" != "$CORE_VERCEL_PROJECT_ID"
          test "$MCP_PRODUCTION_URL" = "https://mcp.nguyenlieuhungphat.com"
          test "$MCP_ROOT_DIRECTORY" = "mcp"
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"

      - name: Validate Issue #5 trigger comment
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "${COMMENT_BODY:-}" = '/deploy-vercel-mcp-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Foundation CI green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          result="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/foundation-f0-2.yml/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"
          success="$(jq -r '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // empty' <<<"$result")"
          test -n "$success"
          echo "FOUNDATION_EXACT_HEAD_RUN=$success" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Validate VPS production endpoints
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          company_url="https://$VPS_COMPANY_HOST"
          mcp_url="https://$VPS_MCP_HOST"
          COMPANY_URL="$company_url" MCP_URL="$mcp_url" node --input-type=module <<'NODE'
          for (const [name, raw] of [["company", process.env.COMPANY_URL], ["mcp", process.env.MCP_URL]]) {
            const url = new URL(raw);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/") {
              throw new Error(`invalid_${name}_production_url`);
            }
          }
          NODE
          for url in "$company_url/health/live" "$company_url/health/ready" "$mcp_url/health/live" "$mcp_url/health/ready"; do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$url" || true)"
            test "$status" = 200
          done
          auth_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$company_url/api/internal-auth/me" || true)"
          test "$auth_status" = 401
          {
            echo "CORE_API_INTERNAL_URL=$company_url"
            echo "BACKEND_API_BASE_URL=$mcp_url"
          } >> "$GITHUB_ENV"
          echo "company=VPS" >> "$GITHUB_OUTPUT"
          echo "mcp=VPS" >> "$GITHUB_OUTPUT"

      - name: Synchronize MCP production routing bindings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"
          metadata="$RUNNER_TEMP/mcp-production-env-metadata.json"
          status="$(curl --silent --show-error --output "$metadata" --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")"
          test "$status" = 200
          ENV_METADATA="$metadata" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync(process.env.ENV_METADATA, "utf8"));
          const envs = Array.isArray(payload.envs) ? payload.envs : [];
          const matches = envs.filter((entry) => entry?.key === "BACKEND_API_TOKEN" && Array.isArray(entry.target) && entry.target.includes("production"));
          if (matches.length !== 1) throw new Error("mcp_backend_token_production_binding_missing_or_ambiguous");
          if (matches[0].type === "plain") throw new Error("mcp_backend_token_must_not_be_plain");
          NODE
          body="$(jq -nc \
            --arg core "$CORE_API_INTERNAL_URL" \
            --arg backend "$BACKEND_API_BASE_URL" \
            --arg actor "$MCP_LEGACY_ACTOR_ID" \
            '[
              {key:"CORE_API_INTERNAL_URL",value:$core,type:"sensitive",target:["production"]},
              {key:"BACKEND_API_BASE_URL",value:$backend,type:"sensitive",target:["production"]},
              {key:"MCP_LEGACY_ACTOR_ID",value:$actor,type:"sensitive",target:["production"]}
            ]')"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/mcp-env-upsert.json" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true")"
          case "$status" in 200|201) ;; *) exit 1 ;; esac

      - name: Pull MCP production project configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify MCP Vercel project link and automatic deploy lock
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          const config = JSON.parse(await readFile("mcp/vercel.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error("unexpected_mcp_vercel_project");
          if (linked.projectId === process.env.CORE_VERCEL_PROJECT_ID) throw new Error("mcp_project_must_not_equal_core_project");
          if (linked.settings?.rootDirectory !== process.env.MCP_ROOT_DIRECTORY) throw new Error("unexpected_mcp_root_directory");
          if (config.git?.deploymentEnabled !== false) throw new Error("mcp_vercel_auto_deploy_not_locked");
          NODE

      - name: Deploy exact main to MCP production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@58.0.0 deploy --prod --yes --token="$VERCEL_TOKEN")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke MCP production domain
        shell: bash
        run: |
          set -euo pipefail
          assert_status() {
            local path="$1" expected="$2" accept="${3:-application/json}" status=""
            for attempt in $(seq 1 12); do
              status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 -H "Accept: $accept" --output /dev/null --write-out '%{http_code}' "$MCP_PRODUCTION_URL$path" || true)"
              [ "$status" = "$expected" ] && return 0
              sleep 5
            done
            echo "unexpected_mcp_status path=$path status=${status:-000}" >&2
            return 1
          }
          assert_status /login 200 text/html
          assert_status /api/backend/routes 401 application/json
          login_headers="$RUNNER_TEMP/mcp-auth-smoke-headers.txt"
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=__mcp_auth_smoke_never_exists__' \
            --data-urlencode 'password=not-a-real-password' \
            --data-urlencode 'returnTo=/customers' \
            --dump-header "$login_headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$MCP_PRODUCTION_URL/api/auth/login" || true)"
          test "$status" = 303
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$login_headers")"
          case "$location" in
            *error=invalid_credentials*) ;;
            *auth_unavailable*) echo 'mcp_company_auth_unavailable' >&2; exit 1 ;;
            *) echo 'unexpected_mcp_login_redirect' >&2; exit 1 ;;
          esac
          html="$RUNNER_TEMP/mcp-login.html"
          curl --fail --silent --show-error "$MCP_PRODUCTION_URL/login" > "$html"
          asset="$(grep -oE '/_next/static/[^" ]+\.(css|js)' "$html" | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$MCP_PRODUCTION_URL$asset" >/dev/null

      - name: Record successful exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 5 --body "MCP Vercel production deploy succeeded for SHA ${{ steps.target.outputs.sha }} at ${{ steps.deploy.outputs.url }}. Công Ty auth binding: VPS. MCP business binding: VPS. Login connectivity smoke: passed. Backend/DB/proxy were not restarted or mutated."
