name: Manual Vercel MCP production deploy

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-mcp-production-manual
  cancel-in-progress: false

jobs:
  deploy-mcp-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-mcp-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      CORE_VERCEL_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      CORE_HEROKU_APP_NAME: hung-phat
      DEPLOY_REF: main
      MCP_ROOT_DIRECTORY: mcp
      MCP_PRODUCTION_URL: https://mcp.nguyenlieuhungphat.com
      MCP_LEGACY_ACTOR_ID: service:mcp-plan:mcp-v1

    steps:
      - name: Validate exact MCP deployment target
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "prj_854SWdJeDEOPezAvvTZzTaRvZUSq"
          test "$VERCEL_PROJECT_ID" != "$CORE_VERCEL_PROJECT_ID"
          test "$MCP_PRODUCTION_URL" = "https://mcp.nguyenlieuhungphat.com"
          test "$CORE_HEROKU_APP_NAME" = "hung-phat"
          test "$MCP_LEGACY_ACTOR_ID" = "service:mcp-plan:mcp-v1"

      - name: Validate Issue #5 trigger comment
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          trimmed_comment="${COMMENT_BODY:-}"
          trimmed_comment="${trimmed_comment#"${trimmed_comment%%[![:space:]]*}"}"
          trimmed_comment="${trimmed_comment%"${trimmed_comment##*[![:space:]]}"}"
          test "$trimmed_comment" = '/deploy-vercel-mcp-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying MCP ref ${DEPLOY_REF} at SHA: $sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Resolve MCP Core auth runtime
        id: core-runtime
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          SECRET_CORE_API_INTERNAL_URL: ${{ secrets.CORE_API_INTERNAL_URL }}
        run: |
          set -euo pipefail
          core_url="${SECRET_CORE_API_INTERNAL_URL:-}"
          runtime_source="github-secrets"
          if [ -z "$core_url" ]; then
            runtime_source="heroku-core"
            test -n "${HEROKU_API_KEY:-}"
            app_json="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.heroku+json; version=3' \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$CORE_HEROKU_APP_NAME")"
            core_url="$(printf '%s' "$app_json" | jq -r '.web_url // empty')"
            core_url="${core_url%/}"
          fi
          test -n "$core_url"
          CORE_URL="$core_url" node --input-type=module <<'NODE'
          const url = new URL(process.env.CORE_URL);
          if (url.protocol !== 'https:' || url.username || url.password) {
            throw new Error('invalid_core_api_internal_url');
          }
          NODE
          core_health="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null --write-out '%{http_code}' "$core_url/health/live" || true)"
          test "$core_health" = "200"
          echo "::add-mask::$core_url"
          marker="MCP_CORE_API_INTERNAL_URL_${RANDOM}_${RANDOM}"
          {
            echo "CORE_API_INTERNAL_URL<<$marker"
            echo "$core_url"
            echo "$marker"
          } >> "$GITHUB_ENV"
          echo "source=$runtime_source" >> "$GITHUB_OUTPUT"

      - name: Synchronize guarded MCP runtime configuration
        id: runtime-config
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BACKEND_API_BASE_URL: ${{ secrets.MCP_BACKEND_API_BASE_URL }}
          BACKEND_API_TOKEN: ${{ secrets.MCP_BACKEND_API_TOKEN }}
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/mcp-runtime-config-status.md"
          printf 'MCP runtime configuration synchronization failed: unknown_preflight_error.\n' > "$status_file"

          STATUS_FILE="$status_file" node --input-type=module <<'NODE'
          import { appendFile, writeFile } from "node:fs/promises";

          const sources = [
            ["CORE_API_INTERNAL_URL", "resolved:CORE_API_INTERNAL_URL"],
            ["BACKEND_API_BASE_URL", "MCP_BACKEND_API_BASE_URL"],
            ["BACKEND_API_TOKEN", "MCP_BACKEND_API_TOKEN"],
            ["MCP_LEGACY_ACTOR_ID", "workflow:MCP_LEGACY_ACTOR_ID"]
          ];

          try {
            const vercelToken = String(process.env.VERCEL_TOKEN || "").trim();
            const values = Object.fromEntries(
              sources.map(([runtimeName]) => [runtimeName, String(process.env[runtimeName] || "").trim()])
            );
            const missingSources = sources
              .filter(([runtimeName]) => !values[runtimeName])
              .map(([, sourceName]) => sourceName);

            if (!vercelToken) missingSources.unshift("VERCEL_TOKEN");
            if (missingSources.length) {
              throw new Error(`missing_github_runtime_sources:${missingSources.join(",")}`);
            }
            if (!/^vcp_[A-Za-z0-9_-]+$/.test(vercelToken)) {
              throw new Error("invalid_vercel_token_format");
            }
            if (!values.CORE_API_INTERNAL_URL.startsWith("https://")) {
              throw new Error("core_api_internal_url_must_be_https");
            }
            if (!values.BACKEND_API_BASE_URL.startsWith("https://")) {
              throw new Error("backend_api_base_url_must_be_https");
            }
            if (values.BACKEND_API_TOKEN.length < 32) {
              throw new Error("backend_api_token_too_short");
            }

            process.stdout.write(`::add-mask::${vercelToken}\n`);
            for (const value of Object.values(values)) process.stdout.write(`::add-mask::${value}\n`);

            const response = await fetch(
              `https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}&upsert=true`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${vercelToken}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(
                  Object.entries(values).map(([key, value]) => ({
                    key,
                    value,
                    type: "encrypted",
                    target: ["production"],
                    comment: "Synchronized by guarded MCP production deployment workflow"
                  }))
                )
              }
            );

            if (!response.ok) {
              const payload = await response.json().catch(() => ({}));
              throw new Error(`vercel_env_upsert_failed:${response.status}:${payload?.error?.code || "unknown"}`);
            }

            for (const [key, value] of Object.entries(values)) {
              const marker = `MCP_RUNTIME_${key}_${Date.now()}`;
              await appendFile(process.env.GITHUB_ENV, `${key}<<${marker}\n${value}\n${marker}\n`, "utf8");
            }
            await writeFile(
              process.env.STATUS_FILE,
              `MCP runtime configuration synchronized for: ${sources.map(([name]) => name).join(", ")}.\n`,
              "utf8"
            );
          } catch (error) {
            const rawCode = String(error?.message || "runtime_config_sync_failed");
            const safePatterns = [
              /^missing_github_runtime_sources:[A-Z0-9_:,]+$/,
              /^invalid_vercel_token_format$/,
              /^core_api_internal_url_must_be_https$/,
              /^backend_api_base_url_must_be_https$/,
              /^backend_api_token_too_short$/,
              /^vercel_env_upsert_failed:\d{3}:[A-Za-z0-9_.-]+$/
            ];
            const code = safePatterns.some((pattern) => pattern.test(rawCode))
              ? rawCode
              : "runtime_config_sync_failed";
            await writeFile(
              process.env.STATUS_FILE,
              `MCP runtime configuration synchronization failed: ${code}.\n`,
              "utf8"
            );
            throw new Error(code);
          }
          NODE

      - name: Report MCP runtime configuration failure
        if: failure() && steps.runtime-config.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### MCP Vercel production preflight failed"
            echo
            cat "${RUNNER_TEMP}/mcp-runtime-config-status.md"
            echo
            echo "Source SHA: ${{ steps.target.outputs.sha }}"
          } > "${RUNNER_TEMP}/mcp-runtime-config-comment.md"
          gh issue comment 5 --body-file "${RUNNER_TEMP}/mcp-runtime-config-comment.md"

      - name: Pull MCP production project configuration
        run: >-
          npx --yes vercel@latest pull
          --yes
          --environment=production
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify MCP Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`unexpected_mcp_vercel_project:${linked.projectId}`);
          }
          if (linked.projectId === process.env.CORE_VERCEL_PROJECT_ID) {
            throw new Error("mcp_project_must_not_equal_core_project");
          }
          if (linked.settings?.rootDirectory !== process.env.MCP_ROOT_DIRECTORY) {
            throw new Error(`unexpected_mcp_root_directory:${linked.settings?.rootDirectory}`);
          }
          NODE

      - name: Verify automatic deployment lock
        working-directory: mcp
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile("vercel.json", "utf8"));
          if (config.git?.deploymentEnabled !== false) {
            throw new Error("mcp_vercel_auto_deploy_not_locked");
          }
          NODE

      - name: Build MCP production artifact
        run: >-
          npx --yes vercel@latest build
          --prod
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy MCP production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "MCP production deployment URL: $url"

      - name: Smoke exact MCP production deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          assert_reachable() {
            local path="$1"
            local response=""
            for attempt in $(seq 1 6); do
              response="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path" || true)"
              echo "MCP exact smoke path=$path attempt=$attempt status=${response:-000}"
              case "$response" in
                200|302|307|401|403) return 0 ;;
              esac
              [ "$attempt" -lt 6 ] && sleep 5
            done
            echo "Exact MCP deployment is not reachable at $path; got ${response:-000}" >&2
            exit 1
          }

          # The exact deployment hostname can be protected by Vercel Authentication.
          # Reachability is checked here; public page content and assets are checked
          # against MCP_PRODUCTION_URL in the next step.
          assert_reachable /
          assert_reachable /field-checks

      - name: Smoke configured MCP production domain
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ env.MCP_PRODUCTION_URL }}
        run: |
          set -euo pipefail

          assert_status() {
            local path="$1"
            shift
            local -a expected_codes=("$@")
            local response=""
            for attempt in $(seq 1 12); do
              response="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path" || true)"
              echo "MCP domain smoke path=$path attempt=$attempt status=${response:-000}"
              for code in "${expected_codes[@]}"; do
                [ "$response" = "$code" ] && return 0
              done
              [ "$attempt" -lt 12 ] && sleep 5
            done
            echo "Unexpected MCP production status for $path: expected one of ${expected_codes[*]}, got ${response:-000}" >&2
            exit 1
          }

          assert_status / 200 302 307
          assert_status /mcp 200 302 307
          assert_status /routes 200 302 307
          assert_status /visits 200 302 307
          assert_status /field-checks 200 302 307

          html_file="${RUNNER_TEMP}/mcp-production-root.html"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$DEPLOYMENT_URL/" > "$html_file"
          asset="$(HTML_FILE="$html_file" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const html = await readFile(process.env.HTML_FILE, "utf8");
          const match = html.match(/\/_next\/static\/[^\"'\s]+\.(?:css|js)/);
          if (!match) process.exit(1);
          process.stdout.write(match[0]);
          NODE
          )"
          test -n "$asset"
          echo "MCP smoke asset=$asset"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$DEPLOYMENT_URL$asset" >/dev/null

      - name: Smoke MCP login Core connectivity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ env.MCP_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          headers_file="${RUNNER_TEMP}/mcp-auth-smoke-headers.txt"
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=__mcp_auth_smoke_never_exists__' \
            --data-urlencode 'password=not-a-real-password' \
            --data-urlencode 'returnTo=/customers' \
            --dump-header "$headers_file" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$DEPLOYMENT_URL/api/auth/login" || true)"
          test "$status" = "303"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers_file")"
          test -n "$location"
          case "$location" in
            *auth_unavailable*)
              echo "MCP login cannot reach Core auth boundary" >&2
              exit 1
              ;;
            *error=invalid_credentials*)
              echo "MCP login reached Core auth boundary"
              ;;
            *)
              echo "Unexpected MCP login smoke redirect" >&2
              exit 1
              ;;
          esac

      - name: Record successful exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "MCP_DEPLOYED_SHA=${{ steps.target.outputs.sha }}"
          echo "MCP_DEPLOYED_URL=${{ steps.deploy.outputs.url }}"
          gh issue comment 5 --body "MCP Vercel production deploy succeeded for SHA ${{ steps.target.outputs.sha }} at ${{ steps.deploy.outputs.url }}. Core auth runtime source: ${{ steps.core-runtime.outputs.source }}. Login connectivity smoke: passed."
