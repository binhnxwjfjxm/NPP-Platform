name: Heroku MCP backend contract CI

on:
  pull_request:
    paths:
      - .github/workflows/heroku-mcp-backend-manual.yml
      - .github/workflows/heroku-mcp-backend-contract-ci.yml
      - mcp/apps/backend/**
      - mcp/test/heroku-mcp-backend-*.mjs
      - mcp/test/phase-6c0b-persistence-boundary.test.mjs
      - mcp/package.json
      - packages/contracts/**
  push:
    branches:
      - agent/heroku-mcp-backend-contract
      - agent/phase-6c0b-provider-neutral-mcp
    paths:
      - .github/workflows/heroku-mcp-backend-manual.yml
      - .github/workflows/heroku-mcp-backend-contract-ci.yml
      - mcp/apps/backend/**
      - mcp/test/heroku-mcp-backend-*.mjs
      - mcp/test/phase-6c0b-persistence-boundary.test.mjs
      - mcp/package.json
      - packages/contracts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP workspace dependencies
        working-directory: mcp
        run: npm ci

      - name: Install backend workspace dependencies
        run: npm ci --prefix mcp/apps/backend

      - name: Verify MCP backend
        run: npm --workspace mcp/apps/backend run verify

      - name: Run Heroku MCP contract tests
        run: npm --workspace mcp run test:heroku-mcp-backend-contract

      - name: Run Heroku MCP runtime tests
        run: npm --workspace mcp run test:heroku-mcp-backend-runtime

      - name: Run Phase 6C.0B persistence boundary tests
        run: node --test mcp/test/phase-6c0b-persistence-boundary.test.mjs

      - name: Verify Vercel deployment control remains unchanged
        run: npm --workspace mcp run test:vercel-deployment-control

      - name: Typecheck MCP frontend
        run: npm --workspace mcp run typecheck

      - name: Build MCP frontend
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:3001
          BACKEND_API_TOKEN: 0123456789abcdef0123456789abcdef
          MCP_LEGACY_ACTOR_ID: service:ci:mcp-v1
        run: npm --workspace mcp run build

      - name: Build MCP backend container
        run: docker build -f mcp/apps/backend/Dockerfile . -t heroku-mcp-backend:${{ github.sha }}

      - name: Smoke the MCP backend container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(
            docker run -d --rm \
              -p 127.0.0.1:3001:3001 \
              -e NODE_ENV=production \
              -e HOST=0.0.0.0 \
              -e PORT=3001 \
              -e LEGACY_INTERNAL_PORT=3002 \
              -e INSTALLATION_ID=fixture-installation \
              -e NPP_CODE=fixture-code \
              -e MCP_LEGACY_ACTOR_ID=service:fixture-code:mcp-v1 \
              -e BACKEND_API_TOKEN=fixture-backend-token-0123456789abcdef \
              -e PERSISTENCE_PROVIDER=postgresql \
              -e MCP_DB_SCHEMA=mcp \
              -e CORS_ORIGINS=http://127.0.0.1 \
              -e AUTH_MODE=proxy-service \
              heroku-mcp-backend:${{ github.sha }}
          )"

          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          smoke() {
            local path="$1"
            local expected="$2"
            local deadline=$((SECONDS + 180))
            local last_status=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              last_status="$(
                curl --silent --show-error \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  "http://127.0.0.1:3001${path}" || true
              )"
              if [ "$last_status" = "$expected" ]; then
                return 0
              fi
              sleep 3
            done
            docker logs "$container_id" >&2 || true
            echo "Container smoke failed for ${path} (expected=${expected}, last_status=${last_status:-none})" >&2
            exit 1
          }

          smoke /health/live 200
          smoke /health/ready 503
          smoke /health 503
          smoke /api/health 503
