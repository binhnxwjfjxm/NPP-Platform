name: Generate MCP PostgreSQL parity migration

on:
  pull_request:
    branches: [main]
    paths:
      - mcp/ops/generate-postgresql-supabase-parity.mjs
      - mcp/ops/patch-postgresql-supabase-parity-generator.mjs
      - mcp/ops/patch-postgresql-supabase-parity-columns.mjs
      - mcp/ops/patch-postgresql-supabase-parity-functions.mjs
      - mcp/ops/patch-postgresql-supabase-add-route-customer.mjs
      - mcp/ops/patch-postgresql-supabase-parity-tenancy.mjs
      - mcp/ops/patch-postgresql-legacy-provider-idempotency.mjs
      - mcp/ops/audit-postgresql-supabase-parity-columns.mjs
      - mcp/ops/audit-legacy-provider-calls.mjs
      - mcp/ops/audit-postgresql-provider-function-coverage.mjs
      - mcp/supabase/migrations/**
      - .github/workflows/generate-mcp-postgresql-parity.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/mcp-supabase-write-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalize patch template
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mcp/ops/patch-postgresql-supabase-parity-generator.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('const manualFunctions = String.raw`', 'const manualFunctions = `')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Complete generator fallbacks
        run: node mcp/ops/patch-postgresql-supabase-parity-generator.mjs

      - name: Add complete parity fields
        run: node mcp/ops/patch-postgresql-supabase-parity-columns.mjs

      - name: Include every legacy RPC function
        run: node mcp/ops/patch-postgresql-supabase-parity-functions.mjs

      - name: Port add-route-customer behavior
        run: node mcp/ops/patch-postgresql-supabase-add-route-customer.mjs

      - name: Enforce installation scope
        run: node mcp/ops/patch-postgresql-supabase-parity-tenancy.mjs

      - name: Stabilize command fingerprints
        run: node mcp/ops/patch-postgresql-legacy-provider-idempotency.mjs

      - name: Generate canonical and packaged migration
        run: node mcp/ops/generate-postgresql-supabase-parity.mjs

      - name: Audit all referenced columns
        shell: bash
        run: |
          set +e
          node mcp/ops/audit-postgresql-supabase-parity-columns.mjs > /tmp/parity-audit.json
          status=$?
          set -e
          cat /tmp/parity-audit.json
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const audit = JSON.parse(readFileSync('/tmp/parity-audit.json', 'utf8'));
          console.log(`MISSING_COLUMNS=${audit.missing.map(({ table, column }) => `${table}.${column}`).join(',')}`);
          NODE
          exit "$status"

      - name: Inventory legacy provider calls
        run: node mcp/ops/audit-legacy-provider-calls.mjs

      - name: Require a PostgreSQL function for every legacy RPC
        run: node mcp/ops/audit-postgresql-provider-function-coverage.mjs

      - name: Commit generator, provider and migration
        shell: bash
        run: |
          set -euo pipefail
          tracked=(
            mcp/ops/generate-postgresql-supabase-parity.mjs
            mcp/ops/patch-postgresql-supabase-parity-generator.mjs
            mcp/ops/patch-postgresql-supabase-parity-columns.mjs
            mcp/ops/patch-postgresql-supabase-parity-functions.mjs
            mcp/ops/patch-postgresql-supabase-add-route-customer.mjs
            mcp/ops/patch-postgresql-supabase-parity-tenancy.mjs
            mcp/ops/patch-postgresql-legacy-provider-idempotency.mjs
            mcp/ops/audit-postgresql-supabase-parity-columns.mjs
            mcp/ops/audit-legacy-provider-calls.mjs
            mcp/ops/audit-postgresql-provider-function-coverage.mjs
            mcp/apps/backend/foundation/postgresql-legacy-provider.js
            database/migrations/mcp/003_mcp_supabase_contract_parity.sql
            mcp/apps/backend/foundation/migrations/sql/003_mcp_supabase_contract_parity.sql
          )
          if git diff --quiet -- "${tracked[@]}"; then
            echo 'Generator, provider and migration are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m 'feat(mcp): generate Supabase PostgreSQL parity migration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
