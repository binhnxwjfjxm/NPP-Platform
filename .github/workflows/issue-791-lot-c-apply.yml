name: Issue 791 Lot C apply

on:
  push:
    branches:
      - agent/issue-791-lot-c-direct-price-discount

permissions:
  contents: write

concurrency:
  group: issue-791-lot-c-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_lot_c
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_lot_c
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: npp_lot_c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d npp_lot_c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify branch baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/issue-791-lot-c-direct-price-discount"
          git merge-base --is-ancestor 963c9a3a7f2f9aaf6f91ab4b991d80a17480acaf HEAD
      - name: Recover reviewed patch script
        shell: bash
        run: |
          set -euo pipefail
          git show 8dd25caf6ac882ae2c8b8cef09fbd18951b96ebd:.github/workflows/issue-791-lot-c-apply.yml > /tmp/lot-c-old.yml
          python -c "from pathlib import Path; s=Path('/tmp/lot-c-old.yml').read_text(); a=s.index(\"          python <<'PY'\\n\") + len(\"          python <<'PY'\\n\"); b=s.index(\"          PY\\n\", a); body=''.join((line[10:] if line.startswith('          ') else line) for line in s[a:b].splitlines(True)); Path('/tmp/lot-c-apply.py').write_text(body)"
      - name: Apply reviewed Lô C patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/lot-c-apply.py')
          text = path.read_text()
          old = "replace_once(form, old_price_ui, new_price_ui)"
          new = "p = Path(form); source = p.read_text(); updated, count = re.subn(r\"                <div className=\\{styles\\.priceCell\\}><span>Giá nền</span>.*?                \\)\\}\\n(?=                <div\\n                  id=\\{`sales-order-line-details-)\", lambda _match: new_price_ui, source, count=1, flags=re.S); count == 1 or (_ for _ in ()).throw(SystemExit(f'{form}: expected one price UI block, got {count}')); p.write_text(updated)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one price replacement call, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python /tmp/lot-c-apply.py
      - name: Reconcile all known Lô C regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          permission_paths = [
              Path('npp-core/api/test/sales-order-transaction.test.js'),
              Path('npp-core/api/test/sales-order-idempotency-transaction.test.js'),
          ]
          old_permission = "      permissions: Object.freeze([]),\n"
          new_permission = "      permissions: Object.freeze(['core.sales-order.discount.override']),\n"
          for path in permission_paths:
              text = path.read_text()
              count = text.count(old_permission)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one empty permission fixture, got {count}')
              path.write_text(text.replace(old_permission, new_permission, 1))

          replacements = {
              Path('npp-core/web/test/sales-order-commercial-controls-contract.test.js'): [
                  (
                      "  assert.match(form, /aria-expanded=\\{expandedLineId === line\\.variantId\\}/);\n",
                      "  assert.match(form, /aria-expanded=\\{expandedLineId === line\\.clientLineId\\}/);\n",
                  ),
                  (
                      "  assert.match(form, /hidden=\\{expandedLineId !== line\\.variantId\\}/);\n",
                      "  assert.match(form, /hidden=\\{expandedLineId !== line\\.clientLineId\\}/);\n",
                  ),
              ],
              Path('npp-core/web/test/sales-order-ui.test.js'): [
                  (
                      "  assert.match(formSource, /Giá bán cuối/);\n",
                      "  assert.match(formSource, /Đơn giá/);\n",
                  ),
                  (
                      "  assert.match(formSource, /aria-expanded=\\{expandedLineId === line\\.variantId\\}/);\n",
                      "  assert.match(formSource, /aria-expanded=\\{expandedLineId === line\\.clientLineId\\}/);\n",
                  ),
              ],
          }
          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one stale assertion, got {count}: {old.strip()}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Prepare isolated PostgreSQL
        run: npm --workspace npp-core-api run migration:migrate
      - name: Verify Công Ty API sales-order slice
        run: npm --workspace npp-core-api run verify:sales-order
      - name: Verify Công Ty web typecheck and source regressions
        run: |
          npm --workspace npp-core-web run typecheck
          npm --workspace npp-core-web run test
      - name: Commit implementation once
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-791-lot-c-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core .github/workflows/issue-791-lot-c-apply.yml
          git diff --cached --check
          git commit -m "feat(company): hoàn thiện Lô C giá và CK trực tiếp #791"
          git push origin HEAD:agent/issue-791-lot-c-direct-price-discount