name: Issue 791 Lot C apply

on:
  push:
    branches:
      - agent/issue-791-lot-c-direct-price-discount

permissions:
  contents: write

concurrency:
  group: issue-791-lot-c-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify branch baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/issue-791-lot-c-direct-price-discount"
          git merge-base --is-ancestor 963c9a3a7f2f9aaf6f91ab4b991d80a17480acaf HEAD
      - name: Apply Lot C contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 exact match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 regex match, got {count}: {pattern[:100]!r}")
              p.write_text(updated)

          form = 'npp-core/web/app/sales/sales-orders/SalesOrderCommercialForm.tsx'
          types = 'npp-core/web/lib/sales-order-types.ts'
          service = 'npp-core/api/src/services/sales-order.js'
          commercial_repo = 'npp-core/api/src/db/repositories/sales-order-commercial.js'
          permissions = 'npp-core/api/src/access/permissions-sales.js'
          css = 'npp-core/web/app/sales/sales-orders/sales-orders.module.css'
          api_contract_test = 'npp-core/api/test/issue-736-pricing-preview-contract.test.js'
          web_regression = 'npp-core/web/test/issue-736-sales-order-regression.test.mjs'
          commercial_e2e = 'npp-core/web/e2e/sales-orders-commercial.spec.ts'

          # Shared web contract: expose per-line discount on draft payload.
          replace_once(types,
              "export type SalesOrderDocumentDiscountMode = 'NONE' | 'PERCENT' | 'TOTAL_AMOUNT';\n",
              "export type SalesOrderDocumentDiscountMode = 'NONE' | 'PERCENT' | 'TOTAL_AMOUNT';\nexport type SalesOrderLineDiscountMode = 'TOTAL_AMOUNT' | 'PER_UNIT' | 'PERCENT';\n")
          replace_once(types,
              "  discountMode: 'TOTAL_AMOUNT' | 'PER_UNIT' | 'PERCENT';\n",
              "  discountMode: SalesOrderLineDiscountMode;\n")
          replace_once(types,
              "  manualReason?: string;\n  expectedSystemUnitPriceMinor?: string;\n",
              "  manualReason?: string;\n  discountMode?: SalesOrderLineDiscountMode;\n  discountValue?: string;\n  expectedSystemUnitPriceMinor?: string;\n")

          # Backend: permissioned direct price no longer requires a typed reason.
          old_manual = '''  const reason = String(line.manualReason ?? '').trim();
  if (!reason || reason.length > 500) {
    return failure(
      'PRICE_OVERRIDE_REASON_REQUIRED',
      'Price override reason is required and must not exceed 500 characters',
      false,
      { line: lineNumber },
    );
  }
  return { ok: true, value, reason };
'''
          new_manual = '''  const reason = String(line.manualReason ?? '').trim();
  if (reason.length > 500) {
    return failure(
      'PRICE_OVERRIDE_REASON_INVALID',
      'Price override reason must not exceed 500 characters',
      false,
      { line: lineNumber },
    );
  }
  return { ok: true, value, reason: reason || null };
'''
          replace_once(service, old_manual, new_manual)

          replace_once(service,
              "  const documentDiscount = normalizeDocumentDiscount(payload, requestContext);\n  if (!documentDiscount.ok) return documentDiscount;\n  if (documentDiscount.positive && payload.lines.some(nonZeroLegacyLineDiscount)) {\n",
              "  const documentDiscount = normalizeDocumentDiscount(payload, requestContext);\n  if (!documentDiscount.ok) return documentDiscount;\n  const hasLineDiscount = payload.lines.some(nonZeroLegacyLineDiscount);\n  if (hasLineDiscount && !hasPermission(requestContext, 'core.sales-order.discount.override')) {\n    return failure(\n      'LINE_DISCOUNT_FORBIDDEN',\n      'Line discount permission is required',\n    );\n  }\n  if (documentDiscount.positive && hasLineDiscount) {\n")

          replace_once(service,
              "      fingerprint,\n      manualReason: manual.reason,\n    }));\n",
              "      fingerprint,\n      manualOverride: manual.value !== null,\n      manualReason: manual.reason,\n    }));\n")
          replace_once(service,
              "    manualUnitPriceMinor: line.finalUnitPriceMinor,\n    manualReason: line.manualReason ?? `system-price:${line.fingerprint}`,\n",
              "    manualUnitPriceMinor: line.finalUnitPriceMinor,\n    manualReason: line.manualReason ?? (line.manualOverride\n      ? 'permission-price-override'\n      : `system-price:${line.fingerprint}`),\n")

          # Commercial snapshot must distinguish a manual price even when no reason was typed.
          replace_once(commercial_repo,
              "  for (const line of lines) {\n    const source = line.manualReason ? 'MANUAL_OVERRIDE' : 'PRICE_ENGINE';\n",
              "  for (const line of lines) {\n    const source = line.manualOverride ? 'MANUAL_OVERRIDE' : 'PRICE_ENGINE';\n")
          replace_once(commercial_repo,
              "      ...(line.manualReason\n        ? [{\n            kind: 'MANUAL_OVERRIDE',\n            reason: line.manualReason,\n",
              "      ...(line.manualOverride\n        ? [{\n            kind: 'MANUAL_OVERRIDE',\n            reason: line.manualReason ?? null,\n")

          # Office language in Role permissions.
          replace_once(permissions,
              "  ['coreSalesOrderPriceOverride', 'Bán hàng', 'Ghi đè giá bán', 'Cho phép ghi đè giá bán do hệ thống phân giải khi có lý do.'],\n  ['coreSalesOrderDiscountOverride', 'Bán hàng', 'Chiết khấu bổ sung toàn đơn', 'Cho phép áp dụng chiết khấu bổ sung toàn đơn có lý do và phân bổ chính xác xuống từng dòng.'],\n",
              "  ['coreSalesOrderPriceOverride', 'Bán hàng', 'Sửa giá bán trên đơn', 'Cho phép sửa trực tiếp đơn giá trên dòng hàng; hệ thống tự lưu lịch sử thay đổi.'],\n  ['coreSalesOrderDiscountOverride', 'Bán hàng', 'Sửa chiết khấu bán hàng', 'Cho phép nhập chiết khấu theo từng dòng hoặc chiết khấu bổ sung toàn đơn theo đúng chính sách.'],\n")

          # Frontend contract/type additions.
          replace_once(form,
              "  SalesOrderEntrySettings,\n  SalesOrderSkuSearchOption,\n",
              "  SalesOrderEntrySettings,\n  SalesOrderLineDiscountMode,\n  SalesOrderSkuSearchOption,\n")
          replace_once(form,
              "  manualUnitPriceMinor: string;\n  manualReason: string;\n  pricingFingerprint: string;\n",
              "  manualUnitPriceMinor: string;\n  discountMode: SalesOrderLineDiscountMode;\n  discountValue: string;\n  pricingFingerprint: string;\n")

          old_version_lines = '''function versionLines(version?: SalesOrderVersion | null): LineDraft[] {
  return (version?.lines ?? []).map((line) => ({
    clientLineId: line.id,
    variantId: line.variantId,
    sku: line.sku,
    name: line.itemName,
    unitCode: line.unitCode,
    quantity: compactQuantity(line.quantity),
    taxMode: line.taxMode,
    taxRate: line.taxRate,
    baseUnitPriceMinor: line.baseUnitPrice ?? line.unitPrice,
    systemUnitPriceMinor: line.systemUnitPrice ?? line.unitPrice,
    manualUnitPriceMinor: line.priceSource === 'MANUAL_OVERRIDE' ? line.unitPrice : '',
    manualReason: line.manualOverrideReason ?? '',
    pricingFingerprint: resolutionFingerprint(line.pricingTrace ?? []),
    priceSteps: line.pricingTrace ?? [],
    resolvingPrice: false,
    priceError: null,
    pricingErrorCode: null,
  }));
}
'''
          new_version_lines = '''function versionLines(version?: SalesOrderVersion | null): LineDraft[] {
  const documentDiscountActive = version?.documentDiscountMode !== 'NONE'
    && (parseScaled(version?.documentDiscountValue ?? '0', true) ?? 0n) > 0n;
  return (version?.lines ?? []).map((line) => ({
    clientLineId: line.id,
    variantId: line.variantId,
    sku: line.sku,
    name: line.itemName,
    unitCode: line.unitCode,
    quantity: compactQuantity(line.quantity),
    taxMode: line.taxMode,
    taxRate: line.taxRate,
    baseUnitPriceMinor: line.baseUnitPrice ?? line.unitPrice,
    systemUnitPriceMinor: line.systemUnitPrice ?? line.unitPrice,
    manualUnitPriceMinor: line.priceSource === 'MANUAL_OVERRIDE' ? line.unitPrice : '',
    discountMode: documentDiscountActive ? 'TOTAL_AMOUNT' : line.discountMode,
    discountValue: documentDiscountActive ? '0' : line.discountValue,
    pricingFingerprint: resolutionFingerprint(line.pricingTrace ?? []),
    priceSteps: line.pricingTrace ?? [],
    resolvingPrice: false,
    priceError: null,
    pricingErrorCode: null,
  }));
}
'''
          replace_once(form, old_version_lines, new_version_lines)
          replace_once(form,
              "function hasValidManualPrice(line: LineDraft): boolean {\n  return /^\\d+$/.test(line.manualUnitPriceMinor.trim()) && Boolean(line.manualReason.trim());\n}\n",
              "function hasValidManualPrice(line: LineDraft): boolean {\n  return /^\\d+$/.test(line.manualUnitPriceMinor.trim());\n}\n")

          insert_after_gross = '''function grossMinor(line: LineDraft): bigint {
  const quantity = parseScaled(line.quantity, false) ?? 0n;
  const price = /^\\d+$/.test(finalUnitPrice(line)) ? BigInt(finalUnitPrice(line)) : 0n;
  return halfUp(quantity * price, SCALE);
}
'''
          discount_helpers = insert_after_gross + '''
function lineDiscountMinor(line: LineDraft): bigint | null {
  const gross = grossMinor(line);
  const quantity = parseScaled(line.quantity, false);
  const scaled = parseScaled(line.discountValue || '0', true);
  if (scaled === null || quantity === null) return null;
  let discount: bigint;
  if (line.discountMode === 'PERCENT') {
    if (scaled > HUNDRED) return null;
    discount = halfUp(gross * scaled, HUNDRED);
  } else {
    if (scaled % SCALE !== 0n) return null;
    const money = scaled / SCALE;
    discount = line.discountMode === 'PER_UNIT'
      ? halfUp(quantity * money, SCALE)
      : money;
  }
  return discount <= gross ? discount : null;
}

function discountValueText(line: LineDraft): string {
  const value = line.discountValue || '0';
  if (line.discountMode === 'PERCENT') return `${value}%`;
  return line.discountMode === 'PER_UNIT' ? `${vnd(value)} / ĐVT` : vnd(value);
}
'''
          replace_once(form, insert_after_gross, discount_helpers)

          replace_once(form,
              "  const [expandedLineId, setExpandedLineId] = useState<string | null>(null);\n  const [manualEditorLineId, setManualEditorLineId] = useState<string | null>(null);\n",
              "  const [expandedLineId, setExpandedLineId] = useState<string | null>(null);\n")

          old_estimate = '''  const estimate = useMemo(() => {
    const gross = lines.map(grossMinor);
    const grossTotal = gross.reduce((sum, value) => sum + value, 0n);
    const target = documentDiscountTarget(documentDiscountMode, documentDiscountValue, grossTotal);
    const allocations = target === null ? null : largestRemainder(gross, target);
    const details = lines.map((line, index) => estimateLine(line, allocations?.[index] ?? 0n));
    return {
      valid: target !== null && allocations !== null,
      gross: grossTotal,
      discount: allocations?.reduce((sum, value) => sum + value, 0n) ?? 0n,
      tax: details.reduce((sum, value) => sum + value.tax, 0n),
      total: details.reduce((sum, value) => sum + value.total, 0n),
      allocations,
    };
  }, [documentDiscountMode, documentDiscountValue, lines]);
'''
          new_estimate = '''  const estimate = useMemo(() => {
    const gross = lines.map(grossMinor);
    const grossTotal = gross.reduce((sum, value) => sum + value, 0n);
    const lineDiscounts = lines.map(lineDiscountMinor);
    const lineDiscountValid = lineDiscounts.every((value) => value !== null);
    const lineDiscountValues = lineDiscounts.map((value) => value ?? 0n);
    const lineDiscountTotal = lineDiscountValues.reduce((sum, value) => sum + value, 0n);
    const target = documentDiscountTarget(documentDiscountMode, documentDiscountValue, grossTotal);
    const documentAllocations = target === null ? null : largestRemainder(gross, target);
    const documentDiscountTotal = documentAllocations?.reduce((sum, value) => sum + value, 0n) ?? 0n;
    const mixedScope = lineDiscountTotal > 0n && documentDiscountTotal > 0n;
    const effectiveDiscounts = documentDiscountTotal > 0n
      ? (documentAllocations ?? gross.map(() => 0n))
      : lineDiscountValues;
    const details = lines.map((line, index) => estimateLine(line, effectiveDiscounts[index] ?? 0n));
    return {
      valid: target !== null && documentAllocations !== null && lineDiscountValid && !mixedScope,
      gross: grossTotal,
      discount: effectiveDiscounts.reduce((sum, value) => sum + value, 0n),
      tax: details.reduce((sum, value) => sum + value.tax, 0n),
      total: details.reduce((sum, value) => sum + value.total, 0n),
      lineDiscountTotal,
      documentDiscountTotal,
      mixedScope,
      details,
    };
  }, [documentDiscountMode, documentDiscountValue, lines]);

  const hasLineDiscount = estimate.lineDiscountTotal > 0n;
'''
          replace_once(form, old_estimate, new_estimate)

          replace_once(form,
              "      manualUnitPriceMinor: '',\n      manualReason: '',\n      pricingFingerprint: '',\n",
              "      manualUnitPriceMinor: '',\n      discountMode: 'PERCENT',\n      discountValue: '0',\n      pricingFingerprint: '',\n")
          replace_once(form,
              "      if (details.code === 'BASE_PRICE_NOT_FOUND' && canPriceOverride) {\n        setManualEditorLineId(option.id);\n      }\n",
              "")

          regex_once(form,
              r"\n  function enableManualPrice\(index: number\) \{.*?\n  function useSystemPrice\(index: number\) \{\n    setLines\(\(current\) => current\.map\(\(line, itemIndex\) => itemIndex === index \? \{\n      \.\.\.line,\n      manualUnitPriceMinor: '',\n      manualReason: '',\n    \} : line\)\);\n    setManualEditorLineId\(null\);\n    markDirty\(\);\n  \}\n",
              "\n  function useSystemPrice(index: number) {\n    setLines((current) => current.map((line, itemIndex) => itemIndex === index ? {\n      ...line,\n      manualUnitPriceMinor: '',\n    } : line));\n    markDirty();\n  }\n",
              flags=re.S)

          replace_once(form,
              "    if (lines.some((line) => line.manualUnitPriceMinor && (!canPriceOverride || !hasValidManualPrice(line)))) {\n      return 'Giá điều chỉnh thủ công cần đúng quyền, giá bán cuối hợp lệ và lý do riêng từng dòng';\n    }\n    if (!taxReady) return 'Chưa tải được chính sách thuế mặc định từ Công Ty';\n    if (!estimate.valid) return 'Chiết khấu bổ sung không hợp lệ hoặc vượt tiền hàng';\n",
              "    if (lines.some((line) => line.manualUnitPriceMinor && (!canPriceOverride || !hasValidManualPrice(line)))) {\n      return 'Đơn giá sửa trực tiếp cần đúng quyền và là số tiền VND hợp lệ';\n    }\n    if (lines.some((line) => lineDiscountMinor(line) === null)) return 'Chiết khấu từng dòng không hợp lệ hoặc vượt tiền hàng';\n    if (estimate.lineDiscountTotal > 0n && !canDiscountOverride) return 'Cần quyền sửa chiết khấu bán hàng để nhập CK từng dòng';\n    if (estimate.mixedScope) return 'Chỉ dùng CK từng dòng hoặc chiết khấu toàn đơn trong cùng một đơn';\n    if (!taxReady) return 'Chưa tải được chính sách thuế mặc định từ Công Ty';\n    if (!estimate.valid) return 'Chiết khấu không hợp lệ hoặc vượt tiền hàng';\n")

          replace_once(form,
              "        taxMode: line.taxMode,\n        taxRate: line.taxRate,\n        ...(line.pricingFingerprint ? {\n",
              "        taxMode: line.taxMode,\n        taxRate: line.taxRate,\n        discountMode: line.discountMode,\n        discountValue: line.discountValue || '0',\n        ...(line.pricingFingerprint ? {\n")
          replace_once(form,
              "        ...(line.manualUnitPriceMinor ? {\n          manualUnitPriceMinor: line.manualUnitPriceMinor,\n          manualReason: line.manualReason.trim(),\n        } : {}),\n",
              "        ...(line.manualUnitPriceMinor ? {\n          manualUnitPriceMinor: line.manualUnitPriceMinor,\n        } : {}),\n")

          # Use client-line identity for expandable UI now; duplicate-SKU database work stays in Lot D.
          replace_once(form,
              "aria-expanded={expandedLineId === line.variantId}\n",
              "aria-expanded={expandedLineId === line.clientLineId}\n")
          replace_once(form,
              "onClick={() => setExpandedLineId((current) => current === line.variantId ? null : line.variantId)}\n",
              "onClick={() => setExpandedLineId((current) => current === line.clientLineId ? null : line.clientLineId)}\n")
          replace_once(form,
              "{expandedLineId === line.variantId ? 'Ẩn chi tiết' : 'Chi tiết'}\n",
              "{expandedLineId === line.clientLineId ? 'Ẩn chi tiết' : 'Chi tiết'}\n")
          replace_once(form,
              "hidden={expandedLineId !== line.variantId}\n",
              "hidden={expandedLineId !== line.clientLineId}\n")

          replace_once(form,
              "            <header className={styles.lineTableHeader}><span>STT</span><span>Hàng hóa</span><span>ĐVT</span><span>Số lượng</span><span>Giá nền</span><span>Giá hệ thống</span><span>Giá cuối</span><span>Thành tiền</span><span /></header>\n",
              "            <header className={styles.lineTableHeader}><span>STT</span><span>Hàng hóa</span><span>ĐVT</span><span>SL</span><span>Đơn giá</span><span>CK</span><span>Thành tiền</span><span /></header>\n")

          old_price_ui = '''                <div className={styles.priceCell}><span>Giá nền</span><strong>{automaticPriceText(line, line.baseUnitPriceMinor)}</strong></div>
                <div className={styles.priceCell}><span>Giá hệ thống</span><strong>{automaticPriceText(line, line.systemUnitPriceMinor)}</strong><small>{pricingSummary(line)}</small></div>
                <div className={styles.priceCell}>
                  <span>Giá bán cuối</span>
                  <div className={styles.inlineActions}>
                    <strong>{line.manualUnitPriceMinor ? vnd(line.manualUnitPriceMinor) : (line.pricingFingerprint ? automaticPriceText(line, line.systemUnitPriceMinor) : '—')}</strong>
                    {!line.manualUnitPriceMinor && canPriceOverride && (
                      <button type="button" className={styles.linkButton} aria-label={`Dùng giá điều chỉnh thủ công cho ${line.sku}`} onClick={() => enableManualPrice(index)}>Nhập giá bán</button>
                    )}
                    {line.manualUnitPriceMinor && canPriceOverride && (
                      <button type="button" className={styles.linkButton} aria-label={`Sửa giá điều chỉnh thủ công cho ${line.sku}`} onClick={() => setManualEditorLineId(line.variantId)}>Sửa giá</button>
                    )}
                    {line.manualUnitPriceMinor && line.pricingFingerprint && (
                      <button type="button" className={styles.linkButton} aria-label={`Dùng lại giá hệ thống cho ${line.sku}`} onClick={() => useSystemPrice(index)}>Giá hệ thống</button>
                    )}
                  </div>
                  {line.manualUnitPriceMinor && <small className={styles.manualBadge}>Giá nhập tay</small>}
                </div>
                <div className={styles.priceCell}><span>Tiền hàng dự kiến</span><strong>{vnd(grossMinor(line))}</strong></div>
                <button type="button" className={styles.removeLineButton} onClick={() => { setLines((current) => current.filter((_, itemIndex) => itemIndex !== index)); if (manualEditorLineId === line.variantId) setManualEditorLineId(null); markDirty(); }}>Xóa</button>

                {manualEditorLineId === line.variantId && (
                  <div className={styles.manualPriceEditor}>
                    <label><span>Giá bán cuối *</span><input inputMode="numeric" value={line.manualUnitPriceMinor} onChange={(event) => { const value = event.target.value.replace(/\\D/g, ''); setLines((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, manualUnitPriceMinor: value } : item)); markDirty(); }} /></label>
                    <label><span>Lý do điều chỉnh giá *</span><input value={line.manualReason} maxLength={500} onChange={(event) => { const value = event.target.value; setLines((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, manualReason: value } : item)); markDirty(); }} placeholder="Ví dụ: Giá chợ theo ngày" /></label>
                    <p>{line.pricingFingerprint ? <>Giá hệ thống để đối chiếu: <strong>{vnd(line.systemUnitPriceMinor)}</strong></> : <strong>Chưa có giá Công Ty</strong>}</p>
                    <button type="button" className={styles.primaryButton} onClick={() => finishManualPrice(index)}>Xong</button>
                  </div>
                )}
'''
          new_price_ui = '''                <div className={styles.priceCell}>
                  <span>Đơn giá</span>
                  {canPriceOverride ? (
                    <input
                      className={styles.directPriceInput}
                      aria-label={`Đơn giá ${line.sku}`}
                      inputMode="numeric"
                      value={line.manualUnitPriceMinor || (line.pricingFingerprint ? line.systemUnitPriceMinor : '')}
                      placeholder={line.pricingErrorCode === 'BASE_PRICE_NOT_FOUND' ? 'Nhập giá' : undefined}
                      onFocus={(event) => event.currentTarget.select()}
                      onClick={(event) => event.currentTarget.select()}
                      onChange={(event) => {
                        const value = event.target.value.replace(/\\D/g, '');
                        setLines((current) => current.map((item, itemIndex) => itemIndex === index ? {
                          ...item,
                          manualUnitPriceMinor: value,
                        } : item));
                        markDirty();
                      }}
                    />
                  ) : (
                    <strong>{line.pricingFingerprint ? automaticPriceText(line, line.systemUnitPriceMinor) : '—'}</strong>
                  )}
                  {line.manualUnitPriceMinor && <small className={styles.manualBadge}>Giá đã sửa</small>}
                  {line.manualUnitPriceMinor && line.pricingFingerprint && canPriceOverride && (
                    <button type="button" className={styles.linkButton} aria-label={`Dùng lại giá hệ thống cho ${line.sku}`} onClick={() => useSystemPrice(index)}>Giá hệ thống</button>
                  )}
                </div>
                <div className={styles.discountCell}>
                  <span>CK</span>
                  {canDiscountOverride ? (
                    <div className={styles.discountControls}>
                      <select
                        aria-label={`Cách CK ${line.sku}`}
                        value={line.discountMode}
                        disabled={estimate.documentDiscountTotal > 0n}
                        onChange={(event) => {
                          const mode = event.target.value as SalesOrderLineDiscountMode;
                          setLines((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, discountMode: mode } : item));
                          markDirty();
                        }}
                      >
                        <option value="PERCENT">%</option>
                        <option value="PER_UNIT">đ/ĐVT</option>
                        <option value="TOTAL_AMOUNT">Tổng đ</option>
                      </select>
                      <input
                        aria-label={`Chiết khấu ${line.sku}`}
                        inputMode="decimal"
                        value={line.discountValue}
                        disabled={estimate.documentDiscountTotal > 0n}
                        onFocus={(event) => event.currentTarget.select()}
                        onClick={(event) => event.currentTarget.select()}
                        onChange={(event) => {
                          const raw = event.target.value;
                          const value = line.discountMode === 'PERCENT'
                            ? raw.replace(/[^0-9.]/g, '')
                            : raw.replace(/\\D/g, '');
                          setLines((current) => current.map((item, itemIndex) => itemIndex === index ? { ...item, discountValue: value } : item));
                          markDirty();
                        }}
                      />
                    </div>
                  ) : (
                    <strong>{discountValueText(line)}</strong>
                  )}
                </div>
                <div className={styles.priceCell}><span>Thành tiền</span><strong>{vnd(estimate.details[index]?.total ?? 0n)}</strong></div>
                <button type="button" className={styles.removeLineButton} onClick={() => { setLines((current) => current.filter((_, itemIndex) => itemIndex !== index)); markDirty(); }}>Xóa</button>
'''
          replace_once(form, old_price_ui, new_price_ui)

          replace_once(form,
              "                  <div className={styles.priceTrace}>\n                    {line.priceSteps.length === 0 && <span>",
              "                  <div className={styles.priceTrace}>\n                    <div><span>Giá nền</span><b>{automaticPriceText(line, line.baseUnitPriceMinor)}</b></div>\n                    <div><span>Giá hệ thống</span><b>{automaticPriceText(line, line.systemUnitPriceMinor)}</b></div>\n                    {line.priceSteps.length === 0 && <span>")

          # Disable whole-order discount while a line discount is active; preserve existing whole-order rule/reason otherwise.
          replace_once(form,
              "value={documentDiscountMode} onChange={(event) => { const mode = event.target.value as SalesOrderDocumentDiscountMode;",
              "value={documentDiscountMode} disabled={hasLineDiscount} onChange={(event) => { const mode = event.target.value as SalesOrderDocumentDiscountMode;")
          replace_once(form,
              "          <section className={styles.taxSummary} aria-label=\"Tổng kết thuế và thanh toán\">\n            <div><span>Tiền hàng theo giá cuối</span><strong>{vnd(estimate.gross)}</strong></div>\n            <div><span>Chiết khấu bổ sung toàn đơn</span><strong>- {vnd(estimate.discount)}</strong></div>\n",
              "          <section className={styles.taxSummary} aria-label=\"Tổng kết thuế và thanh toán\">\n            <div><span>Tiền hàng theo giá cuối</span><strong>{vnd(estimate.gross)}</strong></div>\n            <div><span>Chiết khấu</span><strong>- {vnd(estimate.discount)}</strong></div>\n")

          # Compact business columns: Hàng hóa | ĐVT | SL | Đơn giá | CK | Thành tiền.
          grid_old = "48px minmax(190px,1.35fr) minmax(64px,.42fr) 122px repeat(4,minmax(100px,.65fr)) 52px"
          grid_new = "48px minmax(210px,1.5fr) minmax(64px,.42fr) 122px minmax(130px,.72fr) minmax(150px,.85fr) minmax(120px,.72fr) 52px"
          p = Path(css)
          text = p.read_text()
          if text.count(grid_old) != 2:
              raise SystemExit(f"{css}: expected 2 line grids, got {text.count(grid_old)}")
          text = text.replace(grid_old, grid_new)
          text += "\n.directPriceInput{font-weight:800;font-variant-numeric:tabular-nums}.discountCell{display:grid;gap:.15rem;min-width:0}.discountCell>span{color:#68717d;font-size:.72rem}.discountControls{display:grid;grid-template-columns:62px minmax(72px,1fr);gap:.25rem}.discountControls select,.discountControls input{min-width:0!important;width:100%!important}.discountControls input{text-align:right;font-variant-numeric:tabular-nums}\n"
          p.write_text(text)

          # Reconcile older source contracts to the new owner decision.
          replace_once(api_contract_test,
              "test('Issue #736 keeps save-time manual price permission, reason and system-price concurrency guards', async () => {\n",
              "test('Issue #736 keeps save-time manual price permission and system-price concurrency guards', async () => {\n")
          replace_once(api_contract_test,
              "  assert.match(salesOrder, /PRICE_OVERRIDE_REASON_REQUIRED/);\n",
              "  assert.doesNotMatch(salesOrder, /PRICE_OVERRIDE_REASON_REQUIRED/);\n  assert.match(salesOrder, /PRICE_OVERRIDE_REASON_INVALID/);\n")

          replace_once(web_regression,
              "  assert.match(form, /manualReason: line\\.manualOverrideReason \\?\\? ''/);\n",
              "  assert.match(form, /discountMode: documentDiscountActive \\? 'TOTAL_AMOUNT' : line\\.discountMode/);\n")

          old_e2e_flow = '''    const firstLine = dialog.getByTestId('sales-order-line-1');
    await firstLine.getByRole('button', { name: /^Dùng giá điều chỉnh thủ công/ }).click();
    await firstLine.getByLabel('Giá bán cuối *').fill('8500');
    await firstLine.getByLabel('Lý do điều chỉnh giá *').fill('Giá đã được quản lý duyệt cho E2E');
    await expect(firstLine.getByText('Giá nhập tay', { exact: true })).toBeVisible();
    await firstLine.getByRole('button', { name: /^Dùng lại giá hệ thống/ }).click();
    await expect(firstLine.getByRole('button', { name: /^Dùng giá điều chỉnh thủ công/ })).toBeVisible();

    await dialog.getByTestId('document-discount-mode').selectOption('PERCENT');
    await dialog.getByLabel('Tỷ lệ %').fill('5');
    await dialog.getByLabel('Lý do *').fill('Chiết khấu toàn đơn đã duyệt');
'''
          new_e2e_flow = '''    const firstLine = dialog.getByTestId('sales-order-line-1');
    const directPrice = firstLine.getByLabel('Đơn giá SKU-1');
    await directPrice.fill('8500');
    await expect(firstLine.getByText('Giá đã sửa', { exact: true })).toBeVisible();
    await firstLine.getByRole('button', { name: /^Dùng lại giá hệ thống/ }).click();
    await expect(directPrice).toHaveValue('9001');
    await directPrice.fill('0');
    await expect(directPrice).toHaveValue('0');

    await firstLine.getByLabel('Cách CK SKU-1').selectOption('PERCENT');
    await firstLine.getByLabel('Chiết khấu SKU-1').fill('5');
    await expect(dialog.getByTestId('document-discount-mode')).toBeDisabled();
'''
          replace_once(commercial_e2e, old_e2e_flow, new_e2e_flow)
          replace_once(commercial_e2e,
              "          manualOverrideReason: String(line.manualReason ?? '') || null,\n          pricingTrace: [],\n          discountMode: 'TOTAL_AMOUNT',\n          discountValue: '0',\n",
              "          manualOverrideReason: String(line.manualReason ?? '') || null,\n          pricingTrace: [],\n          discountMode: String(line.discountMode ?? 'TOTAL_AMOUNT'),\n          discountValue: String(line.discountValue ?? '0'),\n")

          # Focused source regressions for Lot C boundaries.
          Path('npp-core/api/test/issue-791-lot-c-direct-price-discount.test.js').write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst servicePath = new URL('../src/services/sales-order.js', import.meta.url);\nconst repositoryPath = new URL('../src/db/repositories/sales-order-commercial.js', import.meta.url);\nconst permissionPath = new URL('../src/access/permissions-sales.js', import.meta.url);\n\ntest('Issue #791 Lô C keeps price override permission, allows zero/no-reason and audits source explicitly', async () => {\n  const [service, repository, permissions] = await Promise.all([\n    readFile(servicePath, 'utf8'), readFile(repositoryPath, 'utf8'), readFile(permissionPath, 'utf8'),\n  ]);\n  assert.match(service, /core\\.sales-order\\.price\\.override/);\n  assert.match(service, /MONEY_PATTERN = \\/\\^\\(\\?:0\\|\\[1-9\\]\\\\d/);\n  assert.doesNotMatch(service, /PRICE_OVERRIDE_REASON_REQUIRED/);\n  assert.match(service, /reason: reason \\|\\| null/);\n  assert.match(service, /manualOverride: manual\\.value !== null/);\n  assert.match(repository, /const source = line\\.manualOverride \\? 'MANUAL_OVERRIDE' : 'PRICE_ENGINE'/);\n  assert.match(repository, /beforeUnitPriceMinor: line\\.systemUnitPriceMinor/);\n  assert.match(repository, /afterUnitPriceMinor: line\\.finalUnitPriceMinor/);\n  assert.match(permissions, /'Sửa giá bán trên đơn'/);\n});\n\ntest('Issue #791 Lô C enforces line discount permission and keeps mixed-scope denial', async () => {\n  const service = await readFile(servicePath, 'utf8');\n  assert.match(service, /hasLineDiscount && !hasPermission\\(requestContext, 'core\\.sales-order\\.discount\\.override'\\)/);\n  assert.match(service, /LINE_DISCOUNT_FORBIDDEN/);\n  assert.match(service, /documentDiscount\\.positive && hasLineDiscount/);\n  assert.match(service, /MIXED_DISCOUNT_SCOPE/);\n});\n''')

          Path('npp-core/web/test/issue-791-lot-c-direct-price-discount.test.mjs').write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst formPath = new URL('../app/sales/sales-orders/SalesOrderCommercialForm.tsx', import.meta.url);\nconst typesPath = new URL('../lib/sales-order-types.ts', import.meta.url);\n\ntest('Issue #791 Lô C edits unit price directly without a reason panel', async () => {\n  const form = await readFile(formPath, 'utf8');\n  assert.match(form, /aria-label={`Đơn giá \\${line\\.sku}`}/);\n  assert.match(form, /onFocus=\\{\\(event\\) => event\\.currentTarget\\.select\\(\\)\\}/);\n  assert.match(form, /manualUnitPriceMinor: value/);\n  assert.doesNotMatch(form, /Lý do điều chỉnh giá \\*/);\n  assert.doesNotMatch(form, /finishManualPrice/);\n  assert.doesNotMatch(form, /manualPriceEditor/);\n  assert.doesNotMatch(form, /manualReason: line\\.manualReason/);\n});\n\ntest('Issue #791 Lô C sends direct per-line discount through the canonical sales-order payload', async () => {\n  const [form, types] = await Promise.all([readFile(formPath, 'utf8'), readFile(typesPath, 'utf8')]);\n  assert.match(types, /SalesOrderLineDiscountMode = 'TOTAL_AMOUNT' \\| 'PER_UNIT' \\| 'PERCENT'/);\n  assert.match(types, /discountMode\\?: SalesOrderLineDiscountMode/);\n  assert.match(form, /aria-label={`Chiết khấu \\${line\\.sku}`}/);\n  assert.match(form, /discountMode: line\\.discountMode/);\n  assert.match(form, /discountValue: line\\.discountValue \\|\\| '0'/);\n  assert.match(form, /estimate\\.mixedScope/);\n});\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify Công Ty API sales-order slice
        run: npm --workspace npp-core-api run verify:sales-order
      - name: Verify Công Ty web typecheck and source regressions
        run: |
          npm --workspace npp-core-web run typecheck
          npm --workspace npp-core-web run test
      - name: Commit implementation once
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-791-lot-c-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core .github/workflows/issue-791-lot-c-apply.yml
          git diff --cached --check
          git commit -m "feat(company): hoàn thiện Lô C giá và CK trực tiếp #791"
          git push origin HEAD:agent/issue-791-lot-c-direct-price-discount
