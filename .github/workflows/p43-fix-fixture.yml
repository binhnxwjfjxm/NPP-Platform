name: P4.3 One-Time Fixture Fix

on:
  push:
    branches:
      - agent/phase-4-inventory-reservations-negative-stock-v2

permissions:
  contents: write

jobs:
  fix-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-inventory-reservations-negative-stock-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Fix placeholder sequence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('npp-core/api/test/inventory-reservations.test.js')
          source = path.read_text(encoding='utf-8')
          old = """       ($1,$4,$5,$8,'SKU cân cơ sở','BASE',true,true,true,true,$11,1,true,$13,$13),
                 ($2,$4,$6,$9,'SKU đếm cơ sở','BASE',true,true,true,true,$12,1,true,$13,$13),
                 ($3,$4,$5,$10,'SKU cân không cơ sở','OTHER',false,true,true,true,$11,1,true,$13,$13)`,
              [
                fractionalVariantId,
                countVariantId,
                nonBaseVariantId,
                installationId,
                fractionalProductId,
                countProductId,
                null,
                `VF-${suffix}`,
                `VC-${suffix}`,
                `VN-${suffix}`,
                fractionalUnitId,
                countUnitId,
                actor,
              ],"""
          new = """       ($1,$4,$5,$7,'SKU cân cơ sở','BASE',true,true,true,true,$10,1,true,$12,$12),
                 ($2,$4,$6,$8,'SKU đếm cơ sở','BASE',true,true,true,true,$11,1,true,$12,$12),
                 ($3,$4,$5,$9,'SKU cân không cơ sở','OTHER',false,true,true,true,$10,1,true,$12,$12)`,
              [
                fractionalVariantId,
                countVariantId,
                nonBaseVariantId,
                installationId,
                fractionalProductId,
                countProductId,
                `VF-${suffix}`,
                `VC-${suffix}`,
                `VN-${suffix}`,
                fractionalUnitId,
                countUnitId,
                actor,
              ],"""
          if source.count(old) != 1:
              raise SystemExit(f'expected one fixture match, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit fixture fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/p43-fix-fixture.yml
          git add npp-core/api/test/inventory-reservations.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(inventory): fix P4.3 variant fixture parameters"
          git push origin HEAD:agent/phase-4-inventory-reservations-negative-stock-v2
