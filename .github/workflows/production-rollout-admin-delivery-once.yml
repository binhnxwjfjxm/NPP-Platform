name: Finish authorized Admin and Delivery production rollout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write

concurrency:
  group: authorized-production-rollout-admin-delivery
  cancel-in-progress: false

jobs:
  rollout:
    if: github.head_ref == 'agent/production-rollout-admin-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEPLOY_REF: main
      APPROVED_TREE_BASE: 5b4a5680ab5368be360c799b9ac22527fcf7f862
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      ADMIN_PROJECT_ID: prj_0hp2A8WyUW4zgglShPTzL70hesVC
      ADMIN_ROOT_DIRECTORY: admin/web
      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com
      DELIVERY_PROJECT_NAME: npp-delivery
      DELIVERY_ROOT_DIRECTORY: delivery/web
      DELIVERY_DOMAIN: log.nguyenlieuhungphat.com
      CORE_HEROKU_APP_NAME: hung-phat
      CORE_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      MCP_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      NPP_URL: https://office.nguyenlieuhungphat.com

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main and approved runtime tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          test -z "$(git diff --name-only "$APPROVED_TREE_BASE"..HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci --ignore-scripts

      - name: Resolve protected Core and Admin runtime values
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          SECRET_CORE_WEB_ADMIN_USERNAME: ${{ secrets.CORE_WEB_ADMIN_USERNAME }}
          SECRET_CORE_WEB_ADMIN_PASSWORD: ${{ secrets.CORE_WEB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          app_json="${RUNNER_TEMP}/core-app.json"
          config_json="${RUNNER_TEMP}/core-config.json"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_HEROKU_APP_NAME" > "$app_json"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_HEROKU_APP_NAME/config-vars" > "$config_json"
          core_url="$(jq -r '.web_url // empty' "$app_json")"
          core_url="${core_url%/}"
          core_token="$(jq -r '.BACKEND_API_TOKEN // empty' "$config_json")"
          admin_username="${SECRET_CORE_WEB_ADMIN_USERNAME:-}"
          admin_password="${SECRET_CORE_WEB_ADMIN_PASSWORD:-}"
          test -n "$core_url"
          test -n "$core_token"
          test -n "$admin_username"
          test -n "$admin_password"
          for value in "$core_url" "$core_token" "$admin_username" "$admin_password"; do
            echo "::add-mask::$value"
          done
          write_env() {
            local name="$1" value="$2" marker="RUNTIME_${RANDOM}_${RANDOM}"
            {
              echo "$name<<$marker"
              echo "$value"
              echo "$marker"
            } >> "$GITHUB_ENV"
          }
          write_env CORE_API_INTERNAL_URL "$core_url"
          write_env CORE_API_SERVER_TOKEN "$core_token"
          write_env CORE_WEB_ADMIN_USERNAME "$admin_username"
          write_env CORE_WEB_ADMIN_PASSWORD "$admin_password"

      - name: Synchronize Admin Vercel project and environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project_json="${RUNNER_TEMP}/admin-project.json"
          settings_payload="$(jq -n --arg root "$ADMIN_ROOT_DIRECTORY" '{framework:"nextjs",rootDirectory:$root,nodeVersion:"24.x"}')"
          status="$(curl --silent --show-error --output "$project_json" --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v9/projects/$ADMIN_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            --data "$settings_payload")"
          test "$status" = 200
          test "$(jq -r '.id' "$project_json")" = "$ADMIN_PROJECT_ID"
          test "$(jq -r '.rootDirectory' "$project_json")" = "$ADMIN_ROOT_DIRECTORY"

          ADMIN_PROJECT_ID="$ADMIN_PROJECT_ID" node --input-type=module <<'NODE'
          const values = {
            CORE_API_INTERNAL_URL: process.env.CORE_API_INTERNAL_URL,
            CORE_API_SERVER_TOKEN: process.env.CORE_API_SERVER_TOKEN,
            CORE_WEB_ADMIN_USERNAME: process.env.CORE_WEB_ADMIN_USERNAME,
            CORE_WEB_ADMIN_PASSWORD: process.env.CORE_WEB_ADMIN_PASSWORD,
            NPP_OPERATIONS_URL: process.env.NPP_URL,
          };
          const response = await fetch(`https://api.vercel.com/v10/projects/${process.env.ADMIN_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}&upsert=true`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.entries(values).map(([key, value]) => ({ key, value, type: 'sensitive', target: ['production'] }))),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`admin_env_sync_failed:${response.status}:${payload?.error?.code || 'unknown'}`);
          NODE

          lookup="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$ADMIN_PROJECT_ID/domains/$ADMIN_DOMAIN?teamId=$VERCEL_ORG_ID")"
          if [ "$lookup" != 200 ]; then
            domain_body="${RUNNER_TEMP}/admin-domain.json"
            status="$(curl --silent --show-error --output "$domain_body" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v10/projects/$ADMIN_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
              --data "{\"name\":\"$ADMIN_DOMAIN\"}")"
            case "$status" in 200|201) ;; *) cat "$domain_body" >&2; exit 1 ;; esac
          fi

      - name: Build and deploy Admin production
        id: admin
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.ADMIN_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@58.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          test "$(jq -r '.projectId' .vercel/project.json)" = "$VERCEL_PROJECT_ID"
          (
            cd admin/web
            npm install --no-audit --no-fund
            npm run verify
          )
          npx --yes vercel@58.0.0 build --prod --token="$VERCEL_TOKEN"
          url="$(npx --yes vercel@58.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke Admin exact deployment and domain
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.admin.outputs.url }}
        run: |
          set -euo pipefail
          auth="${CORE_WEB_ADMIN_USERNAME}:${CORE_WEB_ADMIN_PASSWORD}"
          echo "::add-mask::$auth"
          test "$(curl --silent --show-error --retry 8 --retry-delay 4 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")" = 401
          for base in "$DEPLOYMENT_URL" "https://$ADMIN_DOMAIN"; do
            for path in / /customer-onboarding; do
              code="$(curl --silent --show-error --retry 12 --retry-delay 5 -u "$auth" --output /dev/null --write-out '%{http_code}' "$base$path")"
              test "$code" = 200
            done
          done
          html="$(curl --fail --silent --show-error -u "$auth" "https://$ADMIN_DOMAIN/")"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.(css|js)' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "https://$ADMIN_DOMAIN$asset" >/dev/null

      - name: Create and deploy Delivery fifth Vercel project
        id: delivery
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          SECRET_DELIVERY_WEB_USERS_JSON: ${{ secrets.DELIVERY_WEB_USERS_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('delivery/web/scripts/deploy-production.sh')
          text = path.read_text()
          old = 'done\n\nsettings_payload='
          new = 'done\nexport VERCEL_PROJECT_ID="$project_id"\n\nsettings_payload='
          if old not in text:
              raise SystemExit('delivery_project_export_anchor_not_found')
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n delivery/web/scripts/deploy-production.sh
          bash delivery/web/scripts/deploy-production.sh

      - name: Final production smoke
        shell: bash
        run: |
          set -euo pipefail
          auth="${CORE_WEB_ADMIN_USERNAME}:${CORE_WEB_ADMIN_PASSWORD}"
          echo "::add-mask::$auth"
          for path in /health/live /health/ready; do
            test "$(curl --silent --show-error --retry 8 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "$CORE_API_INTERNAL_URL$path")" = 200
          done
          for path in /dashboard /logistics/trips /logistics/dispatch; do
            test "$(curl --silent --show-error --retry 8 --retry-delay 5 -u "$auth" --output /dev/null --write-out '%{http_code}' "$NPP_URL$path")" = 200
          done
          test "$(curl --silent --show-error --retry 8 --retry-delay 5 -u "$auth" --output /dev/null --write-out '%{http_code}' "https://$ADMIN_DOMAIN/")" = 200
          test "$(curl --silent --show-error --retry 12 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "https://$DELIVERY_DOMAIN/")" = 401
          delivery_auth="$(DELIVERY_USERS_JSON="$DELIVERY_WEB_USERS_JSON" node --input-type=module <<'NODE'
          const [user] = JSON.parse(process.env.DELIVERY_USERS_JSON || '[]');
          if (!user?.username || !user?.password) process.exit(1);
          process.stdout.write(`${user.username}:${user.password}`);
          NODE
          )"
          echo "::add-mask::$delivery_auth"
          html="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 -u "$delivery_auth" "https://$DELIVERY_DOMAIN/")"
          grep -q 'Chuyến của tôi' <<<"$html"
          grep -qv 'Không tải được chuyến' <<<"$html"
          css="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.css' | head -n 1)"
          js="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.js' | head -n 1)"
          test -n "$css"
          test -n "$js"
          curl --fail --silent --show-error "https://$DELIVERY_DOMAIN$css" >/dev/null
          curl --fail --silent --show-error "https://$DELIVERY_DOMAIN$js" >/dev/null

      - name: Publish successful rollout evidence
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(cat <<EOT
          ## Phase 6D/6E production rollout — success

          - SOURCE_SHA: ${{ steps.source.outputs.sha }}
          - DATABASE_MIGRATIONS_042_048: success
          - CORE_BACKEND: success
          - NPP_OPERATIONS: success
          - ADMIN_MCP_NPP: success
          - ADMIN_DEPLOYMENT_URL: ${{ steps.admin.outputs.url }}
          - DELIVERY_PROJECT_ID: ${{ steps.delivery.outputs.project_id }}
          - DELIVERY_DEPLOYMENT_URL: ${{ steps.delivery.outputs.deployment_url }}
          - DELIVERY_DOMAIN: https://${DELIVERY_DOMAIN}
          - FINAL_SMOKE: success
          - GITHUB_RUN_ID: ${GITHUB_RUN_ID}
          EOT
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/248/comments" -f body="$body" >/dev/null
          gh issue close 248 --reason completed >/dev/null

      - name: Publish failed rollout evidence
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/248/comments" \
            -f body="## Admin/Delivery rollout — failure\n\n- SOURCE_SHA: ${{ steps.source.outputs.sha }}\n- ADMIN: ${{ steps.admin.outcome }}\n- DELIVERY: ${{ steps.delivery.outcome }}\n- GITHUB_RUN_ID: ${GITHUB_RUN_ID}" >/dev/null
