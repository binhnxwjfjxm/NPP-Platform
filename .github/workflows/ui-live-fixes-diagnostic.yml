name: UI Live Fixes Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'npp-core/web/**'
      - '.github/workflows/ui-live-fixes-diagnostic.yml'

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck Core web
        run: npm --workspace npp-core-web run typecheck

      - name: Test live UI contracts
        run: node --test npp-core/web/test/ui-live-fixes.test.js

      - name: Locate failing Core web contract
        shell: bash
        run: |
          set -euo pipefail
          for test_file in npp-core/web/test/*.test.js; do
            if [ "$test_file" = "npp-core/web/test/ui-live-fixes.test.js" ]; then
              continue
            fi
            echo "Checking $test_file"
            if ! node --test "$test_file" > /tmp/core-web-test.log 2>&1; then
              echo "FAILED_TEST_FILE=$test_file"
              tail -n 80 /tmp/core-web-test.log
              exit 1
            fi
          done

      - name: Build Core web
        run: npm --workspace npp-core-web run build
