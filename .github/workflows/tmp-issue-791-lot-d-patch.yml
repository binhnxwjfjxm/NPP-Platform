name: Temporary Issue 791 Lot D patch

on:
  push:
    branches:
      - automation/issue-791-lot-d-patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary patch source
        uses: actions/checkout@v4
        with:
          ref: automation/issue-791-lot-d-patch
          fetch-depth: 0
      - name: Preserve patch script
        run: cp .github/scripts/tmp_issue_791_lot_d_patch.py /tmp/issue-791-lot-d.py
      - name: Checkout feature branch
        run: |
          git fetch origin agent/issue-791-lot-d-split-line
          git checkout agent/issue-791-lot-d-split-line
      - name: Apply and verify Lot D
        run: |
          python3 /tmp/issue-791-lot-d.py
          git diff --check
          node --test npp-core/api/test/issue-791-lot-d-split-lines.test.js npp-core/web/test/issue-791-sales-line-split.test.mjs
          git status --short
      - name: Commit feature batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrations/sales/115_sales_order_split_lines.sql \
                  npp-core/api/src/migrations/index.js \
                  npp-core/api/src/services/sales-order-legacy.js \
                  npp-core/api/test/sales-order-transaction.test.js \
                  npp-core/api/test/issue-791-lot-d-split-lines.test.js \
                  npp-core/web/app/sales/sales-orders/SalesOrderCommercialForm.tsx \
                  npp-core/web/test/issue-791-sales-line-split.test.mjs
          git commit -m "feat(company): thêm thao tác tách dòng bán hàng #791"
          git push origin HEAD:agent/issue-791-lot-d-split-line
      - name: Remove temporary patch branch
        if: always()
        run: git push origin --delete automation/issue-791-lot-d-patch || true
