name: Diagnose PR168 current failures

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-pr168-current.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/issue-158-mcp-production-read-store'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: diagnose-pr168
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-158-mcp-production-read-store

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - name: Backend verify failure detail
        shell: bash
        run: |
          set -o pipefail
          npm --prefix mcp/apps/backend run verify 2>&1 | tee /tmp/backend.log || {
            echo '=== BACKEND FAILURE TAIL ==='
            tail -n 160 /tmp/backend.log
            exit 1
          }

      - name: Provider cutover failure detail
        if: always()
        env:
          TEST_DATABASE_URL: postgresql://postgres:diagnose-pr168@127.0.0.1:5432/postgres
        shell: bash
        run: |
          set -o pipefail
          npm --prefix mcp/apps/backend run test:provider-cutover 2>&1 | tee /tmp/provider.log || {
            echo '=== PROVIDER FAILURE TAIL ==='
            tail -n 200 /tmp/provider.log
            exit 1
          }

      - name: Foundation failure detail
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm --prefix mcp run test:foundation 2>&1 | tee /tmp/foundation.log || {
            echo '=== FOUNDATION FAILURE TAIL ==='
            tail -n 200 /tmp/foundation.log
            exit 1
          }
