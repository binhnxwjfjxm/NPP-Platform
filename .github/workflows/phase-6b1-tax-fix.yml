name: Phase 6B.1 Tax Fix

on:
  push:
    branches:
      - agent/phase-6b1-sales-order-operational-ux
    paths:
      - .github/workflows/phase-6b1-tax-fix.yml

permissions:
  contents: write

jobs:
  apply-tax-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6b1-sales-order-operational-ux
          fetch-depth: 0
      - name: Remove inconsistent settings-row branch
        shell: python
        run: |
          from pathlib import Path
          path = Path('npp-core/api/src/services/sales-order-entry.js')
          source = path.read_text(encoding='utf-8')
          old = "  if (!Array.isArray(lines)) return lines;\n  if (!settings) return lines;\n  const defaults = taxSettings(settings);"
          new = "  if (!Array.isArray(lines)) return lines;\n  const defaults = taxSettings(settings);"
          if old not in source:
              raise SystemExit('Expected inconsistent tax branch was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "npp-ci-fix"
          git config user.email "npp-ci-fix@users.noreply.github.com"
          git rm .github/workflows/phase-6b1-tax-fix.yml
          git add npp-core/api/src/services/sales-order-entry.js
          git commit -m "fix(sales-api): keep Core tax defaults consistent"
          git push origin HEAD:agent/phase-6b1-sales-order-operational-ux
