name: Issue 791 Lot C P1 fix

on:
  push:
    branches:
      - agent/issue-791-lot-c-direct-price-discount

permissions:
  contents: write

concurrency:
  group: issue-791-lot-c-p1-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact branch and blocker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/issue-791-lot-c-direct-price-discount"
          python - <<'PY'
          from pathlib import Path
          form = Path('npp-core/web/app/sales/sales-orders/SalesOrderCommercialForm.tsx').read_text()
          old = "if (estimate.discount > 0n && (!canDiscountOverride || !documentDiscountReason.trim())) {"
          if form.count(old) != 1:
              raise SystemExit(f'expected exactly one P1 blocker, got {form.count(old)}')
          PY
      - name: Fix document-discount reason gate and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          form_path = Path('npp-core/web/app/sales/sales-orders/SalesOrderCommercialForm.tsx')
          form = form_path.read_text()
          old = "if (estimate.discount > 0n && (!canDiscountOverride || !documentDiscountReason.trim())) {"
          new = "if (estimate.documentDiscountTotal > 0n && (!canDiscountOverride || !documentDiscountReason.trim())) {"
          if form.count(old) != 1:
              raise SystemExit(f'form: expected 1 old reason gate, got {form.count(old)}')
          form_path.write_text(form.replace(old, new, 1))

          test_path = Path('npp-core/web/test/issue-791-lot-c-direct-price-discount.test.mjs')
          test = test_path.read_text()
          marker = "test('Issue #791 Lô C keeps line discount independent from whole-order reason', async () => {"
          if marker not in test:
              test += '''\n\ntest('Issue #791 Lô C keeps line discount independent from whole-order reason', async () => {\n  const form = await readFile(formPath, 'utf8');\n  assert.match(form, /estimate\\.documentDiscountTotal > 0n && \\(!canDiscountOverride \\|\\| !documentDiscountReason\\.trim\\(\\)\\)/);\n  assert.doesNotMatch(form, /estimate\\.discount > 0n && \\(!canDiscountOverride \\|\\| !documentDiscountReason\\.trim\\(\\)\\)/);\n});\n'''
          test_path.write_text(test)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify Công Ty web
        run: |
          npm --workspace npp-core-web run typecheck
          npm --workspace npp-core-web run test
      - name: Commit fixed source once
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-791-lot-c-p1-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/web .github/workflows/issue-791-lot-c-p1-fix.yml
          git diff --cached --check
          git commit -m "fix(company): cho phép lưu CK từng dòng Lô C #791"
          git push origin HEAD:agent/issue-791-lot-c-direct-price-discount
