name: One-shot MCP runtime database credential repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: one-shot-mcp-runtime-credential-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'agent/ops-mcp-runtime-credential-final' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_APP: hung-phat
      MCP_APP: hung-phat-mcp
      EXPECTED_MAIN_SHA: 188165fe9c8de84291015a1fa4564c15180399ee
      EXPECTED_RUNTIME_ROLE: mcp_runtime
      TEMP_ATTACHMENT: MCP_RUNTIME_DB
      STATUS_FILE: /tmp/mcp-runtime-credential-status
    steps:
      - name: Verify exact operation scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "$EXPECTED_MAIN_SHA"
          test "$CORE_APP" = "hung-phat"
          test "$MCP_APP" = "hung-phat-mcp"
          test "$CORE_APP" != "$MCP_APP"
          test "$EXPECTED_RUNTIME_ROLE" = "mcp_runtime"

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku version

      - name: Repair managed MCP runtime credential
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          stage="preflight"
          cutover_started="false"
          old_was_attachment="false"
          addon_name=""
          old_database_url=""
          old_mcp_db_role=""

          write_status() {
            printf '%s\n' "$1" > "$STATUS_FILE"
          }

          detach_if_present() {
            local attachment="$1"
            local value
            value="$(heroku config:get "${attachment}_URL" -a "$MCP_APP" 2>/dev/null || true)"
            if [ -n "$value" ]; then
              heroku addons:detach "$attachment" -a "$MCP_APP" --confirm "$MCP_APP" >/dev/null 2>&1 || true
            fi
          }

          rollback_cutover() {
            set +e
            heroku addons:detach DATABASE -a "$MCP_APP" --confirm "$MCP_APP" >/dev/null 2>&1 || true
            if [ "$old_was_attachment" = "true" ] && [ -n "$addon_name" ]; then
              heroku addons:attach "$addon_name" --as DATABASE -a "$MCP_APP" >/dev/null 2>&1 || true
            elif [ -n "$old_database_url" ]; then
              heroku config:set "DATABASE_URL=$old_database_url" -a "$MCP_APP" >/dev/null 2>&1 || true
            fi
            if [ -n "$old_mcp_db_role" ]; then
              heroku config:set "MCP_DB_ROLE=$old_mcp_db_role" -a "$MCP_APP" >/dev/null 2>&1 || true
            fi
            detach_if_present "$TEMP_ATTACHMENT"
            set -e
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ "$cutover_started" = "true" ]; then
                rollback_cutover
              else
                detach_if_present "$TEMP_ATTACHMENT"
              fi
              write_status "failure:$stage"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"

          stage="provider-audit"
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_APP/config-vars" > /tmp/core-config.json
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$MCP_APP/config-vars" > /tmp/mcp-config.json
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_APP/addons" > /tmp/core-addons.json
          curl -fsS -H 'Accept: application/vnd.heroku+json; version=3' -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$MCP_APP/addon-attachments" > /tmp/mcp-attachments.json

          EXPECTED_RUNTIME_ROLE="$EXPECTED_RUNTIME_ROLE" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const coreConfig = JSON.parse(await readFile('/tmp/core-config.json', 'utf8'));
          const mcpConfig = JSON.parse(await readFile('/tmp/mcp-config.json', 'utf8'));
          const coreAddons = JSON.parse(await readFile('/tmp/core-addons.json', 'utf8'));
          const mcpAttachments = JSON.parse(await readFile('/tmp/mcp-attachments.json', 'utf8'));
          const ownerUrl = coreConfig.DATABASE_URL;
          const runtimeUrl = mcpConfig.DATABASE_URL;
          const oldRole = mcpConfig.MCP_DB_ROLE;
          const expectedRole = process.env.EXPECTED_RUNTIME_ROLE;
          if (!ownerUrl || !runtimeUrl || !oldRole || !expectedRole) throw new Error('missing_required_provider_config');
          const postgresAddons = coreAddons.filter((addon) =>
            addon?.addon_service?.name === 'heroku-postgresql' || String(addon?.plan?.name || '').startsWith('heroku-postgresql')
          );
          if (postgresAddons.length !== 1) throw new Error('expected_one_shared_postgres_addon');
          const addon = postgresAddons[0];
          if (String(addon?.plan?.name || '').includes('advanced')) throw new Error('advanced_postgres_requires_different_attachment_api');
          const databaseAttachment = mcpAttachments.find((attachment) => attachment?.name === 'DATABASE');
          if (databaseAttachment && databaseAttachment?.addon?.id !== addon.id) throw new Error('mcp_database_attachment_targets_wrong_addon');
          const owner = new URL(ownerUrl);
          const runtime = new URL(runtimeUrl);
          const port = (url) => url.port || '5432';
          if (owner.hostname !== runtime.hostname || port(owner) !== port(runtime) || owner.pathname !== runtime.pathname) {
            throw new Error('core_and_mcp_target_different_databases');
          }
          const alreadySeparated = decodeURIComponent(owner.username) !== decodeURIComponent(runtime.username)
            && decodeURIComponent(runtime.username) === expectedRole
            && oldRole === expectedRole;
          await writeFile('/tmp/postgres-addon-name', addon.name, { mode: 0o600 });
          await writeFile('/tmp/old-mcp-database-url', runtimeUrl, { mode: 0o600 });
          await writeFile('/tmp/old-mcp-db-role', oldRole, { mode: 0o600 });
          await writeFile('/tmp/old-was-attachment', databaseAttachment ? 'true' : 'false', { mode: 0o600 });
          await writeFile('/tmp/already-separated', alreadySeparated ? 'true' : 'false', { mode: 0o600 });
          NODE

          addon_name="$(cat /tmp/postgres-addon-name)"
          old_database_url="$(cat /tmp/old-mcp-database-url)"
          old_mcp_db_role="$(cat /tmp/old-mcp-db-role)"
          old_was_attachment="$(cat /tmp/old-was-attachment)"
          already_separated="$(cat /tmp/already-separated)"
          echo "::add-mask::$old_database_url"

          if [ "$already_separated" = "true" ]; then
            write_status "success:already-separated:$EXPECTED_RUNTIME_ROLE"
            trap - EXIT
            exit 0
          fi

          stage="credential-provision"
          credentials="$(heroku pg:credentials DATABASE_URL -a "$CORE_APP")"
          if ! printf '%s\n' "$credentials" | grep -Eq "^[[:space:]]*${EXPECTED_RUNTIME_ROLE}[[:space:]]"; then
            heroku pg:credentials:create DATABASE_URL --name "$EXPECTED_RUNTIME_ROLE" -a "$CORE_APP"
          fi

          stage="temporary-attachment"
          detach_if_present "$TEMP_ATTACHMENT"
          heroku addons:attach "$addon_name" --credential "$EXPECTED_RUNTIME_ROLE" --as "$TEMP_ATTACHMENT" -a "$MCP_APP"
          temp_url="$(heroku config:get "${TEMP_ATTACHMENT}_URL" -a "$MCP_APP")"
          test -n "$temp_url"
          echo "::add-mask::$temp_url"

          TEMP_URL="$temp_url" OLD_URL="$old_database_url" ROLE="$EXPECTED_RUNTIME_ROLE" node --input-type=module <<'NODE'
          const oldUrl = new URL(process.env.OLD_URL);
          const tempUrl = new URL(process.env.TEMP_URL);
          const port = (url) => url.port || '5432';
          if (decodeURIComponent(tempUrl.username) !== process.env.ROLE) throw new Error('temporary_attachment_wrong_role');
          if (oldUrl.hostname !== tempUrl.hostname || port(oldUrl) !== port(tempUrl) || oldUrl.pathname !== tempUrl.pathname) {
            throw new Error('temporary_attachment_wrong_database');
          }
          if (decodeURIComponent(oldUrl.username) === decodeURIComponent(tempUrl.username)) throw new Error('credential_still_not_separated');
          NODE

          stage="database-attachment-cutover"
          cutover_started="true"
          if [ "$old_was_attachment" = "true" ]; then
            heroku addons:detach DATABASE -a "$MCP_APP" --confirm "$MCP_APP"
          else
            heroku config:unset DATABASE_URL -a "$MCP_APP"
          fi
          heroku addons:attach "$addon_name" --credential "$EXPECTED_RUNTIME_ROLE" --as DATABASE -a "$MCP_APP"
          heroku config:set "MCP_DB_ROLE=$EXPECTED_RUNTIME_ROLE" -a "$MCP_APP" >/dev/null

          stage="final-verification"
          final_url="$(heroku config:get DATABASE_URL -a "$MCP_APP")"
          owner_url="$(heroku config:get DATABASE_URL -a "$CORE_APP")"
          final_role="$(heroku config:get MCP_DB_ROLE -a "$MCP_APP")"
          test -n "$final_url"
          test -n "$owner_url"
          test "$final_role" = "$EXPECTED_RUNTIME_ROLE"
          echo "::add-mask::$final_url"
          echo "::add-mask::$owner_url"

          FINAL_URL="$final_url" OWNER_URL="$owner_url" ROLE="$EXPECTED_RUNTIME_ROLE" node --input-type=module <<'NODE'
          const runtime = new URL(process.env.FINAL_URL);
          const owner = new URL(process.env.OWNER_URL);
          const port = (url) => url.port || '5432';
          if (decodeURIComponent(runtime.username) !== process.env.ROLE) throw new Error('final_runtime_role_mismatch');
          if (decodeURIComponent(runtime.username) === decodeURIComponent(owner.username)) throw new Error('final_credentials_not_separated');
          if (runtime.hostname !== owner.hostname || port(runtime) !== port(owner) || runtime.pathname !== owner.pathname) {
            throw new Error('final_database_target_mismatch');
          }
          NODE

          detach_if_present "$TEMP_ATTACHMENT"
          cutover_started="false"
          write_status "success:repaired:$EXPECTED_RUNTIME_ROLE"
          trap - EXIT

      - name: Publish sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="failure:workflow-interrupted"
          if [ -f "$STATUS_FILE" ]; then status="$(cat "$STATUS_FILE")"; fi
          if [[ "$status" == success:* ]]; then
            mode="$(cut -d: -f2 <<<"$status")"
            role="$(cut -d: -f3 <<<"$status")"
            body="## MCP runtime database credential ready

- Exact main audited: \`$EXPECTED_MAIN_SHA\`
- MCP app: \`$MCP_APP\`
- Runtime role: \`$role\`
- Result: \`$mode\`
- Shared PostgreSQL target preserved: yes
- Runtime and migrator usernames separated: yes
- Application source, production workflow and frontend changed: no

The guarded MCP backend deployment can now be run once."
          else
            stage="${status#failure:}"
            body="## MCP runtime database credential repair failed

- Exact main audited: \`$EXPECTED_MAIN_SHA\`
- Failed stage: \`$stage\`
- Automatic rollback attempted if the cutover had started
- Deployment was not triggered"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$body" >/dev/null
