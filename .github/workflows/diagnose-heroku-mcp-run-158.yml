name: Extract hardened MCP runtime privilege failure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read
  actions: read

jobs:
  extract:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    steps:
      - name: Extract exact privilege mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '91492230497'
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          pattern = re.compile(
              r'(privileged role|HELPER_EXECUTE|IDEMPOTENCY_|AUDIT_|OUTBOX_|ACCOUNTS_|ROUTES_|CURRENT_USER|SEARCH_PATH|SCHEMA_USAGE|READ=|ERROR|FATAL|permission denied|does not exist|grep|Process completed|exit code)',
              re.I,
          )
          selected = []
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.extend(lines[max(0, index - 3):min(len(lines), index + 5)])
          if not selected:
              selected = lines[-240:]

          output = []
          seen = set()
          for line in selected:
              clean = re.sub(r'postgres(?:ql)?://\S+', '[redacted-database-url]', line, flags=re.I)
              clean = re.sub(r'(?i)(password|token|secret|authorization)[=:]\S+', r'\1=[redacted]', clean)
              clean = re.sub(r'[A-Za-z0-9_=-]{72,}', '[redacted]', clean)
              if clean not in seen:
                  seen.add(clean)
                  output.append(clean)
          print('\n'.join(output[-260:]))
          PY
