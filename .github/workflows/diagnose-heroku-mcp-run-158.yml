name: Inspect current final MCP rollout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-rollout:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: 106634992beb421c198d4ef5cecb4abd607fb93d
    steps:
      - name: Print current final MCP Heroku run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/heroku-mcp-backend-manual.yml/runs" \
            -f event=issue_comment \
            -f per_page=40)"

          jq -r --arg head "$EXPECTED_HEAD" '
            .workflow_runs
            | sort_by(.created_at)
            | reverse
            | map(select(.head_sha == $head))
            | .[]
            | "RUN id=\(.id) status=\(.status) conclusion=\(.conclusion // "") created=\(.created_at) actor=\(.actor.login // "") title=\(.display_title // "")"
          ' <<<"$runs_json"

          run_id="$(jq -r --arg head "$EXPECTED_HEAD" '
            .workflow_runs
            | sort_by(.created_at)
            | reverse
            | map(select(.head_sha == $head and (.conclusion // "") != "skipped"))
            | .[0].id // empty
          ' <<<"$runs_json")"
          test -n "$run_id"
          echo "TARGET_RUN_ID=$run_id"

          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '.jobs[] | "JOB id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // "")\n" + ([.steps[] | "  STEP \(.number) \(.name): \(.status)/\(.conclusion // "")"] | join("\n"))'
