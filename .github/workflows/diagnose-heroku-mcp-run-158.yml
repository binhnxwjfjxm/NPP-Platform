name: Extract MCP runtime rehearsal failure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read
  actions: read

jobs:
  extract:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    steps:
      - name: Extract failed runtime verification lines
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '91491531964'
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          marker = 'Create isolated runtime role and verify all reads'
          start = next((i for i, line in enumerate(lines) if marker in line), max(0, len(lines)-250))
          chosen = lines[start:]
          patterns = re.compile(r'(ERROR|FATAL|permission denied|does not exist|failed|SQLSTATE|CURRENT_USER|SEARCH_PATH|SCHEMA_USAGE|READ=)', re.I)
          selected = []
          for i, line in enumerate(chosen):
              if patterns.search(line):
                  selected.extend(chosen[max(0, i-2):min(len(chosen), i+4)])
          if not selected:
              selected = chosen[-180:]
          seen = set()
          output = []
          for line in selected:
              line = re.sub(r'postgres(?:ql)?://\S+', '[redacted-database-url]', line, flags=re.I)
              line = re.sub(r'(?i)(password|token|secret|authorization)[=:]\S+', r'\1=[redacted]', line)
              if line not in seen:
                  seen.add(line)
                  output.append(line)
          print('\n'.join(output[-220:]))
          PY
