name: Inventory MCP migration source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  inventory-migrations:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: List MCP migration files and table definitions
        shell: bash
        run: |
          set -euo pipefail
          echo "MAIN_SHA=$(git rev-parse HEAD)"
          echo "FOUNDATION_MIGRATIONS_BEGIN"
          find mcp/apps/backend/foundation/migrations -type f -maxdepth 4 -print | sort
          echo "FOUNDATION_MIGRATIONS_END"

          echo "MCP_ROUTE_TABLE_DEFINITIONS_BEGIN"
          grep -RniE --include='*.sql' --include='*.js' --include='*.mjs' \
            'create[[:space:]]+table([^;]|$)*(mcp_routes|mcp_route_customers|mcp_route_sessions)|mcp_routes[[:space:]]*\(' \
            mcp database 2>/dev/null || true
          echo "MCP_ROUTE_TABLE_DEFINITIONS_END"

          echo "MCP_DOMAIN_SQL_FILES_BEGIN"
          grep -RliE --include='*.sql' \
            'mcp_routes|mcp_route_customers|mcp_route_sessions' \
            mcp database 2>/dev/null | sort
          echo "MCP_DOMAIN_SQL_FILES_END"

          echo "MCP_MIGRATION_RUNNERS_BEGIN"
          grep -RniE --include='*.js' --include='*.mjs' --include='package.json' \
            'runMcpMigrations|migration:run|migrate:mcp|provider-cutover' \
            mcp 2>/dev/null | head -n 300 || true
          echo "MCP_MIGRATION_RUNNERS_END"
