name: Audit MCP PostgreSQL readiness facts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  audit-readiness:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    env:
      HEROKU_APP_NAME: hung-phat-mcp
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Read sanitized PostgreSQL readiness facts
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(heroku config:get DATABASE_URL -a "$HEROKU_APP_NAME")"
          test -n "$database_url"
          echo "::add-mask::$database_url"

          expected_role="$(heroku config:get MCP_DB_ROLE -a "$HEROKU_APP_NAME")"
          expected_schema="$(heroku config:get MCP_DB_SCHEMA -a "$HEROKU_APP_NAME")"
          test -n "$expected_role"
          test -n "$expected_schema"

          echo "EXPECTED_ROLE=$expected_role"
          echo "EXPECTED_SCHEMA=$expected_schema"
          psql --version

          psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 \
            -v expected_role="$expected_role" \
            -v expected_schema="$expected_schema" <<'SQL'
          select 'CURRENT_USER=' || current_user;
          select 'DEFAULT_SEARCH_PATH=' || current_setting('search_path');
          select 'SCHEMA_AVAILABLE=' || (to_regnamespace(:'expected_schema') is not null)::text;
          select 'SCHEMA_USAGE=' || has_schema_privilege(current_user, :'expected_schema', 'USAGE')::text;
          select 'EXPECTED_ROLE_EXISTS=' || exists(select 1 from pg_roles where rolname = :'expected_role')::text;
          select 'EXPECTED_ROLE_CAN_LOGIN=' || coalesce((select rolcanlogin::text from pg_roles where rolname = :'expected_role'), 'false');
          select 'CURRENT_ROLE_MATCHES_EXPECTED=' || (current_user = :'expected_role')::text;
          SQL
