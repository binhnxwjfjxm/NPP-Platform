name: Inspect actual shared Core columns

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  inspect-columns:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      MCP_APP_NAME: hung-phat-mcp
    steps:
      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Print exact shared table columns
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(heroku config:get DATABASE_URL -a "$MCP_APP_NAME")"
          test -n "$database_url"
          echo "::add-mask::$database_url"
          psql "$database_url" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select 'COLUMN=' || table_schema || '.' || table_name || '.' || column_name ||
                 '|TYPE=' || data_type ||
                 '|NULLABLE=' || is_nullable
          from information_schema.columns
          where table_schema = 'shared'
            and table_name in ('customers', 'products', 'product_variants')
          order by table_name, ordinal_position;
          SQL
