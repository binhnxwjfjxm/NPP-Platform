name: Monitor exact repaired MCP Heroku deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read
  actions: read

jobs:
  monitor-deploy:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find deploy after repaired config
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 10ad25d8317064cb8c89c5092359f1ae14be1054
          NOT_BEFORE: 2026-08-02T11:17:00Z
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs_json="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/heroku-mcp-backend-manual.yml/runs" \
              -f event=issue_comment \
              -f per_page=30)"
            jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[:8][] | "RUN id=\(.id) status=\(.status) conclusion=\(.conclusion // "") created=\(.created_at) actor=\(.actor.login // "") head=\(.head_sha // "")"' <<<"$runs_json"
            run_id="$(jq -r --arg head "$EXPECTED_HEAD" --arg not_before "$NOT_BEFORE" '
              .workflow_runs
              | sort_by(.created_at)
              | reverse
              | map(select(.head_sha == $head and .created_at >= $not_before and (.actor.login // "") == "khuongbinhinfo-a11y" and (.conclusion // "") != "skipped"))
              | .[0].id // empty
            ' <<<"$runs_json")"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done
          test -n "${run_id:-}"

      - name: Wait for deploy completion
        id: completed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run_json="$(gh api --method GET -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "MCP_HEROKU_RUN_ID=$RUN_ID STATUS=$status CONCLUSION=$conclusion"
            if [[ "$status" == "completed" ]]; then
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done
          test -n "${conclusion:-}"

      - name: Print deploy jobs and steps
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | "JOB id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // "")\n" + ([.steps[] | "  STEP \(.number) \(.name): \(.status)/\(.conclusion // "")"] | join("\n"))'

      - name: Enforce successful deploy
        env:
          CONCLUSION: ${{ steps.completed.outputs.conclusion }}
        shell: bash
        run: test "$CONCLUSION" = "success"
