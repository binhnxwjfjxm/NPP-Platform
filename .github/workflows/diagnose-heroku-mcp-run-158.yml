name: Diagnose MCP Heroku production run

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    steps:
      - name: List recent MCP Heroku issue-comment runs
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 10ad25d8317064cb8c89c5092359f1ae14be1054
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/heroku-mcp-backend-manual.yml/runs" \
            -f event=issue_comment \
            -f per_page=30)"

          jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[] | "RUN id=\(.id) status=\(.status) conclusion=\(.conclusion // "") head=\(.head_sha // "") created=\(.created_at) title=\(.display_title // "") actor=\(.actor.login // "")"' <<<"$runs_json"

          run_id="$(jq -r --arg head "$EXPECTED_HEAD" '
            .workflow_runs
            | sort_by(.created_at)
            | reverse
            | map(select(.head_sha == $head and (.conclusion // "") != "skipped"))
            | .[0].id // empty
          ' <<<"$runs_json")"

          [[ -n "$run_id" ]] || { echo "No non-skipped MCP Heroku run found for $EXPECTED_HEAD" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for target run completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            run_json="$(gh api --method GET -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r '.status' <<<"$run_json")"
            echo "Target MCP Heroku run: id=$RUN_ID status=$status conclusion=$(jq -r '.conclusion // ""' <<<"$run_json") head=$(jq -r '.head_sha // ""' <<<"$run_json") created=$(jq -r '.created_at // ""' <<<"$run_json")"
            [[ "$status" == "completed" ]] && break
            sleep 5
          done

      - name: Print target run jobs and steps
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | "JOB id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // "")\n" + ([.steps[] | "  STEP \(.number) \(.name): \(.status)/\(.conclusion // "")"] | join("\n"))'
