name: Map shared database schema for MCP

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  map-schema:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    env:
      CORE_APP_NAME: hung-phat
      MCP_APP_NAME: hung-phat-mcp
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Print non-sensitive schema map
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(heroku config:get DATABASE_URL -a "$MCP_APP_NAME")"
          test -n "$database_url"
          echo "::add-mask::$database_url"

          psql "$database_url" -X -A -t -v ON_ERROR_STOP=1 <<'SQL'
          select 'TABLE=' || table_schema || '.' || table_name
          from information_schema.tables
          where table_schema not in ('pg_catalog','information_schema')
            and table_type in ('BASE TABLE','VIEW')
          order by table_schema, table_name;

          select 'COLUMN=' || table_schema || '.' || table_name || '.' || column_name ||
                 '|TYPE=' || data_type ||
                 '|NULLABLE=' || is_nullable ||
                 '|DEFAULT=' || coalesce(column_default, '')
          from information_schema.columns
          where table_schema not in ('pg_catalog','information_schema')
          order by table_schema, table_name, ordinal_position;
          SQL

      - name: Print exact credential creation help
        shell: bash
        run: |
          set -euo pipefail
          echo "CREDENTIAL_CREATE_HELP_BEGIN"
          heroku pg:credentials:create --help 2>&1 | head -n 260
          echo "CREDENTIAL_CREATE_HELP_END"
          echo "CREDENTIAL_URL_HELP_BEGIN"
          heroku pg:credentials:url --help 2>&1 | head -n 260
          echo "CREDENTIAL_URL_HELP_END"
