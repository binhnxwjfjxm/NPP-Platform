name: Extract MCP read table contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  extract-contracts:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Extract literal table reads with nearby options
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('mcp/src'), Path('mcp/apps/backend')]
          patterns = [
              re.compile(r'(?:restRows|backendReadRows|backendReadCount|restCount)(?:<[^>]+>)?\s*\(\s*["\']([^"\']+)["\']', re.M),
              re.compile(r'\.from\(\s*["\']([^"\']+)["\']\s*\)', re.M),
          ]
          found = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts','.tsx','.js','.mjs'}:
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for pattern in patterns:
                      for match in pattern.finditer(text):
                          start = max(0, match.start() - 250)
                          end = min(len(text), match.start() + 900)
                          snippet = text[start:end].replace('\r','')
                          found.append((match.group(1), str(path), text.count('\n', 0, match.start()) + 1, snippet))
          for table, path, line, snippet in sorted(found):
              print(f'READ_CONTRACT table={table} file={path} line={line}')
              print(snippet)
              print('END_READ_CONTRACT')
          PY

      - name: Extract DTO and row field contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            mcp/src/lib/api/routes-data.ts \
            mcp/src/features/dashboard/persisted-overview.ts \
            mcp/src/lib/mcp-sessions/load-mcp-sessions.ts \
            mcp/src/features/mcp/route-customers.types.ts \
            mcp/src/features/routes/routes.types.ts; do
            echo "FILE_BEGIN=$file"
            sed -n '1,360p' "$file"
            echo "FILE_END=$file"
          done
