name: Repair MCP Heroku PostgreSQL runtime config

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  repair-provider-config:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      CORE_APP_NAME: hung-phat
      MCP_APP_NAME: hung-phat-mcp
    steps:
      - name: Confirm guarded credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku version

      - name: Repair MCP PostgreSQL runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          core_database_url="$(heroku config:get DATABASE_URL -a "$CORE_APP_NAME")"
          test -n "$core_database_url"
          echo "::add-mask::$core_database_url"

          core_hash="$(printf '%s' "$core_database_url" | sha256sum | awk '{print $1}')"

          heroku config:set -a "$MCP_APP_NAME" \
            DATABASE_URL="$core_database_url" \
            MCP_DB_ROLE=mcp_runtime \
            MCP_DB_SCHEMA=mcp \
            MCP_LEGACY_RUNTIME_ENABLED=false \
            PERSISTENCE_PROVIDER=postgresql \
            >/dev/null

          mcp_database_url="$(heroku config:get DATABASE_URL -a "$MCP_APP_NAME")"
          test -n "$mcp_database_url"
          echo "::add-mask::$mcp_database_url"
          mcp_hash="$(printf '%s' "$mcp_database_url" | sha256sum | awk '{print $1}')"
          test "$core_hash" = "$mcp_hash"

          config_json="$(heroku config -a "$MCP_APP_NAME" --json)"
          test "$(jq -r '.MCP_DB_ROLE' <<<"$config_json")" = "mcp_runtime"
          test "$(jq -r '.MCP_DB_SCHEMA' <<<"$config_json")" = "mcp"
          test "$(jq -r '.MCP_LEGACY_RUNTIME_ENABLED' <<<"$config_json")" = "false"
          test "$(jq -r '.PERSISTENCE_PROVIDER' <<<"$config_json")" = "postgresql"

          echo "SHARED_DATABASE_MATCH=true"
          echo "MCP_DB_ROLE=mcp_runtime"
          echo "MCP_DB_SCHEMA=mcp"
          echo "MCP_LEGACY_RUNTIME_ENABLED=false"
          echo "PERSISTENCE_PROVIDER=postgresql"
