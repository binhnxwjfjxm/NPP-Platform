name: Repair MCP Heroku production runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read
  actions: read

jobs:
  repair-provider-config:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    env:
      CORE_APP_NAME: hung-phat
      MCP_APP_NAME: hung-phat-mcp
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      REQUIRED_CONFIG_NAMES: BACKEND_API_TOKEN,CORS_ORIGINS,DATABASE_URL,INSTALLATION_ID,MCP_DB_ROLE,MCP_DB_SCHEMA,MCP_LEGACY_ACTOR_ID,MCP_LEGACY_RUNTIME_ENABLED,NPP_CODE,PERSISTENCE_PROVIDER
    steps:
      - name: Confirm Heroku credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          echo "HEROKU_API_KEY_PRESENT=true"

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku version

      - name: Attach shared PostgreSQL and MCP runtime settings
        shell: bash
        run: |
          set -euo pipefail

          core_database_url="$(heroku config:get DATABASE_URL -a "$CORE_APP_NAME")"
          test -n "$core_database_url"
          echo "::add-mask::$core_database_url"

          heroku config:set -a "$MCP_APP_NAME" \
            DATABASE_URL="$core_database_url" \
            MCP_DB_ROLE="mcp_runtime" \
            MCP_DB_SCHEMA="mcp" \
            MCP_LEGACY_RUNTIME_ENABLED="false" \
            PERSISTENCE_PROVIDER="postgresql" \
            >/dev/null

          target_database_url="$(heroku config:get DATABASE_URL -a "$MCP_APP_NAME")"
          test -n "$target_database_url"
          echo "::add-mask::$target_database_url"

          core_hash="$(printf '%s' "$core_database_url" | sha256sum | awk '{print $1}')"
          target_hash="$(printf '%s' "$target_database_url" | sha256sum | awk '{print $1}')"
          test "$core_hash" = "$target_hash"

          config_json="$(heroku config -a "$MCP_APP_NAME" --json)"
          missing=()
          IFS=',' read -ra required <<<"$REQUIRED_CONFIG_NAMES"
          for name in "${required[@]}"; do
            if ! jq -e --arg name "$name" 'has($name) and (.[$name] | type == "string" and length > 0)' <<<"$config_json" >/dev/null; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required MCP config names: $(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          fi

          test "$(jq -r '.MCP_DB_ROLE' <<<"$config_json")" = "mcp_runtime"
          test "$(jq -r '.MCP_DB_SCHEMA' <<<"$config_json")" = "mcp"
          test "$(jq -r '.MCP_LEGACY_RUNTIME_ENABLED' <<<"$config_json")" = "false"
          test "$(jq -r '.PERSISTENCE_PROVIDER' <<<"$config_json")" = "postgresql"

          echo "SHARED_DATABASE_ATTACHED=true"
          echo "MCP_DB_ROLE=mcp_runtime"
          echo "MCP_DB_SCHEMA=mcp"
          echo "MCP_LEGACY_RUNTIME_ENABLED=false"
          echo "PERSISTENCE_PROVIDER=postgresql"
          echo "CONFIG_NAMES=$(jq -r 'keys | sort | join(",")' <<<"$config_json")"

      - name: Verify sanitized provider contract
        shell: bash
        run: |
          set -euo pipefail
          stack="$(heroku stack -a "$MCP_APP_NAME" | awk '/^\*/ {print $2; exit}')"
          test "$stack" = "container"
          latest_release="$(heroku releases --json -a "$MCP_APP_NAME" | jq -r '.[0].version // empty')"
          test -n "$latest_release"
          echo "ACTIVE_STACK=$stack"
          echo "LATEST_RELEASE_VERSION=$latest_release"
