name: Read MCP Heroku crash logs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-heroku-mcp-run-158.yml

permissions:
  contents: read

jobs:
  read-crash-logs:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    env:
      HEROKU_APP_NAME: hung-phat-mcp
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Print sanitized crash logs
        shell: bash
        run: |
          set -euo pipefail
          heroku logs --num 250 --source app --dyno web -a "$HEROKU_APP_NAME" 2>&1 \
            | python3 -c '
          import re, sys
          text = sys.stdin.read()
          text = re.sub(r"postgres(?:ql)?://\S+", "[redacted-database-url]", text, flags=re.I)
          text = re.sub(r"(?i)(token|password|secret|authorization)[=:]\S+", r"\1=[redacted]", text)
          text = re.sub(r"[A-Za-z0-9_=-]{48,}", "[redacted]", text)
          print("\n".join(text.splitlines()[-250:]))
          '
