name: Deploy smoke protection helper

on:
  push:
    branches:
      - agent/deploy-smoke-protection-helper

permissions:
  contents: write

jobs:
  repair-smoke-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Admin and Delivery production smoke gates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one audited marker, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_between(path: str, start_marker: str, end_marker: str, new_block: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              if text.find(start_marker, start + len(start_marker)) >= 0:
                  raise SystemExit(f'{path}: start marker is not unique')
              p.write_text(text[:start] + new_block + text[end:], encoding='utf-8')

          admin_workflow = '.github/workflows/vercel-admin-production-manual.yml'
          replace_once(
              admin_workflow,
              '      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com\n',
              '      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com\n      ADMIN_ORIGIN: https://admin.nguyenlieuhungphat.com\n',
          )
          deploy_expr = '$' + '{{ steps.deploy.outputs.url }}'
          admin_smoke = '''      - name: Smoke exact Admin deployment reachability
        shell: bash
        env:
          DEPLOYMENT_URL: __DEPLOY_EXPR__
        run: |
          set -euo pipefail
          assert_reachable() {
            local path="$1" response=""
            for attempt in $(seq 1 6); do
              response="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path" || true)"
              echo "Admin exact smoke path=$path attempt=$attempt status=${response:-000}"
              case "$response" in
                200|302|307|401|403) return 0 ;;
              esac
              [ "$attempt" -lt 6 ] && sleep 5
            done
            echo "Exact Admin deployment is not reachable at $path; got ${response:-000}" >&2
            return 1
          }
          # Vercel Authentication may protect the generated deployment hostname.
          # Canonical public behavior is validated against ADMIN_ORIGIN below.
          assert_reachable /
          assert_reachable /login

      - name: Smoke canonical Admin production domain
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_ok=false
          login_file="${RUNNER_TEMP}/admin-login.html"
          for attempt in $(seq 1 12); do
            challenge="$(curl --silent --show-error \\
              -H 'Accept: application/json' \\
              --output /dev/null --write-out '%{http_code}' \\
              "$ADMIN_ORIGIN/" || true)"
            browser_meta="$(curl --silent --show-error \\
              -H 'Accept: text/html' \\
              --output /dev/null --write-out '%{http_code}|%{redirect_url}' \\
              "$ADMIN_ORIGIN/" || true)"
            browser_status="${browser_meta%%|*}"
            browser_redirect="${browser_meta#*|}"
            login_code="$(curl --silent --show-error \\
              -H 'Accept: text/html' \\
              --output "$login_file" --write-out '%{http_code}' \\
              "$ADMIN_ORIGIN/login" || true)"
            case "$browser_status" in
              307|308) browser_redirect_ok=true ;;
              *) browser_redirect_ok=false ;;
            esac
            if [ "$challenge" = 401 ] && \\
               [ "$browser_redirect_ok" = true ] && \\
               [ "$browser_redirect" = "$ADMIN_ORIGIN/login" ] && \\
               [ "$login_code" = 200 ] && \\
               grep -Fq 'mã được gửi tới email của chính tài khoản' "$login_file"; then
              smoke_ok=true
              break
            fi
            echo "Admin canonical domain not ready: attempt=$attempt challenge=$challenge browser=$browser_status login=$login_code"
            sleep 5
          done
          test "$smoke_ok" = true
          html="$(cat "$login_file")"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.(css|js)' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$ADMIN_ORIGIN$asset" >/dev/null

'''.replace('__DEPLOY_EXPR__', deploy_expr)
          replace_between(
              admin_workflow,
              '      - name: Smoke exact Admin deployment\n',
              '      - name: Read Admin domain state\n',
              admin_smoke,
          )

          admin_test = 'admin/web/test/admin-production-smoke.test.mjs'
          replace_once(
              admin_test,
              "const workflowUrl = new URL('../../../.github/workflows/vercel-admin-production-direct.yml', import.meta.url);\n",
              "const workflowUrl = new URL('../../../.github/workflows/vercel-admin-production-direct.yml', import.meta.url);\nconst manualWorkflowUrl = new URL('../../../.github/workflows/vercel-admin-production-manual.yml', import.meta.url);\n",
          )
          admin_test_path = ROOT / admin_test
          admin_test_path.write_text(
              admin_test_path.read_text(encoding='utf-8') + '''\n\ntest('Admin manual rollout tolerates protected deployment hosts and validates the canonical domain', async () => {\n  const workflow = await readFile(manualWorkflowUrl, 'utf8');\n\n  assert.match(workflow, /ADMIN_ORIGIN: https:\/\/admin\.nguyenlieuhungphat\.com/);\n  assert.match(workflow, /200\|302\|307\|401\|403/);\n  assert.match(workflow, /Accept: application\/json/);\n  assert.match(workflow, /Accept: text\/html/);\n  assert.match(workflow, /\$ADMIN_ORIGIN\/login/);\n  assert.match(workflow, /mã được gửi tới email của chính tài khoản/);\n  assert.doesNotMatch(workflow, /test "\$login_code" = 200/);\n});\n''',
              encoding='utf-8',
          )

          delivery_script = 'delivery/web/scripts/deploy-production.sh'
          delivery_smoke = '''assert_deployment_reachable() {
  local path="$1" response=""
  for attempt in $(seq 1 6); do
    response="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$deployment_url$path" || true)"
    echo "Delivery exact smoke path=$path attempt=$attempt status=${response:-000}"
    case "$response" in
      200|302|307|401|403) return 0 ;;
    esac
    [ "$attempt" -lt 6 ] && sleep 5
  done
  echo "Exact Delivery deployment is not reachable at $path; got ${response:-000}." >&2
  return 1
}

# Vercel Authentication may protect the generated deployment hostname.
# Canonical public behavior and assets are validated on the custom domain.
assert_deployment_reachable /
assert_deployment_reachable /login

smoke_url="https://$DELIVERY_DOMAIN"
domain_ready=false
login_file="${RUNNER_TEMP}/delivery-login.html"
for attempt in $(seq 1 12); do
  unauth="$(curl --silent --show-error \\
    -H 'Accept: application/json' \\
    --output /dev/null --write-out '%{http_code}' \\
    "$smoke_url/" || true)"
  domain_login="$(curl --silent --show-error \\
    -H 'Accept: text/html' \\
    --output "$login_file" --write-out '%{http_code}' \\
    "$smoke_url/login" || true)"
  if [ "$unauth" = 401 ] && \\
     [ "$domain_login" = 200 ] && \\
     grep -Fq 'Welcome to Hung Phat Operations.' "$login_file"; then
    domain_ready=true
    break
  fi
  echo "Delivery canonical domain not ready: attempt=$attempt unauth=$unauth login=$domain_login"
  sleep 5
done
test "$domain_ready" = true
html="$(cat "$login_file")"
asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.(css|js)' | head -n 1)"
test -n "$asset"
curl --fail --silent --show-error "$smoke_url$asset" >/dev/null

'''
          replace_between(
              delivery_script,
              'deadline=$((SECONDS + 180))\n',
              '{\n  echo "project_id=$project_id"\n',
              delivery_smoke,
          )

          delivery_test = 'delivery/web/test/delivery-production-workflow.test.mjs'
          replace_once(
              delivery_test,
              "    'vercel@58.0.0 deploy --prebuilt --prod',\n    'npm ci --ignore-scripts',\n",
              "    'vercel@58.0.0 deploy --prebuilt --prod',\n    '200|302|307|401|403',\n    'smoke_url=\"https://$DELIVERY_DOMAIN\"',\n    \"-H 'Accept: application/json'\",\n    \"-H 'Accept: text/html'\",\n    'test \"$domain_ready\" = true',\n    'npm ci --ignore-scripts',\n",
          )
          delivery_test_path = ROOT / delivery_test
          text = delivery_test_path.read_text(encoding='utf-8')
          marker = "  assert.doesNotMatch(script, /vercel@latest/);\n"
          if text.count(marker) != 1:
              raise SystemExit('delivery test insertion marker is not unique')
          text = text.replace(
              marker,
              "  assert.doesNotMatch(script, /\\[ \"\\$unauth\" = 401 \\] && \\[ \"\\$login_code\" = 200 \\]/);\n" + marker,
              1,
          )
          delivery_test_path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/deploy-smoke-protection-helper.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(deploy): smoke canonical protected frontends'
          git push origin HEAD:agent/deploy-smoke-protection-helper
