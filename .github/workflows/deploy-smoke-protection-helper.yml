name: Deploy smoke protection helper

on:
  push:
    branches:
      - agent/deploy-smoke-protection-helper

permissions:
  contents: write

jobs:
  repair-smoke-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Admin and Delivery production smoke gates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from base64 import b64decode
          from pathlib import Path

          ROOT = Path('.')

          def decoded(value: str) -> str:
              return b64decode(value).decode('utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one audited marker, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_between(path: str, start_marker: str, end_marker: str, new_block: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found')
              if text.find(start_marker, start + len(start_marker)) >= 0:
                  raise SystemExit(f'{path}: start marker is not unique')
              p.write_text(text[:start] + new_block + text[end:], encoding='utf-8')

          admin_smoke = decoded('')
          delivery_smoke = decoded('')
          admin_test_append = decoded('')

          admin_workflow = '.github/workflows/vercel-admin-production-manual.yml'
          replace_once(admin_workflow, '      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com\n', '      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com\n      ADMIN_ORIGIN: https://admin.nguyenlieuhungphat.com\n')
          replace_between(admin_workflow, '      - name: Smoke exact Admin deployment\n', '      - name: Read Admin domain state\n', admin_smoke)

          admin_test = 'admin/web/test/admin-production-smoke.test.mjs'
          replace_once(admin_test, "const workflowUrl = new URL('../../../.github/workflows/vercel-admin-production-direct.yml', import.meta.url);\n", "const workflowUrl = new URL('../../../.github/workflows/vercel-admin-production-direct.yml', import.meta.url);\nconst manualWorkflowUrl = new URL('../../../.github/workflows/vercel-admin-production-manual.yml', import.meta.url);\n")
          admin_test_path = ROOT / admin_test
          admin_test_path.write_text(admin_test_path.read_text(encoding='utf-8') + admin_test_append, encoding='utf-8')

          delivery_script = 'delivery/web/scripts/deploy-production.sh'
          replace_between(delivery_script, 'deadline=$((SECONDS + 180))\n', '{\n  echo "project_id=$project_id"\n', delivery_smoke)

          delivery_test = 'delivery/web/test/delivery-production-workflow.test.mjs'
          replace_once(delivery_test, "    'vercel@58.0.0 deploy --prebuilt --prod',\n    'npm ci --ignore-scripts',\n", "    'vercel@58.0.0 deploy --prebuilt --prod',\n    '200|302|307|401|403',\n    'smoke_url=\"https://$DELIVERY_DOMAIN\"',\n    \"-H 'Accept: application/json'\",\n    \"-H 'Accept: text/html'\",\n    'test \"$domain_ready\" = true',\n    'npm ci --ignore-scripts',\n")
          delivery_test_path = ROOT / delivery_test
          text = delivery_test_path.read_text(encoding='utf-8')
          marker = "  assert.doesNotMatch(script, /vercel@latest/);\n"
          if text.count(marker) != 1:
              raise SystemExit('delivery test insertion marker is not unique')
          text = text.replace(marker, "  assert.doesNotMatch(script, /\\[ \"\\$unauth\" = 401 \\] && \\[ \"\\$login_code\" = 200 \\]/);\n" + marker, 1)
          delivery_test_path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/deploy-smoke-protection-helper.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(deploy): smoke canonical protected frontends'
          git push origin HEAD:agent/deploy-smoke-protection-helper
