name: VPS MCP ingress repair 958

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: vps-mcp-ingress-repair-958
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/repair-vps-mcp-oci-ingress-958' &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact operator command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/repair-vps-mcp-oci-ingress-958'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Lock exact main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = false
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Foundation CI green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          result="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/foundation-f0-2.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20")"
          success="$(jq -r '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // empty' <<<"$result")"
          test -n "$success"
          echo "FOUNDATION_EXACT_HEAD_RUN=$success" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SSH
        id: ssh
        shell: bash
        env:
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_MCP_SSH_KEY"
          umask 077
          key="$RUNNER_TEMP/mcp.key"
          known="$RUNNER_TEMP/mcp.known"
          printf '%s\n' "$VPS_MCP_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 10 -H "$VPS_MCP_HOST" > "$known" 2>/dev/null
          test -s "$known"
          chmod 600 "$known"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"

      - name: Repair MCP instance web ingress without touching proxy listeners
        id: repair
        shell: bash
        env:
          MCP_KEY: ${{ steps.ssh.outputs.key }}
          MCP_KNOWN: ${{ steps.ssh.outputs.known }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mcp-ingress-repair.txt"
          token="npp958-web-${GITHUB_RUN_ID}"
          echo "REPORT_FILE=$report" >> "$GITHUB_ENV"
          echo "PROBE_TOKEN=$token" >> "$GITHUB_ENV"
          : > "$report"

          ssh -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" "bash -s -- '$VPS_MCP_HOST' '$token'" >> "$report" <<'REMOTE'
          set -euo pipefail
          expected_public_ip="$1"
          token="$2"

          proxy_count() {
            ss -lntH | awk '{n=split($4,a,":");p=a[n]+0;if(p>=3128&&p<=3427)c++}END{print c+0}'
          }
          verify_proxy() {
            for s in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
              test "$(systemctl is-active "$s")" = active
            done
            test "$(proxy_count)" = 300
          }

          verify_proxy
          echo 'PROXY_BOUNDARY_BEFORE=PASS'
          test "$(systemctl is-active nginx)" = active
          ss -lntH | awk '{n=split($4,a,":");if(a[n]+0==80)f=1}END{exit f?0:1}'
          echo 'NGINX_HTTP_LISTENER=PASS'

          metadata=/tmp/npp958-vnics.json
          curl -fsS --max-time 5 -H 'Authorization: Bearer Oracle' \
            http://169.254.169.254/opc/v2/vnics/ > "$metadata"
          python3 - "$metadata" "$expected_public_ip" <<'PY'
          import json
          import sys
          path, expected = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)
          if not isinstance(data, list) or not data:
              raise SystemExit('metadata_missing')
          primary = next((item for item in data if item.get('nicIndex') == 0), data[0])
          if primary.get('publicIp') != expected:
              raise SystemExit('public_ip_mismatch')
          private_ip = str(primary.get('privateIp') or '')
          cidr = str(primary.get('subnetCidrBlock') or '')
          if cidr != '10.0.0.0/24' and not private_ip.startswith('10.0.0.'):
              raise SystemExit('public_subnet_mismatch')
          print('OCI_METADATA_PUBLIC_IP_MATCH=PASS')
          print('OCI_METADATA_PUBLIC_SUBNET=PASS')
          PY
          rm -f "$metadata"

          sudo -n install -d -m 0755 /var/www/npp-acme/.well-known/acme-challenge
          printf '%s\n' "$token" | sudo -n tee "/var/www/npp-acme/.well-known/acme-challenge/$token" >/dev/null
          local_body="$(curl -fsS --max-time 5 -H "Host: $expected_public_ip" "http://127.0.0.1/.well-known/acme-challenge/$token")"
          test "$local_body" = "$token"
          echo 'LOCAL_HTTP01_WEBROOT=PASS'

          echo 'IPTABLES_RELEVANT_BEFORE_BEGIN'
          sudo -n iptables -L INPUT -n --line-numbers | grep -E '(^Chain INPUT|dpt:(22|80|443|3000|3128)|REJECT|DROP)' || true
          echo 'IPTABLES_RELEVANT_BEFORE_END'

          added=none
          if ! sudo -n iptables -C INPUT -p tcp -m conntrack --ctstate NEW --dport 80 -j ACCEPT 2>/dev/null; then
            sudo -n iptables -I INPUT 1 -p tcp -m conntrack --ctstate NEW --dport 80 -j ACCEPT
            added=80
          fi
          if ! sudo -n iptables -C INPUT -p tcp -m conntrack --ctstate NEW --dport 443 -j ACCEPT 2>/dev/null; then
            sudo -n iptables -I INPUT 1 -p tcp -m conntrack --ctstate NEW --dport 443 -j ACCEPT
            if [ "$added" = none ]; then added=443; else added="$added,443"; fi
          fi

          sudo -n iptables -C INPUT -p tcp -m conntrack --ctstate NEW --dport 80 -j ACCEPT
          sudo -n iptables -C INPUT -p tcp -m conntrack --ctstate NEW --dport 443 -j ACCEPT
          echo "INSTANCE_INGRESS_ADDED=$added"

          if ! command -v netfilter-persistent >/dev/null 2>&1; then
            sudo -n apt-get update -y >/dev/null
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent >/dev/null
          fi
          sudo -n netfilter-persistent save >/dev/null
          echo 'INSTANCE_INGRESS_PERSISTED=PASS'

          verify_proxy
          echo 'PROXY_BOUNDARY_AFTER=PASS'
          REMOTE

      - name: Verify public HTTP-01 ingress from GitHub runner
        id: external
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/mcp-ingress-probe-body"
          code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$body" -w '%{http_code}' \
            "http://$VPS_MCP_HOST/.well-known/acme-challenge/$PROBE_TOKEN")"
          echo "EXTERNAL_HTTP_STATUS=$code" >> "$REPORT_FILE"
          test "$code" = 200
          grep -qxF "$PROBE_TOKEN" "$body"
          echo 'EXTERNAL_HTTP01=PASS' >> "$REPORT_FILE"

      - name: Cleanup remote probe and verify proxy boundary
        if: always()
        id: cleanup
        shell: bash
        env:
          MCP_KEY: ${{ steps.ssh.outputs.key }}
          MCP_KNOWN: ${{ steps.ssh.outputs.known }}
        run: |
          set -euo pipefail
          ssh -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" "bash -s -- '${PROBE_TOKEN:-missing}'" <<'REMOTE'
          set -euo pipefail
          token="$1"
          sudo -n rm -f "/var/www/npp-acme/.well-known/acme-challenge/$token"
          for s in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
            test "$(systemctl is-active "$s")" = active
          done
          test "$(ss -lntH | awk '{n=split($4,a,":");p=a[n]+0;if(p>=3128&&p<=3427)c++}END{print c+0}')" = 300
          REMOTE

      - name: Publish sanitized repair evidence to Issue 958
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mcp-ingress-repair-evidence.md"
          {
            echo '## VPS MCP instance ingress repair'
            echo
            echo "- SOURCE_SHA: \`${SOURCE_SHA:-unknown}\`"
            echo "- GITHUB_RUN_ID: \`${GITHUB_RUN_ID}\`"
            echo "- Instance repair: \`${REPAIR_OUTCOME:-unknown}\`"
            echo "- External HTTP-01: \`${EXTERNAL_OUTCOME:-unknown}\`"
            echo "- Proxy-boundary cleanup: \`${CLEANUP_OUTCOME:-unknown}\`"
            echo '- Scope: MCP VPS OS ingress TCP 80/443 only; Oracle VCN rules and proxy listeners unchanged.'
            echo '- Secret values and OCI resource IDs are not included.'
            echo
            echo '```text'
            if [ -f "${REPORT_FILE:-}" ]; then cat "$REPORT_FILE"; else echo 'REPORT_FILE=missing'; fi
            echo '```'
          } > "$evidence"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/958/comments" -f body="$(cat "$evidence")" >/dev/null
