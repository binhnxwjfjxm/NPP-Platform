name: Core UI and Browser E2E

on:
  push:
    branches:
      - main
      - agent/phase-2-ui-e2e-gate
    paths:
      - 'npp-core/web/**'
      - 'npp-core/api/**'
      - 'packages/**'
      - 'database/migrations/**'
      - '.github/workflows/core-ui-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - 'npp-core/web/**'
      - 'npp-core/api/**'
      - 'packages/**'
      - 'database/migrations/**'
      - '.github/workflows/core-ui-e2e.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: core-ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Isolated runner-only credentials. These are not production secrets.
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_e2e
      E2E_BACKEND_API_TOKEN: ci-e2e-token-not-a-production-secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: npp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d npp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Run Core API migrations
        run: npm --workspace npp-core-api run migration:migrate
        env:
          NODE_ENV: test

      - name: Verify Core API
        run: npm --workspace npp-core-api run verify
        env:
          NODE_ENV: test

      - name: Verify Core web
        run: npm --workspace npp-core-web run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: npp-core/web

      - name: Run browser E2E
        run: npm run test:core-ui-e2e

      - name: Publish browser summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = 'npp-core/web/test-results/results.json';
          console.log('## Core UI browser verification');
          if (!fs.existsSync(path)) {
            console.log('Playwright JSON results were not produced.');
            process.exit(0);
          }
          const result = JSON.parse(fs.readFileSync(path, 'utf8'));
          const stats = result.stats || {};
          console.log(`- Expected: ${stats.expected ?? 0}`);
          console.log(`- Unexpected: ${stats.unexpected ?? 0}`);
          console.log(`- Skipped: ${stats.skipped ?? 0}`);
          console.log(`- Duration: ${stats.duration ?? 0} ms`);
          NODE

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-playwright-report
          path: npp-core/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-playwright-traces
          path: npp-core/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
