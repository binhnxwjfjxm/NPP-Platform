name: Core UI and Browser E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/core-ui-e2e.yml'
      - '.github/scripts/fix-phase-5-3-e2e-waits.py'

permissions:
  contents: write

jobs:
  fix-phase-5-3-e2e-waits:
    if: github.head_ref == 'agent/phase-5-3-goods-receipt-variance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-3-goods-receipt-variance
          fetch-depth: 0
      - name: Fix E2E waits and restore workflow
        shell: bash
        run: |
          python .github/scripts/fix-phase-5-3-e2e-waits.py
          git show origin/main:.github/workflows/core-ui-e2e.yml > .github/workflows/core-ui-e2e.yml
          rm -f .github/scripts/fix-phase-5-3-e2e-waits.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github npp-core/web/e2e/goods-receipts.spec.ts
          git commit -m "test(purchasing): synchronize goods receipt browser flow"
          git push origin HEAD:agent/phase-5-3-goods-receipt-variance
