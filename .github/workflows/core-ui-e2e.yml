name: Core UI and Browser E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/core-ui-e2e.yml'
      - '.github/scripts/phase-5-3-ui-clean.py'
      - 'npp-core/web/**'

permissions:
  contents: write

jobs:
  finalize-phase-5-3:
    if: github.head_ref == 'agent/phase-5-3-goods-receipt-variance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-3-goods-receipt-variance
          fetch-depth: 0
      - name: Clean UTF-8 and remove repair tooling
        shell: bash
        run: |
          python .github/scripts/phase-5-3-ui-clean.py
          git show origin/main:.github/workflows/core-foundation.yml > .github/workflows/core-foundation.yml
          git show origin/main:.github/workflows/core-ui-e2e.yml > .github/workflows/core-ui-e2e.yml
          rm -f .github/workflows/phase-5-3-repair.yml
          rm -f .github/scripts/phase-5-3-final-repair.py
          rm -f .github/scripts/phase-5-3-ui-clean.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github npp-core/web/app/purchasing/goods-receipts/GoodsReceiptWorkspace.tsx
          git commit -m "chore(purchasing): finalize phase 5.3 review cleanup"
          git push origin HEAD:agent/phase-5-3-goods-receipt-variance
