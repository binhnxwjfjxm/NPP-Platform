name: Apply Vietnam Address UI

on:
  push:
    branches:
      - agent/ui-live-fixes
    paths:
      - '.github/workflows/ui-vietnam-address-apply.yml'
      - '.github/ui-vietnam-address/**'
      - 'npp-core/web/app/customers/vietnam-administrative-fields.tsx'
      - 'npp-core/web/app/api/reference/vietnam-administrative-units/route.ts'
      - 'npp-core/web/lib/vietnam-administrative-data.ts'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/ui-live-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-live-fixes
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Add administrative dataset dependency
        run: npm install --workspace npp-core-web --save-exact vietnam-address-database@1.0.0

      - name: Apply UI integration patch
        run: python .github/ui-vietnam-address/apply.py

      - name: Verify Core web
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm --workspace npp-core-web run verify 2>&1 | tee /tmp/ui-vietnam-address-verify.log

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-vietnam-address-verify
          path: /tmp/ui-vietnam-address-verify.log
          retention-days: 1

      - name: Stop on verification failure
        if: steps.verify.outcome != 'success'
        run: exit 1

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ui-vietnam-address
          rm -f .github/workflows/ui-vietnam-address-apply.yml
          git config user.name 'khuongbinhinfo-a11y'
          git config user.email '269412638+khuongbinhinfo-a11y@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): add dependent Vietnam administrative selectors'
          git push origin HEAD:agent/ui-live-fixes
