name: Apply Company sales line flat UI

on:
  push:
    branches:
      - agent/company-sales-line-flat-ui
    paths:
      - .github/workflows/company-sales-line-flat-ui-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-sales-line-flat-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply flat numeric controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('npp-core/web/app/sales/sales-orders/sales-orders.module.css')
          css = css_path.read_text()
          marker = '/* issue-791-sales-line-flat-controls */'
          if marker in css:
              raise SystemExit('flat UI marker already exists')

          block = r'''

          /* issue-791-sales-line-flat-controls */
          .orderLineCard{align-items:center}
          .unitCell,.quantityCell,.priceCell,.discountCell{min-height:32px;align-items:center}
          .unitCell{display:flex;gap:.3rem}
          .quantityCell{display:flex;gap:.28rem}
          .priceCell{display:flex;gap:.32rem;flex-wrap:nowrap}
          .discountCell{display:flex;gap:.32rem}
          .quantityStepper{display:grid;grid-template-columns:24px 64px 24px;gap:.15rem;align-items:center;width:max-content}
          .quantityStepper input,.directPriceInput,.discountControls input,.discountControls select{min-height:30px!important;border:0!important;border-bottom:1px solid #b9c5be!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;padding:.22rem .12rem!important;line-height:1.25}
          .quantityStepper input:focus,.directPriceInput:focus,.discountControls input:focus,.discountControls select:focus{outline:none!important;border-bottom-color:#155c46!important;box-shadow:0 1px 0 #155c46!important}
          .quantityStepper button{width:24px;min-width:24px;height:30px;min-height:30px!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;font-size:1rem!important;line-height:1}
          .quantityMinus{color:#a23a32!important;background:transparent!important}
          .quantityPlus{color:#146d55!important;background:transparent!important}
          .quantityStepper input{width:64px!important;min-width:64px!important;text-align:center;font-variant-numeric:tabular-nums}
          .directPriceInput{width:100%;min-width:0!important;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
          .discountControls{display:grid;grid-template-columns:54px minmax(76px,1fr);gap:.28rem;align-items:center;width:100%}
          .discountControls select,.discountControls input{min-width:0!important;width:100%!important}
          .discountControls input{text-align:right;font-variant-numeric:tabular-nums}
          .manualBadge{display:none}
          .priceCell>.linkButton{flex:0 0 24px;width:24px;height:28px;min-height:28px!important;padding:0!important;border:0!important;background:transparent!important;font-size:0!important;line-height:1}
          .priceCell>.linkButton::after{content:"↺";font-size:1rem;color:#146d55}
          .priceCell strong{white-space:nowrap}
          @media(min-width:1181px){.unitCell>span,.quantityCell>span,.priceCell>span,.discountCell>span{display:none}}
          @media(max-width:780px){.quantityStepper button{height:34px;min-height:34px!important}.quantityStepper input,.directPriceInput,.discountControls input,.discountControls select{min-height:34px!important}}
          @media(max-width:520px){.discountCell{grid-column:1/-1}.unitCell,.quantityCell,.priceCell,.discountCell{justify-content:flex-start}.discountControls{max-width:250px}}
          '''
          css_path.write_text(css.rstrip() + block + '\n')

          test_path = Path('npp-core/web/test/issue-791-sales-line-flat-ui.test.mjs')
          test_path.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const cssPath = new URL('../app/sales/sales-orders/sales-orders.module.css', import.meta.url);
          const formPath = new URL('../app/sales/sales-orders/SalesOrderCommercialForm.tsx', import.meta.url);

          test('Issue #791 keeps quantity, price and line discount controls flat and baseline-stable', async () => {
            const [css, form] = await Promise.all([readFile(cssPath, 'utf8'), readFile(formPath, 'utf8')]);
            assert.match(css, /issue-791-sales-line-flat-controls/);
            assert.match(css, /\.quantityStepper input,\.directPriceInput,\.discountControls input,\.discountControls select\{[^}]*border:0!important;[^}]*border-bottom:1px solid/);
            assert.match(css, /\.quantityStepper button\{[^}]*border:0!important;[^}]*background:transparent!important/);
            assert.match(css, /\.priceCell\{display:flex;gap:\.32rem;flex-wrap:nowrap\}/);
            assert.match(css, /\.manualBadge\{display:none\}/);
            assert.match(css, /\.priceCell>\.linkButton::after\{content:"↺"/);
            assert.match(form, /aria-label={`Số lượng \${line\.sku}`}/);
            assert.match(form, /aria-label={`Đơn giá \${line\.sku}`}/);
            assert.match(form, /aria-label={`Chiết khấu \${line\.sku}`}/);
          });
          ''')
          PY

      - name: Typecheck Company web
        run: npm --workspace npp-core-web run typecheck

      - name: Test Company web
        run: npm --workspace npp-core-web test

      - name: Check diff
        run: git diff --check

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/company-sales-line-flat-ui-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/web/app/sales/sales-orders/sales-orders.module.css npp-core/web/test/issue-791-sales-line-flat-ui.test.mjs
          git commit -m "fix(company): làm phẳng dòng số lượng giá và CK #791"
          git push origin HEAD:agent/company-sales-line-flat-ui
