name: Issue 158 b014 migration rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-158-rehearse-b014.yml

permissions:
  contents: read

jobs:
  rehearse:
    if: github.event.pull_request.head.ref == 'agent/diagnose-heroku-mcp-run-158'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehearsal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      OWNER_URL: postgresql://postgres:postgres@127.0.0.1:5432/rehearsal
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-158-mcp-domain-schema
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/apps/backend/package-lock.json

      - name: Install tools and restore b014
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix mcp/apps/backend
          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          backup_url="$(heroku pg:backups:url b014 -a hung-phat)"
          test -n "$backup_url"
          echo "::add-mask::$backup_url"
          curl --fail --silent --show-error --location "$backup_url" --output /tmp/b014.dump
          test -s /tmp/b014.dump
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v /tmp/b014.dump:/backup.dump:ro postgres:17 \
            pg_restore --host=127.0.0.1 --port=5432 --username=postgres --dbname=rehearsal \
              --no-owner --no-privileges --clean --if-exists --exit-on-error /backup.dump
          echo "BACKUP_ID=b014"
          echo "BACKUP_BYTES=$(stat -c '%s' /tmp/b014.dump)"

      - name: Apply migration twice
        shell: bash
        env:
          NODE_ENV: test
          MCP_MIGRATION_DATABASE_URL: ${{ env.OWNER_URL }}
        run: |
          set -euo pipefail
          before="$(psql "$OWNER_URL" -XAt -v ON_ERROR_STOP=1 -c "select jsonb_build_object('customers',(select count(*) from shared.customers),'products',(select count(*) from shared.products),'variants',(select count(*) from shared.product_variants),'migrations',(select count(*) from shared.schema_migrations))::text")"
          echo "$before" > /tmp/before.json
          echo "BEFORE=$before"
          npm --prefix mcp/apps/backend run migration:migrate
          npm --prefix mcp/apps/backend run migration:migrate
          npm --prefix mcp/apps/backend run migration:verify

      - name: Create runtime role and verify 20 read models
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE mcp_runtime LOGIN PASSWORD 'mcp_runtime_rehearsal';
          SELECT shared.grant_mcp_runtime_access('mcp_runtime');
          SQL

          if psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 \
              -c "select shared.grant_mcp_runtime_access('postgres')" \
              > /tmp/privileged-role.log 2>&1; then
            echo 'privileged role was accepted by grant helper' >&2
            exit 1
          fi
          grep -Fq 'mcp_runtime_role_is_privileged:postgres' /tmp/privileged-role.log

          helper_execute="$(psql "$OWNER_URL" -XAt -v ON_ERROR_STOP=1 \
            -c "select has_function_privilege('mcp_runtime', 'shared.grant_mcp_runtime_access(name)', 'EXECUTE')::text")"
          test "$helper_execute" = "false"
          echo 'HELPER_EXECUTE=false' > /tmp/runtime-reads.log

          PGPASSWORD=mcp_runtime_rehearsal psql \
            --host=127.0.0.1 --port=5432 --username=mcp_runtime --dbname=rehearsal \
            -XAt -v ON_ERROR_STOP=1 <<'SQL' | tee -a /tmp/runtime-reads.log
          select 'CURRENT_USER=' || current_user;
          select 'SEARCH_PATH=' || current_setting('search_path');
          select 'SCHEMA_USAGE=' || has_schema_privilege(current_user, 'mcp', 'USAGE')::text;
          select 'IDEMPOTENCY_SELECT=' || has_table_privilege(current_user, 'mcp.idempotency_records', 'SELECT')::text;
          select 'IDEMPOTENCY_INSERT=' || has_table_privilege(current_user, 'mcp.idempotency_records', 'INSERT')::text;
          select 'IDEMPOTENCY_UPDATE=' || has_table_privilege(current_user, 'mcp.idempotency_records', 'UPDATE')::text;
          select 'IDEMPOTENCY_DELETE=' || has_table_privilege(current_user, 'mcp.idempotency_records', 'DELETE')::text;
          select 'AUDIT_INSERT=' || has_table_privilege(current_user, 'mcp.audit_events', 'INSERT')::text;
          select 'AUDIT_SELECT=' || has_table_privilege(current_user, 'mcp.audit_events', 'SELECT')::text;
          select 'AUDIT_UPDATE=' || has_table_privilege(current_user, 'mcp.audit_events', 'UPDATE')::text;
          select 'AUDIT_DELETE=' || has_table_privilege(current_user, 'mcp.audit_events', 'DELETE')::text;
          select 'OUTBOX_INSERT=' || has_table_privilege(current_user, 'mcp.outbox_events', 'INSERT')::text;
          select 'OUTBOX_SELECT=' || has_table_privilege(current_user, 'mcp.outbox_events', 'SELECT')::text;
          select 'OUTBOX_UPDATE=' || has_table_privilege(current_user, 'mcp.outbox_events', 'UPDATE')::text;
          select 'OUTBOX_DELETE=' || has_table_privilege(current_user, 'mcp.outbox_events', 'DELETE')::text;
          select 'ACCOUNTS_SELECT=' || has_table_privilege(current_user, 'mcp.accounts', 'SELECT')::text;
          select 'ACCOUNTS_INSERT=' || has_table_privilege(current_user, 'mcp.accounts', 'INSERT')::text;
          select 'ROUTES_SELECT=' || has_table_privilege(current_user, 'mcp.mcp_routes', 'SELECT')::text;
          select 'ROUTES_INSERT=' || has_table_privilege(current_user, 'mcp.mcp_routes', 'INSERT')::text;
          select 'ROUTES_UPDATE=' || has_table_privilege(current_user, 'mcp.mcp_routes', 'UPDATE')::text;
          select 'ROUTES_DELETE=' || has_table_privilege(current_user, 'mcp.mcp_routes', 'DELETE')::text;
          select 'READ=' || name || ':' || count_value from (
            select 'accounts' name,(select count(*) from mcp.accounts)::bigint count_value union all
            select 'market_reports',(select count(*) from mcp.market_reports)::bigint union all
            select 'mcp_followups',(select count(*) from mcp.mcp_followups)::bigint union all
            select 'mcp_report_setting_groups',(select count(*) from mcp.mcp_report_setting_groups)::bigint union all
            select 'mcp_report_settings',(select count(*) from mcp.mcp_report_settings)::bigint union all
            select 'mcp_route_customers',(select count(*) from mcp.mcp_route_customers)::bigint union all
            select 'mcp_route_sessions',(select count(*) from mcp.mcp_route_sessions)::bigint union all
            select 'mcp_routes',(select count(*) from mcp.mcp_routes)::bigint union all
            select 'mcp_session_customers',(select count(*) from mcp.mcp_session_customers)::bigint union all
            select 'mcp_session_reports',(select count(*) from mcp.mcp_session_reports)::bigint union all
            select 'mcp_visits',(select count(*) from mcp.mcp_visits)::bigint union all
            select 'order_items',(select count(*) from mcp.order_items)::bigint union all
            select 'orders',(select count(*) from mcp.orders)::bigint union all
            select 'product_variants',(select count(*) from mcp.product_variants)::bigint union all
            select 'products',(select count(*) from mcp.products)::bigint union all
            select 'route_customers',(select count(*) from mcp.route_customers)::bigint union all
            select 'test_customer_results',(select count(*) from mcp.test_customer_results)::bigint union all
            select 'test_customers',(select count(*) from mcp.test_customers)::bigint union all
            select 'test_file_products',(select count(*) from mcp.test_file_products)::bigint union all
            select 'test_files',(select count(*) from mcp.test_files)::bigint
          ) reads order by name;
          SQL
          test "$(grep -c '^READ=' /tmp/runtime-reads.log)" -eq 20
          for expected in \
            CURRENT_USER=mcp_runtime \
            'SEARCH_PATH=mcp, public' \
            SCHEMA_USAGE=true \
            HELPER_EXECUTE=false \
            IDEMPOTENCY_SELECT=true IDEMPOTENCY_INSERT=true IDEMPOTENCY_UPDATE=true IDEMPOTENCY_DELETE=false \
            AUDIT_INSERT=true AUDIT_SELECT=false AUDIT_UPDATE=false AUDIT_DELETE=false \
            OUTBOX_INSERT=true OUTBOX_SELECT=false OUTBOX_UPDATE=false OUTBOX_DELETE=false \
            ACCOUNTS_SELECT=true ACCOUNTS_INSERT=false \
            ROUTES_SELECT=true ROUTES_INSERT=true ROUTES_UPDATE=true ROUTES_DELETE=true; do
            grep -Fxq "$expected" /tmp/runtime-reads.log
          done

      - name: Reconcile Core counts
        shell: bash
        run: |
          set -euo pipefail
          before="$(cat /tmp/before.json)"
          after="$(psql "$OWNER_URL" -XAt -v ON_ERROR_STOP=1 -c "select jsonb_build_object('customers',(select count(*) from shared.customers),'products',(select count(*) from shared.products),'variants',(select count(*) from shared.product_variants),'migrations',(select count(*) from shared.schema_migrations))::text")"
          echo "AFTER=$after"
          test "$(jq -c 'del(.migrations)' <<<"$before")" = "$(jq -c 'del(.migrations)' <<<"$after")"
          test "$(jq -r '.migrations' <<<"$after")" -eq $(( $(jq -r '.migrations' <<<"$before") + 2 ))
          echo "CORE_RECONCILIATION=matched"
          echo "MCP_MIGRATION_REHEARSAL=passed"
