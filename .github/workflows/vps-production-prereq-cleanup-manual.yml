name: VPS production prerequisite cleanup

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-production-prereq-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/cleanup-vps-production-prereqs' &&
        (
          github.actor == 'binhnxwjfjxm' ||
          github.actor == 'khuongbinhinfo-a11y'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/cleanup-vps-production-prereqs'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH credentials
        id: ssh
        shell: bash
        env:
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_MCP_SSH_KEY"

          umask 077
          printf '%s\n' "$VPS_COMPANY_SSH_KEY" > "$RUNNER_TEMP/vps-company.key"
          printf '%s\n' "$VPS_MCP_SSH_KEY" > "$RUNNER_TEMP/vps-mcp.key"
          chmod 600 "$RUNNER_TEMP"/vps-*.key
          ssh-keygen -y -f "$RUNNER_TEMP/vps-company.key" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/vps-mcp.key" >/dev/null

          known_hosts="$RUNNER_TEMP/vps-known-hosts"
          : > "$known_hosts"
          for host in "$VPS_COMPANY_HOST" "$VPS_MCP_HOST"; do
            ssh-keyscan -T 10 -H "$host" >> "$known_hosts" 2>/dev/null
          done
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Snapshot proxy reachability before cleanup
        id: proxy_before
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local port="$1"
            if timeout 3 bash -c "</dev/tcp/$VPS_MCP_HOST/$port" 2>/dev/null; then
              printf 'OPEN'
            else
              printf 'CLOSED'
            fi
          }
          echo "p3000=$(probe 3000)" >> "$GITHUB_OUTPUT"
          echo "p3128=$(probe 3128)" >> "$GITHUB_OUTPUT"
          echo "p3278=$(probe 3278)" >> "$GITHUB_OUTPUT"
          echo "p3427=$(probe 3427)" >> "$GITHUB_OUTPUT"

      - name: Verify Công Ty cleanup from previous run
        id: company
        shell: bash
        env:
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/company-cleanup.out"
          ssh \
            -i "$RUNNER_TEMP/vps-company.key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" 'bash -s' >"$out" <<'REMOTE'
          set -euo pipefail
          sudo -n true
          test "$(systemctl is-active nginx)" = "active"
          sudo -n nginx -t >/dev/null 2>&1
          for site in api.tocvietlab.studio.conf api.vieclamgannha.me.conf; do
            test ! -e "/etc/nginx/sites-enabled/$site"
            test ! -L "/etc/nginx/sites-enabled/$site"
          done
          certbot_failed="$(systemctl --failed --no-legend --plain 2>/dev/null | awk '{print $1}' | grep -E '^(certbot\.service|snap\.certbot\.renew\.service)$' || true)"
          test -z "$certbot_failed"
          echo 'old_nginx_sites=absent'
          echo 'nginx=active'
          echo 'nginx_test=PASS'
          echo 'certbot_failed_units=0'
          REMOTE
          cat "$out"
          echo "output=$out" >> "$GITHUB_OUTPUT"

      - name: Cleanup proxy VPS prerequisites without changing proxy
        id: mcp
        shell: bash
        env:
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          PORT3000_EXTERNAL_BEFORE: ${{ steps.proxy_before.outputs.p3000 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mcp-cleanup.out"
          ssh \
            -i "$RUNNER_TEMP/vps-mcp.key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" "bash -s -- '$PORT3000_EXTERNAL_BEFORE'" >"$out" <<'REMOTE'
          set -euo pipefail
          port3000_external_before="${1:-UNKNOWN}"
          sudo -n true

          for svc in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
            test "$(systemctl is-active "$svc")" = "active"
            test "$(systemctl is-enabled "$svc")" = "enabled"
          done

          proxy_count_before="$(ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}')"
          test "$proxy_count_before" = "300"
          ss -lntH | awk '{n=split($4,a,":"); if (a[n]+0==3000) found=1} END {exit found?0:1}'

          public_ports="$(ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p!=53) print p}' | sort -n -u)"
          while read -r port; do
            [ -n "$port" ] || continue
            if [ "$port" = "22" ] || [ "$port" = "111" ] || [ "$port" = "3000" ] || { [ "$port" -ge 3128 ] && [ "$port" -le 3427 ]; }; then
              continue
            fi
            echo "Refusing firewall mutation: unexplained listening TCP port $port" >&2
            exit 31
          done <<< "$public_ports"

          dep_text="$(systemctl show ipv4-proxy ipv6-proxy oci-ipv6-pool --property=Requires,Wants,After --no-pager 2>/dev/null || true)"
          if grep -Eqi 'rpcbind|nfs|sunrpc' <<< "$dep_text"; then
            echo 'Refusing rpcbind cleanup: proxy unit dependency detected' >&2
            exit 32
          fi

          for svc in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
            fragment="$(systemctl show "$svc" -p FragmentPath --value 2>/dev/null || true)"
            if [ -n "$fragment" ] && [ -f "$fragment" ]; then
              if sudo -n grep -Eqi 'rpcbind|nfs|sunrpc|(^|[^0-9])111([^0-9]|$)' "$fragment"; then
                echo "Refusing rpcbind cleanup: dependency marker in $svc unit" >&2
                exit 33
              fi
            fi
          done

          if findmnt -rn -t nfs,nfs4 | grep -q .; then
            echo 'Refusing rpcbind cleanup: active NFS mount detected' >&2
            exit 34
          fi

          reverse_deps="$(systemctl list-dependencies --reverse rpcbind.service --plain --no-pager 2>/dev/null || true)"
          if grep -Eqi 'ipv4-proxy|ipv6-proxy|oci-ipv6-pool|nfs-server' <<< "$reverse_deps"; then
            echo 'Refusing rpcbind cleanup: active reverse dependency detected' >&2
            exit 35
          fi

          command -v ufw >/dev/null
          test "$(sudo -n ufw status | head -n1)" = 'Status: inactive'
          added_rules="$(sudo -n ufw show added 2>/dev/null | sed '/^[[:space:]]*$/d' || true)"
          if [ -n "$added_rules" ]; then
            bad_rules="$(printf '%s\n' "$added_rules" | grep -Ev "^Added user rules \(see 'ufw status' for running firewall\):$|^ufw allow (22/tcp|OpenSSH|3000/tcp|3128:3427/tcp)$" || true)"
            if [ -n "$bad_rules" ]; then
              echo 'Refusing UFW enable: pre-existing rules outside approved proxy set' >&2
              exit 36
            fi
          fi

          rpcbind_was_active=no
          if [ "$(systemctl is-active rpcbind.service 2>/dev/null || true)" = "active" ]; then
            rpcbind_was_active=yes
          fi

          if systemctl list-unit-files rpcbind.socket --no-legend 2>/dev/null | grep -q '^rpcbind.socket'; then
            sudo -n systemctl disable --now rpcbind.socket || true
          fi
          if systemctl list-unit-files rpcbind.service --no-legend 2>/dev/null | grep -q '^rpcbind.service'; then
            sudo -n systemctl disable --now rpcbind.service || true
          fi

          test "$(systemctl is-active rpcbind.service 2>/dev/null || true)" != "active"
          if ss -lntH | awk '{n=split($4,a,":"); if (a[n]+0==111) found=1} END {exit found?0:1}'; then
            echo 'Port 111 still listening after rpcbind stop' >&2
            exit 37
          fi

          sudo -n ufw default deny incoming >/dev/null
          sudo -n ufw default allow outgoing >/dev/null
          sudo -n ufw allow 22/tcp >/dev/null
          sudo -n ufw allow 3128:3427/tcp >/dev/null
          if [ "$port3000_external_before" = "OPEN" ]; then
            sudo -n ufw allow 3000/tcp >/dev/null
          elif [ "$port3000_external_before" != "CLOSED" ]; then
            echo 'Unknown external state for TCP 3000' >&2
            exit 38
          fi
          sudo -n ufw --force enable >/dev/null
          test "$(sudo -n ufw status | head -n1)" = 'Status: active'

          for svc in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
            test "$(systemctl is-active "$svc")" = "active"
          done
          proxy_count_after="$(ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}')"
          test "$proxy_count_after" = "$proxy_count_before"
          test "$proxy_count_after" = "300"
          ss -lntH | awk '{n=split($4,a,":"); if (a[n]+0==3000) found=1} END {exit found?0:1}'

          echo "proxy_listener_count_before=$proxy_count_before"
          echo "proxy_listener_count_after=$proxy_count_after"
          echo 'proxy_services=active_enabled'
          echo 'tcp_3000_listener=preserved'
          echo "tcp_3000_external_before=$port3000_external_before"
          echo "rpcbind_was_active=$rpcbind_was_active"
          echo 'rpcbind=inactive_disabled'
          echo 'tcp_111=closed'
          echo 'ufw=active'
          echo 'ufw_allowed_tcp=22,3128-3427,3000-only-if-preexisting-public'
          REMOTE
          cat "$out"
          echo "output=$out" >> "$GITHUB_OUTPUT"
          echo "rpcbind_was_active=$(grep '^rpcbind_was_active=' "$out" | tail -n1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Verify proxy externally after firewall
        id: proxy_after
        shell: bash
        env:
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          BEFORE_3000: ${{ steps.proxy_before.outputs.p3000 }}
          BEFORE_3128: ${{ steps.proxy_before.outputs.p3128 }}
          BEFORE_3278: ${{ steps.proxy_before.outputs.p3278 }}
          BEFORE_3427: ${{ steps.proxy_before.outputs.p3427 }}
          RPCBIND_WAS_ACTIVE: ${{ steps.mcp.outputs.rpcbind_was_active }}
        run: |
          set -euo pipefail
          probe() {
            local port="$1"
            if timeout 3 bash -c "</dev/tcp/$VPS_MCP_HOST/$port" 2>/dev/null; then
              printf 'OPEN'
            else
              printf 'CLOSED'
            fi
          }

          after_3000="$(probe 3000)"
          after_3128="$(probe 3128)"
          after_3278="$(probe 3278)"
          after_3427="$(probe 3427)"

          if [ "$after_3000" != "$BEFORE_3000" ] || \
             [ "$after_3128" != "$BEFORE_3128" ] || \
             [ "$after_3278" != "$BEFORE_3278" ] || \
             [ "$after_3427" != "$BEFORE_3427" ]; then
            ssh \
              -i "$RUNNER_TEMP/vps-mcp.key" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS" \
              "$VPS_SSH_USER@$VPS_MCP_HOST" "bash -s -- '$RPCBIND_WAS_ACTIVE'" <<'REMOTE'
            set -euo pipefail
            rpcbind_was_active="${1:-no}"
            sudo -n ufw disable >/dev/null || true
            if [ "$rpcbind_was_active" = "yes" ]; then
              sudo -n systemctl enable rpcbind.socket 2>/dev/null || true
              sudo -n systemctl start rpcbind.socket 2>/dev/null || true
              sudo -n systemctl enable rpcbind.service 2>/dev/null || true
              sudo -n systemctl start rpcbind.service 2>/dev/null || true
            fi
            REMOTE
            echo 'Proxy reachability changed; firewall/rpcbind cleanup rolled back' >&2
            exit 41
          fi

          ssh \
            -i "$RUNNER_TEMP/vps-mcp.key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" 'test "$(systemctl is-active ipv4-proxy)" = active && test "$(systemctl is-active ipv6-proxy)" = active && test "$(systemctl is-active oci-ipv6-pool)" = active && test "$(ss -lntH | awk '\''{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}'\'')" = 300'

          echo "p3000=$after_3000" >> "$GITHUB_OUTPUT"
          echo "p3128=$after_3128" >> "$GITHUB_OUTPUT"
          echo "p3278=$after_3278" >> "$GITHUB_OUTPUT"
          echo "p3427=$after_3427" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized cleanup evidence to Issue 958
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMPANY_OUT: ${{ steps.company.outputs.output }}
          MCP_OUT: ${{ steps.mcp.outputs.output }}
          BEFORE_3000: ${{ steps.proxy_before.outputs.p3000 }}
          BEFORE_3128: ${{ steps.proxy_before.outputs.p3128 }}
          BEFORE_3278: ${{ steps.proxy_before.outputs.p3278 }}
          BEFORE_3427: ${{ steps.proxy_before.outputs.p3427 }}
          AFTER_3000: ${{ steps.proxy_after.outputs.p3000 }}
          AFTER_3128: ${{ steps.proxy_after.outputs.p3128 }}
          AFTER_3278: ${{ steps.proxy_after.outputs.p3278 }}
          AFTER_3427: ${{ steps.proxy_after.outputs.p3427 }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/vps-prereq-cleanup.md"
          {
            echo '## VPS prerequisite cleanup — Issue #958'
            echo
            echo "- Source main SHA: \`${SOURCE_SHA:-unknown}\`"
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo '- Scope: prerequisite cleanup only; proxy IPv4/IPv6 is preserved; no MCP app deploy, no database install/migration, no cutover.'
            echo '- Secret handling: no token/password/private key/DATABASE_URL values are printed.'
            echo
            echo '### Công Ty VPS'
            if [ -n "${COMPANY_OUT:-}" ] && [ -f "$COMPANY_OUT" ]; then
              echo '```text'
              cat "$COMPANY_OUT"
              echo '```'
            else
              echo '- Verification did not produce a completed sanitized result.'
            fi
            echo
            echo '### Proxy VPS'
            if [ -n "${MCP_OUT:-}" ] && [ -f "$MCP_OUT" ]; then
              echo '```text'
              cat "$MCP_OUT"
              echo '```'
            else
              echo '- Cleanup did not produce a completed sanitized result.'
            fi
            echo
            echo '### Public reachability before -> after'
            echo "- 3000: ${BEFORE_3000:-unknown} -> ${AFTER_3000:-unknown}"
            echo "- 3128: ${BEFORE_3128:-unknown} -> ${AFTER_3128:-unknown}"
            echo "- 3278: ${BEFORE_3278:-unknown} -> ${AFTER_3278:-unknown}"
            echo "- 3427: ${BEFORE_3427:-unknown} -> ${AFTER_3427:-unknown}"
          } > "$report"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/958/comments" \
            -f body="$(cat "$report")" \
            >/dev/null
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce cleanup outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ssh.outcome }}" = "success"
          test "${{ steps.company.outcome }}" = "success"
          test "${{ steps.mcp.outcome }}" = "success"
          test "${{ steps.proxy_after.outcome }}" = "success"
