name: One-shot Pack 8 confirmation fix

on:
  push:
    branches:
      - agent/document-numbering
    paths:
      - ".github/workflows/one-shot-fix-pack8-confirmation.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-numbering
          fetch-depth: 0

      - name: Confirm ephemeral migration rehearsal explicitly
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/phase-3-split-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = """      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal_npp_core
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal_npp_core
      DATABASE_SSL_MODE: disable
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
    steps:
"""
          new = """      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal_npp_core
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearsal_npp_core
      DATABASE_SSL_MODE: disable
      MIGRATION_REHEARSAL_CONFIRM: temporary-database
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
    steps:
"""
          if text.count(old) != 1:
              raise SystemExit('Pack 8 environment contract changed unexpectedly')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-pack8-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-3-split-validation.yml
          git diff --cached --check
          git commit -m "Phase 3: confirm ephemeral Pack 8 rehearsal"
          git push origin HEAD:agent/document-numbering
