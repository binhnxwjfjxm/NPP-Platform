name: Phase 5.3 review repair

on:
  push:
    branches:
      - agent/phase-5-3-goods-receipt-variance

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-3-goods-receipt-variance
          fetch-depth: 0
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          # Repair the UTF-8 mojibake introduced across the Goods Receipt workspace.
          ui_path = 'npp-core/web/app/purchasing/goods-receipts/GoodsReceiptWorkspace.tsx'
          ui = read(ui_path)
          cp_extra = '\u20ac\u201a\u0192\u201e\u2026\u2020\u2021\u02c6\u2030\u0160\u2039\u0152\u017d\u2018\u2019\u201c\u201d\u2022\u2013\u2014\u02dc\u2122\u0161\u203a\u0153\u017e\u0178'
          span_pattern = re.compile(rf'[\x00-\xff{cp_extra}]+')
          markers = ('Ã', 'Â', 'Ä', 'Æ', 'â€', 'á»', 'áº', 'ðŸ')

          def score(value):
              return sum(value.count(marker) for marker in markers)

          def repair_span(value):
              current = value
              for _ in range(3):
                  best = current
                  best_score = score(current)
                  for encoding in ('cp1252', 'latin1'):
                      try:
                          candidate = current.encode(encoding).decode('utf-8')
                      except (UnicodeEncodeError, UnicodeDecodeError):
                          continue
                      candidate_score = score(candidate)
                      if candidate_score < best_score:
                          best = candidate
                          best_score = candidate_score
                  if best == current:
                      break
                  current = best
              return current

          ui = span_pattern.sub(lambda match: repair_span(match.group(0)), ui)
          if score(ui) != 0:
              raise SystemExit('GoodsReceiptWorkspace still contains mojibake markers')

          ui = replace_once(
              ui,
              "    return `Ghi sổ ${identifier}? Hàng sẽ đi vào tồn kho ngay sau khi xác nhận.`;",
              "    return `Ghi sổ ${identifier}? Phần chấp nhận sẽ vào tồn kho; phần loại hoặc chốt thiếu chỉ được ghi nhận trên phiếu.`;",
              'post confirmation copy',
          )
          ui = ui.replace('<small>Đã vào tồn kho</small>', '<small>Đã ghi nhận nhập hàng và chênh lệch</small>')
          ui = replace_once(
              ui,
              "        if (rejected > 0n && (!line.qualityReasonCode.trim() || !line.qualityNote.trim())) {\n          setError('Dòng có số lượng loại phải có lý do và ghi chú chất lượng.');",
              "        if ((rejected > 0n || line.finalizeLine) && (!line.qualityReasonCode.trim() || !line.qualityNote.trim())) {\n          setError('Dòng có hàng loại hoặc chốt thiếu phải có mã lý do và ghi chú chênh lệch.');",
              'variance reason validation',
          )
          ui = ui.replace(
              "              ...(decimalPositive(rejectedQuantity)\n                ? {",
              "              ...((decimalPositive(rejectedQuantity) || line.finalizeLine)\n                ? {",
              1,
          )
          ui = replace_once(
              ui,
              "                    const rejectedPositive = varianceAllowed && decimalPositive(line.rejectedQuantity);",
              "                    const rejectedPositive = varianceAllowed && decimalPositive(line.rejectedQuantity);\n                    const varianceReasonRequired = varianceAllowed && (rejectedPositive || line.finalizeLine);",
              'variance reason UI state',
          )
          ui = ui.replace('<th>Lý do CL</th>', '<th>Lý do chênh lệch</th>')
          ui = ui.replace('<th>Ghi chú CL</th>', '<th>Ghi chú chênh lệch</th>')
          ui = ui.replace('disabled={editor.loading || !rejectedPositive}', 'disabled={editor.loading || !varianceReasonRequired}')
          ui = ui.replace("placeholder={rejectedPositive ? 'VD: DAMAGED' : 'Chỉ mở khi có loại'}", "placeholder={varianceReasonRequired ? 'VD: DAMAGED hoặc SHORTAGE' : 'Chỉ mở khi có loại/chốt thiếu'}")
          ui = ui.replace("placeholder={rejectedPositive ? 'Ghi chú chất lượng' : 'Chỉ mở khi có loại'}", "placeholder={varianceReasonRequired ? 'Ghi chú chênh lệch' : 'Chỉ mở khi có loại/chốt thiếu'}")
          write(ui_path, ui)

          # Migration: align catalog metadata and enforce accepted/rejected/shortage semantics.
          migration_path = 'database/migrations/purchasing/023_goods_receipt_variance.sql'
          migration = read(migration_path)
          migration = migration.replace('chốt chặn chênh lệch', 'chốt chênh lệch')
          constraint_pattern = re.compile(
              r"ALTER TABLE purchasing\.goods_receipt_lines\n  ADD CONSTRAINT goods_receipt_lines_variance_check CHECK \(.*?\n  \);",
              re.S,
          )
          constraint = """ALTER TABLE purchasing.goods_receipt_lines
            ADD CONSTRAINT goods_receipt_lines_variance_check CHECK (
              received_quantity = accepted_quantity + rejected_quantity
              AND accepted_quantity >= 0
              AND rejected_quantity >= 0
              AND shortage_closed_quantity >= 0
              AND accepted_quantity <= remaining_quantity_before
              AND (
                (finalize_line = false AND shortage_closed_quantity = 0)
                OR (
                  finalize_line = true
                  AND shortage_closed_quantity = remaining_quantity_before - accepted_quantity
                )
              )
              AND (
                (rejected_quantity = 0 AND shortage_closed_quantity = 0)
                OR (
                  quality_reason_code IS NOT NULL
                  AND quality_note IS NOT NULL
                  AND char_length(btrim(quality_reason_code)) BETWEEN 1 AND 64
                  AND char_length(btrim(quality_note)) BETWEEN 1 AND 2000
                )
              )
              AND base_quantity = round(accepted_quantity * conversion_to_base, 6)
              AND remaining_quantity_after = remaining_quantity_before - accepted_quantity - shortage_closed_quantity
            );"""
          migration, count = constraint_pattern.subn(constraint, migration, count=1)
          if count != 1:
              raise SystemExit('failed to replace variance constraint')
          shape_sql = """

          ALTER TABLE purchasing.goods_receipts
            DROP CONSTRAINT IF EXISTS goods_receipts_posted_shape_check,
            DROP CONSTRAINT IF EXISTS goods_receipts_reversed_shape_check;

          ALTER TABLE purchasing.goods_receipts
            ADD CONSTRAINT goods_receipts_posted_shape_check CHECK (
              status <> 'posted'
              OR (
                document_number IS NOT NULL
                AND document_number_allocation_id IS NOT NULL
                AND posted_at IS NOT NULL
                AND posted_by IS NOT NULL
                AND reversed_at IS NULL
                AND reversed_by IS NULL
                AND reversal_reason IS NULL
                AND inventory_reversal_movement_id IS NULL
              )
            ),
            ADD CONSTRAINT goods_receipts_reversed_shape_check CHECK (
              status <> 'reversed'
              OR (
                document_number IS NOT NULL
                AND document_number_allocation_id IS NOT NULL
                AND posted_at IS NOT NULL
                AND posted_by IS NOT NULL
                AND reversed_at IS NOT NULL
                AND reversed_by IS NOT NULL
                AND reversal_reason IS NOT NULL
                AND (
                  (inventory_movement_id IS NULL AND inventory_reversal_movement_id IS NULL)
                  OR (inventory_movement_id IS NOT NULL AND inventory_reversal_movement_id IS NOT NULL)
                )
              )
            );
          """
          migration = migration.replace('\nCREATE INDEX IF NOT EXISTS goods_receipt_lines_quality_reason_idx', shape_sql + '\nCREATE INDEX IF NOT EXISTS goods_receipt_lines_quality_reason_idx', 1)
          write(migration_path, migration)

          # Service: rejected quantity never satisfies the PO; shortage is based on accepted quantity.
          service_path = 'npp-core/api/src/services/goods-receipt.js'
          service = read(service_path)
          service = replace_once(
              service,
              "  if (value instanceof Date) return value.toISOString().slice(0, 10);\n  const parsed = new Date(value);\n  if (Number.isNaN(parsed.getTime())) return null;\n  const year = parsed.getFullYear();\n  const month = String(parsed.getMonth() + 1).padStart(2, '0');\n  const day = String(parsed.getDate()).padStart(2, '0');\n  return `${year}-${month}-${day}`;",
              "  if (value instanceof Date) return value.toISOString().slice(0, 10);\n  const parsed = new Date(value);\n  return Number.isNaN(parsed.getTime()) ? null : parsed.toISOString().slice(0, 10);",
              'date-only normalization',
          )
          service = replace_once(
              service,
              "  let qualityReasonCode = null;\n  if (normalizedRejectedQuantity > 0n) {\n    qualityReasonCode = normalizeQualityReasonCode(qualityReasonCodeInput);\n    if (!qualityReasonCode) {\n      return failure('INVALID_QUALITY_REASON_CODE', `Line ${index + 1} qualityReasonCode is required when rejectedQuantity is greater than zero`);\n    }\n    if (!qualityNote) {\n      return failure('INVALID_QUALITY_NOTE', `Line ${index + 1} qualityNote is required when rejectedQuantity is greater than zero`);\n    }\n  }",
              "  const varianceReasonRequired = normalizedRejectedQuantity > 0n || finalizeLine;\n  let qualityReasonCode = null;\n  if (varianceReasonRequired) {\n    qualityReasonCode = normalizeQualityReasonCode(qualityReasonCodeInput);\n    if (!qualityReasonCode) {\n      return failure('INVALID_VARIANCE_REASON_CODE', `Line ${index + 1} variance reason code is required for rejected quantity or shortage closure`);\n    }\n    if (!qualityNote) {\n      return failure('INVALID_VARIANCE_REASON_NOTE', `Line ${index + 1} variance reason note is required for rejected quantity or shortage closure`);\n    }\n  }",
              'variance reason normalization',
          )
          service = service.replace('qualityNote: normalizedRejectedQuantity > 0n ? qualityNote : null,', 'qualityNote: varianceReasonRequired ? qualityNote : null,', 1)
          service = replace_once(
              service,
              "    if (input.value.receivedQuantityScaled > remainingBefore) {\n      return failure('RECEIPT_QUANTITY_EXCEEDS_REMAINING', `Line ${index + 1} quantity exceeds the remaining purchase order quantity`);\n    }",
              "    if (input.value.acceptedQuantityScaled > remainingBefore) {\n      return failure('RECEIPT_QUANTITY_EXCEEDS_REMAINING', `Line ${index + 1} accepted quantity exceeds the remaining purchase order quantity`);\n    }",
              'accepted over-receipt validation',
          )
          service = replace_once(
              service,
              "    const shortageClosedQuantityScaled = input.value.finalizeLine ? remainingBefore - input.value.receivedQuantityScaled : 0n;",
              "    const shortageClosedQuantityScaled = input.value.finalizeLine ? remainingBefore - input.value.acceptedQuantityScaled : 0n;",
              'shortage calculation',
          )
          service = replace_once(
              service,
              "    const remainingAfter = remainingBefore - input.value.receivedQuantityScaled - shortageClosedQuantityScaled;",
              "    const remainingAfter = remainingBefore - input.value.acceptedQuantityScaled - shortageClosedQuantityScaled;",
              'remaining calculation',
          )

          post_pattern = re.compile(
              r"  const movementLines = refreshed\.lines.*?  if \(!movementResult\.ok\) return movementResult;\n",
              re.S,
          )
          post_block = """  const movementLines = refreshed.lines
            .filter((line) => (decimalToScaled(line.acceptedQuantity, { allowZero: true }) ?? 0n) > 0n)
            .map((line) => ({
              warehouseId: line.warehouseId,
              locationId: line.locationId,
              sourceVariantId: line.variantId,
              direction: 'IN',
              sourceQuantity: line.acceptedQuantity,
              sourceLineReference: `PO-${line.purchaseOrderLineNumber}`,
              lotId: line.lotId,
              lotCode: line.lotCode,
              manufacturedDate: line.manufacturedDate,
              expiryDate: line.expiryDate,
              supplierLotReference: line.supplierLotReference,
              metadata: {
                goodsReceiptId: current.raw.id,
                goodsReceiptLineId: line.id,
                purchaseOrderLineId: line.purchaseOrderLineId,
              },
            }));

          let inventoryMovementId = null;
          if (movementLines.length > 0) {
            const movementResult = await postInventoryMovement(client, {
              requestContext,
              idempotencyKey,
              payload: {
                movementType: 'PURCHASE_RECEIPT',
                sourceDomain: 'PURCHASING',
                sourceDocumentType: 'PURCHASE_RECEIPT',
                sourceDocumentId: current.raw.id,
                sourceDocumentNumber: allocation.allocation.document_number,
                documentDate: receiptDocumentDate,
                reasonCode: 'PURCHASE_RECEIPT',
                reasonNote: current.raw.supplier_delivery_reference ?? 'Purchase receipt posted',
                metadata: {
                  goodsReceiptId: current.raw.id,
                  purchaseOrderId: current.raw.purchase_order_id,
                },
                lines: movementLines,
              },
            });
            if (!movementResult.ok) return movementResult;
            inventoryMovementId = movementResult.movement.id;
          }
"""
          service, count = post_pattern.subn(post_block, service, count=1)
          if count != 1:
              raise SystemExit('failed to replace optional inventory posting block')
          service = service.replace('inventoryMovementId: movementResult.movement.id,', 'inventoryMovementId,', 1)

          reverse_pattern = re.compile(
              r"  const reversalResult = await reverseInventoryMovement\(client, \{.*?  if \(!reversalResult\.ok\) return reversalResult;\n",
              re.S,
          )
          reverse_block = """  let inventoryReversalMovementId = null;
          if (current.raw.inventory_movement_id) {
            const reversalResult = await reverseInventoryMovement(client, {
              requestContext,
              idempotencyKey,
              movementId: current.raw.inventory_movement_id,
              payload: {
                documentDate,
                reasonCode,
                reasonNote,
              },
            });
            if (!reversalResult.ok) return reversalResult;
            inventoryReversalMovementId = reversalResult.movement.id;
          }
"""
          service, count = reverse_pattern.subn(reverse_block, service, count=1)
          if count != 1:
              raise SystemExit('failed to replace optional inventory reversal block')
          service = service.replace('inventoryReversalMovementId: reversalResult.movement.id,', 'inventoryReversalMovementId,', 1)
          write(service_path, service)

          # PO projection: rejected quantity is informational and never consumes ordered quantity.
          po_repo_path = 'npp-core/api/src/db/repositories/purchase-order.js'
          po_repo = read(po_repo_path)
          po_repo = po_repo.replace("    - COALESCE(receipt_summary.rejected_quantity, 0::numeric)\n", '')
          po_repo = po_repo.replace("             - receipt_summary.rejected_quantity_total\n", '')
          po_repo = replace_once(
              po_repo,
              "           WHEN receipt_summary.received_quantity_total <= 0 THEN 'approved'",
              "           WHEN receipt_summary.accepted_quantity_total <= 0\n             AND receipt_summary.shortage_closed_quantity_total <= 0 THEN 'approved'",
              'PO approved status projection',
          )
          write(po_repo_path, po_repo)

          # API tests: align expectations with accepted-only PO consumption and require shortage reason.
          test_path = 'npp-core/api/test/goods-receipt.test.js'
          tests = read(test_path)
          tests = tests.replace("assert.equal(partialPo.remainingQuantityTotal, '6.000000');", "assert.equal(partialPo.remainingQuantityTotal, '7.000000');")
          tests = tests.replace("assert.equal(partialPo.lines[0].remainingQuantity, '6.000000');", "assert.equal(partialPo.lines[0].remainingQuantity, '7.000000');")
          tests = tests.replace("receiptPayload(partialPo, fixture, '7', 'DELIVERY-OVER')", "receiptPayload(partialPo, fixture, '8', 'DELIVERY-OVER')")
          tests = tests.replace("receiptPayload(partialPo, fixture, '6', 'DELIVERY-2')", "receiptPayload(partialPo, fixture, '7', 'DELIVERY-2')")
          tests = tests.replace("assert.equal(fullPo.receivedQuantityTotal, '10.000000');", "assert.equal(fullPo.receivedQuantityTotal, '11.000000');")
          tests = tests.replace("assert.equal(fullPo.acceptedQuantityTotal, '9.000000');", "assert.equal(fullPo.acceptedQuantityTotal, '10.000000');")
          tests = tests.replace("assert.equal(fullPo.lines[0].receivedQuantity, '10.000000');", "assert.equal(fullPo.lines[0].receivedQuantity, '11.000000');")
          tests = tests.replace("assert.equal(fullPo.lines[0].acceptedQuantity, '9.000000');", "assert.equal(fullPo.lines[0].acceptedQuantity, '10.000000');")
          tests = tests.replace("assert.equal(restoredPo.remainingQuantityTotal, '6.000000');", "assert.equal(restoredPo.remainingQuantityTotal, '7.000000');")
          tests = tests.replace("assert.equal(restoredPo.lines[0].remainingQuantity, '6.000000');", "assert.equal(restoredPo.lines[0].remainingQuantity, '7.000000');")
          tests = replace_once(
              tests,
              "      body: JSON.stringify(receiptPayload(approved, fixture, '2', 'DELIVERY-CLOSE', {\n        finalizeLine: true,\n      })),",
              "      body: JSON.stringify(receiptPayload(approved, fixture, '2', 'DELIVERY-CLOSE', {\n        finalizeLine: true,\n        qualityReasonCode: 'SHORTAGE',\n        qualityNote: 'Nhà cung cấp xác nhận giao thiếu phần còn lại',\n      })),",
              'shortage close reason fixture',
          )
          missing_reason_case = """

              response = await fetch(`${baseUrl}/api/goods-receipts`, {
                method: 'POST',
                headers: mutationHeaders(config, `gr-missing-shortage-reason-${randomUUID()}`),
                body: JSON.stringify(receiptPayload(approved, fixture, '2', 'DELIVERY-MISSING-SHORTAGE-REASON', {
                  finalizeLine: true,
                })),
              });
              assert.equal(response.status, 400);
              assert.equal(await errorCode(response), 'INVALID_VARIANCE_REASON_CODE');
"""
          anchor = "    const firstKey = `gr-create-1-${randomUUID()}`;"
          if missing_reason_case.strip() not in tests:
              tests = tests.replace(anchor, missing_reason_case + '\n' + anchor, 1)
          write(test_path, tests)

          # Browser E2E: keep semantic locators and accepted-only remaining math.
          e2e_path = 'npp-core/web/e2e/goods-receipts.spec.ts'
          e2e = read(e2e_path)
          e2e = e2e.replace("const secondReference = `DELIVERY-2-${suffix}`;", "const secondReference = `DELIVERY-2-${suffix}`;\n    const shortageReference = `DELIVERY-SHORT-${suffix}`;")
          e2e = e2e.replace("page.getByRole('dialog');", "page.getByRole('dialog', { name: 'Phiếu nhận hàng nháp' });", 1)
          e2e = e2e.replace("await expect(page.locator('h1').first()).toBeVisible();", "await expect(page.getByRole('heading', { name: 'Phiếu nhận hàng', exact: true })).toBeVisible();")
          e2e = e2e.replace("await expect(editor).toContainText('6');", "await expect(editor).toContainText('7');")
          e2e = e2e.replace(".nth(0).fill('6');", ".nth(0).fill('7');", 1)
          e2e = e2e.replace("await expect(detail).toContainText('9');", "await expect(detail).toContainText('10');")
          e2e = e2e.replace("await expect(detail).toContainText('6');\n    await expect(detail.getByTestId('purchase-order-receipts-table')).toContainText(secondReference);", "await expect(detail).toContainText('7');\n    await expect(detail.getByTestId('purchase-order-receipts-table')).toContainText(secondReference);")
          e2e = e2e.replace("await editor.locator('input[inputmode=\"decimal\"]').first().fill('7');", "await editor.locator('input[inputmode=\"decimal\"]').first().fill('8');")
          tail_anchor = """    await page.getByTestId('goods-receipt-save-button').click();
              await expect(page.locator('[role="alert"]').filter({ hasText: /remaining/i })).toBeVisible();

              await page.setViewportSize({ width: 390, height: 844 });"""
          tail_replacement = """    await page.getByTestId('goods-receipt-save-button').click();
              await expect(page.locator('[role="alert"]').filter({ hasText: /remaining/i })).toBeVisible();

              await editor.locator('input[inputmode="decimal"]').nth(0).fill('2');
              await editor.getByRole('checkbox').check();
              await editor.locator('input').nth(1).fill(shortageReference);
              const shortageLine = editor.getByRole('row').filter({ hasText: fixture.variant.sku }).first();
              await shortageLine.getByRole('textbox').nth(2).fill('SHORTAGE');
              await shortageLine.getByRole('textbox').nth(3).fill('Nhà cung cấp xác nhận giao thiếu');
              await page.getByTestId('goods-receipt-save-button').click();
              await expect(editor).toHaveCount(0);
              await page.getByTestId('goods-receipt-search').fill(shortageReference);
              receiptRow = page.getByTestId('goods-receipts-table').locator('tbody tr');
              await expect(receiptRow).toHaveCount(1);
              await receiptRow.getByRole('button', { name: 'Ghi sổ', exact: true }).click();
              await page.getByTestId('goods-receipt-post-confirm').click();

              await page.goto('/purchasing/purchase-orders');
              await page.getByTestId('purchase-order-search').fill(fixture.purchaseOrder.number);
              purchaseOrderRow = page.getByTestId('purchase-orders-table').locator('tbody tr');
              await expect(purchaseOrderRow).toContainText('Đã đóng');

              await page.goto('/purchasing/goods-receipts');
              await page.setViewportSize({ width: 390, height: 844 });"""
          e2e = replace_once(e2e, tail_anchor, tail_replacement, 'browser shortage flow')
          write(e2e_path, e2e)

          # Decision record must state the same accepted-only projection used by code.
          decision_path = 'docs/operations/phase-5-3-goods-receipt-variance-decisions.md'
          decision = read(decision_path)
          decision = decision.replace('shortageClosedQuantity = remainingBefore - receivedQuantity', 'shortageClosedQuantity = remainingBefore - acceptedQuantity')
          decision = decision.replace('- Không được vượt remaining của PO line.', '- Accepted quantity không được vượt remaining của PO line; rejected quantity không làm giảm remaining.')
          decision = decision.replace('- `qualityReasonCode`;\n- `qualityNote`.', '- `qualityReasonCode`;\n- `qualityNote`.\n\nCặp reason/note này là snapshot lý do variance của dòng và cũng bắt buộc khi `finalizeLine` chốt thiếu.')
          decision = decision.replace('- `remaining`.', '- `remaining = ordered - accepted - shortageClosed`; rejected chỉ là số liệu variance và không hoàn thành PO.')
          write(decision_path, decision)

          # Record the current source checkpoint without claiming production rollout.
          handoff_path = 'docs/operations/LATEST_HANDOFF.md'
          handoff = read(handoff_path)
          checkpoint = """## Source checkpoint — Phase 5.3 Goods Receipt Variance

- Phase 5.2 is merged on `main` at `bea7b846537781a5809106c3d7db08dc60dfc546`.
- Phase 5.3 is implemented on Draft PR #88 and remains unmerged until final review/CI.
- Accepted quantity alone consumes PO remaining and posts inventory.
- Rejected quantity is recorded as variance and never reduces PO remaining or inventory.
- Explicit shortage closure computes `remainingBefore - acceptedQuantity` and requires a normalized reason plus note.
- No production migration or deployment is included in the source task.

"""
          if '## Source checkpoint — Phase 5.3 Goods Receipt Variance' not in handoff:
              handoff = handoff.replace('# NPP Platform — Latest Handoff\n\n', '# NPP Platform — Latest Handoff\n\n' + checkpoint, 1)
          write(handoff_path, handoff)
          PY
          git diff --check
          git status --short
      - name: Commit reviewed fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database docs npp-core
          git commit -m "fix(purchasing): correct phase 5.3 variance invariants"
          git push origin HEAD:agent/phase-5-3-goods-receipt-variance
