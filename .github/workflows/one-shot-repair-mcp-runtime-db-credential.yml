name: One-shot repair MCP runtime database credential

on:
  push:
    branches:
      - agent/ops-repair-mcp-runtime-db-credential

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-repair-mcp-runtime-db-credential
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_APP: hung-phat
      MCP_APP: hung-phat-mcp
      BASE_MAIN_SHA: 188165fe9c8de84291015a1fa4564c15180399ee
      TEMP_ATTACHMENT: MCP_RUNTIME_DB
    steps:
      - name: Checkout operation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku version

      - name: Repair managed MCP runtime credential attachment
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          stage="preflight"
          cutover_started="false"
          old_was_attachment="false"
          addon_name=""
          runtime_role=""
          old_database_url=""

          write_status() {
            printf '%s\n' "$1" > /tmp/mcp-runtime-credential-repair-status
          }

          detach_if_present() {
            local attachment="$1"
            if heroku config:get "${attachment}_URL" -a "$MCP_APP" >/tmp/attachment-value 2>/dev/null; then
              if test -s /tmp/attachment-value; then
                heroku addons:detach "$attachment" -a "$MCP_APP" --confirm "$MCP_APP" >/dev/null 2>&1 || true
              fi
            fi
            rm -f /tmp/attachment-value
          }

          rollback_cutover() {
            set +e
            detach_if_present DATABASE
            if [ "$old_was_attachment" = "true" ] && [ -n "$addon_name" ]; then
              heroku addons:attach "$addon_name" --as DATABASE -a "$MCP_APP" >/dev/null 2>&1
            elif [ -n "$old_database_url" ]; then
              heroku config:set "DATABASE_URL=$old_database_url" -a "$MCP_APP" >/dev/null 2>&1
            fi
            detach_if_present "$TEMP_ATTACHMENT"
            set -e
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ "$cutover_started" = "true" ]; then
                rollback_cutover
              else
                detach_if_present "$TEMP_ATTACHMENT"
              fi
              write_status "failure:$stage"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          test -n "${HEROKU_API_KEY:-}"
          echo "::add-mask::$HEROKU_API_KEY"

          stage="provider-audit"
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const token = process.env.HEROKU_API_KEY;
          const coreApp = process.env.CORE_APP;
          const mcpApp = process.env.MCP_APP;

          async function heroku(path) {
            const response = await fetch(`https://api.heroku.com${path}`, {
              headers: {
                Accept: 'application/vnd.heroku+json; version=3',
                Authorization: `Bearer ${token}`,
              },
            });
            if (!response.ok) throw new Error(`heroku_api_${response.status}`);
            return response.json();
          }

          const [coreConfig, mcpConfig, coreAddons, mcpAttachments] = await Promise.all([
            heroku(`/apps/${coreApp}/config-vars`),
            heroku(`/apps/${mcpApp}/config-vars`),
            heroku(`/apps/${coreApp}/addons`),
            heroku(`/apps/${mcpApp}/addon-attachments`),
          ]);

          const ownerUrl = coreConfig.DATABASE_URL;
          const oldRuntimeUrl = mcpConfig.DATABASE_URL;
          const runtimeRole = mcpConfig.MCP_DB_ROLE;
          if (!ownerUrl || !oldRuntimeUrl || !runtimeRole) throw new Error('missing_required_provider_config');
          if (!/^[A-Za-z0-9_-]{1,50}$/.test(runtimeRole)) throw new Error('invalid_runtime_role_name');

          const postgresAddons = coreAddons.filter((addon) =>
            addon?.addon_service?.name === 'heroku-postgresql' ||
            String(addon?.plan?.name || '').startsWith('heroku-postgresql')
          );
          if (postgresAddons.length !== 1) throw new Error('expected_one_shared_postgres_addon');
          const addon = postgresAddons[0];

          const databaseAttachment = mcpAttachments.find((attachment) => attachment?.name === 'DATABASE');
          if (databaseAttachment && databaseAttachment?.addon?.id !== addon.id) {
            throw new Error('mcp_database_attachment_targets_wrong_addon');
          }

          const owner = new URL(ownerUrl);
          const runtime = new URL(oldRuntimeUrl);
          const port = (url) => url.port || '5432';
          if (owner.hostname !== runtime.hostname || port(owner) !== port(runtime) || owner.pathname !== runtime.pathname) {
            throw new Error('core_and_mcp_target_different_databases');
          }

          await writeFile('/tmp/mcp-runtime-role', runtimeRole, { mode: 0o600 });
          await writeFile('/tmp/postgres-addon-name', addon.name, { mode: 0o600 });
          await writeFile('/tmp/old-mcp-database-url', oldRuntimeUrl, { mode: 0o600 });
          await writeFile('/tmp/old-was-attachment', databaseAttachment ? 'true' : 'false', { mode: 0o600 });
NODE

          runtime_role="$(cat /tmp/mcp-runtime-role)"
          addon_name="$(cat /tmp/postgres-addon-name)"
          old_database_url="$(cat /tmp/old-mcp-database-url)"
          old_was_attachment="$(cat /tmp/old-was-attachment)"
          echo "::add-mask::$old_database_url"

          stage="credential-provision"
          credentials="$(heroku pg:credentials DATABASE_URL -a "$CORE_APP" 2>/tmp/heroku-credentials-stderr)"
          if ! printf '%s\n' "$credentials" | grep -Eq "^[[:space:]]*${runtime_role}[[:space:]]"; then
            heroku pg:credentials:create DATABASE_URL --name "$runtime_role" -a "$CORE_APP"
          fi
          rm -f /tmp/heroku-credentials-stderr

          stage="temporary-credential-attachment"
          detach_if_present "$TEMP_ATTACHMENT"
          heroku addons:attach "$addon_name" --credential "$runtime_role" --as "$TEMP_ATTACHMENT" -a "$MCP_APP"
          temp_url="$(heroku config:get "${TEMP_ATTACHMENT}_URL" -a "$MCP_APP" 2>/dev/null)"
          test -n "$temp_url"
          echo "::add-mask::$temp_url"

          TEMP_URL="$temp_url" OLD_URL="$old_database_url" ROLE="$runtime_role" node --input-type=module <<'NODE'
          const oldUrl = new URL(process.env.OLD_URL);
          const tempUrl = new URL(process.env.TEMP_URL);
          const port = (url) => url.port || '5432';
          if (decodeURIComponent(tempUrl.username) !== process.env.ROLE) throw new Error('temporary_attachment_wrong_role');
          if (oldUrl.hostname !== tempUrl.hostname || port(oldUrl) !== port(tempUrl) || oldUrl.pathname !== tempUrl.pathname) {
            throw new Error('temporary_attachment_wrong_database');
          }
          if (decodeURIComponent(oldUrl.username) === decodeURIComponent(tempUrl.username)) {
            throw new Error('credential_still_not_separated');
          }
NODE

          stage="database-attachment-cutover"
          cutover_started="true"
          if [ "$old_was_attachment" = "true" ]; then
            heroku addons:detach DATABASE -a "$MCP_APP" --confirm "$MCP_APP"
          else
            heroku config:unset DATABASE_URL -a "$MCP_APP"
          fi
          heroku addons:attach "$addon_name" --credential "$runtime_role" --as DATABASE -a "$MCP_APP"

          stage="final-verification"
          final_url="$(heroku config:get DATABASE_URL -a "$MCP_APP" 2>/dev/null)"
          owner_url="$(heroku config:get DATABASE_URL -a "$CORE_APP" 2>/dev/null)"
          test -n "$final_url"
          test -n "$owner_url"
          echo "::add-mask::$final_url"
          echo "::add-mask::$owner_url"

          FINAL_URL="$final_url" OWNER_URL="$owner_url" ROLE="$runtime_role" node --input-type=module <<'NODE'
          const runtime = new URL(process.env.FINAL_URL);
          const owner = new URL(process.env.OWNER_URL);
          const port = (url) => url.port || '5432';
          if (decodeURIComponent(runtime.username) !== process.env.ROLE) throw new Error('final_runtime_role_mismatch');
          if (decodeURIComponent(runtime.username) === decodeURIComponent(owner.username)) throw new Error('final_credentials_not_separated');
          if (runtime.hostname !== owner.hostname || port(runtime) !== port(owner) || runtime.pathname !== owner.pathname) {
            throw new Error('final_database_target_mismatch');
          }
NODE

          detach_if_present "$TEMP_ATTACHMENT"
          cutover_started="false"
          write_status "success:${runtime_role}"
          trap - EXIT

      - name: Publish sanitized operation result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="failure:workflow-interrupted"
          if test -f /tmp/mcp-runtime-credential-repair-status; then
            status="$(cat /tmp/mcp-runtime-credential-repair-status)"
          fi

          if [[ "$status" == success:* ]]; then
            role="${status#success:}"
            body=$(cat <<EOF
          ## MCP runtime database credential repaired

          - Main audited: \`$BASE_MAIN_SHA\`
          - MCP app: \`$MCP_APP\`
          - Managed runtime credential: \`$role\`
          - Shared database target preserved: yes
          - Runtime and migrator usernames separated: yes
          - \`DATABASE_URL\` is now a managed Heroku Postgres credential attachment
          - Source, workflow on main, frontend and migrations changed: no

          Ready for one exact \`/deploy-heroku-mcp-production\` command.
          EOF
          )
          else
            stage="${status#failure:}"
            body=$(cat <<EOF
          ## MCP runtime database credential repair failed

          - Main audited: \`$BASE_MAIN_SHA\`
          - Failed stage: \`$stage\`
          - Automatic rollback attempted where cutover had started
          - No deploy command was sent
          EOF
          )
          fi

          jq -n --arg body "$body" '{body:$body}' > /tmp/issue-comment.json
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/issue-comment.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/5/comments" >/dev/null

      - name: Delete one-shot branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl --silent --show-error \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/agent/ops-repair-mcp-runtime-db-credential" >/dev/null
