name: Materialize Phase 7.3 final source

on:
  push:
    branches:
      - agent/phase-7-3-stocktake
    paths:
      - ".github/workflows/phase73-final-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase-7-3-stocktake
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync exact main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize source
        run: |
          set -euo pipefail
          # Run only from a head that contains all verified payload chunks.
          test -f .phase73-final/part-00
          test -f .phase73-final/part-04
          cat .phase73-final/part-* > /tmp/phase73-final.b64
          echo "9da3b944c4a018f530fd26ee4afd870eea9e68e0e9bc0170e8a9d9f764093c03  /tmp/phase73-final.b64" | sha256sum --check
          base64 --decode /tmp/phase73-final.b64 > /tmp/phase73-final.tar.gz
          echo "094003a48b3838bcd693bf8967bcf956959a6f970bfc9a857b6dac0e6607c154  /tmp/phase73-final.tar.gz" | sha256sum --check
          tar -xzf /tmp/phase73-final.tar.gz -C .
          python3 .phase73-finalize.py
          rm -rf .phase73-final
          rm -f .phase73-finalize.py .github/workflows/phase73-final-materialize.yml

      - name: Verify syntax and boundaries
        run: |
          set -euo pipefail
          node --check npp-core/api/src/services/inventory-stocktake.js
          node --check npp-core/api/test/inventory-stocktake.postgres.test.js
          node --check npp-core/web/test/stocktake-ui-contract.test.js
          if git diff --name-only HEAD | grep -E '^(mcp|admin|delivery)/'; then
            echo "Unexpected non-Phase-7.3 runtime path" >&2
            exit 1
          fi

      - name: Commit final source
        run: |
          set -euo pipefail
          git add -A
          git commit -m "feat(phase-7.3): complete stocktake API UI and integration tests"
          git push origin HEAD:agent/phase-7-3-stocktake
