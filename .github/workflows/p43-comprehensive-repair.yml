name: P4.3 Comprehensive Repair Gate

on:
  push:
    branches:
      - agent/phase-4-inventory-reservations-negative-stock-v2

permissions:
  contents: write

concurrency:
  group: p43-comprehensive-repair
  cancel-in-progress: false

jobs:
  repair-verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: npp_p43_repair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d npp_p43_repair"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_p43_repair
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/npp_p43_repair
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-inventory-reservations-negative-stock-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply comprehensive repair
        run: python .github/p43-comprehensive-repair.py

      - name: Verify repair scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(mcp/|database/migrations/shared/01[0-6]|docs/operations/phase-3|\.github/workflows/.*vercel|\.github/workflows/.*heroku)'; then
            echo 'ERROR: repair escaped P4.3 scope'
            exit 1
          fi

      - name: Install workspaces
        run: npm ci

      - name: Build Core API
        run: npm --workspace npp-core-api run build

      - name: Apply migrations on clean PostgreSQL 17
        run: npm --workspace npp-core-api run migration:migrate

      - name: Verify migration registry and schema
        run: npm --workspace npp-core-api run migration:verify

      - name: Verify migration rerun is a no-op
        shell: bash
        run: |
          output="$(npm --workspace npp-core-api run migration:migrate)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -E 'applied[^[]*\[\]' >/dev/null

      - name: Run focused P4.3 tests
        run: node --test npp-core/api/test/inventory-reservations.test.js

      - name: Run full inventory regression
        run: node --test npp-core/api/test/inventory-ledger.test.js npp-core/api/test/inventory-balance.test.js npp-core/api/test/inventory-reservations.test.js

      - name: Run full Core API verification
        run: npm --workspace npp-core-api run verify

      - name: Commit verified repair and remove temporary repair files
        shell: bash
        run: |
          git rm .github/p43-comprehensive-repair.py .github/workflows/p43-comprehensive-repair.yml
          git add \
            .github/workflows/phase-4-inventory-reservations.yml \
            database/migrations/inventory/019_inventory_reservations_negative_stock.sql \
            npp-core/api/package.json \
            npp-core/api/src/db/repositories/inventory-ledger.js \
            npp-core/api/src/db/repositories/inventory-reservations.js \
            npp-core/api/src/services/inventory-ledger.js \
            npp-core/api/src/services/inventory-reservations.js \
            npp-core/api/test/inventory-reservations.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(inventory): harden P4.3 reservations and negative stock"
          git push origin HEAD:agent/phase-4-inventory-reservations-negative-stock-v2
