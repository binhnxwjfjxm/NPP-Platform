name: P4.3 Comprehensive Repair Gate

on:
  push:
    branches:
      - agent/phase-4-inventory-reservations-negative-stock-v2

permissions:
  contents: write

concurrency:
  group: p43-comprehensive-repair
  cancel-in-progress: false

jobs:
  apply-and-commit-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-inventory-reservations-negative-stock-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Apply comprehensive repair
        run: python .github/p43-comprehensive-repair.py

      - name: Verify repair scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(mcp/|database/migrations/shared/01[0-6]|docs/operations/phase-3|\.github/workflows/.*vercel|\.github/workflows/.*heroku)'; then
            echo 'ERROR: repair escaped P4.3 scope'
            exit 1
          fi

      - name: Commit repair and remove temporary files
        shell: bash
        run: |
          git rm .github/p43-comprehensive-repair.py .github/workflows/p43-comprehensive-repair.yml
          git add \
            .github/workflows/phase-4-inventory-reservations.yml \
            database/migrations/inventory/019_inventory_reservations_negative_stock.sql \
            npp-core/api/package.json \
            npp-core/api/src/db/repositories/inventory-ledger.js \
            npp-core/api/src/db/repositories/inventory-reservations.js \
            npp-core/api/src/services/inventory-ledger.js \
            npp-core/api/src/services/inventory-reservations.js \
            npp-core/api/test/inventory-reservations.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(inventory): harden P4.3 reservations and negative stock"
          git push origin HEAD:agent/phase-4-inventory-reservations-negative-stock-v2
