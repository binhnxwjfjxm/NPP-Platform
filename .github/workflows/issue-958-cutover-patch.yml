name: Issue 958 cutover source patch

on:
  push:
    branches:
      - agent/cutover-vps-runtime-958
    paths:
      - .github/workflows/issue-958-cutover-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cutover-vps-runtime-958
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare complete source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('.github/workflows/resume-delivery-production-only.yml'),
              Path('.github/workflows/admin-ai-production-config-manual.yml'),
              Path('.github/workflows/ordering-ai-production-config-manual.yml'),
              Path('.github/workflows/resume-production-rollout-admin-delivery.yml'),
              Path('.github/workflows/website-ai-production-config-manual.yml'),
          ]
          old = 'https://hung-phat-945da1547594.herokuapp.com'
          new = '$' + '{{ vars.COMPANY_API_URL }}'

          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new))
              elif count == 0 and new in text:
                  pass
              else:
                  raise SystemExit(f'{path}: unexpected legacy/canonical state')

          for path in files:
              text = path.read_text()
              if old in text or new not in text:
                  raise SystemExit(f'{path}: cutover source contract failed')

          Path('.github/workflows/issue-958-cutover-patch.yml').unlink()
          PY
          git diff --check

      - name: Upload detached commit object
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const baseCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const baseTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          const paths = [
            '.github/workflows/resume-delivery-production-only.yml',
            '.github/workflows/admin-ai-production-config-manual.yml',
            '.github/workflows/ordering-ai-production-config-manual.yml',
            '.github/workflows/resume-production-rollout-admin-delivery.yml',
            '.github/workflows/website-ai-production-config-manual.yml',
            '.github/workflows/issue-958-cutover-patch.yml',
          ];

          async function api(path, body) {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                'content-type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`github_api_failed:${path}:${response.status}:${payload?.message || 'unknown'}`);
            return payload;
          }

          const tree = [];
          for (const path of paths) {
            if (!existsSync(path)) {
              tree.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const content = readFileSync(path).toString('base64');
            const blob = await api('/git/blobs', { content, encoding: 'base64' });
            tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
          }

          const newTree = await api('/git/trees', { base_tree: baseTree, tree });
          const commit = await api('/git/commits', {
            message: 'fix(ops): bỏ URL Heroku khỏi dây production Issue 958',
            tree: newTree.sha,
            parents: [baseCommit],
          });
          console.log(`PREPARED_COMMIT_SHA=${commit.sha}`);
          NODE
