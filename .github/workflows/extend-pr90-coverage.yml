name: Temporary PR 90 Coverage Extension

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/extend-pr90-coverage.py
      - .github/workflows/extend-pr90-coverage.yml

permissions:
  contents: write

jobs:
  extend:
    if: github.event.pull_request.number == 90 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-4-supplier-return
          fetch-depth: 0
      - run: python3 scripts/extend-pr90-coverage.py
      - shell: bash
        run: |
          set -euo pipefail
          rm scripts/extend-pr90-coverage.py .github/workflows/extend-pr90-coverage.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(purchasing): cover supplier return failure invariants"
          git push origin HEAD:agent/phase-5-4-supplier-return
