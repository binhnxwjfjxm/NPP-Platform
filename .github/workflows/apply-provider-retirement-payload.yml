name: Apply Provider Retirement Payload

on:
  push:
    branches:
      - agent/remove-supabase-runtime
    paths:
      - .github/provider-retirement/chunks/**
      - .github/workflows/apply-provider-retirement-payload.yml

permissions:
  contents: write

concurrency:
  group: apply-provider-retirement-payload
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-supabase-runtime
          fetch-depth: 0

      - name: Decode and validate payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/provider-retirement/chunks
          mapfile -t chunks < <(find .github/provider-retirement/chunks -maxdepth 1 -type f -name 'pair-*' | sort)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" > /tmp/provider-retirement.b64
          base64 --decode /tmp/provider-retirement.b64 > /tmp/provider-retirement.tar.gz
          mkdir -p /tmp/provider-retirement
          tar -tzf /tmp/provider-retirement.tar.gz > /tmp/provider-retirement-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/provider-retirement-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            cat /tmp/provider-retirement-files.txt >&2
            exit 1
          fi
          tar -xzf /tmp/provider-retirement.tar.gz -C /tmp/provider-retirement
          echo 'Payload entries:'
          sed -n '1,240p' /tmp/provider-retirement-files.txt

      - name: Apply payload to repository
        shell: bash
        run: |
          set -euo pipefail
          if test -x /tmp/provider-retirement/apply.sh; then
            /tmp/provider-retirement/apply.sh "$GITHUB_WORKSPACE"
          elif test -f /tmp/provider-retirement/apply.sh; then
            bash /tmp/provider-retirement/apply.sh "$GITHUB_WORKSPACE"
          elif test -d /tmp/provider-retirement/repo; then
            cp -a /tmp/provider-retirement/repo/. "$GITHUB_WORKSPACE/"
          else
            cp -a /tmp/provider-retirement/. "$GITHUB_WORKSPACE/"
          fi

          rm -rf .github/provider-retirement/chunks
          rm -f .github/workflows/apply-provider-retirement-payload.yml

      - name: Refresh lockfiles when package manifests changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -Eq '^mcp/(package.json|apps/backend/package.json)$'; then
            npm --prefix mcp install --package-lock-only --ignore-scripts
            npm --prefix mcp/apps/backend install --package-lock-only --ignore-scripts
          fi

      - name: Sanity check resulting tree
        shell: bash
        run: |
          set -euo pipefail
          test -f mcp/package.json
          test -f mcp/apps/backend/package.json
          node --check mcp/scripts/audit-no-supabase-runtime.mjs
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Payload produced no source changes.' >&2
            exit 1
          fi

      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(mcp): replace Supabase runtime with Heroku Postgres'
          git push origin HEAD:agent/remove-supabase-runtime
