name: Manual Heroku Core latest migrations

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: heroku-core-latest-migrations-manual
  cancel-in-progress: false

jobs:
  audit-or-migrate:
    if: >-
      github.event.issue.number == 5 &&
      (
        github.event.comment.body == '/audit-heroku-core-latest-migrations' ||
        github.event.comment.body == '/migrate-heroku-core-latest-production'
      ) &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-core-latest-rollout
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPLOY_REF: main
      HEROKU_APP_NAME: hung-phat

    steps:
      - name: Validate exact issue command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMMENT_BODY" in
            /audit-heroku-core-latest-migrations|/migrate-heroku-core-latest-production) ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install locked dependencies
        working-directory: npp-core
        run: npm --prefix .. ci --ignore-scripts

      - name: Validate Core migration gate
        working-directory: npp-core
        shell: bash
        run: |
          set -euo pipefail
          bash -n api/scripts/core-latest-production-gate.sh
          node --test \
            api/test/core-latest-production-gate-source.test.js \
            api/test/heroku-core-latest-migrations-workflow-source.test.js

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Audit or migrate Core latest schema
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CORE_GATE_EVIDENCE_FILE: ${{ runner.temp }}/core-latest-migration-evidence.txt
        run: |
          set -euo pipefail
          rm -f "$CORE_GATE_EVIDENCE_FILE"
          case "$COMMENT_BODY" in
            /audit-heroku-core-latest-migrations) action="audit" ;;
            /migrate-heroku-core-latest-production) action="migrate" ;;
            *) exit 1 ;;
          esac
          GITHUB_STEP_SUMMARY="$CORE_GATE_EVIDENCE_FILE" \
            REQUESTED_ACTION="$action" \
            bash npp-core/api/scripts/core-latest-production-gate.sh
          test -s "$CORE_GATE_EVIDENCE_FILE"

      - name: Publish sanitized rollout evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CORE_GATE_EVIDENCE_FILE: ${{ runner.temp }}/core-latest-migration-evidence.txt
        run: |
          set -euo pipefail
          if [ "$OPERATION_STATUS" = success ]; then
            test -s "$CORE_GATE_EVIDENCE_FILE"
          fi
          evidence_file="$(mktemp)"
          {
            echo "## Core latest migration gate — ${OPERATION_STATUS}"
            echo
            if [ -s "$CORE_GATE_EVIDENCE_FILE" ]; then
              cat "$CORE_GATE_EVIDENCE_FILE"
            else
              echo "CORE_GATE_EVIDENCE=unavailable"
            fi
            echo "SOURCE_SHA=${SOURCE_SHA:-unavailable}"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          } > "$evidence_file"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/262/comments" \
            -f body="$(cat "$evidence_file")" >/dev/null
          rm -f "$evidence_file"
