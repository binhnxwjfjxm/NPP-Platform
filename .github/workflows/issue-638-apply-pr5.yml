name: issue-638-resend-apply-pr5

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-638-resend-email-provider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply staged Resend migration and normalize existing backup tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/issue-638-apply-resend.yml')
          workflow = source.read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch = workflow[start:end]
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in patch.splitlines()) + '\n'
          patch = patch.replace(
              r'''r"async function sendLoginChallengeEmail\(fetchImpl, runtime, \{ recipientEmail, code, sourceApp \} \) \{.*?\n\}\n\nexport function internalWebChallengeRequired"''',
              r'''r"async function sendLoginChallengeEmail.*?\n\}\n\nexport function internalWebChallengeRequired"''',
          )
          patch = patch.replace(
              r'''r"export async function sendTechnicalBackupAccessEmail\(fetchImpl, runtime, \{ code \} \) \{.*?\n\}\n"''',
              r'''r"export async function sendTechnicalBackupAccessEmail.*?\n\}\n"''',
          )
          patch = patch.replace(
              r'''r"export async function sendOwnerDeletionChallengeEmail\(fetchImpl, runtime, \{ code, sourceApp \} \) \{.*?\n\}\n"''',
              r'''r"export async function sendOwnerDeletionChallengeEmail.*?\n\}\n"''',
          )
          patch = re.sub(
              r"\n          backup_test = ROOT / 'npp-core/api/test/backup-foundation\.test\.js'.*?(?=\n          # Verify that no provider-specific Cloudflare email sending code remains)",
              '\n',
              patch,
              count=1,
              flags=re.S,
          )
          exec(compile(patch, str(source), 'exec'), {})

          test_path = Path('npp-core/api/test/backup-foundation.test.js')
          text = test_path.read_text(encoding='utf-8')
          text = re.sub(
              r"CLOUDFLARE_ACCOUNT_ID: '[^']+',\n\s+CLOUDFLARE_EMAIL_API_TOKEN: '[^']+',",
              "RESEND_API_KEY: 're_test_only',",
              text,
          )
          text = text.replace(
              "json: async () => ({ success: true, result: { delivered: runtime.recipients, queued: [], permanent_bounces: [] } }),",
              "json: async () => ({ id: 'email-123' }),",
          )
          text = text.replace(
              "json: async () => ({ success: true, result: { delivered: ['owner1@example.com', 'owner2@example.com'], queued: [], permanent_bounces: [] } }),",
              "json: async () => ({ id: 'email-123' }),",
          )
          text = text.replace(
              "assert.deepEqual(requestBody.from, { address: 'security@example.com', name: 'Hưng Phát Security' });",
              "assert.equal(requestBody.from, 'security@example.com');",
          )
          text = text.replace("secret-provider-token", "re_test_only")
          text = text.replace("sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code: '123456', sourceApp: 'npp-operations' })", "sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code: '123456', sourceApp: 'npp-operations', intentId: '33333333-3333-4333-8333-333333333333' })")
          text = text.replace("sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code: '123456', sourceApp: 'npp-operations-web' })", "sendOwnerDeletionChallengeEmail(fetchImpl, runtime, { code: '123456', sourceApp: 'npp-operations-web', intentId: '44444444-4444-4444-8444-444444444444' })")
          old_failure_fetch = """  const fetchImpl = async () => ({\n    ok: true,\n    json: async () => ({ id: 'email-123' }),\n  });\n  await assert.rejects("""
          if old_failure_fetch in text:
              text = text.replace(old_failure_fetch, """  const fetchImpl = async () => ({\n    ok: false,\n    json: async () => ({ error: { message: 'rejected' } }),\n  });\n  await assert.rejects(""", 1)
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        working-directory: npp-core/api
        run: npm run verify

      - name: Verify scope
        shell: bash
        run: |
          test "$(git diff --name-only -- database/migrations | wc -l)" -eq 0
          git diff --check

      - name: Commit final changes and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-638-apply-resend.yml .github/workflows/issue-638-apply-pr.yml .github/workflows/issue-638-apply-pr2.yml .github/workflows/issue-638-apply-pr3.yml .github/workflows/issue-638-apply-pr4.yml .github/workflows/issue-638-apply-pr5.yml
          git add npp-core/api/src/email/resend.js \
            npp-core/api/src/internal-workforce-auth.js \
            npp-core/api/src/backup/technical-access.js \
            npp-core/api/src/backup/owner-delete-challenge.js \
            npp-core/api/src/services/technical-backup-access.js \
            npp-core/api/src/services/backup.js \
            npp-core/api/package.json \
            npp-core/api/test/resend-email.test.js \
            npp-core/api/test/backup-foundation.test.js
          git commit -m 'fix(issue-638): switch transactional email provider to Resend'
          git push origin agent/issue-638-resend-email-provider
