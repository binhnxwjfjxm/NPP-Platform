name: Manual Vercel production deploy

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact production SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          git fetch origin main
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying exact main SHA: $sha"

      - name: Require automatic Git deployments to remain locked
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const config = JSON.parse(
            await readFile("npp-core/web/vercel.json", "utf8")
          );
          if (config.git?.deploymentEnabled !== false) {
            throw new Error("vercel_automatic_git_deployments_must_remain_locked");
          }
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Pull production project configuration
        working-directory: npp-core/web
        run: >-
          npx --yes vercel@latest pull
          --yes
          --environment=production
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify Vercel project link
        working-directory: npp-core/web
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`unexpected_vercel_project:${linked.projectId}`);
          }
          NODE

      - name: Build production artifact
        working-directory: npp-core/web
        run: >-
          npx --yes vercel@latest build
          --prod
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production artifact
        id: deploy
        working-directory: npp-core/web
        shell: bash
        run: |
          set -euo pipefail
          url="$(
            npx --yes vercel@latest deploy \
              --prebuilt \
              --prod \
              --token="${{ secrets.VERCEL_TOKEN }}"
          )"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $url"

      - name: Smoke test deployment URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /dashboard /login; do
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 5 \
              "$DEPLOYMENT_URL$path" >/dev/null
          done

          html="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/")"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$DEPLOYMENT_URL$asset" >/dev/null

      - name: Record successful exact SHA
        shell: bash
        run: |
          echo "DEPLOYED_SHA=${{ steps.target.outputs.sha }}"
          echo "DEPLOYED_URL=${{ steps.deploy.outputs.url }}"
