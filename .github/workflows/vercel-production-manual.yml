name: Manual Vercel production deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: main
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        startsWith(github.event.comment.body, '/deploy-vercel-production') &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || 'main' }}
    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Record deploy SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "${DEPLOY_REF}" = "main" ]; then
            git fetch origin main
            test "$sha" = "$(git rev-parse origin/main)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying ref ${DEPLOY_REF} at SHA: $sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Pull production project configuration
        run: >-
          npx --yes vercel@latest pull
          --yes
          --environment=production
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`unexpected_vercel_project:${linked.projectId}`);
          }
          NODE

      - name: Build production artifact
        run: >-
          npx --yes vercel@latest build
          --prod
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(
            npx --yes vercel@latest deploy \
              --prebuilt \
              --prod \
              --archive=tgz \
              --token="${{ secrets.VERCEL_TOKEN }}"
          )"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $url"

      - name: Smoke test deployment URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CORE_WEB_ADMIN_USERNAME: ${{ secrets.CORE_WEB_ADMIN_USERNAME }}
          CORE_WEB_ADMIN_PASSWORD: ${{ secrets.CORE_WEB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          assert_status() {
            local path="$1"
            local expected="$2"
            local auth="${3:-}"
            local -a auth_args=()
            if [ -n "$auth" ]; then
              auth_args=(-u "$auth")
            fi
            local response
            response="$(
              curl --silent --show-error \
                --retry 5 --retry-delay 5 \
                "${auth_args[@]}" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$DEPLOYMENT_URL$path"
            )"
            if [ "$response" != "$expected" ]; then
              echo "Unexpected status for $path: expected $expected, got $response" >&2
              exit 1
            fi
          }

          assert_status / 307
          assert_status /login 200
          assert_status /dashboard 401
          assert_status /api/access/permissions 401
          assert_status /api/access/roles 401

          if [ -n "${CORE_WEB_ADMIN_USERNAME:-}" ] && [ -n "${CORE_WEB_ADMIN_PASSWORD:-}" ]; then
            auth="${CORE_WEB_ADMIN_USERNAME}:${CORE_WEB_ADMIN_PASSWORD}"
            assert_status /dashboard 200 "$auth"
            assert_status /organization 200 "$auth"
            assert_status /organization/branches 200 "$auth"
            assert_status /organization/warehouses 200 "$auth"
            assert_status /organization/locations 200 "$auth"
            assert_status /api/access/permissions 200 "$auth"
            assert_status /api/access/roles 200 "$auth"
          fi

          html="$(
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 5 \
              "$DEPLOYMENT_URL/login"
          )"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$DEPLOYMENT_URL$asset" >/dev/null

      - name: Record successful exact SHA
        shell: bash
        run: |
          echo "DEPLOYED_SHA=${{ steps.target.outputs.sha }}"
          echo "DEPLOYED_URL=${{ steps.deploy.outputs.url }}"
