name: Manual Vercel NPP production deploy

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 5 && github.event.comment.body == '/deploy-vercel-production' && contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y","gustavjung01"]'), github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      DEPLOY_REF: main
      PRODUCTION_URL: https://npp-platform.vercel.app
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with: { ref: '${{ env.DEPLOY_REF }}', fetch-depth: 0 }
      - name: Validate Issue #5 trigger comment
        if: github.event_name == 'issue_comment'
        shell: bash
        env: { COMMENT_BODY: '${{ github.event.comment.body }}' }
        run: |
          set -euo pipefail
          trimmed_comment="${COMMENT_BODY:-}"
          trimmed_comment="${trimmed_comment#"${trimmed_comment%%[![:space:]]*}"}"
          trimmed_comment="${trimmed_comment%"${trimmed_comment##*[![:space:]]}"}"
          test "$trimmed_comment" = '/deploy-vercel-production'
      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install workspace dependencies
        run: npm ci
      - name: Configure and verify Vercel Node 24 runtime
        shell: bash
        env:
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = `https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`;
          const authorization = `Bearer ${process.env.VERCEL_TOKEN}`;
          const desired = {
            framework: 'nextjs',
            rootDirectory: 'npp-core/web',
            nodeVersion: '24.x',
          };

          const update = await fetch(endpoint, {
            method: 'PATCH',
            headers: { Authorization: authorization, 'Content-Type': 'application/json' },
            body: JSON.stringify(desired),
          });
          const updateBody = await update.json().catch(() => null);
          if (!update.ok) {
            throw new Error(`company_vercel_runtime_update_failed:${update.status}:${updateBody?.error?.code || 'unknown'}`);
          }

          const readback = await fetch(endpoint, { headers: { Authorization: authorization } });
          const project = await readback.json().catch(() => null);
          if (!readback.ok) {
            throw new Error(`company_vercel_runtime_readback_failed:${readback.status}:${project?.error?.code || 'unknown'}`);
          }
          if (project?.id !== process.env.VERCEL_PROJECT_ID) throw new Error(`unexpected_vercel_project:${project?.id}`);
          if (project?.name !== 'npp-platform') throw new Error(`unexpected_vercel_project_name:${project?.name}`);
          if (project?.framework !== desired.framework) throw new Error(`unexpected_vercel_framework:${project?.framework}`);
          if (project?.rootDirectory !== desired.rootDirectory) throw new Error(`unexpected_root_directory:${project?.rootDirectory}`);
          if (project?.nodeVersion !== desired.nodeVersion) throw new Error(`unexpected_vercel_node_version:${project?.nodeVersion}`);
          NODE
      - name: Prepare MCP route settings runtime credential
        id: mcp_ssh
        shell: bash
        env:
          VPS_MCP_SSH_KEY: '${{ secrets.VPS_MCP_SSH_KEY }}'
        run: |
          set -euo pipefail
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_MCP_SSH_KEY"
          umask 077
          key="$RUNNER_TEMP/vps-mcp.key"
          printf '%s\n' "$VPS_MCP_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known_hosts="$RUNNER_TEMP/vps-mcp-known-hosts"
          ssh-keyscan -T 10 -H "$VPS_MCP_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Synchronize MCP route settings server binding
        shell: bash
        env:
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
          SSH_KEY: '${{ steps.mcp_ssh.outputs.key }}'
          KNOWN_HOSTS: '${{ steps.mcp_ssh.outputs.known_hosts }}'
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"
          mcp_url="https://$VPS_MCP_HOST"
          MCP_API_INTERNAL_URL="$mcp_url" node --input-type=module <<'NODE'
          const url = new URL(process.env.MCP_API_INTERNAL_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/') {
            throw new Error('invalid_mcp_route_settings_url');
          }
          NODE
          for path in /health/live /health/ready; do
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}' "$mcp_url$path" || true)"
            test "$code" = 200
          done

          token_file="$RUNNER_TEMP/mcp-backend-token"
          ssh \
            -i "$SSH_KEY" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" \
            "sudo -n /usr/bin/node --env-file=/etc/npp/mcp.env -e 'process.stdout.write(process.env.BACKEND_API_TOKEN || \"\")'" \
            > "$token_file"
          token="$(cat "$token_file")"
          test "${#token}" -ge 32
          echo "::add-mask::$token"

          body="$(jq -nc \
            --arg url "$mcp_url" \
            --arg token "$token" \
            '[
              {key:"MCP_API_INTERNAL_URL",value:$url,type:"sensitive",target:["production"]},
              {key:"MCP_API_SERVER_TOKEN",value:$token,type:"sensitive",target:["production"]}
            ]')"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/company-mcp-route-env-upsert.json" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true")"
          case "$status" in 200|201) ;; *) exit 1 ;; esac
          rm -f "$token_file"

          metadata="$RUNNER_TEMP/company-mcp-route-env-metadata.json"
          status="$(curl --silent --show-error --output "$metadata" --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")"
          test "$status" = 200
          ENV_METADATA="$metadata" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync(process.env.ENV_METADATA, 'utf8'));
          const envs = Array.isArray(payload.envs) ? payload.envs : [];
          for (const key of ['MCP_API_INTERNAL_URL', 'MCP_API_SERVER_TOKEN']) {
            const matches = envs.filter((entry) => entry?.key === key && Array.isArray(entry.target) && entry.target.includes('production'));
            if (matches.length !== 1) throw new Error(`company_mcp_route_env_missing_or_ambiguous:${key}`);
            if (matches[0].type === 'plain') throw new Error(`company_mcp_route_env_must_not_be_plain:${key}`);
          }
          NODE
      - name: Pull production project configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Verify Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error(`unexpected_vercel_project:${linked.projectId}`);
          if (linked.settings?.rootDirectory !== 'npp-core/web') throw new Error(`unexpected_root_directory:${linked.settings?.rootDirectory}`);
          NODE
      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test production alias
        shell: bash
        env: { DEPLOYMENT_URL: '${{ env.PRODUCTION_URL }}' }
        run: |
          set -euo pipefail
          assert_status() {
            local path="$1"; shift
            local response
            response="$(curl --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path")"
            for code in "$@"; do [ "$response" = "$code" ] && return 0; done
            echo "Unexpected status for $path: $response" >&2; exit 1
          }
          assert_status / 302 307 401
          assert_status /login 200
          assert_status /dashboard 302 307 401
          assert_status /organization 302 307 401
          assert_status /api/customers 401
          assert_status /api/access/permissions 401
          assert_status /api/mcp-routes 401

          smoke_login_assets() {
            local html css_asset js_asset
            html="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/login")" || return 1
            printf '%s' "$html" | grep -F 'Hệ thống điều hành Công Ty' >/dev/null || return 1
            css_asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.css' | head -n 1)" || return 1
            js_asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.js' | head -n 1)" || return 1
            test -n "$css_asset" && test -n "$js_asset" || return 1
            curl --fail --silent --show-error "$DEPLOYMENT_URL$css_asset" >/dev/null || return 1
            curl --fail --silent --show-error "$DEPLOYMENT_URL$js_asset" >/dev/null || return 1
          }

          smoke_ok=0
          for attempt in {1..12}; do
            if smoke_login_assets; then
              smoke_ok=1
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$smoke_ok" -ne 1 ]; then
            echo "Production alias did not converge to a coherent login page and static assets." >&2
            exit 1
          fi
      - name: Record successful exact SHA
        shell: bash
        env: { TARGET_SHA: '${{ steps.target.outputs.sha }}', DEPLOYED_URL: '${{ steps.deploy.outputs.url }}' }
        run: |
          echo "DEPLOYED_SHA=$TARGET_SHA"
          echo "DEPLOYED_URL=$DEPLOYED_URL"
          echo "VERCEL_NODE_VERSION=24.x"
