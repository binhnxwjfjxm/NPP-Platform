name: Manual Vercel NPP production deploy

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      DEPLOY_REF: main
      PRODUCTION_URL: https://npp-platform.vercel.app
    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Validate Issue #5 trigger comment
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          trimmed_comment="${COMMENT_BODY:-}"
          trimmed_comment="${trimmed_comment#"${trimmed_comment%%[![:space:]]*}"}"
          trimmed_comment="${trimmed_comment%"${trimmed_comment##*[![:space:]]}"}"
          if [ "$trimmed_comment" != '/deploy-vercel-production' ]; then
            echo "Issue #5 comment must be the exact deploy command." >&2
            exit 1
          fi

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying ref ${DEPLOY_REF} at SHA: $sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Pull production project configuration
        run: >-
          npx --yes vercel@latest pull
          --yes
          --environment=production
          --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const linked = JSON.parse(await readFile(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`unexpected_vercel_project:${linked.projectId}`);
          }
          if (linked.settings?.rootDirectory !== 'npp-core/web') {
            throw new Error(`unexpected_root_directory:${linked.settings?.rootDirectory}`);
          }
          NODE

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(
            npx --yes vercel@latest deploy \
              --prod \
              --token="${{ secrets.VERCEL_TOKEN }}"
          )"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $url"

      - name: Smoke test deployment URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ env.PRODUCTION_URL }}
          CORE_WEB_ADMIN_USERNAME: ${{ secrets.CORE_WEB_ADMIN_USERNAME }}
          CORE_WEB_ADMIN_PASSWORD: ${{ secrets.CORE_WEB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          assert_status() {
            local path="$1"
            shift
            local -a expected_codes=("$@")
            local -a auth_args=()
            local response
            response="$(
              curl --silent --show-error \
                --retry 5 --retry-delay 5 \
                "${auth_args[@]}" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$DEPLOYMENT_URL$path"
            )"
            local expected_ok=false
            for code in "${expected_codes[@]}"; do
              if [ "$response" = "$code" ]; then
                expected_ok=true
                break
              fi
            done
            if [ "$expected_ok" != true ]; then
              echo "Unexpected status for $path: expected one of ${expected_codes[*]}, got $response" >&2
              exit 1
            fi
          }

          assert_status_auth() {
            local path="$1"
            local auth="$2"
            shift 2
            local -a expected_codes=("$@")
            local -a auth_args=()
            if [ -n "$auth" ]; then
              auth_args=(-u "$auth")
            fi
            local response
            response="$(
              curl --silent --show-error \
                --retry 5 --retry-delay 5 \
                "${auth_args[@]}" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$DEPLOYMENT_URL$path"
            )"
            local expected_ok=false
            for code in "${expected_codes[@]}"; do
              if [ "$response" = "$code" ]; then
                expected_ok=true
                break
              fi
            done
            if [ "$expected_ok" != true ]; then
              echo "Unexpected status for $path: expected one of ${expected_codes[*]}, got $response" >&2
              exit 1
            fi
          }

          assert_status / 302 307
          assert_status /login 200
          assert_status /dashboard 401
          assert_status /organization 401
          assert_status /organization/branches 401
          assert_status /organization/warehouses 401
          assert_status /organization/locations 401
          assert_status /api/customers 401
          assert_status /api/customer-groups 401
          assert_status /api/suppliers 401
          assert_status /api/product-brands 401
          assert_status /api/inventory/balances 401
          assert_status /api/inventory/lots 401
          assert_status /api/inventory/tracking-policies 401
          assert_status /api/inventory/opening-balances 401
          assert_status /api/access/permissions 401
          assert_status /api/access/roles 401

          if [ -z "${CORE_WEB_ADMIN_USERNAME:-}" ] || [ -z "${CORE_WEB_ADMIN_PASSWORD:-}" ]; then
            echo "Core web Basic Auth secrets are required for authenticated smoke." >&2
            exit 1
          fi

          auth="${CORE_WEB_ADMIN_USERNAME}:${CORE_WEB_ADMIN_PASSWORD}"
          assert_status_auth /dashboard "$auth" 200
          assert_status_auth /organization "$auth" 200
          assert_status_auth /organization/branches "$auth" 200
          assert_status_auth /organization/warehouses "$auth" 200
          assert_status_auth /organization/locations "$auth" 200
          assert_status_auth /api/customers "$auth" 200
          assert_status_auth /api/customer-groups "$auth" 200
          assert_status_auth /api/suppliers "$auth" 200
          assert_status_auth /api/product-brands "$auth" 200
          assert_status_auth /api/inventory/balances "$auth" 200
          assert_status_auth /api/inventory/lots "$auth" 200
          assert_status_auth /api/inventory/tracking-policies "$auth" 200
          assert_status_auth /api/inventory/opening-balances "$auth" 200
          assert_status_auth /api/access/permissions "$auth" 200
          assert_status_auth /api/access/roles "$auth" 200

          html="$(
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 5 \
              "$DEPLOYMENT_URL/login"
          )"
          css_asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.css' | head -n 1)"
          js_asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.js' | head -n 1)"
          test -n "$css_asset"
          test -n "$js_asset"
          curl --fail --silent --show-error "$DEPLOYMENT_URL$css_asset" >/dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL$js_asset" >/dev/null

      - name: Record successful exact SHA
        shell: bash
        run: |
          echo "DEPLOYED_SHA=${{ steps.target.outputs.sha }}"
          echo "DEPLOYED_URL=${{ steps.deploy.outputs.url }}"
