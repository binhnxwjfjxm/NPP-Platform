name: Manual Vercel production deploy

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: write

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure deployment identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Open one-shot production gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "npp-core/web/vercel.json";
          const config = JSON.parse(await readFile(path, "utf8"));
          if (config.git?.deploymentEnabled !== false) {
            throw new Error("vercel_deployment_gate_not_locked");
          }
          config.git = { ...(config.git || {}), deploymentEnabled: true };
          await writeFile(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          git add npp-core/web/vercel.json
          git commit -m "chore(vercel): open one-shot production gate [skip ci]"
          git push origin HEAD:main

      - name: Allow Vercel to accept the production event
        run: sleep 45

      - name: Re-lock automatic deployments
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "npp-core/web/vercel.json";
          const config = JSON.parse(await readFile(path, "utf8"));
          config.git = { ...(config.git || {}), deploymentEnabled: false };
          await writeFile(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          git add npp-core/web/vercel.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(vercel): re-lock automatic deployments [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify repository is locked
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:npp-core/web/vercel.json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync(0, "utf8"));
            if (config.git?.deploymentEnabled !== false) {
              throw new Error("vercel_deployment_gate_left_open");
            }
          '
