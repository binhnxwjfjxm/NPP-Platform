name: TEMP PR944 source snapshot

on:
  push:
    branches:
      - agent/issue-942-warehouse-location-mode-lot2

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr944-source-snapshot
          path: |
            npp-core/api/test
            npp-core/api/src
            npp-core/api/package.json
            database/migrations
          if-no-files-found: error
          retention-days: 1
