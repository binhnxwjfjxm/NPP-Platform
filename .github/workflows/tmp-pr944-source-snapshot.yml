name: TEMP PR944 final CI fix

on:
  push:
    branches:
      - agent/issue-942-warehouse-location-mode-lot2

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply complete PR944 fixture contract fix
        shell: bash
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          root=Path('npp-core/api/test')
          changed=[]

          def write(path, text):
              p=root/path
              old=p.read_text()
              if old==text: return
              p.write_text(text)
              changed.append(path)

          def set_mode(path, mode, mixed=None):
              p=root/path; old=p.read_text(); t=old
              t=t.replace('warehouse_type, is_active, created_by, updated_by', 'warehouse_type, location_management_mode, is_active, created_by, updated_by')
              t=t.replace('warehouse_type,is_active,created_by,updated_by', 'warehouse_type,location_management_mode,is_active,created_by,updated_by')
              t=t.replace('warehouse_type,\n       is_active, created_by, updated_by', 'warehouse_type, location_management_mode,\n       is_active, created_by, updated_by')
              t=t.replace('warehouse_type,\n      is_active, created_by, updated_by', 'warehouse_type, location_management_mode,\n      is_active, created_by, updated_by')
              t=t.replace('name, warehouse_type, is_active, created_by, updated_by)', 'name, warehouse_type, location_management_mode, is_active, created_by, updated_by)')
              if mixed:
                  pos=0
                  for m in mixed:
                      candidates=[]
                      for pat in ["'main',true", "'main', true"]:
                          idx=t.find(pat,pos)
                          if idx>=0: candidates.append((idx,pat))
                      if not candidates: raise AssertionError(f'{path}: missing warehouse main row for {m}')
                      idx,pat=min(candidates)
                      rep = "'main','%s',true"%m if pat=="'main',true" else "'main', '%s', true"%m
                      t=t[:idx]+rep+t[idx+len(pat):]
                      pos=idx+len(rep)
              else:
                  t=t.replace("'main',true", f"'main','{mode}',true")
                  t=t.replace("'main', true", f"'main', '{mode}', true")
              if t==old: raise AssertionError(f'{path}: no warehouse fixture mode change')
              write(path,t)

          managed=[
          'goods-receipt.test.js','inventory-adjustment.postgres.test.js','inventory-balance.test.js',
          'inventory-costing.postgres.test.js','inventory-ledger.test.js','inventory-lots-opening-balance.test.js',
          'inventory-reservations.test.js','inventory-stocktake.postgres.test.js','inventory-transfer-receipt.test.js',
          'issue-633-manual-inbound-lot1.test.js','logistics-trip-batch-assignment-integration.test.js',
          'logistics-trip-planning-integration.test.js','logistics-trip-reconciliation-postgres.test.js','payable.test.js',
          'sales-delivery-inventory-integration.test.js','sales-fulfillment-hardening-integration.test.js',
          'sales-fulfillment-operations-integration.test.js','supplier-return.test.js']
          for f in managed: set_mode(f,'MANAGED')
          set_mode('manual-sales-order-allocation-release-postgres.test.js','UNMANAGED')
          set_mode('manual-sales-order-edit-postgres.test.js','UNMANAGED')
          set_mode('inventory-transfer.test.js','MANAGED',mixed=['MANAGED','UNMANAGED'])

          p=root/'inventory-adjustment-bulk.test.js'; t=p.read_text()
          t=t.replace("test('bulk scope auto-fills the sole valid required lot instead of asking for a file column'", "test('bulk scope auto-fills the sole valid required lot but never auto-selects a managed warehouse location'")
          t=t.replace("  assert.equal(resolved.locationCode, 'A01');\n  assert.equal(resolved.lotAutoFilled, true);\n  assert.equal(resolved.locationAutoFilled, true);\n  assert.equal(resolved.requiresLotSelection, false);\n  assert.equal(resolved.requiresLocationSelection, false);", "  assert.equal(resolved.locationCode, null);\n  assert.equal(resolved.lotAutoFilled, true);\n  assert.equal(resolved.locationAutoFilled, false);\n  assert.equal(resolved.requiresLotSelection, false);\n  assert.equal(resolved.requiresLocationSelection, true);")
          t=t.replace("test('bulk scope requires a user lot choice when tracking policy has multiple valid lots'", "test('bulk scope requires explicit managed location and user lot when multiple valid lots exist'")
          t=t.replace("  assert.equal(resolved.locationCode, 'A01');\n  assert.equal(resolved.locationAutoFilled, true);\n  assert.equal(resolved.lotCode, null);\n  assert.equal(resolved.requiresLotSelection, true);\n  assert.equal(resolved.requiresLocationSelection, false);", "  assert.equal(resolved.locationCode, null);\n  assert.equal(resolved.locationAutoFilled, false);\n  assert.equal(resolved.lotCode, null);\n  assert.equal(resolved.requiresLotSelection, true);\n  assert.equal(resolved.requiresLocationSelection, true);")
          t=t.replace("test('bulk scope requires location only when exact scope is still ambiguous'", "test('bulk scope may infer a unique lot but always requires explicit managed location'")
          t=t.replace("  assert.equal(noLotTracking.locationCode, 'A01');\n  assert.equal(noLotTracking.requiresLocationSelection, false);", "  assert.equal(noLotTracking.locationCode, null);\n  assert.equal(noLotTracking.locationAutoFilled, false);\n  assert.equal(noLotTracking.requiresLocationSelection, true);")
          t=t.replace("test('bulk scope uses active warehouse locations even when a SKU has no balance there yet'", "test('bulk scope exposes active managed warehouse locations as choices without auto-selecting one'")
          t=t.replace("  assert.equal(soleLocation.locationCode, 'A01');\n  assert.equal(soleLocation.locationAutoFilled, true);\n  assert.equal(soleLocation.requiresLocationSelection, false);", "  assert.equal(soleLocation.locationCode, null);\n  assert.equal(soleLocation.locationAutoFilled, false);\n  assert.equal(soleLocation.requiresLocationSelection, true);\n  assert.deepEqual(soleLocation.scopeOptions.map((item) => item.locationCode), ['A01']);")
          write('inventory-adjustment-bulk.test.js',t)

          p=root/'inventory-adjustment-unassigned-location.test.js'; old=p.read_text()
          start=old.index("test('bulk preview treats Không vị trí")
          end=old.index("test('governed manual adjustment", start)
          new1="""test('bulk preview separates managed location stock from unmanaged common stock without auto-fill', () => {
            const input = {
              lineNumber: 2,
              sku: 'VAIMOC',
              actualQuantity: '0',
              actualScaled6: 0n,
              locationCode: null,
              lotCode: null,
              errors: [],
            };
            const source = { lot_tracking_mode: 'NONE' };
            const candidates = [
              scope({ locationId: null, locationCode: null, onHand: '27306.000000000000' }),
              scope({
                locationId: '33333333-3333-4333-8333-333333333333',
                locationCode: '001',
                onHand: '25030.000000000000',
              }),
            ];

            const managed = inventoryAdjustmentBulkInternals.resolveScopeSelection(input, source, candidates, 'MANAGED');
            assert.equal(managed.locationCode, null);
            assert.equal(managed.locationAutoFilled, false);
            assert.equal(managed.requiresLocationSelection, true);
            assert.deepEqual(managed.scopeOptions.map((item) => item.locationCode), ['001']);
            assert.equal(managed.candidates.length, 1);
            assert.equal(managed.candidates[0].location_id, '33333333-3333-4333-8333-333333333333');

            const unmanaged = inventoryAdjustmentBulkInternals.resolveScopeSelection(input, source, candidates, 'UNMANAGED');
            assert.equal(unmanaged.locationCode, null);
            assert.equal(unmanaged.locationAutoFilled, false);
            assert.equal(unmanaged.requiresLocationSelection, false);
            assert.deepEqual(unmanaged.scopeOptions.map((item) => item.locationCode), [null]);
            assert.equal(unmanaged.candidates.length, 1);
            assert.equal(unmanaged.candidates[0].location_id, null);
            assert.equal(unmanaged.candidates[0].on_hand_quantity, '27306.000000000000');
          });

          """
          t=old[:start]+new1+old[end:]
          start=t.index("test('governed manual adjustment")
          end=t.index("test('repository and migration", start)
          new2="""test('manual adjustment normalization leaves location authority to the selected warehouse mode', () => {
            const basePayload = {
              warehouseId,
              documentKind: 'MANUAL_ADJUSTMENT',
              reasonCode: 'MANUAL_COUNT_CORRECTION_OUT',
              reasonNote: 'Đưa tồn cũ chưa gán vị trí về đúng số thực tế',
              lines: [{ sourceLocationId: null, sourceVariantId: variantId, lotId: null, quantity: '27306' }],
            };

            const decrease = inventoryAdjustmentInternals.normalizeCreatePayload({
              ...basePayload,
              adjustmentDirection: 'OUT',
            });
            assert.equal(decrease.ok, true);
            assert.equal(decrease.value.lines[0].source_location_id, null);

            const increase = inventoryAdjustmentInternals.normalizeCreatePayload({
              ...basePayload,
              adjustmentDirection: 'IN',
              reasonCode: 'MANUAL_COUNT_CORRECTION_IN',
            });
            assert.equal(increase.ok, true);
            assert.equal(increase.value.lines[0].source_location_id, null);

            const serviceSource = readFileSync(new URL('../src/services/inventory-adjustment.js', import.meta.url), 'utf8');
            assert.match(serviceSource, /WAREHOUSE_LOCATION_MODE_REQUIRED/);
            assert.match(serviceSource, /LOCATION_REQUIRED/);
            assert.match(serviceSource, /LOCATION_NOT_ALLOWED/);
          });

          """
          t=t[:start]+new2+t[end:]
          t=t.replace("  assert.match(bulkSource, /UNASSIGNED_LOCATION_INCREASE_DENIED/);\n","")
          write('inventory-adjustment-unassigned-location.test.js',t)

          p=root/'inventory-policy-alignment.test.js'; t=p.read_text()
          t=t.replace("return { rows: [{ id: warehouseId, code: 'KHO-01', name: 'Kho chính' }] };", "return { rows: [{ id: warehouseId, code: 'KHO-01', name: 'Kho chính', location_management_mode: 'UNMANAGED' }] };")
          write('inventory-policy-alignment.test.js',t)

          p=root/'issue-942-warehouse-location-mode.test.js'; t=p.read_text()
          oldblock="""test('Issue #942 preview blocks open reservations but does not block merely because stock exists', () => {
            assert.match(serviceSource, /ACTIVE_RESERVATIONS_PRESENT/);
            assert.match(serviceSource, /reservedQuantity\\s*>\\s*0n/);
            assert.doesNotMatch(serviceSource, /WAREHOUSE_HAS_STOCK|STOCK_MUST_BE_ZERO/);
          });"""
          newblock="""test('Issue #942 remaps pre-execution reservations and blocks only physical fulfillment execution', () => {
            assert.match(serviceSource, /function reservationPlan\\(/);
            assert.match(serviceSource, /ACTIVE_RESERVATION_NOT_RELOCATABLE/);
            assert.match(serviceSource, /FULFILLMENT_PHYSICAL_EXECUTION_PRESENT/);
            assert.match(serviceSource, /physicallyStarted/);
            assert.match(serviceSource, /relocations/);
            assert.doesNotMatch(serviceSource, /ACTIVE_RESERVATIONS_PRESENT/);
            assert.doesNotMatch(serviceSource, /WAREHOUSE_HAS_STOCK|STOCK_MUST_BE_ZERO/);
          });"""
          if oldblock not in t: raise AssertionError('issue-942 old block not found')
          t=t.replace(oldblock,newblock)
          write('issue-942-warehouse-location-mode.test.js',t)

          p=root/'warehouse-location-authority-lot2.test.js'; t=p.read_text()
          t=t.replace("assert.match(migration132, /warehouse\\.location_management_mode/);", "assert.match(migration132, /location_management_mode/);")
          write('warehouse-location-authority-lot2.test.js',t)

          if len(changed) != 26:
              raise AssertionError(f'expected 26 changed test files, got {len(changed)}: {changed}')
          print('changed', len(changed))
          for f in changed: print(f)
          PYFIX
      - name: Validate changed tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            goods-receipt.test.js
            inventory-adjustment-bulk.test.js
            inventory-adjustment-unassigned-location.test.js
            inventory-adjustment.postgres.test.js
            inventory-balance.test.js
            inventory-costing.postgres.test.js
            inventory-ledger.test.js
            inventory-lots-opening-balance.test.js
            inventory-policy-alignment.test.js
            inventory-reservations.test.js
            inventory-stocktake.postgres.test.js
            inventory-transfer-receipt.test.js
            inventory-transfer.test.js
            issue-633-manual-inbound-lot1.test.js
            issue-942-warehouse-location-mode.test.js
            logistics-trip-batch-assignment-integration.test.js
            logistics-trip-planning-integration.test.js
            logistics-trip-reconciliation-postgres.test.js
            manual-sales-order-allocation-release-postgres.test.js
            manual-sales-order-edit-postgres.test.js
            payable.test.js
            sales-delivery-inventory-integration.test.js
            sales-fulfillment-hardening-integration.test.js
            sales-fulfillment-operations-integration.test.js
            supplier-return.test.js
            warehouse-location-authority-lot2.test.js
          )
          for f in "${files[@]}"; do node --check "npp-core/api/test/$f" >/dev/null; done
          python - <<'PYVERIFY'
          from pathlib import Path
          root=Path('npp-core/api/test')
          expected={
            'manual-sales-order-allocation-release-postgres.test.js':'UNMANAGED',
            'manual-sales-order-edit-postgres.test.js':'UNMANAGED',
          }
          managed={
            'goods-receipt.test.js','inventory-adjustment.postgres.test.js','inventory-balance.test.js',
            'inventory-costing.postgres.test.js','inventory-ledger.test.js','inventory-lots-opening-balance.test.js',
            'inventory-reservations.test.js','inventory-stocktake.postgres.test.js','inventory-transfer-receipt.test.js',
            'issue-633-manual-inbound-lot1.test.js','logistics-trip-batch-assignment-integration.test.js',
            'logistics-trip-planning-integration.test.js','logistics-trip-reconciliation-postgres.test.js','payable.test.js',
            'sales-delivery-inventory-integration.test.js','sales-fulfillment-hardening-integration.test.js',
            'sales-fulfillment-operations-integration.test.js','supplier-return.test.js'
          }
          for name in managed: expected[name]='MANAGED'
          for name,mode in expected.items():
              text=(root/name).read_text()
              assert 'INSERT INTO shared.warehouses' in text, name
              for part in text.split('INSERT INTO shared.warehouses')[1:]:
                  before=part.split('VALUES',1)[0]
                  assert 'location_management_mode' in before, f'{name} missing mode column'
              assert f"'{mode}'" in text, f'{name} missing {mode}'
          transfer=(root/'inventory-transfer.test.js').read_text()
          assert "'MANAGED'" in transfer and "'UNMANAGED'" in transfer
          bulk=(root/'inventory-adjustment-bulk.test.js').read_text()
          assert 'locationAutoFilled, true' not in bulk
          assert bulk.count('locationAutoFilled, false') >= 3
          policy=(root/'inventory-policy-alignment.test.js').read_text()
          assert "location_management_mode: 'UNMANAGED'" in policy
          issue=(root/'issue-942-warehouse-location-mode.test.js').read_text()
          assert 'FULFILLMENT_PHYSICAL_EXECUTION_PRESENT' in issue
          assert 'assert.doesNotMatch(serviceSource, /ACTIVE_RESERVATIONS_PRESENT/)' in issue
          print('PR944 fixture contract validation OK')
          PYVERIFY
      - name: Commit one final fix and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch tmp-do-not-use tmp2-do-not-use tmp3-do-not-use
          git rm -f --ignore-unmatch .github/workflows/tmp-pr944-source-snapshot.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/api/test
          git diff --cached --check
          git commit -m "test(company): đồng bộ kiểm thử theo chế độ vị trí kho"
          git push origin HEAD:agent/issue-942-warehouse-location-mode-lot2
