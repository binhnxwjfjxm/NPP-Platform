name: Customer Ordering AI production config gate

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: ordering-ai-production-config
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 5 &&
       github.event.comment.body == '/configure-ordering-ai-production' &&
       contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_REF: main
      HEROKU_APP_NAME: hung-phat
      HEROKU_FORBIDDEN_APP_NAME: hung-phat-mcp
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      VERCEL_ORDERING_PROJECT_ID: prj_btLk3p4FhmShgKFdRBMq6ZFOagKe
      COMPANY_API_URL: https://hung-phat-945da1547594.herokuapp.com
      WEBSITE_AI_BASE_URL: https://nguyenlieuhungphat.com
      ORDERING_AI_ACTOR_ID: service:ordering-ai
    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: '${{ github.event.comment.body }}'
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/configure-ordering-ai-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: '${{ env.DEPLOY_REF }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        working-directory: mcp
        run: npm install --global vercel@58.0.0

      - name: Resolve canonical Ordering token and synchronize plain production URLs
        shell: bash
        env:
          HEROKU_API_KEY: '${{ secrets.HEROKU_API_KEY }}'
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';

          const env = process.env;
          const required = (value, name) => {
            if (!value) throw new Error(`${name}_missing`);
            return value;
          };
          required(env.HEROKU_API_KEY, 'heroku_api_key');
          required(env.VERCEL_TOKEN, 'vercel_token');
          if (env.HEROKU_APP_NAME !== 'hung-phat' || env.HEROKU_APP_NAME === env.HEROKU_FORBIDDEN_APP_NAME) {
            throw new Error('unexpected_heroku_target');
          }

          const herokuHeaders = {
            Accept: 'application/vnd.heroku+json; version=3',
            Authorization: `Bearer ${env.HEROKU_API_KEY}`,
            'Content-Type': 'application/json',
          };
          const vercelHeaders = {
            Authorization: `Bearer ${env.VERCEL_TOKEN}`,
            'Content-Type': 'application/json',
          };
          async function jsonRequest(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`provider_request_failed:${response.status}:${body?.error?.code || body?.id || 'unknown'}`);
            return body;
          }
          async function project(projectId) {
            return jsonRequest(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}?teamId=${encodeURIComponent(env.VERCEL_ORG_ID)}`, { headers: vercelHeaders });
          }
          const website = await project(env.VERCEL_WEBSITE_PROJECT_ID);
          const ordering = await project(env.VERCEL_ORDERING_PROJECT_ID);
          if (website?.name !== 'nguyenlieuhungphat') throw new Error('website_project_identity_mismatch');
          if (ordering?.name !== 'customer-ordering') throw new Error('ordering_project_identity_mismatch');
          if ((ordering?.rootDirectory || '.') !== 'customer-ordering') throw new Error('ordering_project_root_mismatch');
          if (website?.nodeVersion !== '24.x' || ordering?.nodeVersion !== '24.x') throw new Error('unexpected_node_runtime');

          const herokuConfigUrl = `https://api.heroku.com/apps/${encodeURIComponent(env.HEROKU_APP_NAME)}/config-vars`;
          const herokuConfig = await jsonRequest(herokuConfigUrl, { headers: herokuHeaders });
          const reservedTokens = [
            herokuConfig?.BACKEND_API_TOKEN,
            herokuConfig?.MCP_ONBOARDING_API_TOKEN,
            herokuConfig?.MCP_SALES_API_TOKEN,
            herokuConfig?.WEBSITE_AI_API_TOKEN,
            herokuConfig?.DELIVERY_FRONTEND_API_TOKEN,
          ].filter(Boolean);
          let sharedToken = String(herokuConfig?.ORDERING_AI_API_TOKEN || '');
          if (!sharedToken || reservedTokens.includes(sharedToken)) sharedToken = randomBytes(48).toString('base64url');
          console.log(`::add-mask::${sharedToken}`);

          const herokuPatch = {};
          if (String(herokuConfig?.ORDERING_AI_API_TOKEN || '') !== sharedToken) herokuPatch.ORDERING_AI_API_TOKEN = sharedToken;
          if (String(herokuConfig?.ORDERING_AI_ACTOR_ID || '') !== env.ORDERING_AI_ACTOR_ID) herokuPatch.ORDERING_AI_ACTOR_ID = env.ORDERING_AI_ACTOR_ID;
          if (Object.keys(herokuPatch).length) {
            await jsonRequest(herokuConfigUrl, {
              method: 'PATCH', headers: herokuHeaders, body: JSON.stringify(herokuPatch),
            });
          }

          async function productionEnv(projectId) {
            const url = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`);
            url.searchParams.set('teamId', env.VERCEL_ORG_ID);
            url.searchParams.set('decrypt', 'true');
            url.searchParams.set('source', 'vercel-cli:pull');
            const body = await jsonRequest(url, { headers: vercelHeaders });
            const entries = Array.isArray(body) ? body : Array.isArray(body?.envs) ? body.envs : [];
            return entries.filter((entry) => {
              const targets = Array.isArray(entry?.target) ? entry.target : [entry?.target].filter(Boolean);
              return targets.includes('production') && !entry?.gitBranch;
            });
          }
          const websiteEnv = await productionEnv(env.VERCEL_WEBSITE_PROJECT_ID);
          const orderingEnv = await productionEnv(env.VERCEL_ORDERING_PROJECT_ID);
          const entriesFor = (entries, key) => entries.filter((entry) => entry?.key === key);

          async function syncPlain(projectId, entries, key, value, comment) {
            const matches = entriesFor(entries, key);
            if (matches.length > 1) throw new Error(`vercel_env_count_invalid:${key}:${matches.length}`);
            if (matches.length === 1) {
              const id = String(matches[0]?.id || '');
              if (!id) throw new Error(`vercel_env_id_missing:${key}`);
              const url = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env/${encodeURIComponent(id)}`);
              url.searchParams.set('teamId', env.VERCEL_ORG_ID);
              await jsonRequest(url, {
                method: 'PATCH', headers: vercelHeaders,
                body: JSON.stringify({ key, value, type: 'plain', target: ['production'], comment }),
              });
              return;
            }
            const url = new URL(`https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/env`);
            url.searchParams.set('teamId', env.VERCEL_ORG_ID);
            await jsonRequest(url, {
              method: 'POST', headers: vercelHeaders,
              body: JSON.stringify([{ key, value, type: 'plain', target: ['production'], comment }]),
            });
          }

          await syncPlain(env.VERCEL_WEBSITE_PROJECT_ID, websiteEnv, 'COMPANY_API_URL', env.COMPANY_API_URL, 'Công Ty API for Ordering gateway');
          await syncPlain(env.VERCEL_ORDERING_PROJECT_ID, orderingEnv, 'CORE_API_BASE_URL', env.COMPANY_API_URL, 'Công Ty API');
          await syncPlain(env.VERCEL_ORDERING_PROJECT_ID, orderingEnv, 'WEBSITE_AI_BASE_URL', env.WEBSITE_AI_BASE_URL, 'Website AI gateway');

          appendFileSync(process.env.GITHUB_ENV, `ORDERING_SHARED_TOKEN=${sharedToken}\n`);
          NODE

      - name: Update Customer Ordering production capability token with Vercel CLI
        shell: bash
        env:
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID
          export VERCEL_PROJECT_ID="$VERCEL_ORDERING_PROJECT_ID"
          printf '%s\n' "$ORDERING_SHARED_TOKEN" | vercel env update ORDERING_AI_API_TOKEN production --sensitive --yes --token "$VERCEL_TOKEN"

      - name: Verify production runtime contract end to end
        shell: bash
        env:
          HEROKU_API_KEY: '${{ secrets.HEROKU_API_KEY }}'
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const env = process.env;
          const herokuHeaders = {
            Accept: 'application/vnd.heroku+json; version=3',
            Authorization: `Bearer ${env.HEROKU_API_KEY}`,
          };
          const vercelHeaders = { Authorization: `Bearer ${env.VERCEL_TOKEN}` };
          async function jsonRequest(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`provider_request_failed:${response.status}:${body?.error?.code || 'unknown'}`);
            return body;
          }
          async function productionEnv(projectId) {
            const url = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`);
            url.searchParams.set('teamId', env.VERCEL_ORG_ID);
            url.searchParams.set('decrypt', 'true');
            url.searchParams.set('source', 'vercel-cli:pull');
            const body = await jsonRequest(url, { headers: vercelHeaders });
            const entries = Array.isArray(body) ? body : Array.isArray(body?.envs) ? body.envs : [];
            return entries.filter((entry) => {
              const targets = Array.isArray(entry?.target) ? entry.target : [entry?.target].filter(Boolean);
              return targets.includes('production') && !entry?.gitBranch;
            });
          }
          const valueFor = (entries, key) => {
            const matches = entries.filter((entry) => entry?.key === key);
            if (matches.length !== 1) throw new Error(`vercel_env_count_invalid:${key}:${matches.length}`);
            return String(matches[0]?.value || '');
          };

          const herokuConfig = await jsonRequest(`https://api.heroku.com/apps/${encodeURIComponent(env.HEROKU_APP_NAME)}/config-vars`, { headers: herokuHeaders });
          const orderingEnv = await productionEnv(env.VERCEL_ORDERING_PROJECT_ID);
          const websiteEnv = await productionEnv(env.VERCEL_WEBSITE_PROJECT_ID);
          const orderingSecretEntries = orderingEnv.filter((entry) => entry?.key === 'ORDERING_AI_API_TOKEN');
          if (orderingSecretEntries.length !== 1) throw new Error(`ordering_token_metadata_count_invalid:${orderingSecretEntries.length}`);
          const orderingSecretType = String(orderingSecretEntries[0]?.type || '');
          if (!['sensitive', 'encrypted'].includes(orderingSecretType)) throw new Error(`ordering_token_metadata_type_invalid:${orderingSecretType || 'missing'}`);

          const orderingToken = String(env.ORDERING_SHARED_TOKEN || '').trim();
          if (!orderingToken) throw new Error('ordering_shared_token_missing');
          console.log(`::add-mask::${orderingToken}`);
          if (orderingToken !== String(herokuConfig?.ORDERING_AI_API_TOKEN || '')) throw new Error('ordering_token_runtime_mismatch');
          if (valueFor(orderingEnv, 'CORE_API_BASE_URL').replace(/\/$/, '') !== env.COMPANY_API_URL) throw new Error('ordering_api_url_mismatch');
          if (valueFor(orderingEnv, 'WEBSITE_AI_BASE_URL').replace(/\/$/, '') !== env.WEBSITE_AI_BASE_URL) throw new Error('ordering_website_url_mismatch');
          if (valueFor(websiteEnv, 'COMPANY_API_URL').replace(/\/$/, '') !== env.COMPANY_API_URL) throw new Error('website_company_api_url_mismatch');

          for (const path of ['/health/live', '/health/ready']) {
            const response = await fetch(`${env.COMPANY_API_URL}${path}`, { signal: AbortSignal.timeout(15_000) });
            if (response.status !== 200) throw new Error(`company_health_failed:${path}:${response.status}`);
          }

          const gateway = await fetch(new URL('/api/ai/ordering-gateway-auth', env.COMPANY_API_URL), {
            headers: { authorization: `Bearer ${orderingToken}` }, signal: AbortSignal.timeout(15_000),
          });
          const gatewayBody = await gateway.json().catch(() => null);
          if (gateway.status !== 200 || gatewayBody?.data?.authorized !== true || gatewayBody?.data?.capability !== 'ordering-ai') {
            throw new Error(`ordering_gateway_auth_probe_failed:${gateway.status}:${gatewayBody?.error?.code || 'unknown'}`);
          }

          const contextUrl = new URL('/api/ai/ordering-context', env.COMPANY_API_URL);
          contextUrl.searchParams.set('customerCode', '__ordering_config_probe__');
          const context = await fetch(contextUrl, {
            headers: { authorization: `Bearer ${orderingToken}` }, signal: AbortSignal.timeout(15_000),
          });
          const contextBody = await context.json().catch(() => null);
          if (context.status !== 404 || contextBody?.error?.code !== 'AI_ORDERING_CUSTOMER_NOT_FOUND') {
            throw new Error(`ordering_service_probe_failed:${context.status}:${contextBody?.error?.code || 'unknown'}`);
          }

          console.log('ORDERING_AI_CONFIG=success');
          console.log('ORDERING_AI_GATEWAY_AUTH=success');
          console.log('ORDERING_AI_BACKEND_TOKEN=success');
          NODE
