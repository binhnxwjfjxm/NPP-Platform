name: Manual production deploy matrix CI

on:
  pull_request:
    paths:
      - .github/workflows/vercel-production-manual.yml
      - .github/workflows/vercel-mcp-production-manual.yml
      - .github/workflows/heroku-npp-backend-manual.yml
      - .github/workflows/heroku-mcp-backend-manual.yml
      - .github/workflows/vps-production-migration-135-manual.yml
      - .github/workflows/vps-production-migration-148-manual.yml
      - .github/workflows/manual-production-deploy-matrix-ci.yml
      - npp-core/api/scripts/vps-production-migrate-workforce-148.sh
      - mcp/test/manual-production-deploy-matrix.test.mjs
      - mcp/test/vps-production-migration-135.test.mjs
      - mcp/test/vps-production-migration-148.test.mjs
  push:
    branches:
      - agent/manual-production-deploy-matrix
    paths:
      - .github/workflows/vercel-production-manual.yml
      - .github/workflows/vercel-mcp-production-manual.yml
      - .github/workflows/heroku-npp-backend-manual.yml
      - .github/workflows/heroku-mcp-backend-manual.yml
      - .github/workflows/vps-production-migration-135-manual.yml
      - .github/workflows/vps-production-migration-148-manual.yml
      - .github/workflows/manual-production-deploy-matrix-ci.yml
      - npp-core/api/scripts/vps-production-migrate-workforce-148.sh
      - mcp/test/manual-production-deploy-matrix.test.mjs
      - mcp/test/vps-production-migration-135.test.mjs
      - mcp/test/vps-production-migration-148.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-matrix-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify manual production boundaries
        run: |
          node --test mcp/test/manual-production-deploy-matrix.test.mjs
          node --test mcp/test/vps-production-migration-135.test.mjs
          node --test mcp/test/vps-production-migration-148.test.mjs
