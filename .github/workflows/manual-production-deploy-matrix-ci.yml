name: Manual production deploy matrix CI

on:
  pull_request:
    paths:
      - .github/workflows/vercel-production-manual.yml
      - .github/workflows/vercel-mcp-production-manual.yml
      - .github/workflows/heroku-npp-backend-manual.yml
      - .github/workflows/heroku-mcp-backend-manual.yml
      - .github/workflows/manual-production-deploy-matrix-ci.yml
      - mcp/test/manual-production-deploy-matrix.test.mjs
  push:
    branches:
      - agent/manual-production-deploy-matrix
    paths:
      - .github/workflows/vercel-production-manual.yml
      - .github/workflows/vercel-mcp-production-manual.yml
      - .github/workflows/heroku-npp-backend-manual.yml
      - .github/workflows/heroku-mcp-backend-manual.yml
      - .github/workflows/manual-production-deploy-matrix-ci.yml
      - mcp/test/manual-production-deploy-matrix.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-production-deploy-matrix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-matrix-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify four-way manual deployment boundary
        run: node --test mcp/test/manual-production-deploy-matrix.test.mjs
