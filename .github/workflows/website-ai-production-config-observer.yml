name: Website AI production config observer

on:
  workflow_run:
    workflows:
      - Website AI production config gate
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-result:
    if: >-
      github.event.workflow_run.event == 'issue_comment' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate observed run boundary
        shell: bash
        env:
          OBSERVED_REPOSITORY: '${{ github.event.workflow_run.repository.full_name }}'
          OBSERVED_HEAD_BRANCH: '${{ github.event.workflow_run.head_branch }}'
          OBSERVED_WORKFLOW: '${{ github.event.workflow_run.name }}'
        run: |
          set -euo pipefail
          test "$OBSERVED_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$OBSERVED_HEAD_BRANCH" = 'main'
          test "$OBSERVED_WORKFLOW" = 'Website AI production config gate'

      - name: Publish sanitized gate result
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          GATE_CONCLUSION: '${{ github.event.workflow_run.conclusion }}'
          GATE_RUN_ID: '${{ github.event.workflow_run.id }}'
          GATE_HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          GATE_EVENT: '${{ github.event.workflow_run.event }}'
        run: |
          set -euo pipefail
          case "$GATE_CONCLUSION" in
            success|failure|cancelled|timed_out|action_required|neutral|skipped|stale) ;;
            *) echo "Unexpected gate conclusion: $GATE_CONCLUSION" >&2; exit 1 ;;
          esac

          body="$(cat <<EOF
          ## Website AI production config observer — $GATE_CONCLUSION

          CONFIG_GATE_CONCLUSION=$GATE_CONCLUSION
          GITHUB_RUN_ID=$GATE_RUN_ID
          SOURCE_SHA=$GATE_HEAD_SHA
          EVENT=$GATE_EVENT
          EOF
          )"

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/764/comments" \
            -f body="$body" \
            >/dev/null
