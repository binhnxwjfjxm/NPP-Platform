name: Company bulk adjustment 503 diagnostic

on:
  push:
    branches:
      - agent/diagnose-inventory-bulk-503
    paths:
      - .github/workflows/vps-company-bulk-503-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}

    steps:
      - name: Prepare SSH credentials
        id: ssh
        shell: bash
        env:
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_DB_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_DB_SSH_KEY"

          umask 077
          company_key="$RUNNER_TEMP/vps-company.key"
          db_key="$RUNNER_TEMP/vps-db.key"
          printf '%s\n' "$VPS_COMPANY_SSH_KEY" > "$company_key"
          printf '%s\n' "$VPS_DB_SSH_KEY" > "$db_key"
          chmod 600 "$company_key" "$db_key"
          ssh-keygen -y -f "$company_key" >/dev/null
          ssh-keygen -y -f "$db_key" >/dev/null

          company_known="$RUNNER_TEMP/vps-company.known"
          db_known="$RUNNER_TEMP/vps-db.known"
          ssh-keyscan -T 10 -H "$VPS_COMPANY_HOST" > "$company_known" 2>/dev/null
          ssh-keyscan -T 10 -H "$VPS_DB_HOST" > "$db_known" 2>/dev/null
          test -s "$company_known"
          test -s "$db_known"
          chmod 600 "$company_known" "$db_known"

          echo "company_key=$company_key" >> "$GITHUB_OUTPUT"
          echo "company_known=$company_known" >> "$GITHUB_OUTPUT"
          echo "db_key=$db_key" >> "$GITHUB_OUTPUT"
          echo "db_known=$db_known" >> "$GITHUB_OUTPUT"

      - name: Read exact Công Ty backend evidence
        shell: bash
        env:
          KEY: ${{ steps.ssh.outputs.company_key }}
          KNOWN: ${{ steps.ssh.outputs.company_known }}
        run: |
          set -euo pipefail
          ssh \
            -i "$KEY" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "service_state=$(systemctl is-active npp-company-api.service 2>/dev/null || true)"
          active_release="$(readlink -f /srv/npp/company/current 2>/dev/null || true)"
          if [ -n "$active_release" ]; then
            echo "active_release=$(basename "$active_release")"
          else
            echo "active_release=unknown"
          fi

          echo 'BULK_503_JOURNAL_BEGIN'
          sudo -n journalctl \
            -u npp-company-api.service \
            --since '2026-09-20 13:15:00 UTC' \
            --until '2026-09-20 13:25:00 UTC' \
            --no-pager \
            -o cat 2>/dev/null \
          | grep -E 'idempotent_request_processing_error|inventory_adjustment_bulk_operation_failed|/api/inventory/adjustments/bulk-confirm|bulk-confirm' \
          | tail -n 200 \
          || true
          echo 'BULK_503_JOURNAL_END'
          REMOTE

      - name: Read exact PostgreSQL error evidence
        shell: bash
        env:
          KEY: ${{ steps.ssh.outputs.db_key }}
          KNOWN: ${{ steps.ssh.outputs.db_known }}
        run: |
          set -euo pipefail
          ssh \
            -i "$KEY" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            "$VPS_SSH_USER@$VPS_DB_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo 'POSTGRES_503_ERROR_BEGIN'
          log_file=/var/log/postgresql/postgresql-17-main.log
          if sudo -n test -r "$log_file"; then
            sudo -n awk '
              $0 ~ /^2026-09-20 13:(1[5-9]|2[0-5]):/ { in_window=1 }
              $0 ~ /^2026-09-20 13:2[6-9]:/ { in_window=0 }
              in_window && $0 ~ /(ERROR:|CONTEXT:|DETAIL:|HINT:)/ { print }
            ' "$log_file" \
            | grep -E 'inventory|adjustment|scope|location|ledger|movement|audit|outbox|idempot|ERROR:|CONTEXT:' \
            | tail -n 200 \
            || true
          else
            echo 'POSTGRES_LOG_NOT_READABLE'
          fi
          echo 'POSTGRES_503_ERROR_END'
          REMOTE
