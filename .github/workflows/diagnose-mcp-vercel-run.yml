name: Diagnose MCP Vercel run

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-mcp-vercel-run.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/diagnose-mcp-vercel-run'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      VERCEL_SCOPE: binhnxwjfjxms-projects
      MCP_ROOT_DIRECTORY: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe scoped MCP project pull without deploying
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          npx --yes vercel@latest pull \
            --yes \
            --environment=production \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN"

      - name: Verify scoped MCP project link
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const linked = JSON.parse(await readFile('.vercel/project.json', 'utf8'));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`unexpected_mcp_vercel_project:${linked.projectId}`);
          }
          if (linked.orgId !== process.env.VERCEL_ORG_ID) {
            throw new Error(`unexpected_mcp_vercel_org:${linked.orgId}`);
          }
          if (linked.settings?.rootDirectory !== process.env.MCP_ROOT_DIRECTORY) {
            throw new Error(`unexpected_mcp_root_directory:${linked.settings?.rootDirectory}`);
          }
          console.log('Scoped MCP Vercel project pull verified.');
          NODE
