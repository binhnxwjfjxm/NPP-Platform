name: Diagnose MCP Vercel run

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-mcp-vercel-run.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/diagnose-mcp-vercel-run'
    runs-on: ubuntu-latest
    steps:
      - name: Report recent MCP Vercel issue-comment runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=issue_comment&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Manual Vercel MCP production deploy")] | sort_by(.created_at) | reverse | .[:10]'
          )"
          test "$(jq 'length' <<<"$runs_json")" -gt 0
          {
            echo "### Recent MCP Vercel workflow runs"
            echo
            echo '| Run ID | Title | Status | Conclusion | Created | Head SHA |'
            echo '|---:|---|---|---|---|---|'
            jq -r '.[] | "| `\(.id)` | `\(.display_title)` | `\(.status)` | `\(.conclusion // "pending")` | `\(.created_at)` | `\(.head_sha)` |"' <<<"$runs_json"
          } > "${RUNNER_TEMP}/mcp-vercel-run-diagnosis.md"
          cat "${RUNNER_TEMP}/mcp-vercel-run-diagnosis.md"
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/mcp-vercel-run-diagnosis.md"
