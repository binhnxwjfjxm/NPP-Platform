name: Apply UI Component Refactor

on:
  pull_request:
    branches:
      - codex/vercel-production-source-deploy
    paths:
      - '.github/workflows/ui-source-export.yml'
      - '.github/ui-refactor/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/ui-live-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-live-fixes
          fetch-depth: 0

      - name: Apply direct component patches
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ui-refactor/product.*.patch > /tmp/product.patch
          cat .github/ui-refactor/customer.*.patch > /tmp/customer.patch
          git apply --check /tmp/product.patch
          git apply --check /tmp/customer.patch
          git apply /tmp/product.patch
          git apply /tmp/customer.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Verify focused Core web changes
        id: verify
        shell: bash
        run: |
          set +e
          : > /tmp/ui-refactor-verify.log
          npm --workspace npp-core-web run typecheck >> /tmp/ui-refactor-verify.log 2>&1
          typecheck_status=$?
          node --test npp-core/web/test/ui-live-fixes.test.js >> /tmp/ui-refactor-verify.log 2>&1
          test_status=$?
          cat /tmp/ui-refactor-verify.log
          if [ "$typecheck_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            echo 'failed=0' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=1' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload focused verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-refactor-verify
          path: /tmp/ui-refactor-verify.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when focused verification failed
        if: steps.verify.outputs.failed != '0'
        run: exit 1

      - name: Commit direct component refactor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ui-refactor
          rm -f .github/workflows/ui-source-export.yml
          git config user.name 'khuongbinhinfo-a11y'
          git config user.email '269412638+khuongbinhinfo-a11y@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ui): implement live fixes in components'
          git push origin HEAD:agent/ui-live-fixes
