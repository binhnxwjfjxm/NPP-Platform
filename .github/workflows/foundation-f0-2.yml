name: Foundation F0.2

on:
  pull_request:
  push:
    branches:
      - main
      - f0-2-installation-context-config

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify root ignore coverage
        working-directory: .
        run: |
          set -euo pipefail
          for candidate in \
            mcp/coverage/.probe \
            mcp/.turbo/.probe \
            mcp/.env.production \
            npp-core/node_modules/.probe \
            npp-core/.next/.probe \
            npp-core/.env.local
          do
            match="$(git check-ignore --no-index --verbose "$candidate")"
            echo "$match"
            case "$match" in
              .gitignore:*) ;;
              *)
                echo "::error::$candidate is not protected by the root .gitignore"
                exit 1
                ;;
            esac
          done

          for example in mcp/.env.example npp-core/api/.env.example npp-core/web/.env.example
          do
            if git check-ignore --no-index --quiet "$example"; then
              echo "::error::$example must remain committable"
              exit 1
            fi
          done

      - name: Verify NPP Core foundation boundary
        working-directory: .
        run: |
          set -euo pipefail
          test -s npp-core/README.md
          test -s npp-core/api/package.json
          test -s npp-core/web/package.json
          grep -Fq "Phase 0 repository baseline is complete." npp-core/README.md
          grep -Fq "Phase 1 monorepo foundation is complete" npp-core/README.md
          grep -Fq "Phase 2 now adds the Core API request-context and authorization boundary." npp-core/README.md
          grep -Fq "It does **not** contain inventory, purchasing, sales, accounting, XNT" npp-core/README.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime hardcodes
        run: npm run audit:runtime-config

      - name: Verify Windows entrypoint paths
        run: npm run test:windows-path

      - name: Verify workflow workspace paths
        run: npm run test:workflow-paths 2>&1 | tee workflow-path-audit.log

      - name: Upload workflow path diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-path-audit
          path: mcp/workflow-path-audit.log
          if-no-files-found: error

      - name: Upload hardcode audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-hardcode-findings
          path: mcp/runtime-hardcode-findings.txt
          if-no-files-found: error

      - name: Test direct mutation scanner and retirement policy
        run: npm run test:direct-db-mutation

      - name: Verify Edge mutation retirement
        run: npm run test:edge-retirement

      - name: Verify direct REST mutation retirement
        run: npm run test:direct-rest-retirement

      - name: Verify session lifecycle caller contract
        run: npm run test:session-lifecycle-caller

      - name: Verify route master caller contract
        run: npm run test:route-master-caller

      - name: Verify route customer photo contracts
        run: npm run test:route-customer-photo

      - name: Verify retired route settings mutation boundary
        run: node --test test/a5-5-2-route-settings-caller-contract.test.mjs

      - name: Verify A5.5.1 idempotency caller contract
        run: node --test test/a5-5-1-idempotency-caller-contract.test.mjs

      - name: Verify A5.5.2 session action contracts
        run: node --test test/a5-5-2-session-action-caller-contract.test.mjs test/a5-5-2-session-action-runtime-smoke-contract.test.mjs

      - name: Verify order and active-route idempotency contracts
        run: node --test test/orders-create-ui-contract.test.mjs test/orders-control-center-contract.test.mjs test/route-active-session-ui-contract.test.mjs

      - name: Verify check-in and F05 runtime contracts
        run: node --test test/mcp-session-checkin-ui-contract.test.mjs test/f05-runtime-smoke-script.test.mjs

      - name: Verify production hygiene contracts
        run: npm run test:production-hygiene

      - name: Audit direct DB mutations
        run: npm run audit:direct-db-mutation

      - name: Upload direct mutation audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-db-mutation-findings
          path: |
            mcp/direct-db-mutation-findings.txt
            mcp/direct-db-mutation-findings.json
          if-no-files-found: error

      - name: Verify deploy and frontend gateway auth contracts
        run: |
          bash -n ops/pullmcp
          npm run test:pullmcp-deployer
          npm run test:backend-api-auth

      - name: Verify Phase 6C.0A audit contracts
        run: npm run test:phase-6c0a-audit

      - name: Verify backend foundation
        run: npm --prefix apps/backend run verify

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend with validated runtime config
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:3001
          BACKEND_API_TOKEN: 0123456789abcdef0123456789abcdef
          MCP_LEGACY_ACTOR_ID: service:ci:mcp-v1
          SUPABASE_URL: https://project.example.com
          SUPABASE_ANON_KEY: ci-publishable-key
        run: npm run build
