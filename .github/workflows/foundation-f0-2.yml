name: Foundation F0.2

on:
  pull_request:
    paths-ignore:
      - ".github/provider-retirement/**"
  push:
    branches:
      - main
      - f0-2-installation-context-config

permissions:
  contents: read

jobs:
  provider-retirement-staging:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/remove-supabase-runtime'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full Foundation workflow is restored by the provider-retirement payload."
