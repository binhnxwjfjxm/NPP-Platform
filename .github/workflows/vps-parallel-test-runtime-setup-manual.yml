name: VPS parallel test runtime setup

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-parallel-test-runtime-958
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/prepare-vps-parallel-test-958' &&
        (
          github.actor == 'binhnxwjfjxm' ||
          github.actor == 'khuongbinhinfo-a11y'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_COMPANY_HOST: ${{ vars.VPS_COMPANY_HOST }}
      VPS_MCP_HOST: ${{ vars.VPS_MCP_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
      COMPANY_TEST_HTTPS_PORT: '3443'
      COMPANY_TEST_HTTPS_NAME: 'npp958-company.test'
      COMPANY_TEST_EDGE_PORT: '443'

    steps:
      - name: Validate exact issue command
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/prepare-vps-parallel-test-958'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare runtime paths
        shell: bash
        run: |
          set -euo pipefail
          echo "REPORT_FILE=$RUNNER_TEMP/vps-parallel-test-958.out" >> "$GITHUB_ENV"
          echo "CORE_CONFIG_FILE=$RUNNER_TEMP/heroku-company-config.json" >> "$GITHUB_ENV"
          echo "MCP_CONFIG_FILE=$RUNNER_TEMP/heroku-mcp-config.json" >> "$GITHUB_ENV"
          echo "COMPANY_DB_PASSWORD_FILE=$RUNNER_TEMP/company-db-password" >> "$GITHUB_ENV"
          echo "MCP_DB_PASSWORD_FILE=$RUNNER_TEMP/mcp-db-password" >> "$GITHUB_ENV"
          echo "COMPANY_ENV_FILE=$RUNNER_TEMP/company.env" >> "$GITHUB_ENV"
          echo "MCP_ENV_FILE=$RUNNER_TEMP/mcp.env" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/vps-parallel-test-958.out"

      - name: Prepare SSH credentials
        id: ssh
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
          VPS_COMPANY_SSH_KEY: ${{ secrets.VPS_COMPANY_SSH_KEY }}
          VPS_MCP_SSH_KEY: ${{ secrets.VPS_MCP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_DB_HOST"
          test -n "$VPS_COMPANY_HOST"
          test -n "$VPS_MCP_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"
          test -n "$VPS_COMPANY_SSH_KEY"
          test -n "$VPS_MCP_SSH_KEY"

          umask 077
          prepare_key() {
            local raw="$1" host="$2" key="$3" known="$4"
            printf '%s\n' "$raw" > "$key"
            chmod 600 "$key"
            ssh-keygen -y -f "$key" >/dev/null
            ssh-keyscan -T 10 -H "$host" > "$known" 2>/dev/null
            test -s "$known"
            chmod 600 "$known"
          }

          prepare_key "$VPS_DB_SSH_KEY" "$VPS_DB_HOST" "$RUNNER_TEMP/vps-db.key" "$RUNNER_TEMP/vps-db-known-hosts"
          prepare_key "$VPS_COMPANY_SSH_KEY" "$VPS_COMPANY_HOST" "$RUNNER_TEMP/vps-company.key" "$RUNNER_TEMP/vps-company-known-hosts"
          prepare_key "$VPS_MCP_SSH_KEY" "$VPS_MCP_HOST" "$RUNNER_TEMP/vps-mcp.key" "$RUNNER_TEMP/vps-mcp-known-hosts"

          echo "db_key=$RUNNER_TEMP/vps-db.key" >> "$GITHUB_OUTPUT"
          echo "db_known=$RUNNER_TEMP/vps-db-known-hosts" >> "$GITHUB_OUTPUT"
          echo "company_key=$RUNNER_TEMP/vps-company.key" >> "$GITHUB_OUTPUT"
          echo "company_known=$RUNNER_TEMP/vps-company-known-hosts" >> "$GITHUB_OUTPUT"
          echo "mcp_key=$RUNNER_TEMP/vps-mcp.key" >> "$GITHUB_OUTPUT"
          echo "mcp_known=$RUNNER_TEMP/vps-mcp-known-hosts" >> "$GITHUB_OUTPUT"

      - name: Resolve backend network addresses
        id: network
        shell: bash
        run: |
          set -euo pipefail

          private_ip() {
            local key="$1" known="$2" host="$3"
            ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              "$VPS_SSH_USER@$host" \
              "ip -4 route get 1.1.1.1 | awk 'NR==1 {for(i=1;i<=NF;i++) if(\$i==\"src\") {print \$(i+1); exit}}'"
          }

          db_private_ip="$(private_ip "$RUNNER_TEMP/vps-db.key" "$RUNNER_TEMP/vps-db-known-hosts" "$VPS_DB_HOST")"
          company_private_ip="$(private_ip "$RUNNER_TEMP/vps-company.key" "$RUNNER_TEMP/vps-company-known-hosts" "$VPS_COMPANY_HOST")"
          mcp_private_ip="$(private_ip "$RUNNER_TEMP/vps-mcp.key" "$RUNNER_TEMP/vps-mcp-known-hosts" "$VPS_MCP_HOST")"

          python3 - "$db_private_ip" "$company_private_ip" "$mcp_private_ip" <<'PY'
          import ipaddress, sys
          db_ip, company_ip, mcp_ip = [ipaddress.IPv4Address(value) for value in sys.argv[1:]]
          if not all(ip.is_private for ip in (db_ip, company_ip, mcp_ip)):
              raise SystemExit('non_private_vps_address')
          if len({db_ip, company_ip, mcp_ip}) != 3:
              raise SystemExit('duplicate_private_vps_address')
          db_subnet = ipaddress.ip_network(f'{db_ip}/24', strict=False)
          if company_ip not in db_subnet:
              raise SystemExit('company_and_db_not_same_private_subnet')
          PY

          echo "db_private_ip=$db_private_ip" >> "$GITHUB_OUTPUT"
          echo "company_private_ip=$company_private_ip" >> "$GITHUB_OUTPUT"
          echo "mcp_private_ip=$mcp_private_ip" >> "$GITHUB_OUTPUT"

      - name: Fail closed if DB is broadly publicly reachable before setup
        shell: bash
        run: |
          set -euo pipefail
          if timeout 4 bash -c "cat < /dev/null > /dev/tcp/$VPS_DB_HOST/5432" 2>/dev/null; then
            echo "DB TCP 5432 is broadly publicly reachable before parallel-test setup." >&2
            exit 1
          fi

      - name: Capture Heroku runtime config privately
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$HEROKU_API_KEY"
          umask 077
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            'https://api.heroku.com/apps/hung-phat/config-vars' > "$CORE_CONFIG_FILE"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            'https://api.heroku.com/apps/hung-phat-mcp/config-vars' > "$MCP_CONFIG_FILE"

          jq -e '
            has("DATABASE_URL") and has("INSTALLATION_ID") and has("BACKEND_API_TOKEN") and
            has("CORE_BOOTSTRAP_ACTOR_ID") and has("CORS_ORIGINS")
          ' "$CORE_CONFIG_FILE" >/dev/null
          jq -e '
            has("DATABASE_URL") and has("INSTALLATION_ID") and has("BACKEND_API_TOKEN") and
            has("NPP_CODE") and has("MCP_LEGACY_ACTOR_ID") and has("CORS_ORIGINS") and
            has("MCP_DB_SCHEMA") and has("MCP_DB_ROLE") and has("PERSISTENCE_PROVIDER")
          ' "$MCP_CONFIG_FILE" >/dev/null

      - name: Create test-only DB roles and allowlisted backend network access
        shell: bash
        env:
          DB_KEY: ${{ steps.ssh.outputs.db_key }}
          DB_KNOWN: ${{ steps.ssh.outputs.db_known }}
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
          COMPANY_PRIVATE_IP: ${{ steps.network.outputs.company_private_ip }}
          MCP_PRIVATE_IP: ${{ steps.network.outputs.mcp_private_ip }}
        run: |
          set -euo pipefail
          umask 077
          company_password="$(openssl rand -hex 24)"
          mcp_password="$(openssl rand -hex 24)"
          printf '%s' "$company_password" > "$COMPANY_DB_PASSWORD_FILE"
          printf '%s' "$mcp_password" > "$MCP_DB_PASSWORD_FILE"
          echo "::add-mask::$company_password"
          echo "::add-mask::$mcp_password"

          sql="$RUNNER_TEMP/npp958-parallel-test-roles.sql"
          cat > "$sql" <<SQL
          \\set ON_ERROR_STOP on
          SELECT 'CREATE ROLE npp_company_test_runtime LOGIN' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'npp_company_test_runtime') \\gexec
          SELECT 'CREATE ROLE mcp_test_runtime LOGIN' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mcp_test_runtime') \\gexec
          ALTER ROLE npp_company_test_runtime LOGIN PASSWORD '$company_password';
          ALTER ROLE mcp_test_runtime LOGIN PASSWORD '$mcp_password';
          GRANT CONNECT ON DATABASE npp_rehearsal_958 TO npp_company_test_runtime, mcp_test_runtime;
          \\connect npp_rehearsal_958
          DO \$npp_company\$
          DECLARE s text;
          BEGIN
            FOR s IN
              SELECT nspname
              FROM pg_namespace
              WHERE nspname = ANY (ARRAY['shared','sales','purchasing','inventory','logistics','accounting','reporting'])
            LOOP
              EXECUTE format('GRANT USAGE ON SCHEMA %I TO npp_company_test_runtime', s);
              EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO npp_company_test_runtime', s);
              EXECUTE format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA %I TO npp_company_test_runtime', s);
              EXECUTE format('GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA %I TO npp_company_test_runtime', s);
            END LOOP;
          END
          \$npp_company\$;
          DO \$npp_mcp\$
          BEGIN
            IF to_regprocedure('shared.grant_mcp_runtime_access(name)') IS NULL THEN
              RAISE EXCEPTION 'missing_grant_mcp_runtime_access';
            END IF;
          END
          \$npp_mcp\$;
          SELECT shared.grant_mcp_runtime_access('mcp_test_runtime'::name);
          ALTER ROLE mcp_test_runtime SET search_path TO mcp, public;
          SQL
          chmod 600 "$sql"

          ssh -i "$DB_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DB_KNOWN" \
            "$VPS_SSH_USER@$VPS_DB_HOST" 'sudo -n rm -f /tmp/npp958-parallel-test-roles.sql'
          scp -i "$DB_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DB_KNOWN" \
            "$sql" "$VPS_SSH_USER@$VPS_DB_HOST:/tmp/npp958-parallel-test-roles.sql"

          ssh -i "$DB_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DB_KNOWN" \
            "$VPS_SSH_USER@$VPS_DB_HOST" \
            "bash -s -- '$DB_PRIVATE_IP' '$COMPANY_PRIVATE_IP' '$MCP_PRIVATE_IP' '$VPS_COMPANY_HOST' '$VPS_MCP_HOST'" >> "$REPORT_FILE" <<'REMOTE'
          set -euo pipefail
          db_private_ip="$1"
          company_private_ip="$2"
          mcp_private_ip="$3"
          company_public_ip="$4"
          mcp_public_ip="$5"
          sudo -n true

          cleanup_sql() {
            sudo -n rm -f /tmp/npp958-parallel-test-roles.sql
          }
          trap cleanup_sql EXIT
          test "$(systemctl is-active postgresql)" = active
          test -f /tmp/npp958-parallel-test-roles.sql
          sudo -n chown postgres:postgres /tmp/npp958-parallel-test-roles.sql
          sudo -n chmod 600 /tmp/npp958-parallel-test-roles.sql
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 postgres -f /tmp/npp958-parallel-test-roles.sql >/dev/null
          cleanup_sql
          trap - EXIT

          test "$(sudo -n -u postgres psql -Atqc 'show ssl')" = on
          hba="$(sudo -n -u postgres psql -Atqc 'show hba_file')"
          test -n "$hba"
          temp="$(mktemp)"
          sudo -n awk '
            /^# BEGIN NPP958 PARALLEL TEST$/ {skip=1; next}
            /^# END NPP958 PARALLEL TEST$/ {skip=0; next}
            !skip {print}
          ' "$hba" > "$temp"
          cat >> "$temp" <<EOF
          # BEGIN NPP958 PARALLEL TEST
          hostssl npp_rehearsal_958 npp_company_test_runtime ${company_private_ip}/32 scram-sha-256
          hostssl npp_rehearsal_958 mcp_test_runtime ${mcp_public_ip}/32 scram-sha-256
          # END NPP958 PARALLEL TEST
          EOF
          sudo -n install -o postgres -g postgres -m 0640 "$temp" "$hba"
          rm -f "$temp"

          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -v db_private_ip="$db_private_ip" postgres <<'SQL'
          SELECT format('ALTER SYSTEM SET listen_addresses = %L', '127.0.0.1,::1,' || :'db_private_ip') \gexec
          ALTER SYSTEM SET password_encryption = 'scram-sha-256';
          SQL

          sudo -n ufw default deny incoming >/dev/null
          sudo -n ufw default allow outgoing >/dev/null
          sudo -n ufw allow 22/tcp >/dev/null
          sudo -n ufw --force delete allow from "$company_public_ip" to any port 5432 proto tcp >/dev/null 2>&1 || true
          sudo -n ufw --force delete allow from "$mcp_public_ip" to any port 5432 proto tcp >/dev/null 2>&1 || true
          sudo -n ufw --force delete allow from "$company_private_ip" to any port 5432 proto tcp >/dev/null 2>&1 || true
          sudo -n ufw --force delete allow from "$mcp_private_ip" to any port 5432 proto tcp >/dev/null 2>&1 || true
          sudo -n ufw allow from "$company_private_ip" to any port 5432 proto tcp comment 'NPP958 company test DB private' >/dev/null
          sudo -n ufw allow from "$mcp_public_ip" to any port 5432 proto tcp comment 'NPP958 MCP test DB public allowlist' >/dev/null
          sudo -n ufw --force enable >/dev/null

          if sudo -n ufw status | grep -Eq '^5432(/tcp)?[[:space:]]+ALLOW([[:space:]]+IN)?[[:space:]]+Anywhere'; then
            echo broad_public_5432_rule_detected >&2
            exit 31
          fi
          if sudo -n ufw status | grep -Fq "$company_public_ip"; then
            echo company_public_5432_rule_still_present >&2
            exit 32
          fi
          sudo -n ufw status | grep -F "$mcp_public_ip" | grep -Fq '5432'

          sudo -n systemctl restart postgresql
          expected_listen="127.0.0.1,::1,$db_private_ip"
          test "$(systemctl is-active postgresql)" = active
          test "$(sudo -n -u postgres psql -Atqc 'show ssl')" = on
          test "$(sudo -n -u postgres psql -Atqc 'show listen_addresses')" = "$expected_listen"
          hba_errors="$(sudo -n -u postgres psql -Atqc 'select count(*) from pg_hba_file_rules where error is not null')"
          test "$hba_errors" = 0
          sudo -n -u postgres psql -Atqc "select 1 from pg_database where datname='npp_rehearsal_958'" | grep -qx 1
          ss -lntH | awk -v ip="$db_private_ip" '$4 == ip ":5432" {found=1} END {exit found?0:1}'

          echo 'db_database=npp_rehearsal_958'
          echo 'db_ssl=on'
          echo 'db_network=company_private_plus_mcp_public_allowlist'
          echo 'db_listen=loopback_plus_private_ip'
          echo 'db_company_role=npp_company_test_runtime'
          echo 'db_mcp_role=mcp_test_runtime'
          echo 'db_hba_sources=company_private_ip,mcp_public_ip'
          echo 'db_public_5432=restricted_to_mcp_public_ip'
          REMOTE

      - name: Verify DB remains blocked from unrelated public runner
        shell: bash
        run: |
          set -euo pipefail
          if timeout 4 bash -c "cat < /dev/null > /dev/tcp/$VPS_DB_HOST/5432" 2>/dev/null; then
            echo "DB TCP 5432 became reachable from an unrelated public runner." >&2
            exit 1
          fi
          echo 'runner_public_5432=blocked' >> "$REPORT_FILE"

      - name: Build test-only VPS environment files
        shell: bash
        env:
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
        run: |
          set -euo pipefail
          company_password="$(cat "$COMPANY_DB_PASSWORD_FILE")"
          mcp_password="$(cat "$MCP_DB_PASSWORD_FILE")"
          company_test_base_url="https://${COMPANY_TEST_HTTPS_NAME}:${COMPANY_TEST_HTTPS_PORT}"
          echo "::add-mask::$company_password"
          echo "::add-mask::$mcp_password"

          COMPANY_DB_PASSWORD="$company_password" MCP_DB_PASSWORD="$mcp_password" DB_PRIVATE_IP="$DB_PRIVATE_IP" DB_PUBLIC_IP="$VPS_DB_HOST" COMPANY_TEST_BASE_URL="$company_test_base_url" \
          node <<'NODE'
          const fs = require('node:fs');
          const core = JSON.parse(fs.readFileSync(process.env.CORE_CONFIG_FILE, 'utf8'));
          const mcp = JSON.parse(fs.readFileSync(process.env.MCP_CONFIG_FILE, 'utf8'));

          function envText(values) {
            return Object.keys(values).sort().map((key) => {
              const value = String(values[key] ?? '');
              if (!/^[A-Z_][A-Z0-9_]*$/.test(key)) throw new Error(`invalid_env_name:${key}`);
              if (/\r|\n/.test(value)) throw new Error(`multiline_env_value:${key}`);
              const escaped = value.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
              return `${key}="${escaped}"`;
            }).join('\n') + '\n';
          }

          delete core.DATABASE_URL;
          delete core.DATABASE_SSL_MODE;
          delete core.HOST;
          delete core.PORT;
          Object.assign(core, {
            NODE_ENV: 'production',
            HOST: '127.0.0.1',
            PORT: '3104',
            DATABASE_URL: `postgresql://npp_company_test_runtime:${process.env.COMPANY_DB_PASSWORD}@${process.env.DB_PRIVATE_IP}:5432/npp_rehearsal_958`,
            DATABASE_SSL_MODE: 'require'
          });

          for (const key of ['DATABASE_URL','HOST','PORT','LEGACY_INTERNAL_PORT','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','MCP_MIGRATION_DATABASE_URL']) delete mcp[key];
          for (const key of ['CORE_SALES_API_TOKEN','CORE_SALES_DEFAULT_WAREHOUSE_ID','CORE_ONBOARDING_API_TOKEN']) {
            if (!String(mcp[key] ?? '').trim()) throw new Error(`missing_parallel_test_${key.toLowerCase()}`);
          }
          Object.assign(mcp, {
            NODE_ENV: 'production',
            HOST: '127.0.0.1',
            PORT: '3105',
            LEGACY_INTERNAL_PORT: '3106',
            PERSISTENCE_PROVIDER: 'postgresql',
            DATABASE_URL: `postgresql://mcp_test_runtime:${process.env.MCP_DB_PASSWORD}@${process.env.DB_PUBLIC_IP}:5432/npp_rehearsal_958`,
            MCP_DB_SCHEMA: 'mcp',
            MCP_DB_ROLE: 'mcp_test_runtime',
            MCP_LEGACY_RUNTIME_ENABLED: 'false',
            CORE_SALES_API_BASE_URL: process.env.COMPANY_TEST_BASE_URL,
            CORE_ONBOARDING_API_BASE_URL: process.env.COMPANY_TEST_BASE_URL,
            NODE_EXTRA_CA_CERTS: '/etc/npp/npp958-company-test-ca.pem'
          });

          fs.writeFileSync(process.env.COMPANY_ENV_FILE, envText(core), { mode: 0o600 });
          fs.writeFileSync(process.env.MCP_ENV_FILE, envText(mcp), { mode: 0o600 });
          NODE

          test -s "$COMPANY_ENV_FILE"
          test -s "$MCP_ENV_FILE"
          grep -q '^DATABASE_SSL_MODE="require"$' "$COMPANY_ENV_FILE"
          grep -q '^DATABASE_URL="postgresql://npp_company_test_runtime:' "$COMPANY_ENV_FILE"
          grep -q '^DATABASE_URL="postgresql://mcp_test_runtime:' "$MCP_ENV_FILE"
          grep -q "@${DB_PRIVATE_IP}:5432/npp_rehearsal_958\"$" "$COMPANY_ENV_FILE"
          grep -q "@${VPS_DB_HOST}:5432/npp_rehearsal_958\"$" "$MCP_ENV_FILE"
          grep -q '^MCP_DB_ROLE="mcp_test_runtime"$' "$MCP_ENV_FILE"
          grep -Fqx "CORE_SALES_API_BASE_URL=\"$company_test_base_url\"" "$MCP_ENV_FILE"
          grep -Fqx "CORE_ONBOARDING_API_BASE_URL=\"$company_test_base_url\"" "$MCP_ENV_FILE"
          grep -Fqx 'NODE_EXTRA_CA_CERTS="/etc/npp/npp958-company-test-ca.pem"' "$MCP_ENV_FILE"
          ! grep -Eq '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|MCP_MIGRATION_DATABASE_URL)=' "$MCP_ENV_FILE"

      - name: Install test runtime env on Công Ty VPS
        shell: bash
        env:
          COMPANY_KEY: ${{ steps.ssh.outputs.company_key }}
          COMPANY_KNOWN: ${{ steps.ssh.outputs.company_known }}
        run: |
          set -euo pipefail
          scp -i "$COMPANY_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$COMPANY_KNOWN" \
            "$COMPANY_ENV_FILE" "$VPS_SSH_USER@$VPS_COMPANY_HOST:/tmp/npp-company-parallel-test.env"
          ssh -i "$COMPANY_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$COMPANY_KNOWN" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo -n install -d -m 0755 /etc/npp
          sudo -n install -o root -g root -m 0600 /tmp/npp-company-parallel-test.env /etc/npp/company.env
          rm -f /tmp/npp-company-parallel-test.env
          sudo -n grep -q '^PORT="3104"$' /etc/npp/company.env
          REMOTE
          echo 'company_env=installed_test_only' >> "$REPORT_FILE"

      - name: Configure isolated Company HTTPS test endpoint for MCP
        shell: bash
        env:
          COMPANY_KEY: ${{ steps.ssh.outputs.company_key }}
          COMPANY_KNOWN: ${{ steps.ssh.outputs.company_known }}
          MCP_KEY: ${{ steps.ssh.outputs.mcp_key }}
          MCP_KNOWN: ${{ steps.ssh.outputs.mcp_known }}
        run: |
          set -euo pipefail
          company_public_ip="$(getent ahostsv4 "$VPS_COMPANY_HOST" | awk 'NR==1 {print $1}')"
          mcp_source_ip="$(getent ahostsv4 "$VPS_MCP_HOST" | awk 'NR==1 {print $1}')"
          [[ "$company_public_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$mcp_source_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ca_key="$RUNNER_TEMP/npp958-company-test-ca.key"
          ca_cert="$RUNNER_TEMP/npp958-company-test-ca.pem"
          server_key="$RUNNER_TEMP/npp958-company-test.key"
          server_csr="$RUNNER_TEMP/npp958-company-test.csr"
          server_cert="$RUNNER_TEMP/npp958-company-test.crt"
          ext_file="$RUNNER_TEMP/npp958-company-test.ext"
          printf 'subjectAltName=DNS:%s\nextendedKeyUsage=serverAuth\n' "$COMPANY_TEST_HTTPS_NAME" > "$ext_file"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -subj '/CN=NPP958 Parallel Test CA' -keyout "$ca_key" -out "$ca_cert" >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -subj "/CN=$COMPANY_TEST_HTTPS_NAME" -keyout "$server_key" -out "$server_csr" >/dev/null 2>&1
          openssl x509 -req -sha256 -days 2 -in "$server_csr" -CA "$ca_cert" -CAkey "$ca_key" -CAcreateserial \
            -out "$server_cert" -extfile "$ext_file" >/dev/null 2>&1

          scp -i "$COMPANY_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$COMPANY_KNOWN" \
            "$server_cert" "$VPS_SSH_USER@$VPS_COMPANY_HOST:/tmp/npp958-company-test.crt"
          scp -i "$COMPANY_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$COMPANY_KNOWN" \
            "$server_key" "$VPS_SSH_USER@$VPS_COMPANY_HOST:/tmp/npp958-company-test.key"
          ssh -i "$COMPANY_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$COMPANY_KNOWN" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" "bash -s -- '$COMPANY_TEST_HTTPS_PORT' '$COMPANY_TEST_EDGE_PORT' '$COMPANY_TEST_HTTPS_NAME' '$mcp_source_ip'" <<'REMOTE'
          set -euo pipefail
          test_port="$1"; edge_port="$2"; test_name="$3"; mcp_source_ip="$4"
          sudo -n true
          command -v nginx >/dev/null
          test "$(systemctl is-active nginx)" = active
          sudo -n install -d -m 0755 /etc/npp
          sudo -n install -o root -g root -m 0644 /tmp/npp958-company-test.crt /etc/npp/npp958-company-test.crt
          sudo -n install -o root -g root -m 0600 /tmp/npp958-company-test.key /etc/npp/npp958-company-test.key
          rm -f /tmp/npp958-company-test.crt /tmp/npp958-company-test.key
          conf="$(mktemp)"
          cat > "$conf" <<EOF
          server {
            listen ${test_port} ssl;
            listen [::]:${test_port} ssl;
            listen ${edge_port} ssl;
            listen [::]:${edge_port} ssl;
            server_name ${test_name};
            ssl_certificate /etc/npp/npp958-company-test.crt;
            ssl_certificate_key /etc/npp/npp958-company-test.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            allow ${mcp_source_ip};
            deny all;
            location / {
              proxy_pass http://127.0.0.1:3104;
              proxy_http_version 1.1;
              proxy_set_header Host \$host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            }
          }
          EOF
          sudo -n install -o root -g root -m 0644 "$conf" /etc/nginx/sites-available/npp958-company-test.conf
          rm -f "$conf"
          sudo -n ln -sfn /etc/nginx/sites-available/npp958-company-test.conf /etc/nginx/sites-enabled/npp958-company-test.conf
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          test "$(systemctl is-active nginx)" = active
          sudo -n ufw --force delete allow from "$mcp_source_ip" to any port "$test_port" proto tcp >/dev/null 2>&1 || true
          sudo -n ufw allow from "$mcp_source_ip" to any port "$test_port" proto tcp comment 'NPP958 MCP to Company HTTPS test' >/dev/null
          sudo -n ufw --force enable >/dev/null
          if sudo -n ufw status | grep -Eq "^${test_port}(/tcp)?[[:space:]]+ALLOW([[:space:]]+IN)?[[:space:]]+Anywhere"; then
            echo broad_public_company_test_https_rule_detected >&2
            exit 41
          fi
          sudo -n ufw status | grep -F "$mcp_source_ip" | grep -Fq "$test_port"
          ss -lntH | awk -v p="$test_port" '{n=split($4,a,":"); if (a[n]+0==p) found=1} END {exit found?0:1}'
          ss -lntH | awk -v p="$edge_port" '{n=split($4,a,":"); if (a[n]+0==p) found=1} END {exit found?0:1}'
          REMOTE

          scp -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$ca_cert" "$VPS_SSH_USER@$VPS_MCP_HOST:/tmp/npp958-company-test-ca.pem"
          ssh -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" "bash -s -- '$company_public_ip' '$COMPANY_TEST_HTTPS_NAME' '$COMPANY_TEST_HTTPS_PORT' '$COMPANY_TEST_EDGE_PORT'" <<'REMOTE'
          set -euo pipefail
          company_public_ip="$1"; test_name="$2"; test_port="$3"; edge_port="$4"
          sudo -n true
          verify_proxy() {
            for svc in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
              test "$(systemctl is-active "$svc")" = active
              test "$(systemctl is-enabled "$svc")" = enabled
            done
            count="$(ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}')"
            test "$count" = 300
            ss -lntH | awk '{n=split($4,a,":"); if (a[n]+0==3000) found=1} END {exit found?0:1}'
          }
          verify_proxy
          sudo -n install -d -m 0755 /etc/npp
          sudo -n install -o root -g root -m 0644 /tmp/npp958-company-test-ca.pem /etc/npp/npp958-company-test-ca.pem
          rm -f /tmp/npp958-company-test-ca.pem

          hosts_tmp="$(mktemp)"
          sudo -n awk '!/# NPP958 COMPANY TEST$/ {print}' /etc/hosts > "$hosts_tmp"
          printf '%s %s # NPP958 COMPANY TEST\n' "$company_public_ip" "$test_name" >> "$hosts_tmp"
          sudo -n install -o root -g root -m 0644 "$hosts_tmp" /etc/hosts
          rm -f "$hosts_tmp"
          getent ahostsv4 "$test_name" | awk 'NR==1 {print $1}' | grep -qx "$company_public_ip"

          sudo -n iptables -t nat -D OUTPUT -p tcp -d "$company_public_ip" --dport "$test_port" -j DNAT --to-destination "${company_public_ip}:${edge_port}" >/dev/null 2>&1 || true
          sudo -n iptables -t nat -A OUTPUT -p tcp -d "$company_public_ip" --dport "$test_port" -j DNAT --to-destination "${company_public_ip}:${edge_port}"
          sudo -n iptables -t nat -C OUTPUT -p tcp -d "$company_public_ip" --dport "$test_port" -j DNAT --to-destination "${company_public_ip}:${edge_port}"

          curl --fail --silent --show-error --cacert /etc/npp/npp958-company-test-ca.pem \
            --connect-timeout 5 --max-time 15 "https://${test_name}:${test_port}/health/live" >/dev/null
          verify_proxy
          REMOTE
          {
            echo 'company_test_https_from_mcp=PASS'
            echo 'company_test_https_scope=mcp_public_ip_only'
            echo 'company_test_https_transport=provider_443_via_test_only_mcp_dnat'
            echo 'mcp_core_sales_target=company_vps_test_https'
            echo 'mcp_core_onboarding_target=company_vps_test_https'
          } >> "$REPORT_FILE"

      - name: Install test runtime env on MCP VPS without touching proxy
        shell: bash
        env:
          MCP_KEY: ${{ steps.ssh.outputs.mcp_key }}
          MCP_KNOWN: ${{ steps.ssh.outputs.mcp_known }}
        run: |
          set -euo pipefail
          scp -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$MCP_ENV_FILE" "$VPS_SSH_USER@$VPS_MCP_HOST:/tmp/npp-mcp-parallel-test.env"
          ssh -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          verify_proxy() {
            for svc in ipv4-proxy ipv6-proxy oci-ipv6-pool; do
              test "$(systemctl is-active "$svc")" = active
              test "$(systemctl is-enabled "$svc")" = enabled
            done
            count="$(ss -lntH | awk '{n=split($4,a,":"); p=a[n]+0; if (p>=3128 && p<=3427) c++} END {print c+0}')"
            test "$count" = 300
            ss -lntH | awk '{n=split($4,a,":"); if (a[n]+0==3000) found=1} END {exit found?0:1}'
          }
          verify_proxy
          sudo -n install -d -m 0755 /etc/npp
          sudo -n test -r /etc/npp/npp958-company-test-ca.pem
          sudo -n install -o root -g root -m 0600 /tmp/npp-mcp-parallel-test.env /etc/npp/mcp.env
          rm -f /tmp/npp-mcp-parallel-test.env
          sudo -n grep -q '^PORT="3105"$' /etc/npp/mcp.env
          sudo -n grep -q '^NODE_EXTRA_CA_CERTS="/etc/npp/npp958-company-test-ca.pem"$' /etc/npp/mcp.env
          verify_proxy
          REMOTE
          {
            echo 'mcp_env=installed_test_only'
            echo 'proxy_services=active_enabled_untouched'
            echo 'proxy_listener_count=300'
            echo 'tcp_3000_listener=preserved'
          } >> "$REPORT_FILE"

      - name: Verify allowlisted DB TCP from both backend VPS hosts
        shell: bash
        env:
          COMPANY_KEY: ${{ steps.ssh.outputs.company_key }}
          COMPANY_KNOWN: ${{ steps.ssh.outputs.company_known }}
          MCP_KEY: ${{ steps.ssh.outputs.mcp_key }}
          MCP_KNOWN: ${{ steps.ssh.outputs.mcp_known }}
          DB_PRIVATE_IP: ${{ steps.network.outputs.db_private_ip }}
        run: |
          set -euo pipefail
          ssh -i "$COMPANY_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$COMPANY_KNOWN" \
            "$VPS_SSH_USER@$VPS_COMPANY_HOST" \
            "ip -4 route get '$DB_PRIVATE_IP' | grep -F '$DB_PRIVATE_IP' >/dev/null && timeout 6 bash -c 'cat < /dev/null > /dev/tcp/$DB_PRIVATE_IP/5432'"

          ssh -i "$MCP_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MCP_KNOWN" \
            "$VPS_SSH_USER@$VPS_MCP_HOST" \
            "ip -4 route get '$VPS_DB_HOST' | grep -F '$VPS_DB_HOST' >/dev/null && timeout 6 bash -c 'cat < /dev/null > /dev/tcp/$VPS_DB_HOST/5432'"

          echo 'company_to_db_private_tcp=PASS' >> "$REPORT_FILE"
          echo 'mcp_to_db_public_allowlist_tcp=PASS' >> "$REPORT_FILE"
          echo 'production_traffic=not_enabled' >> "$REPORT_FILE"
          echo 'cutover=not_performed' >> "$REPORT_FILE"

      - name: Publish sanitized parallel-test setup evidence to Issue 958
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -f "$REPORT_FILE"
          evidence="$(mktemp)"
          {
            echo '## VPS parallel backend test runtime setup'
            echo
            echo "- Source main SHA: \`$SOURCE_SHA\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo '- Scope: rehearsal DB over allowlisted backend paths + isolated MCP-to-Công Ty HTTPS test endpoint; no Vercel/Heroku production endpoint change and no cutover.'
            echo '- No secret values are included below.'
            echo '```text'
            cat "$REPORT_FILE"
            echo '```'
          } > "$evidence"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/958/comments" \
            -f body="$(cat "$evidence")" >/dev/null
          rm -f "$evidence"