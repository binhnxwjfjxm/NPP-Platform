name: Audit missing sales order 2026-09-11

on:
  push:
    branches:
      - agent/audit-missing-sales-order-20260911
    paths:
      - '.github/workflows/audit-missing-sales-order-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORE_APP_NAME: hung-phat
      ORDER_ID: d45487fa-a62f-4c66-ad10-0684150b51fe
    steps:
      - name: Read production database config safely
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$HEROKU_API_KEY"
          core_config_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$CORE_APP_NAME/config-vars")"
          database_url="$(jq -r '.DATABASE_URL // empty' <<<"$core_config_json")"
          test -n "$database_url"
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Audit target aggregate and all versions
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --set order_id="$ORDER_ID" \
            --csv <<'SQL' | tee order-audit.csv
          SELECT
            so.id,
            so.order_number,
            so.status,
            so.current_version_number,
            so.customer_id,
            c.code AS current_customer_code,
            c.name AS current_customer_name,
            so.warehouse_id,
            w.code AS current_warehouse_code,
            w.name AS current_warehouse_name,
            so.fulfillment_status,
            so.delivery_status,
            so.settlement_status,
            so.created_at,
            so.updated_at,
            so.confirmed_at,
            so.created_by,
            so.updated_by
          FROM sales.sales_orders so
          JOIN shared.customers c
            ON c.installation_id = so.installation_id AND c.id = so.customer_id
          JOIN shared.warehouses w
            ON w.installation_id = so.installation_id AND w.id = so.warehouse_id
          WHERE so.id = :'order_id'::uuid;
          SQL

          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --set order_id="$ORDER_ID" \
            --csv <<'SQL' | tee version-history-enriched.csv
          SELECT
            sov.version_number,
            sov.version_status,
            sov.customer_id,
            sov.customer_code_snapshot,
            sov.customer_name_snapshot,
            sov.warehouse_code_snapshot,
            sov.warehouse_name_snapshot,
            sov.amendment_reason,
            sov.total,
            count(l.id) AS line_count,
            COALESCE(sum(l.line_weight_kg), 0) AS weight_kg,
            md5(COALESCE(string_agg(
              concat_ws('|',
                l.line_number::text,
                l.sku_snapshot,
                l.ordered_quantity::text,
                l.unit_code_snapshot,
                l.unit_price::text,
                l.line_total::text
              ), '||' ORDER BY l.line_number
            ), '')) AS line_signature,
            sov.created_at,
            sov.updated_at,
            sov.confirmed_at,
            sov.created_by,
            sov.updated_by
          FROM sales.sales_order_versions sov
          LEFT JOIN sales.sales_order_version_lines l
            ON l.installation_id = sov.installation_id
           AND l.sales_order_version_id = sov.id
          WHERE sov.sales_order_id = :'order_id'::uuid
          GROUP BY sov.id
          ORDER BY sov.version_number;
          SQL

      - name: Find whether version 7 was copied from another order
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --set order_id="$ORDER_ID" \
            --csv <<'SQL' | tee collision-audit.csv
          WITH target_version AS (
            SELECT sov.id, sov.installation_id, sov.customer_id, sov.customer_name_snapshot, sov.total
            FROM sales.sales_order_versions sov
            JOIN sales.sales_orders so
              ON so.installation_id=sov.installation_id
             AND so.id=sov.sales_order_id
             AND so.current_version_number=sov.version_number
            WHERE so.id = :'order_id'::uuid
          ),
          target_signature AS (
            SELECT
              tv.*,
              count(l.id) AS line_count,
              COALESCE(sum(l.line_weight_kg),0) AS weight_kg,
              md5(COALESCE(string_agg(
                concat_ws('|', l.line_number::text, l.sku_snapshot, l.ordered_quantity::text,
                  l.unit_code_snapshot, l.unit_price::text, l.line_total::text),
                '||' ORDER BY l.line_number
              ), '')) AS line_signature
            FROM target_version tv
            LEFT JOIN sales.sales_order_version_lines l
              ON l.installation_id=tv.installation_id
             AND l.sales_order_version_id=tv.id
            GROUP BY tv.id,tv.installation_id,tv.customer_id,tv.customer_name_snapshot,tv.total
          ),
          candidates AS (
            SELECT
              sov.id AS version_id,
              sov.sales_order_id,
              so.order_number,
              sov.version_number,
              sov.version_status,
              sov.customer_id,
              sov.customer_code_snapshot,
              sov.customer_name_snapshot,
              sov.total,
              count(l.id) AS line_count,
              COALESCE(sum(l.line_weight_kg),0) AS weight_kg,
              md5(COALESCE(string_agg(
                concat_ws('|', l.line_number::text, l.sku_snapshot, l.ordered_quantity::text,
                  l.unit_code_snapshot, l.unit_price::text, l.line_total::text),
                '||' ORDER BY l.line_number
              ), '')) AS line_signature,
              sov.created_at,
              sov.confirmed_at
            FROM sales.sales_order_versions sov
            JOIN sales.sales_orders so
              ON so.installation_id=sov.installation_id
             AND so.id=sov.sales_order_id
            LEFT JOIN sales.sales_order_version_lines l
              ON l.installation_id=sov.installation_id
             AND l.sales_order_version_id=sov.id
            WHERE sov.sales_order_id <> :'order_id'::uuid
            GROUP BY sov.id,so.order_number
          )
          SELECT
            c.sales_order_id,
            c.order_number,
            c.version_number,
            c.version_status,
            c.customer_code_snapshot,
            c.customer_name_snapshot,
            c.total,
            c.line_count,
            c.weight_kg,
            c.line_signature,
            ts.line_signature AS target_line_signature,
            (c.line_signature = ts.line_signature) AS exact_line_match,
            c.created_at,
            c.confirmed_at
          FROM candidates c
          CROSS JOIN target_signature ts
          WHERE c.line_signature = ts.line_signature
             OR (c.customer_name_snapshot = ts.customer_name_snapshot AND c.total = ts.total)
          ORDER BY exact_line_match DESC, c.created_at DESC;
          SQL

      - name: Compare every current order for the two customer identities
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --set order_id="$ORDER_ID" \
            --csv <<'SQL' | tee customer-orders-audit.csv
          WITH target_customers AS (
            SELECT DISTINCT customer_id
            FROM sales.sales_order_versions
            WHERE sales_order_id = :'order_id'::uuid
          )
          SELECT
            so.id,
            so.order_number,
            c.code AS current_customer_code,
            c.name AS current_customer_name,
            so.current_version_number,
            cv.total AS current_total,
            (SELECT count(*) FROM sales.sales_order_version_lines l
              WHERE l.installation_id=cv.installation_id AND l.sales_order_version_id=cv.id) AS current_line_count,
            (SELECT COALESCE(sum(l.line_weight_kg),0) FROM sales.sales_order_version_lines l
              WHERE l.installation_id=cv.installation_id AND l.sales_order_version_id=cv.id) AS current_weight_kg,
            so.status,
            so.created_at,
            so.updated_at,
            so.created_by,
            so.updated_by
          FROM sales.sales_orders so
          JOIN target_customers tc ON tc.customer_id=so.customer_id
          JOIN shared.customers c ON c.installation_id=so.installation_id AND c.id=so.customer_id
          JOIN sales.sales_order_versions cv
            ON cv.installation_id=so.installation_id
           AND cv.sales_order_id=so.id
           AND cv.version_number=so.current_version_number
          ORDER BY so.updated_at DESC, so.created_at DESC;
          SQL

      - name: Publish sanitized audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Missing sales order production audit'
            echo
            for file in order-audit.csv version-history-enriched.csv collision-audit.csv customer-orders-audit.csv; do
              echo "### $file"
              if [ -f "$file" ]; then cat "$file"; else echo unavailable; fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-sales-order-audit-${{ github.run_id }}
          path: |
            order-audit.csv
            version-history-enriched.csv
            collision-audit.csv
            customer-orders-audit.csv
          if-no-files-found: ignore
          retention-days: 1
