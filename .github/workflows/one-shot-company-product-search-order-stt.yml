name: One-shot Company product search and order STT

# Triggered once through the contents API; the apply script removes this workflow from the final diff.
on:
  push:
    branches:
      - agent/company-product-search-order-stt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-product-search-order-stt
          fetch-depth: 0

      - name: Apply audited change set
        run: node .agent/apply-company-product-search-order-stt.mjs

      - name: Verify focused contracts
        run: |
          node --test npp-core/web/test/product-search-contract.test.js npp-core/web/test/company-product-order-stt.test.mjs
          node --test npp-core/api/test/company-product-search.test.js npp-core/api/test/retail-catalog-security-contract.test.js npp-core/api/test/sales-order-entry-pagination.test.js
          node --check npp-core/api/src/db/repositories/sales-order.js
          git diff --check

      - name: Commit audited change set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(company): ổn định STT và tìm hàng linh hoạt"
          git push origin HEAD:agent/company-product-search-order-stt
