name: Extract PR173 backend verify failure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/extract-pr173-backend-verify-failure.yml

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.ref == 'agent/mcp-supabase-write-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Extract exact failing TAP blocks
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '91499372200'
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          lines = [re.sub(r'^\d{4}-\d{2}-\d{2}T[^ ]+Z\s+', '', line) for line in raw]
          failures = []
          for index, line in enumerate(lines):
              if 'not ok ' not in line:
                  continue
              start = index
              while start > 0 and '# Subtest:' not in lines[start]:
                  start -= 1
              end = index + 1
              while end < len(lines) and '# Subtest:' not in lines[end] and not re.search(r'^\s*ok\s+\d+\s+-', lines[end]):
                  end += 1
              failures.append(lines[start:min(end, index + 90)])

          output = []
          seen = set()
          for block in failures:
              for line in block:
                  clean = re.sub(r'postgres(?:ql)?://\S+', '[redacted-database-url]', line, flags=re.I)
                  clean = re.sub(r'https?://\S+', '[redacted-url]', clean, flags=re.I)
                  clean = re.sub(r'(?i)(password|token|secret|authorization|api[_-]?key)[=:]\S+', r'\1=[redacted]', clean)
                  if len(clean) > 800:
                      clean = clean[:800] + '…[truncated]'
                  if clean not in seen:
                      seen.add(clean)
                      output.append(clean)
          print('\n'.join(output))
          print(f'FAILURE_COUNT={len(failures)}')
          PY
