name: Extract PR173 backend verify failure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/extract-pr173-backend-verify-failure.yml

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.ref == 'agent/mcp-supabase-write-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Extract exact failure lines
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '91499372200'
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          patterns = re.compile(
              r'(not ok|fail|error|exception|syntax|typeerror|referenceerror|ERR_|postgresql_function|legacy_provider|postgresql-legacy-provider|AssertionError|expected|actual|Process completed|exit code)',
              re.I,
          )
          selected = []
          for index, line in enumerate(lines):
              if patterns.search(line):
                  selected.extend(lines[max(0, index - 4):min(len(lines), index + 10)])
          selected.extend(lines[-140:])

          output = []
          seen = set()
          for line in selected:
              clean = re.sub(r'postgres(?:ql)?://\S+', '[redacted-database-url]', line, flags=re.I)
              clean = re.sub(r'https?://\S+', '[redacted-url]', clean, flags=re.I)
              clean = re.sub(r'(?i)(password|token|secret|authorization|api[_-]?key)[=:]\S+', r'\1=[redacted]', clean)
              clean = re.sub(r'[A-Za-z0-9_=-]{72,}', '[redacted]', clean)
              if clean not in seen:
                  seen.add(clean)
                  output.append(clean)
          print('\n'.join(output[-360:]))
          PY
