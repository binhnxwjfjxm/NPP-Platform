name: VPS price-list read-only inspection

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: vps-price-lists-readonly-inspection
  cancel-in-progress: false

jobs:
  inspect-price-lists:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/audit-vps-price-lists' &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y","gustavjung01"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_DB_HOST: ${{ vars.VPS_DB_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact source and trigger
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$COMMAND" = '/audit-vps-price-lists'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Prepare VPS DB SSH credential
        id: ssh
        shell: bash
        env:
          VPS_DB_SSH_KEY: ${{ secrets.VPS_DB_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_DB_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_DB_SSH_KEY"
          umask 077
          key="$RUNNER_TEMP/price-list-audit.key"
          printf '%s\n' "$VPS_DB_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          known_hosts="$RUNNER_TEMP/price-list-audit-hosts"
          ssh-keyscan -T 10 -H "$VPS_DB_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          chmod 600 "$known_hosts"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Read only names and state of unassigned channel price lists
        shell: bash
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        run: |
          set -euo pipefail
          echo "Source main SHA: $(git rev-parse HEAD)"
          echo "Only SELECT from production in a read-only transaction; no data mutation."
          ssh -i "$SSH_KEY" -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_SSH_USER@$VPS_DB_HOST" \
            'sudo -n -u postgres psql -X --csv -v ON_ERROR_STOP=1 -d npp_production' <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '30s';
          WITH unassigned AS (
            SELECT
              pl.id, pl.code, pl.name, pl.description,
              pl.is_active, pl.effective_from, pl.effective_to, pl.created_at, pl.updated_at,
              sc.code AS channel_code, sc.name AS channel_name, sc.is_active AS channel_active,
              COUNT(pi.id) AS active_item_count,
              COUNT(pi.id) FILTER (
                WHERE (pi.effective_from IS NULL OR pi.effective_from <= now())
                  AND (pi.effective_to IS NULL OR pi.effective_to > now())
              ) AS currently_effective_item_count
            FROM shared.price_lists pl
            JOIN shared.sales_channels sc
              ON sc.installation_id = pl.installation_id AND sc.id = pl.channel_id
            JOIN shared.price_list_items pi
              ON pi.installation_id = pl.installation_id AND pi.price_list_id = pl.id
            WHERE pl.list_type = 'CHANNEL'
              AND pl.is_active = true AND pi.is_active = true
              AND (pl.effective_from IS NULL OR pl.effective_from <= now())
              AND (pl.effective_to IS NULL OR pl.effective_to > now())
              AND NOT EXISTS (
                SELECT 1 FROM shared.sales_channel_customer_groups mapping
                WHERE mapping.installation_id = pl.installation_id
                  AND mapping.channel_id = pl.channel_id
              )
            GROUP BY pl.id, sc.id
          )
          SELECT
            code AS price_list_code,
            name AS price_list_name,
            channel_code, channel_name,
            is_active AS price_list_active,
            channel_active,
            active_item_count,
            currently_effective_item_count,
            CASE WHEN channel_active AND currently_effective_item_count > 0
                 THEN 'CAN_APPLY_IF_GROUP_ASSIGNED'
                 ELSE 'CHANNEL_INACTIVE_OR_NO_CURRENT_ITEMS'
            END AS state,
            COALESCE(LEFT(description, 120),'') AS description,
            created_at::date AS created_date,
            updated_at::date AS updated_date
          FROM unassigned
          ORDER BY price_list_code;
          COMMIT;
          SQL
