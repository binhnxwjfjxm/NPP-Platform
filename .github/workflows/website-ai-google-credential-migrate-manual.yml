name: Website AI Google credential alias migration

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: website-ai-google-credential-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 5 &&
      github.event.comment.body == '/migrate-website-ai-google-credential' &&
      contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_REF: main
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      VERCEL_PROJECT_NAME: nguyenlieuhungphat
    steps:
      - name: Validate exact issue command
        shell: bash
        env:
          COMMENT_BODY: '${{ github.event.comment.body }}'
        run: |
          set -euo pipefail
          test "$COMMENT_BODY" = '/migrate-website-ai-google-credential'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: '${{ env.DEPLOY_REF }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Migrate validated legacy credential alias
        shell: bash
        env:
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
          GH_TOKEN: '${{ github.token }}'
          SOURCE_SHA: '${{ steps.target.outputs.sha }}'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createSign } from 'node:crypto';

          const {
            VERCEL_TOKEN,
            VERCEL_ORG_ID,
            VERCEL_PROJECT_ID,
            VERCEL_PROJECT_NAME,
            GH_TOKEN,
            GITHUB_REPOSITORY,
            GITHUB_RUN_ID,
            SOURCE_SHA,
          } = process.env;

          function required(value, code) {
            if (!value) throw new Error(code);
            return value;
          }

          function safeCode(value) {
            return String(value || 'unknown_error')
              .replace(/[^A-Za-z0-9._:-]+/g, '_')
              .slice(0, 180);
          }

          async function postEvidence(status, code = '') {
            const lines = [
              `## Website AI Google credential alias migration — ${status}`,
              '',
              `GOOGLE_CREDENTIAL_MIGRATION=${status}`,
              `SOURCE_SHA=${SOURCE_SHA || ''}`,
              `GITHUB_RUN_ID=${GITHUB_RUN_ID || ''}`,
            ];
            if (code) lines.push(`ERROR_CODE=${safeCode(code)}`);
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/764/comments`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${GH_TOKEN}`,
                accept: 'application/vnd.github+json',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ body: lines.join('\n') }),
            });
            if (!response.ok) throw new Error(`github_evidence_failed_${response.status}`);
          }

          try {
            required(VERCEL_TOKEN, 'vercel_token_missing');
            required(GH_TOKEN, 'github_token_missing');
            if (VERCEL_PROJECT_NAME !== 'nguyenlieuhungphat') throw new Error('unexpected_vercel_project_name');

            const headers = {
              authorization: `Bearer ${VERCEL_TOKEN}`,
              'content-type': 'application/json',
            };

            async function jsonRequest(url, options = {}, label = 'provider') {
              const response = await fetch(url, options);
              const body = await response.json().catch(() => null);
              if (!response.ok) {
                const remoteCode = safeCode(body?.error?.code || body?.id || 'unknown');
                throw new Error(`${label}_${response.status}_${remoteCode}`);
              }
              return body;
            }

            const project = await jsonRequest(
              `https://api.vercel.com/v9/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}?teamId=${encodeURIComponent(VERCEL_ORG_ID)}`,
              { headers },
              'vercel_project_read_failed',
            );
            if (project?.id !== VERCEL_PROJECT_ID || project?.name !== VERCEL_PROJECT_NAME) {
              throw new Error('vercel_project_identity_mismatch');
            }
            if (project?.nodeVersion !== '24.x') throw new Error('website_node_runtime_not_24');

            async function productionEnv() {
              const url = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}/env`);
              url.searchParams.set('teamId', VERCEL_ORG_ID);
              url.searchParams.set('decrypt', 'true');
              url.searchParams.set('source', 'vercel-cli:pull');
              const body = await jsonRequest(url, { headers }, 'vercel_env_read_failed');
              const entries = Array.isArray(body) ? body : Array.isArray(body?.envs) ? body.envs : [];
              return entries.filter((entry) => {
                const targets = Array.isArray(entry?.target) ? entry.target : [entry?.target].filter(Boolean);
                return targets.includes('production') && !entry?.gitBranch;
              });
            }

            function valueFor(entries, key) {
              const matches = entries.filter((entry) => entry?.key === key);
              if (!matches.length) return '';
              const values = [...new Set(matches.map((entry) => typeof entry?.value === 'string' ? entry.value : ''))];
              if (values.length !== 1) throw new Error(`conflicting_vercel_env_${key}`);
              return values[0];
            }

            let envs = await productionEnv();
            const current = valueFor(envs, 'GOOGLE_SERVICE_ACCOUNT_JSON');
            const legacyA = valueFor(envs, 'DIALOGFLOW_SERVICE_ACCOUNT_JSON');
            const legacyB = valueFor(envs, 'DIALOGFLOW_CX_SERVICE_ACCOUNT_JSON');
            const legacyValues = [...new Set([legacyA, legacyB].filter(Boolean))];

            if (current && legacyValues.some((value) => value !== current)) {
              throw new Error('google_credential_alias_conflict');
            }
            if (!current && legacyValues.length > 1) throw new Error('google_credential_legacy_alias_conflict');

            const credentialRaw = current || legacyValues[0] || '';
            if (!credentialRaw) throw new Error('google_credential_not_found_in_vercel_aliases');
            console.log('::add-mask::' + credentialRaw);

            let credential;
            try {
              credential = JSON.parse(credentialRaw);
            } catch {
              throw new Error('google_service_account_json_invalid');
            }
            if (!credential?.client_email || !credential?.private_key || !credential?.project_id) {
              throw new Error('google_service_account_fields_missing');
            }

            function b64(value) {
              return Buffer.from(JSON.stringify(value)).toString('base64url');
            }
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${b64({ alg: 'RS256', typ: 'JWT' })}.${b64({
              iss: credential.client_email,
              scope: 'https://www.googleapis.com/auth/cloud-platform',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now - 30,
              exp: now + 3300,
            })}`;
            const signer = createSign('RSA-SHA256');
            signer.update(unsigned);
            signer.end();
            const assertion = `${unsigned}.${signer.sign(credential.private_key).toString('base64url')}`;
            const googleResponse = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion,
              }),
            });
            const googleBody = await googleResponse.json().catch(() => null);
            if (!googleResponse.ok || !googleBody?.access_token) {
              throw new Error(`google_service_account_probe_failed_${googleResponse.status}`);
            }

            if (!current) {
              const endpoint = new URL(`https://api.vercel.com/v10/projects/${encodeURIComponent(VERCEL_PROJECT_ID)}/env`);
              endpoint.searchParams.set('teamId', VERCEL_ORG_ID);
              endpoint.searchParams.set('upsert', 'true');
              await jsonRequest(endpoint, {
                method: 'POST',
                headers,
                body: JSON.stringify([{
                  key: 'GOOGLE_SERVICE_ACCOUNT_JSON',
                  value: credentialRaw,
                  type: 'encrypted',
                  target: ['production'],
                  comment: 'Canonical Website AI Google credential migrated from validated legacy alias',
                }]),
              }, 'vercel_google_credential_upsert_failed');
            }

            envs = await productionEnv();
            if (valueFor(envs, 'GOOGLE_SERVICE_ACCOUNT_JSON') !== credentialRaw) {
              throw new Error('vercel_google_credential_readback_failed');
            }

            await postEvidence('success');
            console.log('GOOGLE_CREDENTIAL_MIGRATION=success');
            console.log('GOOGLE_SERVICE_ACCOUNT_PROBE=success');
          } catch (error) {
            const code = safeCode(error instanceof Error ? error.message : 'unknown_error');
            await postEvidence('failure', code).catch(() => {});
            throw new Error(code);
          }
          NODE
