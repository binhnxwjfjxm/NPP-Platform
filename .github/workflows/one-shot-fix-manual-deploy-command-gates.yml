name: One-shot export patched Heroku workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fix-manual-deploy-command-gates.yml

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/fix-manual-deploy-command-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-manual-deploy-command-gates
          fetch-depth: 0

      - name: Export patched Heroku blob and base tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/heroku-mcp-backend-manual.yml')
          text = path.read_text(encoding='utf-8')
          old = "github.event.issue.number == 5 &&\n        contains(fromJSON('[\"binhnxwjfjxm\",\"khuongbinhinfo-a11y\"]'), github.actor)"
          new = "github.event.issue.number == 5 &&\n        github.event.comment.body == '/deploy-heroku-mcp-production' &&\n        contains(fromJSON('[\"binhnxwjfjxm\",\"khuongbinhinfo-a11y\"]'), github.actor)"
          if text.count(old) != 1:
              raise SystemExit(f'unexpected Heroku gate count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          echo "BASE_TREE_SHA=$(git rev-parse HEAD^{tree})"
          echo "PATCHED_HEROKU_BASE64_BEGIN"
          base64 -w0 .github/workflows/heroku-mcp-backend-manual.yml
          echo
          echo "PATCHED_HEROKU_BASE64_END"
