name: Align Issue 791 permission metadata

on:
  push:
    branches:
      - agent/company-sales-line-flat-ui
    paths:
      - .github/workflows/issue-791-permission-metadata-alignment.yml

permissions:
  contents: write

jobs:
  align-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_npp_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_npp_core
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_npp_core
      DATABASE_SSL_MODE: disable
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/company-sales-line-flat-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add forward permission metadata migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('database/migrations/shared/114_sales_order_permission_metadata.sql')
          if migration.exists():
              raise SystemExit('migration 114 already exists')
          migration.write_text("""-- Issue #791: forward-only alignment of Sales Order permission metadata.\n-- Do not rewrite migrations 037/040; installations may already have applied them.\n\nINSERT INTO shared.permission_catalog (\n  permission_key, module, label, description, is_system, created_at\n) VALUES\n  (\n    'core.sales-order.price.override',\n    'Bán hàng',\n    'Sửa giá bán trên đơn',\n    'Cho phép sửa trực tiếp đơn giá trên dòng hàng; hệ thống tự lưu lịch sử thay đổi.',\n    true,\n    now()\n  ),\n  (\n    'core.sales-order.discount.override',\n    'Bán hàng',\n    'Sửa chiết khấu bán hàng',\n    'Cho phép nhập chiết khấu theo từng dòng hoặc chiết khấu bổ sung toàn đơn theo đúng chính sách.',\n    true,\n    now()\n  )\nON CONFLICT (permission_key) DO UPDATE\nSET module = EXCLUDED.module,\n    label = EXCLUDED.label,\n    description = EXCLUDED.description,\n    is_system = EXCLUDED.is_system;\n""")

          index_path = Path('npp-core/api/src/migrations/index.js')
          index = index_path.read_text()
          const_anchor = "const AI_DIALOGFLOW_CX_REQUEST_BILLING_SQL = readFileSync(new URL('../../../../database/migrations/shared/113_ai_dialogflow_cx_request_billing.sql', import.meta.url), 'utf8');"
          const_line = const_anchor + "\nconst SALES_ORDER_PERMISSION_METADATA_SQL = readFileSync(new URL('../../../../database/migrations/shared/114_sales_order_permission_metadata.sql', import.meta.url), 'utf8');"
          if const_anchor not in index or 'SALES_ORDER_PERMISSION_METADATA_SQL' in index:
              raise SystemExit('unexpected migration registry const state')
          index = index.replace(const_anchor, const_line, 1)
          list_anchor = "  Object.freeze({ id: '113_ai_dialogflow_cx_request_billing', sql: AI_DIALOGFLOW_CX_REQUEST_BILLING_SQL }),"
          list_line = list_anchor + "\n  Object.freeze({ id: '114_sales_order_permission_metadata', sql: SALES_ORDER_PERMISSION_METADATA_SQL }),"
          if list_anchor not in index or "id: '114_sales_order_permission_metadata'" in index:
              raise SystemExit('unexpected migration registry list state')
          index_path.write_text(index.replace(list_anchor, list_line, 1))

          test_path = Path('npp-core/api/test/issue-791-permission-metadata-migration.test.js')
          test_path.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst migrationPath = new URL('../../../database/migrations/shared/114_sales_order_permission_metadata.sql', import.meta.url);\nconst registryPath = new URL('../src/migrations/index.js', import.meta.url);\nconst permissionsPath = new URL('../src/access/permissions-sales.js', import.meta.url);\n\ntest('Issue #791 keeps Sales Order permission metadata aligned through a forward migration', async () => {\n  const [migration, registry, permissions] = await Promise.all([\n    readFile(migrationPath, 'utf8'),\n    readFile(registryPath, 'utf8'),\n    readFile(permissionsPath, 'utf8'),\n  ]);\n\n  for (const value of [\n    'core.sales-order.price.override',\n    'Sửa giá bán trên đơn',\n    'Cho phép sửa trực tiếp đơn giá trên dòng hàng; hệ thống tự lưu lịch sử thay đổi.',\n    'core.sales-order.discount.override',\n    'Sửa chiết khấu bán hàng',\n    'Cho phép nhập chiết khấu theo từng dòng hoặc chiết khấu bổ sung toàn đơn theo đúng chính sách.',\n  ]) {\n    assert.match(migration, new RegExp(value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')));\n    assert.match(permissions, new RegExp(value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')));\n  }\n\n  assert.match(registry, /114_sales_order_permission_metadata/);\n  assert.match(registry, /114_sales_order_permission_metadata\\.sql/);\n});\n""")
          PY

      - name: Apply migrations
        run: npm --prefix npp-core/api run migration:migrate

      - name: Reapply migrations as no-op
        run: npm --prefix npp-core/api run migration:migrate

      - name: Verify migration contract
        run: npm --prefix npp-core/api run migration:verify

      - name: Verify Sales Order API
        run: npm --workspace npp-core-api run verify:sales-order

      - name: Check diff
        run: git diff --check

      - name: Commit alignment and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-791-permission-metadata-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrations/shared/114_sales_order_permission_metadata.sql npp-core/api/src/migrations/index.js npp-core/api/test/issue-791-permission-metadata-migration.test.js
          git commit -m "fix(company): đồng bộ metadata quyền giá và CK #791"
          git push origin HEAD:agent/company-sales-line-flat-ui
