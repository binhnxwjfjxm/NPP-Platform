name: Manual Vercel Admin production deploy

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-admin-production-manual
  cancel-in-progress: false

jobs:
  deploy-admin-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-admin-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      ADMIN_PROJECT_NAME: admin-mcp-npp
      ADMIN_ROOT_DIRECTORY: admin/web
      CORE_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      MCP_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      CORE_HEROKU_APP_NAME: hung-phat
      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com
      NPP_DOMAIN: office.nguyenlieuhungphat.com
      MCP_DOMAIN: mcp.nguyenlieuhungphat.com
      WEBSITE_DOMAIN: nguyenlieuhungphat.com
      NPP_OPERATIONS_URL: https://office.nguyenlieuhungphat.com
      DEPLOY_REF: main

    steps:
      - name: Validate Issue #5 trigger
        id: trigger
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: test "${COMMENT_BODY:-}" = '/deploy-vercel-admin-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Vercel credential
        id: provider
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"
          [[ "$VERCEL_TOKEN" =~ ^vcp_[A-Za-z0-9_-]+$ ]]

      - name: Create or resolve Admin Vercel project
        id: project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project_json="${RUNNER_TEMP}/admin-project.json"
          status="$(curl --silent --show-error --output "$project_json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$ADMIN_PROJECT_NAME?teamId=$VERCEL_ORG_ID")"
          if [ "$status" = 404 ]; then
            payload="$(node -e 'process.stdout.write(JSON.stringify({name:process.env.ADMIN_PROJECT_NAME,framework:"nextjs",rootDirectory:process.env.ADMIN_ROOT_DIRECTORY}))')"
            status="$(curl --silent --show-error --output "$project_json" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_ORG_ID" \
              --data "$payload")"
          fi
          case "$status" in
            200|201) ;;
            *)
              echo "::error::Vercel project resolution failed with HTTP $status" >&2
              cat "$project_json" >&2
              exit 1
              ;;
          esac
          project_id="$(PROJECT_FILE="$project_json" node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync(process.env.PROJECT_FILE,"utf8")); if(!p.id) process.exit(1); process.stdout.write(p.id)')"
          test "$project_id" != "$CORE_PROJECT_ID"
          test "$project_id" != "$MCP_PROJECT_ID"
          test "$project_id" != "$WEBSITE_PROJECT_ID"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Resolve protected Admin runtime values
        id: runtime
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          SECRET_CORE_API_INTERNAL_URL: ${{ secrets.CORE_API_INTERNAL_URL }}
          SECRET_CORE_API_SERVER_TOKEN: ${{ secrets.CORE_API_SERVER_TOKEN }}
          SECRET_CORE_WEB_ADMIN_USERNAME: ${{ secrets.CORE_WEB_ADMIN_USERNAME }}
          SECRET_CORE_WEB_ADMIN_PASSWORD: ${{ secrets.CORE_WEB_ADMIN_PASSWORD }}
        run: |
          set -uo pipefail

          core_url="${SECRET_CORE_API_INTERNAL_URL:-}"
          core_token="${SECRET_CORE_API_SERVER_TOKEN:-}"
          admin_username="${SECRET_CORE_WEB_ADMIN_USERNAME:-}"
          admin_password="${SECRET_CORE_WEB_ADMIN_PASSWORD:-}"
          runtime_source="github-secrets"

          if [ -z "$core_url" ] || [ -z "$core_token" ]; then
            runtime_source="heroku-core"
            if [ -n "${HEROKU_API_KEY:-}" ]; then
              app_json="$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.heroku+json; version=3' \
                -H "Authorization: Bearer $HEROKU_API_KEY" \
                "https://api.heroku.com/apps/$CORE_HEROKU_APP_NAME" 2>/dev/null || true)"
              config_json="$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.heroku+json; version=3' \
                -H "Authorization: Bearer $HEROKU_API_KEY" \
                "https://api.heroku.com/apps/$CORE_HEROKU_APP_NAME/config-vars" 2>/dev/null || true)"
              if [ -z "$core_url" ] && [ -n "$app_json" ]; then
                core_url="$(printf '%s' "$app_json" | jq -r '.web_url // empty' 2>/dev/null || true)"
                core_url="${core_url%/}"
              fi
              if [ -z "$core_token" ] && [ -n "$config_json" ]; then
                core_token="$(printf '%s' "$config_json" | jq -r '.BACKEND_API_TOKEN // empty' 2>/dev/null || true)"
              fi
            fi
          fi

          missing=()
          [ -n "$core_url" ] || missing+=(CORE_API_INTERNAL_URL)
          [ -n "$core_token" ] || missing+=(CORE_API_SERVER_TOKEN)
          [ -n "$admin_username" ] || missing+=(CORE_WEB_ADMIN_USERNAME)
          [ -n "$admin_password" ] || missing+=(CORE_WEB_ADMIN_PASSWORD)
          missing_csv="$(IFS=,; echo "${missing[*]}")"
          echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"
          echo "source=$runtime_source" >> "$GITHUB_OUTPUT"

          if [ -n "$missing_csv" ]; then
            echo "::error::Admin runtime values are missing: $missing_csv" >&2
            exit 1
          fi

          CORE_URL="$core_url" node --input-type=module <<'NODE'
          const url = new URL(process.env.CORE_URL);
          if (url.protocol !== 'https:' || url.username || url.password) {
            throw new Error('invalid_core_api_internal_url');
          }
          NODE

          for value in "$core_url" "$core_token" "$admin_username" "$admin_password"; do
            echo "::add-mask::$value"
          done

          write_env() {
            local name="$1" value="$2" marker
            marker="ADMIN_${name}_${RANDOM}_${RANDOM}"
            {
              echo "$name<<$marker"
              echo "$value"
              echo "$marker"
            } >> "$GITHUB_ENV"
          }
          write_env CORE_API_INTERNAL_URL "$core_url"
          write_env CORE_API_SERVER_TOKEN "$core_token"
          write_env CORE_WEB_ADMIN_USERNAME "$admin_username"
          write_env CORE_WEB_ADMIN_PASSWORD "$admin_password"

      - name: Synchronize Admin production environment
        id: envsync
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const values = {
            CORE_API_INTERNAL_URL: process.env.CORE_API_INTERNAL_URL,
            CORE_API_SERVER_TOKEN: process.env.CORE_API_SERVER_TOKEN,
            CORE_WEB_ADMIN_USERNAME: process.env.CORE_WEB_ADMIN_USERNAME,
            CORE_WEB_ADMIN_PASSWORD: process.env.CORE_WEB_ADMIN_PASSWORD,
            NPP_OPERATIONS_URL: process.env.NPP_OPERATIONS_URL,
          };
          const missing = Object.entries(values)
            .filter(([, value]) => !String(value || '').trim())
            .map(([key]) => key);
          if (missing.length) throw new Error(`missing_admin_environment_values:${missing.join(',')}`);
          const response = await fetch(`https://api.vercel.com/v10/projects/${process.env.ADMIN_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}&upsert=true`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(Object.entries(values).map(([key, value]) => ({
              key,
              value,
              type: 'sensitive',
              target: ['production'],
            }))),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok) {
            const code = payload?.error?.code || 'unknown';
            const message = payload?.error?.message || 'Vercel rejected the environment update';
            throw new Error(`admin_env_upsert_failed:${response.status}:${code}:${message}`);
          }
          NODE

      - name: Attach frontend domains to their projects
        id: domains
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          attach_domain() {
            local project_id="$1" domain="$2" lookup status body
            body="${RUNNER_TEMP}/domain-${domain//./-}.json"
            lookup="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$project_id/domains/$domain?teamId=$VERCEL_ORG_ID")"
            [ "$lookup" = 200 ] && return 0
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v10/projects/$project_id/domains?teamId=$VERCEL_ORG_ID" \
              --data "{\"name\":\"$domain\"}")"
            case "$status" in
              200|201) ;;
              *)
                echo "::error::Cannot attach $domain to $project_id (HTTP $status)" >&2
                cat "$body" >&2
                exit 1
                ;;
            esac
          }
          attach_domain "$WEBSITE_PROJECT_ID" "$WEBSITE_DOMAIN"
          attach_domain "$CORE_PROJECT_ID" "$NPP_DOMAIN"
          attach_domain "$MCP_PROJECT_ID" "$MCP_DOMAIN"
          attach_domain "$ADMIN_PROJECT_ID" "$ADMIN_DOMAIN"

      - name: Link and verify exact Admin project
        id: link
        shell: bash
        env:
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$ADMIN_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const linked = JSON.parse(await readFile('.vercel/project.json', 'utf8'));
          if (linked.projectId !== process.env.ADMIN_PROJECT_ID) throw new Error('unexpected_admin_project');
          if (linked.settings?.rootDirectory !== process.env.ADMIN_ROOT_DIRECTORY) {
            throw new Error(`unexpected_admin_root:${linked.settings?.rootDirectory}`);
          }
          const config = JSON.parse(await readFile('admin/web/vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('admin_auto_deploy_not_locked');
          NODE

      - name: Verify Admin source
        id: verify
        working-directory: admin/web
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: Build Admin production artifact
        id: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Admin production artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke exact Admin deployment
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          unauth="$(curl --silent --show-error --retry 5 --retry-delay 4 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          test "$unauth" = 401
          auth="${CORE_WEB_ADMIN_USERNAME}:${CORE_WEB_ADMIN_PASSWORD}"
          for path in / /customer-onboarding; do
            code="$(curl --silent --show-error --retry 5 --retry-delay 4 -u "$auth" --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path")"
            test "$code" = 200
          done
          html="$(curl --fail --silent --show-error -u "$auth" "$DEPLOYMENT_URL/")"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.(css|js)' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$DEPLOYMENT_URL$asset" >/dev/null

      - name: Read Admin domain state
        id: domainstate
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/admin-domain.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$ADMIN_PROJECT_ID/domains/$ADMIN_DOMAIN?teamId=$VERCEL_ORG_ID" > "$body"
          verified="$(DOMAIN_FILE="$body" node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync(process.env.DOMAIN_FILE,"utf8")); process.stdout.write(String(p.verified===true))')"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Report successful Admin rollout
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DOMAIN_VERIFIED: ${{ steps.domainstate.outputs.verified }}
          RUNTIME_SOURCE: ${{ steps.runtime.outputs.source }}
        run: |
          set -euo pipefail
          gh issue comment 5 --body "Admin Vercel production deploy succeeded for SHA ${{ steps.target.outputs.sha }}. Project: \`$PROJECT_ID\`. Deployment: $DEPLOYMENT_URL. Domain \`$ADMIN_DOMAIN\` verified: \`$DOMAIN_VERIFIED\`. Runtime source: \`$RUNTIME_SOURCE\`. Website, NPP and MCP domains were attached to their projects. \`log.nguyenlieuhungphat.com\` remains reserved until the Delivery frontend exists."

      - name: Report failed Admin rollout
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          RUNTIME_MISSING: ${{ steps.runtime.outputs.missing }}
          ENV_OUTCOME: ${{ steps.envsync.outcome }}
          DOMAIN_OUTCOME: ${{ steps.domains.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          report="$(mktemp)"
          {
            echo "## Admin Vercel production deploy failed"
            echo
            echo "- SHA: \`${TARGET_SHA:-unknown}\`"
            echo "- project: \`${PROJECT_OUTCOME:-not-run}\`"
            echo "- runtime: \`${RUNTIME_OUTCOME:-not-run}\`"
            echo "- environment: \`${ENV_OUTCOME:-not-run}\`"
            echo "- domains: \`${DOMAIN_OUTCOME:-not-run}\`"
            echo "- link: \`${LINK_OUTCOME:-not-run}\`"
            echo "- verify: \`${VERIFY_OUTCOME:-not-run}\`"
            echo "- build: \`${BUILD_OUTCOME:-not-run}\`"
            echo "- deploy: \`${DEPLOY_OUTCOME:-not-run}\`"
            echo "- smoke: \`${SMOKE_OUTCOME:-not-run}\`"
            if [ -n "${RUNTIME_MISSING:-}" ]; then
              echo "- missing runtime names: \`$RUNTIME_MISSING\`"
            fi
            echo
            echo "No secret values are included in this report."
          } > "$report"
          gh issue comment 5 --body-file "$report"
          rm -f "$report"
