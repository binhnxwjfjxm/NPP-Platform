name: Manual Vercel Admin production deploy

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-admin-production-manual
  cancel-in-progress: false

jobs:
  deploy-admin-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-admin-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_REF: main
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_0hp2A8WyUW4zgglShPTzL70hesVC
      ADMIN_PROJECT_NAME: admin-mcp-npp
      ADMIN_ROOT_DIRECTORY: admin/web
      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com
      ADMIN_ORIGIN: https://admin.nguyenlieuhungphat.com

    steps:
      - name: Validate exact Admin production command
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: test "${COMMENT_BODY:-}" = '/deploy-vercel-admin-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact Admin Vercel project
        id: project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"
          project_json="${RUNNER_TEMP}/admin-project.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > "$project_json"
          PROJECT_FILE="$project_json" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const project = JSON.parse(readFileSync(process.env.PROJECT_FILE, 'utf8'));
          if (project.id !== process.env.VERCEL_PROJECT_ID) throw new Error('unexpected_admin_project');
          if (project.name !== process.env.ADMIN_PROJECT_NAME) throw new Error(`unexpected_admin_name:${project.name}`);
          if (project.rootDirectory !== process.env.ADMIN_ROOT_DIRECTORY) throw new Error(`unexpected_admin_root:${project.rootDirectory}`);
          if (project.framework !== 'nextjs') throw new Error(`unexpected_admin_framework:${project.framework}`);
          NODE
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('admin/web/vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('admin_auto_deploy_not_locked');
          NODE

      - name: Verify existing Admin production environment contract
        id: envcheck
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          env_json="${RUNNER_TEMP}/admin-production-env.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" > "$env_json"
          ENV_FILE="$env_json" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync(process.env.ENV_FILE, 'utf8'));
          const envs = Array.isArray(payload.envs) ? payload.envs : [];
          const required = ['CORE_API_INTERNAL_URL', 'NPP_OPERATIONS_URL'];
          const missing = required.filter((key) => !envs.some((entry) => {
            if (entry?.key !== key) return false;
            const target = Array.isArray(entry.target) ? entry.target : [];
            return target.includes('production');
          }));
          if (missing.length) throw new Error(`missing_admin_production_environment:${missing.join(',')}`);
          NODE
          # Frontend-only deploy: preserve the provider binding already established
          # by the production cutover. This workflow must never resolve or rewrite
          # CORE_API_INTERNAL_URL from a legacy provider.
          echo "preserved=true" >> "$GITHUB_OUTPUT"

      - name: Link exact Admin project
        id: link
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@58.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          test "$(jq -r '.projectId' .vercel/project.json)" = "$VERCEL_PROJECT_ID"

      - name: Verify Admin source
        id: verify
        working-directory: admin/web
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: Build Admin production artifact
        id: build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.0.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Admin production artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@58.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke exact Admin deployment reachability
        id: deployment_smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          reachable=false
          last_status=""
          for attempt in $(seq 1 10); do
            last_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/login" || true)"
            case "$last_status" in
              200|301|302|303|307|308|401|403)
                reachable=true
                break
                ;;
            esac
            echo "Admin deployment hostname not reachable yet: attempt=$attempt status=${last_status:-none}"
            sleep 3
          done
          test "$reachable" = true

      - name: Smoke canonical Admin production domain
        id: domain_smoke
        shell: bash
        run: |
          set -euo pipefail
          domain_ready=false
          for attempt in $(seq 1 12); do
            login_file="${RUNNER_TEMP}/admin-login.html"
            unauth="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$ADMIN_ORIGIN/" || true)"
            login_code="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              -H 'Accept: text/html' --output "$login_file" --write-out '%{http_code}' \
              "$ADMIN_ORIGIN/login" || true)"
            if [ "$unauth" = 401 ] && [ "$login_code" = 200 ] && \
               grep -Fq 'Admin MCP/NPP' "$login_file" && \
               grep -Fq 'Đăng nhập' "$login_file"; then
              asset="$(grep -oE '/_next/static/[^" ]+\.(css|js)' "$login_file" | head -n 1)"
              if [ -n "$asset" ] && curl --fail --silent --show-error "$ADMIN_ORIGIN$asset" >/dev/null; then
                domain_ready=true
                break
              fi
            fi
            echo "Admin canonical domain not ready: attempt=$attempt root=$unauth login=$login_code"
            sleep 5
          done
          test "$domain_ready" = true
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify Admin domain ownership
        id: domainstate
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/admin-domain.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/$ADMIN_DOMAIN?teamId=$VERCEL_ORG_ID" > "$body"
          verified="$(DOMAIN_FILE="$body" node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync(process.env.DOMAIN_FILE,"utf8")); process.stdout.write(String(p.verified===true))')"
          test "$verified" = true
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Report successful Admin rollout
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          gh issue comment 5 --body "Admin Vercel production deploy succeeded for SHA \`${{ steps.source.outputs.sha }}\`. Project: \`$VERCEL_PROJECT_ID\`. Deployment hostname reachable: \`true\`. Canonical domain: \`$ADMIN_ORIGIN\`. Domain smoke: \`${{ steps.domain_smoke.outputs.ready }}\`. Domain verified: \`${{ steps.domainstate.outputs.verified }}\`. Existing production environment preserved: \`${{ steps.envcheck.outputs.preserved }}\`."

      - name: Report failed Admin rollout
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          ENV_CHECK_OUTCOME: ${{ steps.envcheck.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_SMOKE_OUTCOME: ${{ steps.deployment_smoke.outcome }}
          DOMAIN_SMOKE_OUTCOME: ${{ steps.domain_smoke.outcome }}
          DOMAIN_STATE_OUTCOME: ${{ steps.domainstate.outcome }}
        run: |
          set -euo pipefail
          report="$(mktemp)"
          {
            echo "## Admin Vercel production deploy failed"
            echo
            echo "- SHA: \`${TARGET_SHA:-unknown}\`"
            echo "- project: \`${PROJECT_OUTCOME:-not-run}\`"
            echo "- production environment contract: \`${ENV_CHECK_OUTCOME:-not-run}\`"
            echo "- link: \`${LINK_OUTCOME:-not-run}\`"
            echo "- verify: \`${VERIFY_OUTCOME:-not-run}\`"
            echo "- build: \`${BUILD_OUTCOME:-not-run}\`"
            echo "- deploy: \`${DEPLOY_OUTCOME:-not-run}\`"
            echo "- deployment hostname smoke: \`${DEPLOYMENT_SMOKE_OUTCOME:-not-run}\`"
            echo "- canonical domain smoke: \`${DOMAIN_SMOKE_OUTCOME:-not-run}\`"
            echo "- domain ownership: \`${DOMAIN_STATE_OUTCOME:-not-run}\`"
            echo
            echo "No secret values are included in this report."
          } > "$report"
          gh issue comment 5 --body-file "$report"
          rm -f "$report"
