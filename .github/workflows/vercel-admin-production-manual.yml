name: Manual Vercel Admin production deploy

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-admin-production-manual
  cancel-in-progress: false

jobs:
  deploy-admin-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 5 &&
        github.event.comment.body == '/deploy-vercel-admin-production' &&
        contains(fromJSON('["binhnxwjfjxm","khuongbinhinfo-a11y"]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      ADMIN_PROJECT_NAME: admin-mcp-npp
      ADMIN_ROOT_DIRECTORY: admin/web
      CORE_PROJECT_ID: prj_vFEAzoxesLqNJIfD8uF4q1kytpvk
      MCP_PROJECT_ID: prj_854SWdJeDEOPezAvvTZzTaRvZUSq
      WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      ADMIN_DOMAIN: admin.nguyenlieuhungphat.com
      NPP_DOMAIN: office.nguyenlieuhungphat.com
      MCP_DOMAIN: mcp.nguyenlieuhungphat.com
      WEBSITE_DOMAIN: nguyenlieuhungphat.com
      NPP_OPERATIONS_URL: https://office.nguyenlieuhungphat.com
      DEPLOY_REF: main

    steps:
      - name: Validate Issue #5 trigger
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: test "${COMMENT_BODY:-}" = '/deploy-vercel-admin-production'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Verify exact origin/main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate provider credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"
          [[ "$VERCEL_TOKEN" =~ ^vcp_[A-Za-z0-9_-]+$ ]]

      - name: Create or resolve Admin Vercel project
        id: project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.vercel.com"
          project_json="${RUNNER_TEMP}/admin-project.json"
          status="$(curl --silent --show-error --output "$project_json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$api/v9/projects/$ADMIN_PROJECT_NAME?teamId=$VERCEL_ORG_ID")"
          if [ "$status" = 404 ]; then
            status="$(curl --silent --show-error --output "$project_json" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "$api/v10/projects?teamId=$VERCEL_ORG_ID" \
              --data "$(node -e 'process.stdout.write(JSON.stringify({name:process.env.ADMIN_PROJECT_NAME,framework:"nextjs",rootDirectory:process.env.ADMIN_ROOT_DIRECTORY,nodeVersion:"20.x"}))')")"
          fi
          test "$status" = 200 || test "$status" = 201
          project_id="$(node -e 'const p=require(process.argv[1]); if(!p.id) process.exit(1); process.stdout.write(p.id)' "$project_json")"
          test "$project_id" != "$CORE_PROJECT_ID"
          test "$project_id" != "$MCP_PROJECT_ID"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Pull protected Core runtime values
        id: runtime
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/core-runtime"
          mkdir -p "$runtime_dir/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$CORE_PROJECT_ID" > "$runtime_dir/.vercel/project.json"
          (
            cd "$runtime_dir"
            npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          )
          env_file="$runtime_dir/.vercel/.env.production.local"
          test -f "$env_file"
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          const source = await readFile(process.env.ENV_FILE, 'utf8');
          const names = ['CORE_API_INTERNAL_URL','CORE_API_SERVER_TOKEN','CORE_WEB_ADMIN_USERNAME','CORE_WEB_ADMIN_PASSWORD'];
          const parsed = {};
          for (const line of source.split(/\r?\n/)) {
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index);
            let value = line.slice(index + 1);
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            parsed[key] = value.replace(/\\n/g, '\n');
          }
          const missing = names.filter((name) => !String(parsed[name] || '').trim());
          if (missing.length) throw new Error(`missing_admin_runtime_sources:${missing.join(',')}`);
          for (const name of names) {
            const value = String(parsed[name]);
            process.stdout.write(`::add-mask::${value}\n`);
            const marker = `ADMIN_${name}_${Date.now()}`;
            await appendFile(process.env.GITHUB_ENV, `${name}<<${marker}\n${value}\n${marker}\n`, 'utf8');
          }
          NODE
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENV_FILE: ${{ runner.temp }}/core-runtime/.vercel/.env.production.local

      - name: Synchronize Admin production environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const values = {
            CORE_API_INTERNAL_URL: process.env.CORE_API_INTERNAL_URL,
            CORE_API_SERVER_TOKEN: process.env.CORE_API_SERVER_TOKEN,
            CORE_WEB_ADMIN_USERNAME: process.env.CORE_WEB_ADMIN_USERNAME,
            CORE_WEB_ADMIN_PASSWORD: process.env.CORE_WEB_ADMIN_PASSWORD,
            NPP_OPERATIONS_URL: process.env.NPP_OPERATIONS_URL,
          };
          const response = await fetch(`https://api.vercel.com/v10/projects/${process.env.ADMIN_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}&upsert=true`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.entries(values).map(([key, value]) => ({ key, value, type: 'encrypted', target: ['production'] }))),
          });
          if (!response.ok) throw new Error(`admin_env_upsert_failed:${response.status}`);
          NODE

      - name: Attach frontend domains to their Vercel projects
        id: domains
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          attach_domain() {
            local project_id="$1"
            local domain="$2"
            local body status
            body="${RUNNER_TEMP}/domain-${domain//./-}.json"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v10/projects/$project_id/domains?teamId=$VERCEL_ORG_ID" \
              --data "{\"name\":\"$domain\"}")"
            if [ "$status" != 200 ] && [ "$status" != 201 ] && [ "$status" != 409 ]; then
              echo "Cannot attach domain $domain (HTTP $status)." >&2
              cat "$body" >&2
              exit 1
            fi
          }
          attach_domain "$WEBSITE_PROJECT_ID" "$WEBSITE_DOMAIN"
          attach_domain "$CORE_PROJECT_ID" "$NPP_DOMAIN"
          attach_domain "$MCP_PROJECT_ID" "$MCP_DOMAIN"
          attach_domain "$ADMIN_PROJECT_ID" "$ADMIN_DOMAIN"

      - name: Link and verify exact Admin project
        shell: bash
        env:
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$ADMIN_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const linked = JSON.parse(await readFile('.vercel/project.json', 'utf8'));
          if (linked.projectId !== process.env.ADMIN_PROJECT_ID) throw new Error('unexpected_admin_project');
          if (linked.settings?.rootDirectory !== process.env.ADMIN_ROOT_DIRECTORY) throw new Error(`unexpected_admin_root:${linked.settings?.rootDirectory}`);
          NODE
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('admin/web/vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('admin_auto_deploy_not_locked');
          NODE

      - name: Verify Admin source
        working-directory: admin/web
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: Build Admin production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Admin production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke exact Admin deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          unauth="$(curl --silent --show-error --retry 5 --retry-delay 4 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          test "$unauth" = 401
          auth="${CORE_WEB_ADMIN_USERNAME}:${CORE_WEB_ADMIN_PASSWORD}"
          for path in / /customer-onboarding; do
            code="$(curl --silent --show-error --retry 5 --retry-delay 4 -u "$auth" --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path")"
            test "$code" = 200
          done
          html="$(curl --fail --silent --show-error -u "$auth" "$DEPLOYMENT_URL/")"
          asset="$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+\.(css|js)' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "$DEPLOYMENT_URL$asset" >/dev/null

      - name: Record domain verification state
        id: domain-state
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/admin-domain.json"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$ADMIN_PROJECT_ID/domains/$ADMIN_DOMAIN?teamId=$VERCEL_ORG_ID")"
          test "$status" = 200
          verified="$(node -e 'const p=require(process.argv[1]); process.stdout.write(String(p.verified===true))' "$body")"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Report successful Admin rollout
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DOMAIN_VERIFIED: ${{ steps.domain-state.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 5 --body "Admin Vercel production deploy succeeded for SHA ${{ steps.target.outputs.sha }}. Project: \`$PROJECT_ID\`. Deployment: $DEPLOYMENT_URL. Domain \`$ADMIN_DOMAIN\` verified: \`$DOMAIN_VERIFIED\`. Domain \`$NPP_DOMAIN\`, \`$MCP_DOMAIN\` and \`$WEBSITE_DOMAIN\` were attached to their existing projects. \`log.nguyenlieuhungphat.com\` remains reserved until the Delivery frontend exists."
