name: Issue 791 Lot B apply v2

on:
  push:
    branches:
      - agent/issue-791-lot-b-fast-search

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[lot-b-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-791-lot-b-fast-search
          fetch-depth: 0
      - name: Apply corrected audited Lot B changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue-791-lot-b-apply.yml').read_text()
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('original apply workflow run block not found')
          block = source.split(marker, 1)[1]
          body_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  body_lines.append(line[10:])
              elif not line.strip():
                  body_lines.append('')
              else:
                  break
          body = '\n'.join(body_lines) + '\n'

          correction = r'''
          # Corrections after auditing the first complete apply log and all direct SKU-search consumers.
          route_path = Path('npp-core/api/src/routes/sales-orders.js')
          route_text = route_path.read_text()
          old_route = """      const result = await searchPreviewService.searchSalesOrderSkuOptions(options.getPool(), {
            requestContext: context,
            search: url.searchParams.get('search') ?? '',
            warehouseId: url.searchParams.get('warehouseId'),
            salesChannelId: url.searchParams.get('salesChannelId'),
            customerId: url.searchParams.get('customerId'),
            pricingAt: url.searchParams.get('pricingAt'),
            limit: parseInteger(url.searchParams.get('limit'), 20, 50),
            offset: parseInteger(url.searchParams.get('offset'), 0, 100000),
          });
          """
          new_route = """      const previewContextSupplied = ['warehouseId', 'salesChannelId', 'pricingAt']
            .every((key) => String(url.searchParams.get(key) ?? '').trim());
          const searchArgs = {
            requestContext: context,
            search: url.searchParams.get('search') ?? '',
            limit: parseInteger(url.searchParams.get('limit'), 20, 50),
            offset: parseInteger(url.searchParams.get('offset'), 0, 100000),
          };
          const result = previewContextSupplied
            ? await searchPreviewService.searchSalesOrderSkuOptions(options.getPool(), {
              ...searchArgs,
              warehouseId: url.searchParams.get('warehouseId'),
              salesChannelId: url.searchParams.get('salesChannelId'),
              customerId: url.searchParams.get('customerId'),
              pricingAt: url.searchParams.get('pricingAt'),
            })
            : await entryService.searchSalesOrderSkuOptions(options.getPool(), searchArgs);
          """
          if route_text.count(old_route) != 1:
              raise SystemExit('route compatibility block mismatch')
          route_path.write_text(route_text.replace(old_route, new_route, 1))

          types_path = Path('npp-core/web/lib/sales-order-types.ts')
          types = types_path.read_text()
          types = types.replace('  pricePreview: SalesOrderSkuPricePreview;\n', '  pricePreview?: SalesOrderSkuPricePreview;\n', 1)
          types = types.replace('  inventoryPreview: SalesOrderSkuInventoryPreview;\n', '  inventoryPreview?: SalesOrderSkuInventoryPreview;\n', 1)
          types = types.replace('  defaultWarehouseId: string | null;\n', '  defaultWarehouseId?: string | null;\n', 1)
          types_path.write_text(types)

          form_path = Path('npp-core/web/app/sales/sales-orders/SalesOrderCommercialForm.tsx')
          form_text = form_path.read_text()
          old_helpers = """function searchPriceText(option: SalesOrderSkuSearchOption): string {
            if (option.pricePreview.status === 'RESOLVED' && option.pricePreview.unitPriceMinor !== null) {
              return vnd(option.pricePreview.unitPriceMinor);
            }
            return option.pricePreview.status === 'MISSING' ? 'Chưa có giá' : 'Chưa tính được giá';
          }

          function searchInventoryPrimary(option: SalesOrderSkuSearchOption): string {
            if (option.inventoryPreview.status === 'NOT_MANAGED') return 'Không quản lý tồn';
            if (option.inventoryPreview.status !== 'TRACKED') return 'Chưa có số liệu tồn';
            const unit = option.inventoryPreview.unitCode ? ` ${option.inventoryPreview.unitCode}` : '';
            return `Tồn ${compactQuantity(option.inventoryPreview.onHandQuantity)}${unit}`;
          }

          function searchInventorySecondary(option: SalesOrderSkuSearchOption): string | null {
            if (option.inventoryPreview.status !== 'TRACKED') return null;
            const unit = option.inventoryPreview.unitCode ? ` ${option.inventoryPreview.unitCode}` : '';
            return `Khả dụng ${compactQuantity(option.inventoryPreview.availableQuantity)}${unit}`;
          }
          """
          new_helpers = """function searchPriceText(option: SalesOrderSkuSearchOption): string {
            if (option.pricePreview?.status === 'RESOLVED' && option.pricePreview.unitPriceMinor !== null) {
              return vnd(option.pricePreview.unitPriceMinor);
            }
            return option.pricePreview?.status === 'MISSING' ? 'Chưa có giá' : 'Chưa tính được giá';
          }

          function searchInventoryPrimary(option: SalesOrderSkuSearchOption): string {
            if (option.inventoryPreview?.status === 'NOT_MANAGED') return 'Không quản lý tồn';
            if (option.inventoryPreview?.status !== 'TRACKED') return 'Chưa có số liệu tồn';
            const unit = option.inventoryPreview.unitCode ? ` ${option.inventoryPreview.unitCode}` : '';
            return `Tồn ${compactQuantity(option.inventoryPreview.onHandQuantity)}${unit}`;
          }

          function searchInventorySecondary(option: SalesOrderSkuSearchOption): string | null {
            if (option.inventoryPreview?.status !== 'TRACKED') return null;
            const unit = option.inventoryPreview.unitCode ? ` ${option.inventoryPreview.unitCode}` : '';
            return `Khả dụng ${compactQuantity(option.inventoryPreview.availableQuantity)}${unit}`;
          }
          """
          if form_text.count(old_helpers) != 1:
              raise SystemExit('form preview helper block mismatch')
          form_path.write_text(form_text.replace(old_helpers, new_helpers, 1))

          gateway_path = Path('npp-core/web/lib/sales-order-gateway.ts')
          gateway = gateway_path.read_text()
          old_allowed = "const ALLOWED_QUERY_KEYS=new Set(['limit','offset','status','customerId','warehouseId','search']);"
          new_allowed = "const ALLOWED_QUERY_KEYS=new Set(['limit','offset','status','customerId','warehouseId','salesChannelId','pricingAt','search']);"
          if gateway.count(old_allowed) != 1:
              raise SystemExit('gateway allowed query contract mismatch')
          gateway = gateway.replace(old_allowed, new_allowed, 1)
          old_search = "export function searchSalesOrderSkus<T>(requestId:string,sp:URLSearchParams):Promise<T[]>{const q=new URLSearchParams();const s=sp.get('search')?.trim()??'';const l=Number(sp.get('limit')??20);const o=Number(sp.get('offset')??0);if(s)q.set('search',s.slice(0,256));q.set('limit',String(Number.isFinite(l)?Math.max(1,Math.min(50,Math.trunc(l))):20));q.set('offset',String(Number.isFinite(o)?Math.max(0,Math.trunc(o)):0));return req<T[]>({method:'GET',path:`${path()}/sku-search`,requestId,searchParams:q});}"
          new_search = "export function searchSalesOrderSkus<T>(requestId:string,sp:URLSearchParams):Promise<T[]>{const q=new URLSearchParams();const s=sp.get('search')?.trim()??'';const l=Number(sp.get('limit')??20);const o=Number(sp.get('offset')??0);if(s)q.set('search',s.slice(0,256));const warehouseId=sp.get('warehouseId')?.trim();const salesChannelId=sp.get('salesChannelId')?.trim();const customerId=sp.get('customerId')?.trim();const pricingAt=sp.get('pricingAt')?.trim();if(warehouseId)q.set('warehouseId',uuid(warehouseId,'INVALID_WAREHOUSE_ID','Mã kho không hợp lệ'));if(salesChannelId)q.set('salesChannelId',uuid(salesChannelId,'INVALID_SALES_CHANNEL_ID','Kênh bán không hợp lệ'));if(customerId)q.set('customerId',uuid(customerId,'INVALID_CUSTOMER_ID','Mã khách hàng không hợp lệ'));if(pricingAt)q.set('pricingAt',pricingAt.slice(0,64));q.set('limit',String(Number.isFinite(l)?Math.max(1,Math.min(50,Math.trunc(l))):20));q.set('offset',String(Number.isFinite(o)?Math.max(0,Math.trunc(o)):0));return req<T[]>({method:'GET',path:`${path()}/sku-search`,requestId,searchParams:q});}"
          if gateway.count(old_search) != 1:
              raise SystemExit('gateway sku search contract mismatch')
          gateway_path.write_text(gateway.replace(old_search, new_search, 1))

          api_test_path = Path('npp-core/api/test/issue-791-lot-b-fast-search.test.js')
          api_test = api_test_path.read_text()
          api_test = api_test.replace("warehouseIds: ['w-1', 'w-2']", "warehouseIds: ['00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002']", 1)
          api_test = api_test.replace("{ id: 'w-1', branch_id: 'b-1'", "{ id: '00000000-0000-4000-8000-000000000001', branch_id: 'b-1'", 1)
          api_test = api_test.replace("{ id: 'w-2', branch_id: 'b-1'", "{ id: '00000000-0000-4000-8000-000000000002', branch_id: 'b-1'", 1)
          api_test = api_test.replace("{ id: 'w-3', branch_id: 'b-1'", "{ id: '00000000-0000-4000-8000-000000000003', branch_id: 'b-1'", 1)
          api_test = api_test.replace("), 'w-2');", "), '00000000-0000-4000-8000-000000000002');", 1)
          api_test_path.write_text(api_test)

          web_test_path = Path('npp-core/web/test/issue-791-lot-b-fast-search-ui.test.js')
          web_test = web_test_path.read_text()
          web_test = web_test.replace('/defaultWarehouseId: string \\| null/', '/defaultWarehouseId\\?: string \\| null/', 1)
          web_test = web_test.replace('/pricePreview: SalesOrderSkuPricePreview/', '/pricePreview\\?: SalesOrderSkuPricePreview/', 1)
          web_test = web_test.replace('/inventoryPreview: SalesOrderSkuInventoryPreview/', '/inventoryPreview\\?: SalesOrderSkuInventoryPreview/', 1)
          web_test = web_test.replace("assert.match(types, /inventoryPreview\\?: SalesOrderSkuInventoryPreview/);", "assert.match(types, /inventoryPreview\\?: SalesOrderSkuInventoryPreview/);\n            assert.match(form, /salesChannelId/);\n            const gateway = await read('lib/sales-order-gateway.ts');\n            for (const field of ['warehouseId', 'salesChannelId', 'customerId', 'pricingAt']) assert.match(gateway, new RegExp(field));", 1)
          web_test_path.write_text(web_test)

          commercial_path = Path('npp-core/web/e2e/sales-orders-commercial.spec.ts')
          commercial = commercial_path.read_text()
          commercial = commercial.replace('          defaultSalesChannelId: channelId,\n', '          defaultSalesChannelId: channelId,\n          defaultWarehouseId: null,\n', 1)
          commercial = commercial.replace(
            "          eligibility: { selectable: true, code: 'ELIGIBLE', message: 'Có thể chọn để bán.' },\n",
            "          eligibility: { selectable: true, code: 'ELIGIBLE', message: 'Có thể chọn để bán.' },\n          pricePreview: { status: 'RESOLVED', unitPriceMinor: String(9_000 + digits), message: null },\n          inventoryPreview: { status: 'TRACKED', onHandQuantity: '100.000000000000', availableQuantity: '100.000000000000', unitCode: 'THUNG' },\n",
            1,
          )
          commercial_path.write_text(commercial)

          recovery_path = Path('npp-core/web/e2e/sales-orders-price-recovery.spec.ts')
          recovery = recovery_path.read_text()
          recovery = recovery.replace('          defaultSalesChannelId: CHANNEL_ID,\n', '          defaultSalesChannelId: CHANNEL_ID,\n          defaultWarehouseId: null,\n', 1)
          recovery = recovery.replace(
            "          eligibility: { selectable: true, code: 'ELIGIBLE', message: 'Có thể chọn để bán.' },\n",
            "          eligibility: { selectable: true, code: 'ELIGIBLE', message: 'Có thể chọn để bán.' },\n          pricePreview: { status: 'RESOLVED', unitPriceMinor: systemPrice, message: null },\n          inventoryPreview: { status: 'TRACKED', onHandQuantity: '100.000000000000', availableQuantity: '100.000000000000', unitCode: 'THUNG' },\n",
            1,
          )
          recovery_path.write_text(recovery)

          sales_ui_path = Path('npp-core/web/test/sales-order-ui.test.js')
          sales_ui = sales_ui_path.read_text()
          if "assert.match(formSource, /Kênh bán \\*/);" not in sales_ui:
              raise SystemExit('sales-order-ui channel label assertion mismatch')
          sales_ui_path.write_text(sales_ui.replace("assert.match(formSource, /Kênh bán \\*/);", "assert.match(formSource, /Kênh bán \\/ nguồn giá \\*/);", 1))

          # The existing generic Core SKU-search contract remains backward compatible for MCP and older callers.
          operational_path = Path('npp-core/api/test/sales-order-operational-entry.test.js')
          operational = operational_path.read_text()
          operational = operational.replace(
            "    assert.equal(settings.defaultSalesChannelId, fixture.channelId);\n",
            "    assert.equal(settings.defaultSalesChannelId, fixture.channelId);\n    assert.equal(settings.defaultWarehouseId, null);\n",
            1,
          )
          operational_path.write_text(operational)

          Path('.github/workflows/issue-791-lot-b-apply-v2.yml').unlink()
          '''

          insertion = '# Temporary workflow must not remain in the branch diff.\n'
          if body.count(insertion) != 1:
              raise SystemExit('temporary workflow cleanup marker mismatch')
          body = body.replace(insertion, correction + '\n' + insertion, 1)
          Path('/tmp/issue-791-lot-b-apply.sh').write_text(body)
          PY
          bash /tmp/issue-791-lot-b-apply.sh
