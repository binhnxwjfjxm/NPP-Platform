name: Apply product catalog layout

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/product-catalog-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product layout branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-catalog-layout
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci

      - name: Apply fail-closed layout refactor
        run: node scripts/apply-product-catalog-layout.mjs

      - name: Verify Core web source
        run: npm --prefix npp-core/web run test && npm --prefix npp-core/web run typecheck

      - name: Commit verified layout refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate product catalog unit workspace"
          git push origin HEAD:agent/product-catalog-layout
