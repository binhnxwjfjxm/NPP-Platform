name: One-shot Phase 3 customer event fix

on:
  push:
    branches:
      - agent/document-numbering
    paths:
      - ".github/workflows/one-shot-fix-phase-3-customer-events.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-numbering
          fetch-depth: 0

      - name: Capture React event values before functional state updates
        shell: python
        run: |
          from pathlib import Path
          import re

          workspace = Path('npp-core/web/app/customers/customer-workspace.tsx')
          text = workspace.read_text(encoding='utf-8')
          pattern = re.compile(
              r"onChange=\{\(event\) => "
              r"(set(?:Customer|Group|Address)Draft)"
              r"\(\(value\) => \(\{ \.\.\.value, "
              r"([A-Za-z][A-Za-z0-9]*): event\.currentTarget\.(value|checked) "
              r"\}\)\)\}"
          )

          def replacement(match):
              setter, field, source = match.groups()
              return (
                  "onChange={(event) => { "
                  f"const next = event.currentTarget.{source}; "
                  f"{setter}((value) => ({{ ...value, {field}: next }})); "
                  "}}"
              )

          updated, count = pattern.subn(replacement, text)
          if count < 20:
              raise SystemExit(f'Expected at least 20 customer draft event replacements, got {count}')
          if 'event.currentTarget.value }))}' in updated or 'event.currentTarget.checked }))}' in updated:
              raise SystemExit('Unsafe deferred event access remains in customer workspace')
          workspace.write_text(updated, encoding='utf-8')

          supplier = Path('npp-core/web/e2e/suppliers.spec.ts')
          supplier_text = supplier.read_text(encoding='utf-8')
          old = "await expect(workspace.getByRole('heading', { name: 'Nhà cung cấp', exact: true })).toBeVisible();"
          new = "await expect(page.getByRole('heading', { name: 'Nhà cung cấp', exact: true, level: 1 })).toBeVisible();"
          if supplier_text.count(old) != 1:
              raise SystemExit('Supplier heading assertion contract changed unexpectedly')
          supplier.write_text(supplier_text.replace(old, new), encoding='utf-8')

          print(f'Updated {count} customer event handlers and supplier heading scope')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-phase-3-customer-events.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npp-core/web/app/customers/customer-workspace.tsx npp-core/web/e2e/suppliers.spec.ts
          git diff --cached --check
          git commit -m "Phase 3: fix customer event lifecycle and supplier assertion"
          git push origin HEAD:agent/document-numbering
