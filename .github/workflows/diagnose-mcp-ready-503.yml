name: Monitor MCP Vercel production rollout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-mcp-ready-503.yml

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    if: github.event.pull_request.head.ref == 'agent/issue-158-ready-503-diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find exact MCP Vercel issue-comment run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          NOT_BEFORE: 2026-08-02T11:31:00Z
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs_json="$(gh api --method GET -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs" -f event=issue_comment -f per_page=50)"
            if (( attempt == 1 || attempt % 12 == 0 )); then
              jq -r --arg after "$NOT_BEFORE" '.workflow_runs | map(select(.created_at >= $after)) | sort_by(.created_at) | reverse | .[] | "RUN id=\(.id) path=\(.path // "") status=\(.status) conclusion=\(.conclusion // "") created=\(.created_at) actor=\(.actor.login // "") head=\(.head_sha // "")"' <<<"$runs_json"
            fi
            run_id="$(jq -r --arg after "$NOT_BEFORE" '
              .workflow_runs
              | map(select(
                  .created_at >= $after
                  and (.actor.login // "") == "khuongbinhinfo-a11y"
                  and ((.path // "") | ascii_downcase | contains("vercel"))
                  and ((.path // "") | ascii_downcase | contains("mcp"))
                ))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"$runs_json")"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done
          test -n "${run_id:-}"

      - name: Wait for MCP Vercel rollout completion
        id: completed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=""
          for attempt in $(seq 1 240); do
            run_json="$(gh api --method GET -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "MCP_VERCEL_RUN_ID=$RUN_ID STATUS=$status CONCLUSION=$conclusion"
            if [[ "$status" == "completed" ]]; then break; fi
            sleep 5
          done
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          test -n "$conclusion"

      - name: Print MCP Vercel rollout steps
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | "JOB id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion // "")\n" + ([.steps[] | "  STEP \(.number) \(.name): \(.status)/\(.conclusion // "")"] | join("\n"))'

      - name: Enforce successful MCP Vercel rollout
        env:
          CONCLUSION: ${{ steps.completed.outputs.conclusion }}
        shell: bash
        run: test "$CONCLUSION" = "success"
